[pytest]
pythonpath = .
# Test discovery
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Output
addopts =
    -v
    --tb=short
    --timeout=30
    -m "not slow"

# Markers
markers =
    unit: pure unit tests, no I/O
    integration: tests that wire multiple components together
    slow: tests that take more than a few seconds
