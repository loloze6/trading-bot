[pytest]
# NOTE (fork): `testpaths = tests` is trading-bot's suite ONLY. strategy-research/
# imports this package's code, so a signature change here can break its suite
# without a single test failing below. Run BOTH from the repo root:
#     python run_tests.py
# and see that script's docstring for why the second suite cannot simply be
# added to testpaths. Nothing about this file's own behaviour is changed by it.
pythonpath = .
# Test discovery
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Output
addopts =
    -v
    --tb=short
    --timeout=30
    -m "not slow"

# NOTE (2026-08-28): --timeout=30 above is GLOBAL, and `-m "not slow"` normally
# hides that. Running the slow suite with `pytest -m slow` therefore keeps the
# 30s limit and kills the regression backtests mid-run, reporting a pytest
# Timeout rather than a test failure. The slow suite needs the limit lifted:
#     python -m pytest -m slow --timeout=0
# (26 tests, ~5m40s on Windows. This is the command the fork guardrails'
# "pytest -m slow" line means.)

# Markers
markers =
    unit: pure unit tests, no I/O
    integration: tests that wire multiple components together
    slow: tests that take more than a few seconds
