- id: multi_bar_cascade_reverts
  belief: A run of four same-direction hours that adds up to a large move, with no
    single big candle, is a slow stop cascade that also overshoots and reverts.
  measure: mean_diff
  horizon_bars: 12
  direction: positive
  min_effect: 0.002
  effect: 0.022061139372966426
  n_a: 4
  n_b: 17515
  windows:
  - 0.015601791856900832
  - 0.05046945160489275
  - null
  - null
  - null
  - 0.010782122311480354
  verdict: fail
  code: 'absr = ret.abs()

    usual = absr.rolling(168).median().shift(1)

    sigma = ret.rolling(168).std().shift(1)

    r4 = df.close / df.close.shift(4) - 1

    run = np.sign(ret).rolling(4).sum().abs() == 4

    no_big = (absr > 3 * usual).astype(float).rolling(4).max() == 0

    a = spaced(run & (r4.abs() > 4 * sigma) & no_big, 12)

    b = ~a

    signal = -np.sign(r4)

    '
