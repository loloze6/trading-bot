- id: counter_trend_spike_reverts
  belief: A big bar against the prior three-day trend is a shakeout that the trend
    reclaims, so it reverts more than a big bar with the trend.
  measure: mean_diff
  horizon_bars: 12
  direction: positive
  min_effect: 0.002
  effect: -0.0006279721201626791
  n_a: 217
  n_b: 199
  windows:
  - -0.0012768745052329842
  - -0.0057837405379739665
  - -0.0052092820031148825
  - 0.0018690702185268793
  - 0.001012538859851797
  - 0.004611376952246207
  verdict: fail
  code: 'absr = ret.abs()

    usual = absr.rolling(168).median().shift(1)

    big = spaced(absr > 3 * usual, 12)

    trend = df.close.shift(1) / df.close.shift(73) - 1

    against = np.sign(ret) != np.sign(trend)

    a = big & against

    b = big & ~against

    signal = -np.sign(ret)

    '
- id: close_at_extreme_reverts
  belief: A big bar that closes at its extreme shows forced, unabsorbed flow (stops,
    liquidations) and reverts more than a big bar that already pulled back from its
    extreme within the hour.
  measure: mean_diff
  horizon_bars: 6
  direction: positive
  min_effect: 0.002
  effect: -0.0008042744488642963
  n_a: 218
  n_b: 198
  windows:
  - -0.004071958199972246
  - 0.001984885380598121
  - -5.5585136856455887e-05
  - 0.002826169859988185
  - -0.001458023084143038
  - -0.005124463546895176
  verdict: fail
  code: 'absr = ret.abs()

    usual = absr.rolling(168).median().shift(1)

    big = spaced(absr > 3 * usual, 12)

    rng = (df.high - df.low).replace(0, np.nan)

    clv = (df.close - df.low) / rng

    at_ext = ((ret > 0) & (clv >= 0.85)) | ((ret < 0) & (clv <= 0.15))

    a = big & at_ext

    b = big & ~at_ext

    signal = -np.sign(ret)

    '
- id: thin_hours_spike_reverts
  belief: Big moves in thin hours (weekends and the Asia-early UTC hours) come from
    shallow books and revert more than big moves in the active US/Europe hours.
  measure: mean_diff
  horizon_bars: 12
  direction: positive
  min_effect: 0.002
  effect: 0.0002704883048047418
  n_a: 152
  n_b: 264
  windows:
  - 0.006218704515624812
  - -0.000936020485642083
  - -0.004800747969009883
  - 0.003193909642154582
  - -0.001886390392251248
  - -0.0012850470977524946
  verdict: fail
  code: 'absr = ret.abs()

    usual = absr.rolling(168).median().shift(1)

    big = spaced(absr > 3 * usual, 12)

    thin = (dow >= 5) | (hour < 6)

    a = big & thin

    b = big & ~thin

    signal = -np.sign(ret)

    '
