- id: big_bar_fade
  belief: An hourly BTC bar three or more times its usual size overshoots, and price
    drifts back over the next half day.
  measure: mean_diff
  horizon_bars: 12
  direction: positive
  min_effect: 0.002
  effect: -0.0006995958052159148
  n_a: 416
  n_b: 17103
  windows:
  - -2.107100334434596e-05
  - -0.0016447720126283418
  - 0.0007161840378693466
  - -0.0004782504677739534
  - 0.0007891374065137561
  - -0.004235114488859649
  verdict: fail
  code: 'absr = ret.abs()

    usual = absr.rolling(168).median().shift(1)

    a = spaced(absr > 3 * usual, 12)

    b = ~a

    signal = -np.sign(ret)

    '
