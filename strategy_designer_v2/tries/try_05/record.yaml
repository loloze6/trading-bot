- id: low_volume_spike_reverts
  belief: A big move made on ordinary volume is a liquidity air pocket, not information,
    so it reverts more often than a big move made on heavy volume.
  measure: hit_rate
  horizon_bars: 12
  direction: positive
  min_effect: 0.08
  effect: 0.0164292131947118
  n_a: 98
  n_b: 318
  windows:
  - 0.0
  - -0.1436865021770682
  - 0.1210884353741496
  - 0.0897959183673469
  - 0.10793650793650794
  - -0.001165501165501126
  verdict: fail
  code: 'absr = ret.abs()

    usual = absr.rolling(168).median().shift(1)

    big = spaced(absr > 3 * usual, 12)

    vrel = df.volume / df.volume.rolling(168).median().shift(1)

    a = big & (vrel < 1.5)

    b = big & (vrel >= 1.5)

    signal = -np.sign(ret)

    '
