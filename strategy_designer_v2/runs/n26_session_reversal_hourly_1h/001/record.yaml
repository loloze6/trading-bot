  code: 'c = df.close

    m = pd.Series(np.asarray(hour) == 14, index=df.index)

    o = c.shift(6, freq=''h'').reindex(c.index)

    s = c / o - 1

    hi = df.high.rolling(''6h'').max()

    lo = df.low.rolling(''6h'').min()

