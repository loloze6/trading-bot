run: n29_hourly_autocorrelation_regimes_1h_foldB
observations:
  - The only pass was the lag-24 same-hour echo. Its rank_corr was 0.0216 on BTC and 0.0215 on ETH, just above the 0.02 threshold, so the trailing 14-day lag-24 autocorrelation is a readable state on both coins.
  - The echo was not steady across windows. BTC turned negative in window 2 (-0.041), and ETH was near zero in windows 1-2 (0.0038, -0.0009) before rising to 0.033-0.038 in windows 4-6.
  - The lag-1 168h regime switch nearly held on ETH (mean_diff 0.000274, 5/6 windows positive) but failed on BTC (-0.000063, 3/6 negative windows), so the lag-1 state does not carry across coins.
  - The 14-day variance-ratio 24h rule cleared cost on BTC (net 0.0033, 5/6 windows positive despite -0.0166 in window 6) but lost on ETH (net -0.0050), so the daily regime rule is coin-specific.
  - Fading large shocks in a negative lag-1 state lost after cost on both coins (BTC -0.0009, ETH -0.0025, ETH negative in 5 of 6 windows), so the reversal state does not make shocks revert by 0.15%.
  - Following large shocks in a positive lag-1 state lost more (BTC -0.0015, ETH -0.0033, ETH negative in 5 of 6 windows), so the momentum state does not make shocks continue either.
  - The variance-ratio regime pointed the wrong way on move size. Trending states (vr > 1.2) had about 0.78x the next-24h absolute move of reverting states (vr < 0.85) on both coins, against the 1.15 asked.
  - The Asian-hours reversal edge in a negative state was negative on both coins (hit_rate BTC -0.015, ETH -0.007).
  - Agreement between the 2-day and 14-day lag-1 autocorrelation added nothing at 3 bars (BTC 0.00014, ETH -0.00032), against the 0.0005 asked.
next_claim:
  id: lag24_echo_shock_net_after_cost
  belief: The same-hour echo that ranks next-hour returns on both coins is large enough to pay the round-trip cost when yesterday's same-hour move was a shock and the 14-day lag-24 autocorrelation is clearly non-zero.
  claim:
    when: bars where the 14-day lag-24 autocorrelation is beyond ±0.05 and the return of the same hour yesterday (the bar 23 bars back, which aligns with the next bar) exceeded 2.5 times the trailing one-week hourly std, at most one per day
    then: trading the next hour in the direction of sign(ac24) times sign(yesterday's same-hour return) earns more than the 0.15% round trip
    compared_to: zero after cost
    measure: net_return
    horizon_bars: 1
    direction: positive
    min_effect: 0.0005
    code: |
      ac24 = ret.rolling(336).corr(ret.shift(24))
      sd = ret.rolling(168).std()
      echo = ret.shift(23)
      a = spaced((ac24.abs() > 0.05) & (echo.abs() > 2.5 * sd), 24)
      a = a & ac24.notna() & sd.notna()
      b = ~a
      signal = np.sign(ac24) * np.sign(echo)
  why_no_lookahead: ac24, sd and echo use only returns up to the current bar's close (rolling windows and positive shifts), and the bar 23 back is the same UTC hour as the next bar one day earlier.
  how_it_trades: At the close of a qualifying bar, enter in the direction of signal, hold one hour, then exit.
why: The echo is the only state that passed on both coins, but rank_corr says nothing about cost. This turns it into its strongest tradable form, shocks under a clear state, and asks for 0.05% net (0.20% gross) to answer the brief's after-cost question.
