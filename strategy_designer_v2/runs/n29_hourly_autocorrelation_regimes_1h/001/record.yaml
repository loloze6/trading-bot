- id: lag1_ac_168h_regime_switch_rule
  belief: The sign of the trailing one-week lag-1 autocorrelation of hourly returns
    persists, so following the last hour's move when it is positive and fading it
    when it is negative earns more than doing so when the autocorrelation is near
    zero.
