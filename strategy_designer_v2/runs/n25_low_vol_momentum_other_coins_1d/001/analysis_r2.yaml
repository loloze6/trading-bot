run: n25_low_vol_momentum_other_coins_1d_foldA
observations:
  - The direct BTC transfer (20-day momentum when 20-day volatility is below its yearly median) lost money net of fees on all three coins, at -0.43% on ETH, -0.16% on LTC and -1.08% on XRP over 10 bars, against +1.0% asked.
  - The regime control split by coin. Low volatility beat high volatility for momentum on LTC (+1.35%) but not on ETH (-1.55%) or XRP (-0.56%).
  - The windows disagree on the regime control. Windows 1 and 2 are positive on all three coins (ETH +5.3% and +9.8%), and windows 3 and 4 are negative on all three (ETH -5.2% and -3.1%), so the low-volatility edge was confined to the early part of the fold.
  - A single window carries most of the momentum gains. ETH window 2 is +13.0% for the transfer claim and +16.8% for the quiet breakout, while 4 of the other 5 windows are negative for the transfer and 2 of 5 for the breakout.
  - Volatility-scaled trend strength ranked forward returns the wrong way in the quiet regime, at -0.134 on LTC and -0.139 on XRP, but only -0.006 on ETH. Negative windows numbered 5 of 6 on ETH and 4 of 6 on LTC and XRP, so the reverse claim would not pass either.
  - Stretch reversion in the quiet regime was the only claim to pass on any coin. It passed on LTC (+4.29%, 5 of 6 windows positive) and met the threshold on ETH (+1.50%) with only 4 of 6 windows positive. XRP went the opposite way (-4.25%, 2 of 6 windows positive).
  - The long-only quiet uptrend lost on ETH (-1.30%) and LTC (-1.23%) and gained only +0.19% on XRP, so the long leg does not carry the edge.
  - Fading high-volatility moves met its 0.6% bar on LTC (+0.64%) but lost on ETH (-0.56%) and XRP (-0.76%). Two LTC windows had too few bars to score.
  - The quiet breakout nearly held on ETH (+0.92% against 1.2% asked) but lost -2.88% on LTC with 5 of 6 windows negative.
  - A slower 60-day trend with a range-based quiet regime lost on all three coins, worst on ETH at -2.74% over 20 bars.
next_claim: none
why: Eleven claims covered momentum, its reverse, the opposite regime, long-only, breakout, efficiency, volume and expansion filters, and none held on all three coins; the only consistent sign (negative quiet-regime trend rank) fails the window rule on LTC and XRP. A further variant on this brief would be fitting noise from one window or one coin.
