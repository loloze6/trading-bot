run: n20_compression_breakout_alts_daily_1d / fold A
observations:
  - "The plain squeeze break (range_squeeze_break_continues) earned 1.65% on XRP, 2.87% on ADA and 0.98% on LINK net over 5 bars, but only ADA had 5 of 6 positive windows; XRP had 3 of 6 and LINK had 4 of 6, so the belief looked right on the whole fold and was not stable across windows."
  - "Squeeze breaks did not move further than wide-range breaks: the 10-bar abs_ratio was 1.11 on XRP, 1.19 on ADA and 0.81 on LINK against 1.20 asked, which repeats ETH's 0.96 from the earlier fold."
  - "Squeeze breaks against wide-range breaks nearly held on XRP: 3.8% over 10 bars with 5 of 6 windows positive. It failed because only 16 comparison bars existed against the 30 required, and ADA was flat at 0.01%."
  - "The volume-confirmed squeeze break showed 5.0% net on ADA and 1.8% on XRP, but it had only 15 to 20 events per coin, below the 30 required."
  - "Rejected (wick-back) squeeze breaks did not fade: net 3-bar returns were -1.0% on XRP, -0.54% on ADA and +0.03% on LINK."
  - "Breaks aligned with the 100-day trend did worse than breaks against it on all three coins (-3.1%, -3.1% and -4.6% over 10 bars), the opposite of the belief, on 16 to 24 events per side."
  - "Continuation is absent at 20 bars: the low-volatility 20-day closing break returned -1.2%, -1.4% and -5.8% net on XRP, ADA and LINK."
  - "The squeeze-duration rank correlation passed on XRP alone (0.236), with ADA at 0.086 and LINK at -0.066, so the coins disagree."
  - "The range-expansion-after-quiet definition produced only 8 to 11 events per coin, so it could not be tested, and its window values swing between -0.55 and +0.56."
  - "The coins disagree within windows: in window 6 of the plain claim, ADA made +12.6% and LINK +8.3% while XRP lost 1.5%."
next_claim: none
why: "This fold yields only 31 to 40 squeeze breaks per coin, so any further split falls below 30 events; the one pattern seen on all three coins, against-trend breaks beating aligned ones, is a sign flip of a tried claim on 16 to 24 events; and the unsplit claim already failed on window stability."
