- id: monday_weekend_range_release
  belief: The weekend compression stores energy; the first Monday break of the weekend's
    high or low starts a move that follows through more than an ordinary midweek breakout.
  measure: mean_diff
  horizon_bars: 24
  direction: positive
  min_effect: 0.003
  verdict: fail
  by_symbol:
    BTCUSD:
      effect: -0.004654927005024228
