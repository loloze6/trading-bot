  code: 'wk = ((dow == 4) & (hour >= 21)) | (dow >= 5) | ((dow == 0) & (hour < 8))

    hi = df.high.rolling(72).max().shift(1)

    lo = df.low.rolling(72).min().shift(1)

    up = df.close > hi

    dn = df.close < lo

    ev = spaced(up | dn, 24)

    signal = pd.Series(np.where(up, 1, -1), index=df.index)

    a = ev & ~wk

    b = ev & wk

    '
- id: tsmom_low_vol_gate
  belief: Time-series momentum works when trailing 24h volatility is not in its bottom
    third, because quiet regimes are mean-reverting chop whatever the weekday.
  measure: mean_diff
  horizon_bars: 24
  direction: positive
  min_effect: 0.002
  verdict: fail
  by_symbol:
    BTCUSD:
      effect: 0.0008152842065359072
      n_a: 10998
