claims:
- id: ma_cross_weekday_vs_weekend
  belief: A 24/168-bar moving-average trend rule earns its edge on weekday hours and
    gives it back in the quiet weekend window from Friday evening to Monday morning.
  measure: mean_diff
  horizon_bars: 24
  direction: positive
  min_effect: 0.002
  verdict: fail
  by_symbol:
    BTCUSD:
      effect: 0.0010066274452395086
      n_a: 11340
      n_b: 6144
      windows:
      - 0.006411979526311515
      - -0.002794477221516004
      - -0.003643739221039609
      - 0.004386048124951456
      - 0.009111134165070067
      - -0.007269533147058716
      verdict: fail
      why: null
    ETHUSD:
      effect: -0.0011617500923160051
      n_a: 11341
      n_b: 6143
      windows:
      - -0.007438180390216138
      - -0.0031051721294323123
      - -0.0037563552208529517
      - 0.005705302146303744
      - -0.0012500031919727805
      - 0.0029365644028404954
      verdict: fail
      why: null
  code: 'wk = ((dow == 4) & (hour >= 21)) | (dow >= 5) | ((dow == 0) & (hour < 8))

    f = df.close.rolling(24).mean()

    s = df.close.rolling(168).mean()

    signal = np.sign(f - s).replace(0, 1).fillna(1)

    a = (~wk) & s.notna()

    b = wk & s.notna()

    '
- id: weekend_breakouts_fail
  belief: Breakouts of the 72-hour range made in thin weekend trading are mostly false
    and do not follow through, while weekday breakouts do.
  measure: hit_rate
  horizon_bars: 24
