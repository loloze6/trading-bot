run: n30_round_numbers_hourly_1h/fold_B
observations:
  - The round-level magnet did not hold. Rank correlation was -0.013 on BTC and +0.0005 on ETH against a required -0.04, and the window signs were mixed on both coins.
  - No directional round-level claim beat its threshold on either coin. The best was BTC half-level cross continuation at net 0.00082, short of the 0.001 asked, and ETH was -0.00042 on the same claim.
  - Direction after a cross swings by window and does not hold up. ETH half-level cross windows ranged from -0.0079 to +0.0231 on only 146 events, and the volume and US-session filters left both coins near zero (BTC 0.0006 and 0.0003, ETH -0.0001 and -0.0006).
  - The first-touch fade could not be judged. It produced only 16 BTC and 49 ETH events, and ETH's effect was -0.12, the opposite sign.
  - The raw cross volatility burst nearly held. BTC passed at 1.162, while ETH reached 1.113 against the 1.15 asked, and both coins had 5 of 6 windows above 1.
  - In both raw burst claims, window 5 was the only window below 1 (BTC 0.896, ETH 0.899).
  - Matching the regime flipped which coin passed. ETH passed at 1.189 with all 6 windows above 1, while BTC reached 1.158 but only 3 of 6 windows were above 1 (0.744, 0.948, 0.888).
  - The pinning belief was contradicted on every window. Closes within 0.15 vol-units of a level were followed by more movement, not less: 1.24 on BTC and 1.27 on ETH, with all 12 windows above 1.
  - That pinning result is probably confounded. Its distance was divided by 24h volatility, so high-volatility bars look "near" a level by construction, and the 1.24 likely mixes a level effect with plain volatility clustering.
  - The day-open magnet split by coin. Rank correlation was -0.021 on BTC and +0.018 on ETH, both short of -0.04, so this anchor shows nothing.
next_claim:
  id: level_proximity_vol_regime_matched
  belief: Prices sitting close to a round level, measured in price terms rather than volatility units, are followed by larger moves than prices midway between levels, even at the same volatility regime and the same current bar size.
  claim:
    when: hourly closes within 5% of the level step of the nearest round level (step = leading power of ten / 10), in a normal volatility regime and with a non-extreme current bar
    then: the absolute 6-hour forward return is larger
    compared_to: closes at least 25% of a step away from any level (the midway zone), under the same regime and bar-size filter
    measure: abs_ratio
    horizon_bars: 6
    direction: above
    min_effect: 1.08
    code: |
      step = 10.0 ** np.floor(np.log10(df.close)) / 10
      near = (df.close / step).round() * step
      d = (df.close - near).abs() / step
      sd = ret.rolling(24).std().shift(1)
      z = ret.abs() / sd
      reg = sd / sd.rolling(720).median()
      band = (z <= 2.5) & (reg >= 0.8) & (reg <= 1.25) & sd.notna() & reg.notna()
      a = (d <= 0.05) & band
      b = (d >= 0.25) & band
      signal = pd.Series(1, index=df.index)
  why_no_lookahead: The level, distance, current bar return and 24h volatility use closes at or before the bar, and the regime volatility is shifted one bar.
  how_it_trades: When the close sits near a round level in a normal regime, widen stops or buy volatility for the next 6 hours, and tighten them in the midway zone.
why: Volatility was the only part of this brief that came close to passing (burst ratios of 1.11 to 1.19), and the pinning reversal of 1.24 to 1.27 suggests proximity itself raises volatility; this claim tests that with distance in price terms and the regime held fixed, removing the vol-unit confound.
