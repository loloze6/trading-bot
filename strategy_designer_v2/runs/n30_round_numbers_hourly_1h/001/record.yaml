  code: 'step = 10.0 ** np.floor(np.log10(df.close)) / 10

    near = (df.close / step).round() * step

    vol = df.close * ret.rolling(24).std()

    feature = (df.close - near) / vol

    a = feature.notna() & np.isfinite(feature)

    b = ~a

