  code: 'step = 10.0 ** np.floor(np.log10(df.close)) / 10

    prev = df.close.shift(1)

    up_lvl = (np.floor(prev / step) + 1) * step

    dn_lvl = np.floor(prev / step) * step

    rej_up = (df.high >= up_lvl) & (df.close < up_lvl)

    rej_dn = (df.low <= dn_lvl) & (df.close > dn_lvl) & (prev > dn_lvl)

    a = (rej_up ^ rej_dn) & prev.notna()

    b = ~a

    signal = pd.Series(np.where(rej_up, -1, 1), index=df.index)

    '
