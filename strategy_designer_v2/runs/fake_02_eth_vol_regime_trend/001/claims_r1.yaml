brief: fake_02_eth_vol_regime_trend.md
source: analyst round 1
ideas:
- id: ma_extension_reverts
  belief: On daily ETH, price stretched far from its 50-day average tends to give
    back part of the stretch over the next two weeks, which is why mature, orderly
    trends stall and close to the year high is a poor place to buy.
  claim:
    when: every daily bar with a defined 50-day moving average
    then: the larger the log distance of close above its 50-day average, the lower
      the 10-bar forward return (and the reverse below it)
    compared_to: ranking across all bars with the feature defined
    measure: rank_corr
    horizon_bars: 10
    direction: negative
    min_effect: 0.08
    code: 'ma = df.close.rolling(50).mean()

      feature = np.log(df.close / ma)

      a = feature.notna()

      b = ~a

      signal = pd.Series(np.where(feature >= 0, -1, 1), index=df.index)

      '
  why_no_lookahead: The feature uses only the current close and the trailing 50 closes,
    and nothing is shifted forward.
  how_it_trades: Scale out of or fade trend positions when the close is stretched
    far above or below its 50-day average, and hold or add when it is near the average.
