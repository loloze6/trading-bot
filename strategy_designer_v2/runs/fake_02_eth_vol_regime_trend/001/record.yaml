- id: autocorr_regime_trend
  belief: ETH alternates between regimes where daily returns are positively serially
    correlated, so trend pays, and negatively correlated, so it chops; the recent
    sign of return autocorrelation tells which regime holds.
  measure: mean_diff
  horizon_bars: 5
  direction: positive
  min_effect: 0.006
  verdict: fail
  by_symbol:
    ETHUSD:
      effect: -0.02003106494190481
      n_a: 99
      n_b: 407
      windows:
      - -0.1086723756291069
      - 0.030069646607751334
      - -0.11716178179004033
      - 0.03786500819617442
      - null
      - -0.010661988595384655
      verdict: fail
      why: null
  code: 'ac = ret.rolling(60).corr(ret.shift(1))

    ma = df.close.rolling(20).mean()

    signal = pd.Series(np.where(df.close >= ma, 1, -1), index=df.index)

    a = (ac > 0.05) & ma.notna()

    b = (ac < -0.05) & ma.notna()

    '
- id: close_vol_vs_range_vol
  belief: When close-to-close volatility is large relative to intraday high-low range
    volatility, prices are relocating day after day (trend); when ranges are wide
    but closes go nowhere, it is chop.
  measure: mean_diff
  horizon_bars: 10
  direction: positive
  min_effect: 0.01
  verdict: fail
  by_symbol:
    ETHUSD:
      effect: 0.010154294864743578
      n_a: 363
      n_b: 367
      windows:
      - 0.07565325447093342
      - 0.03826502695893551
      - 0.019832632674978944
      - -0.023744370753732407
      - -0.029991373962340948
      - -0.003893045545923573
      verdict: fail
      why: null
  code: 'lr = np.log(df.close).diff()

    hl = np.log(df.high / df.low.replace(0, np.nan))

    park = np.sqrt((hl ** 2 / (4 * np.log(2))).rolling(20).mean())

    ratio = lr.rolling(20).std() / park.replace(0, np.nan)

    med = ratio.rolling(250, min_periods=120).median().shift(1)

    r20 = df.close.pct_change(20)

    signal = pd.Series(np.where(r20 >= 0, 1, -1), index=df.index)

    a = (ratio > med) & r20.notna()

    b = ~a & ratio.notna() & med.notna() & r20.notna()

    '
- id: close_location_trend_conviction
  belief: In a real trend, buyers or sellers hold control into each day's close, so
    daily closes sit near the extreme in the trend direction; trends whose closes
    drift mid-range are weak and stall.
  measure: mean_diff
  horizon_bars: 10
  direction: positive
  min_effect: 0.01
  verdict: fail
  by_symbol:
    ETHUSD:
      effect: -0.0022996543608487536
      n_a: 95
      n_b: 635
      windows:
      - -0.004998155436480632
      - -0.030779988761928306
      - -0.025945191657188803
      - 0.08083005032982861
      - -0.061120198854362255
      - -0.011556871554685804
      verdict: fail
      why: null
  code: 'rng = (df.high - df.low).replace(0, np.nan)

    clv = ((df.close - df.low) - (df.high - df.close)) / rng

    m = clv.rolling(10).mean()

    ma = df.close.rolling(50).mean()

    signal = pd.Series(np.where(df.close >= ma, 1, -1), index=df.index)

    a = (m * signal > 0.2) & ma.notna()

    b = ~a & ma.notna() & m.notna()

    '
