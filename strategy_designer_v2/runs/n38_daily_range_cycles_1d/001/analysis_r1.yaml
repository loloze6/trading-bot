run: n38_daily_range_cycles_1d_foldC
observations:
  - "Fading the 10-day widest-range day failed on all three coins, and the effect came out the wrong way: -0.0109 on BTC, -0.0159 on ETH and -0.0100 on LTC against +0.006 asked. Window signs were mixed (BTC 3/6 negative, ETH 4/6, LTC 4/6), so the move does not consistently retrace."
  - "Continuation after a wide day closing at an extreme passed on ETH (0.0207, 5/6 windows positive) but failed on BTC (-0.0084, 3/6 windows) and on LTC (0.0133 but only 4/6 windows). Sample sizes were thin at 29 to 37 bars."
  - "Volatility persistence after a 20-day widest range did not hold: the abs ratios were 1.05 (BTC), 1.11 (ETH) and 0.89 (LTC) against 1.25 asked, and windows ranged from 0.65 to 1.94."
  - "Quiet after an NR7 day did not hold either: the abs ratios were 1.04 (BTC) and 1.03 (ETH) against 0.85 asked. LTC reached 0.87 but missed, so on daily bars range extremes do not predict the next day's size."
  - "The signed range-ratio feature had no rank correlation with the 5-day return: -0.004 (BTC), 0.032 (ETH), -0.011 (LTC). Window 4 was negative on all three coins (-0.142, -0.120, -0.107)."
  - "This one nearly held. Trading the 20-day trend after a spaced NR7 day made 0.027 net on BTC, 0.030 on ETH and 0.006 on LTC, all above the 0.004 asked. Only ETH had 5/6 windows positive; BTC and LTC had 4/6."
  - "The capitulation long had only 8 to 12 events per coin, below the 30-bar floor. Its effects split by coin (-0.074 BTC, -0.103 ETH, +0.024 LTC)."
  - "Fading a 3-day expansion regime failed: -0.024 on BTC and -0.017 on LTC. ETH swung between -0.120 and +0.128 across windows."
  - "The first wide day after a quiet spell gave a BTC-only hit-rate edge of 0.112 (5/6 windows positive). ETH (-0.005) and LTC (-0.0004) showed nothing."
next_claim:
  id: contraction_regime_trend_edge
  belief: "The trend-pause result may come from the 20-day trend itself rather than from the narrow days; if contraction matters, the trend should pay more after a multi-day contraction regime than on other bars."
  claim:
    when: "the 5-day mean range is at most 0.75 of the 20-day mean range (a contraction regime), at most one event every 3 bars"
    then: "the 5-day forward return follows the sign of the 20-day trend more than it does elsewhere"
    compared_to: "all other bars with a defined trend and range ratio, using the same trend signal"
    measure: mean_diff
    horizon_bars: 5
    direction: positive
    min_effect: 0.008
    code: |
      rng = (df.high - df.low) / df.close.shift(1)
      ratio = rng.rolling(5).mean() / rng.rolling(20).mean()
      trend = df.close / df.close.shift(20) - 1
      valid = (ratio.notna() & trend.notna()).fillna(False)
      contr = (valid & (ratio <= 0.75)).fillna(False)
      a = spaced(contr, 3)
      b = valid & ~contr
      signal = pd.Series(np.where(trend > 0, 1, -1), index=df.index)
  why_no_lookahead: "The range ratio and the 20-day trend use only rolling windows over bars up to and including the current close."
  how_it_trades: "At the close of a contraction-regime day, enter in the direction of the 20-day trend and hold 5 days."
why: "The only near-pass on all three coins was trend-following after NR7 days; this claim tests whether contraction adds to the trend itself, using a regime selector and a baseline that the NR7 claim did not have."
