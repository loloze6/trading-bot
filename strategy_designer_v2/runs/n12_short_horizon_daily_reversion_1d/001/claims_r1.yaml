brief: n12_short_horizon_daily_reversion_1d.md
source: analyst round 1
ideas:
- brief: n12_short_horizon_daily_reversion_1d.md
  ideas:
  - id: countertrend_pullback_depth_ranks_rebound
    belief: Pullbacks against the 100-day trend are bought back by trend followers,
      and deeper pullbacks in volatility units are bought back harder, so pullback
      depth ranks the next 5-day return.
    claim:
      when: Every 5th daily bar whose 3-day move is against the 100-day trend (down
        in an uptrend, up in a downtrend), of any size, with the trend and volatility
        defined.
      then: The more negative the 3-day vol-scaled move, the higher the next 5-day
        return.
      compared_to: Not used (rank_corr).
      measure: rank_corr
      horizon_bars: 5
      direction: positive
      min_effect: 0.15
      code: 'vol = ret.rolling(30).std().shift(3)

        z3 = (df.close / df.close.shift(3) - 1) / (vol * np.sqrt(3))

        ma100 = df.close.rolling(100).mean().shift(3)

        up_trend = df.close.shift(3) > ma100

        against = ((z3 < 0) & up_trend) | ((z3 > 0) & ~up_trend)

        grid = pd.Series(np.arange(len(df)) % 5 == 0, index=df.index)

        a = (against & grid & z3.notna() & ma100.notna()).fillna(False)

        b = ~a

        feature = -z3

        '
    why_no_lookahead: Volatility, trend and the 3-day move use only closes at or before
      the bar, the trend and volatility are shifted 3 bars to precede the move, and
      the grid is a fixed bar index.
    how_it_trades: At each 5-day check, if price has pulled back against the 100-day
      trend, take a position toward the trend sized by pullback depth, and exit after
      5 days.
