  code: 'vol = ret.rolling(30).std().shift(3)

    m3 = df.close.pct_change(3)

    z = m3 / (vol * np.sqrt(3))

    up = (z > 1.5).astype(float)

    dn = (z < -1.5).astype(float)

    prior_up = up.shift(4).rolling(9).max() > 0

    prior_dn = dn.shift(4).rolling(9).max() > 0

    opp = ((z > 1.5) & prior_dn) | ((z < -1.5) & prior_up)

    sh = z.abs() > 1.5

    a = spaced(sh & opp, 3)

    b = spaced(sh & ~opp, 3)

    signal = -np.sign(m3)

    '
