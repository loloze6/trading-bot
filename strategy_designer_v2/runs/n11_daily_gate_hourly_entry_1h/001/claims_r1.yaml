brief: n11_daily_gate_hourly_entry_1h.md
source: analyst round 1
ideas:
- id: trend_aligned_two_sided_breakout_net
  belief: Two-day range breaks that agree with a rising or falling two-week trend
    continue enough to pay the trading cost, on both the long and the short side.
  claim:
    when: bars that close above the prior 48h high while the 14-day mean is rising
      and price is above it, or close below the prior 48h low while the 14-day mean
      is falling and price is below it, at most one event per 24 bars
    then: price keeps moving in the direction of the break over the next 24 hours
      by more than the round-trip cost
    compared_to: zero after cost (net_return)
    measure: net_return
    horizon_bars: 24
    direction: positive
    min_effect: 0.003
    code: 'hh = df.high.rolling(48).max().shift(1)

      ll = df.low.rolling(48).min().shift(1)

      ma = df.close.rolling(336).mean()

      up = (df.close > ma) & (ma > ma.shift(72))

      dn = (df.close < ma) & (ma < ma.shift(72))

      bu = df.close > hh

      bd = df.close < ll

      ev = spaced(bu | bd, 24)

      a = ev & ((bu & up) | (bd & dn))

      b = ~a

      signal = pd.Series(np.where(bu, 1.0, -1.0), index=df.index)

      '
  why_no_lookahead: The highs, lows and moving average use only past bars (the range
    is shifted by 1, the mean is rolling and its slope uses shift(72)), and the break
    is judged on the bar's own close.
  how_it_trades: At the close of a trend-aligned break, enter in the direction of
    the break (long, or short on margin), hold 24 bars, then exit.
