run: n37_zec_ltc_hourly_trend_1h fold A
observations:
  - The 240h channel breakout passed on ZEC (net 0.0085 over 48 bars, 5 of 6 windows positive) but lost on LTC (net -0.0053, only 2 of 6 windows positive), so the claim failed because LTC broke it.
  - tsmom_168h_rank was never measured, with n_a = 0 on both coins. Its selector spaced(feature.notna(), 24) keeps only the first bar of a run that never ends, so the 7-day momentum belief is still untested.
  - The volume-confirmed breakout nearly held. Its whole-fold effects beat 0.004 on both coins (ZEC 0.0043, LTC 0.0100), but the windows split 3 of 6 positive on ZEC and 4 of 6 on LTC.
  - The US-session breakout cleared 0.003 on both coins (ZEC 0.0071, LTC 0.0135). LTC's figure rests on one window at 0.082 while 3 of 6 windows were negative.
  - On LTC, every net_return breakout rule was negative after cost: 240h at -0.0053, compression-gated 120h at -0.0042, efficiency ratio at -0.0034. Changing channel length or adding a gate did not rescue LTC.
  - The compression gate made ZEC worse rather than better: 0.0020 net versus 0.0085 for the ungated 240h channel.
  - Breakouts do not reliably start volatility expansions. The abs_ratio was 1.14 on ZEC and 1.06 on LTC against a required 1.3, with 2 of 6 windows below 1.0 on each coin.
  - Multi-horizon trend agreement lost on ZEC at -0.012 net over 72 bars, and its last three windows (-0.033, -0.043, -0.028) were all negative. ZEC's recent windows punished full trend alignment.
  - The weekend breakout fade was near zero on both coins (ZEC -0.0001, LTC 0.0017), so weekend breakouts neither continue nor revert by a tradable amount.
next_claim:
  id: vol_scaled_weekly_trend_rank
  belief: The strength of the past week's trend, measured against its own volatility, predicts the next day's return on both coins, once it is sampled one bar per day so the samples do not overlap.
  claim:
    when: one bar per day at 00:00 UTC, once a full week of history exists
    then: the next 24-bar return has the same rank order as the past 168-bar return divided by that week's volatility
    compared_to: no relation (zero rank correlation)
    measure: rank_corr
    horizon_bars: 24
    direction: positive
    min_effect: 0.08
    code: |
      r168 = df.close / df.close.shift(168) - 1
      sd = ret.rolling(168).std() * np.sqrt(168)
      feature = (r168 / sd.replace(0, np.nan)).replace([np.inf, -np.inf], np.nan)
      a = feature.notna() & (hour == 0)
      b = ~a
  why_no_lookahead: The feature uses only closes and returns up to and including the sampled bar, through shift(168) and a trailing 168-bar std, with no forward shift.
  how_it_trades: Each day at 00:00 UTC, hold long or short in the direction of the volatility-scaled weekly trend for 24 hours, sized by its strength.
why: This is the only belief in the brief that was never measured, because the judge saw n_a = 0. It uses a different feature (trend divided by volatility) and a non-overlapping daily sample, unlike the breakout rules that failed on LTC. Its 0.08 threshold is about 2 standard errors for roughly 700 daily samples.
