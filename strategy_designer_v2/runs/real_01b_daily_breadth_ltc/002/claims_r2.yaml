brief: real_01b_daily_breadth_ltc.md
source: analyst round 2
ideas:
- id: down_volume_share_exhaustion
  belief: When most of the past month's dollar volume traded on down days, forced
    and impatient sellers have been absorbed, as in the liquidity-premium result,
    so the next 20 days return more.
  claim:
    when: every bar with a 30-day down-volume share defined
    then: a higher share of the past 30 days' dollar volume traded on down days goes
      with a higher 20-day forward return
    compared_to: the rank ordering across all bars (rank_corr)
    measure: rank_corr
    horizon_bars: 20
    direction: positive
    min_effect: 0.08
    code: 'dv = (df.volume * df.close).replace(0, np.nan)

      down = dv.where(ret < 0, 0.0)

      feature = down.rolling(30, min_periods=25).sum() / dv.rolling(30, min_periods=25).sum()

      a = feature.notna() & np.isfinite(feature)

      b = ~a

      signal = np.sign(feature - 0.5).replace(0, 1.0)

      '
  why_no_lookahead: The feature uses only volume, close and the return of bars at
    or before the current close, through trailing 30-bar sums.
  how_it_trades: Go long when the 30-day down-volume share is high and flat or short
    when it is low, rebalanced at most daily; a slow 20-day hold pays the 0.15% cost
    a few times a year.
