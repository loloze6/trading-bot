observations:
  - "Only long_horizon_exhaustion passed: the 365-day log move has a negative rank correlation with the 60-bar forward return (LTC -0.307, XMR -0.116), negative in 5 of 6 windows on LTC (window 5 is +0.228) and in 6 of 6 on XMR."
  - "The tradable form of that reversal nearly held on LTC and failed on XMR: fade_extreme_yearly_move made 0.0273 net on LTC against a 0.03 bar, but -0.098 on XMR, with only 2 of 6 XMR windows populated."
  - "Window 5 goes against the reversal on LTC in both forms: +0.228 rank correlation in long_horizon_exhaustion and -0.818 net in fade_extreme_yearly_move, so fading a strong yearly trend before it turns can lose heavily."
  - "Broad momentum agreement did not pay: tsmom_horizon_agreement netted 0.0043 on LTC with window signs split 3 to 3, and -0.059 on XMR."
