  - "Volatility compression did not precede larger moves: abs_ratio was 0.974 on LTC and 1.116 on XMR, both under 1.15, and XMR window 4 was 0.333."
  - "Signed volume flow points in opposite directions on the two coins: rank correlation +0.131 on LTC and -0.165 on XMR."
  - "Sparse long setups lost money net of cost. Yearly-high proximity netted -0.042 on both coins with n_a of 20, and dips inside uptrends netted -0.016 on LTC and -0.042 on XMR with n_a of 20 and 16."
next_claim:
  id: yearly_exhaustion_after_turn
  belief: The 12-month reversal on LTC and XMR arrives once the 30-day move has already turned against the yearly move, so fading only after that turn beats fading while both still agree.
  claim:
    when: bars where the 30-day log move has the opposite sign to the 365-day log move
    then: a position against the 365-day move earns more over the next 60 bars
    compared_to: bars where the 30-day and 365-day moves have the same sign, with the same fade position
    measure: mean_diff
    horizon_bars: 60
    direction: positive
    min_effect: 0.03
    code: |
      lc = np.log(df.close)
      m365 = lc - lc.shift(365)
      m30 = lc - lc.shift(30)
      ok = m365.notna() & m30.notna() & (m365 != 0) & (m30 != 0)
      turn = ok & (np.sign(m30) != np.sign(m365))
      a = turn
      b = ok & ~turn
      signal = pd.Series(-np.sign(m365).replace(0, 1), index=df.index)
  why_no_lookahead: Both momentum terms use only closes at or before the bar, through shift(30) and shift(365).
  how_it_trades: Hold a 60-day position against the yearly move only after the 30-day move has turned against it, and stay flat while the two agree.
why: The 365-day reversal is the only effect that held on both coins, and the fade lost when it acted before the trend turned (LTC window 5, -0.818). Gating the fade on a 30-day turn is a new condition rather than a threshold change, it uses every bar so all windows get populated, and 3% over 60 days is well above the 0.15% cost and the noise seen in the fade.
