run: n35_privacy_coins_hourly_shock_1h/fold_A
observations:
  - "Volume-backed shock continuation lost money on both coins. ZEC netted -0.0062 per trade, with all 6 windows negative (from -0.0031 to -0.0093). XMR netted -0.0009, with 5 of 6 windows negative. The XRP/ETH/BTC continuation pattern does not carry over here."
  - "Breaking the weekly high or low on volume also failed as continuation. XMR netted -0.0086 with all 6 windows negative, and ZEC netted -0.0046 with 4 of 6 windows negative. A day after such breaks, price on thin coins tends to come back."
  - "Shocks raise later volatility on both coins. The 6-bar abs ratio was 1.53 on XMR and 1.49 on ZEC, and all 12 windows were above 1.0 (XMR at least 1.20, ZEC at least 1.03). The claim nearly held: the belief looks right, but the 1.6 asked was too high."
  - "Thin-volume shock reversion passed on ZEC (0.0056, 6 of 6 windows positive) but failed on XMR (-0.0006). One XMR window at -0.0206 dominates that result, and n_a was only 40."
  - "Wick-rejection reversal passed on ZEC (0.0039, 5 of 6 windows) but failed on XMR (-0.0005, n_a 27). Both coins must pass, so it fails; the samples are also too small to trust."
  - "Volume intensity ranked against continuation rather than for it. Rank correlation was -0.069 on XMR and -0.047 on ZEC. The last two windows were strongly negative on both coins (XMR -0.216 and -0.273, ZEC -0.182 and -0.265), while earlier windows were mixed. The windows disagree, and recent heavy-volume shocks reverted."
  - "A confirmed shock (next hour in the same direction) had a lower 12-bar hit rate than baseline: -0.047 on XMR and -0.060 on ZEC. ZEC had 4 of 6 windows negative, with one at -0.314."
  - "Heavy volume without a price move barely raised volatility: the ratio was 1.054 on XMR and 1.053 on ZEC, with one ZEC window at 0.92. On these coins the price move, not the volume, carries the volatility information."
  - "The off-hours versus on-hours shock contrast flipped sign between coins: +0.0018 on XMR and -0.0044 on ZEC. Session timing does not separate shocks consistently."
next_claim:
  id: range_expansion_raises_halfday_volatility
  belief: "On XMR and ZEC, an hour whose high-low range is far above normal starts a volatility cluster that lasts about half a day, whether or not volume backs it."
  claim:
    when: "an hourly bar whose high-low range relative to close exceeds 3 times its mean over the prior 168 bars, one event per 12 bars"
    then: "the absolute 12-bar forward return is larger"
    compared_to: "all other bars"
    measure: abs_ratio
    horizon_bars: 12
    direction: above
    min_effect: 1.3
    code: |
      rng = (df.high - df.low) / df.close
      mr = rng.rolling(168).mean().shift(1)
      a = spaced(rng > 3 * mr, 12)
      b = ~a
      signal = np.sign(ret).replace(0, 1)
  why_no_lookahead: "The range and the close are known at the bar's close, and the normal range uses only prior bars via shift(1)."
  how_it_trades: "As a filter: cut position size or widen stops on XMR/ZEC for 12 hours after a range-expansion bar. It is not a directional entry, since direction claims all failed."
why: "Volatility after a shock was the only effect consistent across all 12 windows on both coins, while every direction claim failed or split by coin. This tests whether a range-based, volume-free trigger keeps the effect at a half-day horizon, at a threshold set below the 1.49-1.53 seen at 6 bars to allow for decay."
