      n_a: 0
      n_b: 1
      windows:
      - null
      - null
      - null
      - null
      - null
      - null
      verdict: fail
      why: null
  code: 'vol = ret.rolling(168).std().shift(1)

    big = ret.abs() > 3 * vol

    hi24 = df.high.rolling(24).max().shift(1)

    lo24 = df.low.rolling(24).min().shift(1)

    out = (df.close > hi24) | (df.close < lo24)

    a = spaced(big & out, 12)

    b = spaced(big & ~out, 12)

    signal = pd.Series(np.where(ret >= 0, 1, -1), index=df.index)

    '
