  code: 'vol = ret.rolling(168).std().shift(1)

    big = ret.abs() > 3 * vol

    hi24 = df.high.rolling(24).max().shift(1)

    lo24 = df.low.rolling(24).min().shift(1)

    brk = big & ((df.close > hi24) | (df.close < lo24))

    prev = brk.shift(1).fillna(False).astype(bool)

    dprev = pd.Series(np.where(ret >= 0, 1, -1), index=df.index).shift(1)

    conf = prev & (ret * dprev > 0)

    a = conf

    b = prev & ~conf

    signal = dprev.fillna(1)

    '
