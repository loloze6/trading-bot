- id: big_break_continues_vs_inside_big
  belief: On SOL and AVAX, as on BTC, a violent hourly bar that closes outside the
    prior day's range marks new information and order flow that keeps pushing, while
    an equally big bar inside the range does not.
  measure: mean_diff
  horizon_bars: 12
  direction: positive
  min_effect: 0.006
  verdict: fail
  by_symbol:
