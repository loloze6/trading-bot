- id: compression_break_vol_expansion
  belief: When the prior day's range is unusually narrow, a close outside it releases
    stored volatility, so the next hours move much more than after breaks of a wide
    range.
  measure: abs_ratio
  horizon_bars: 12
  direction: above
  min_effect: 1.25
