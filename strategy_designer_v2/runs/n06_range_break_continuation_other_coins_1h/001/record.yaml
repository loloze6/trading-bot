  code: 'hi24 = df.high.rolling(24).max().shift(1)

    lo24 = df.low.rolling(24).min().shift(1)

    out = (df.close > hi24) | (df.close < lo24)

    r24 = (hi24 - lo24) / df.close.shift(1)

    comp = r24 < 0.6 * r24.rolling(168).median()

    a = spaced(out & comp, 12)

    b = spaced(out & ~comp, 12)

    signal = pd.Series(np.where(ret >= 0, 1, -1), index=df.index)

    '
- id: wick_rejection_reverts
  belief: A big bar that pokes beyond the prior day's high or low but closes back
    inside has swept stops and found no follow-through, so price swings back the other
    way.
  measure: mean_diff
  horizon_bars: 12
  direction: positive
  min_effect: 0.004
