brief: n06_range_break_continuation_other_coins_1h.md
source: analyst round 2
ideas:
- id: trend_aligned_24h_break
  belief: On SOL and AVAX, a 24h-range break continues only when the slow weekly trend
    is behind it, because the trend-following flow seen in the weekly results is what
    carries a break.
  claim:
    when: the first close beyond the prior 24h high in a week that is up, or below
      the prior 24h low in a week that is down (168-bar return sign)
    then: price keeps moving in the break direction over the next 24 bars
    compared_to: first closes beyond the prior 24h range that go against the weekly
      trend
    measure: mean_diff
    horizon_bars: 24
    direction: positive
    min_effect: 0.005
    code: 'r168 = df.close / df.close.shift(168) - 1

      hi24 = df.high.rolling(24).max().shift(1)

      lo24 = df.low.rolling(24).min().shift(1)

      up = (df.close > hi24) & (df.close.shift(1) <= hi24.shift(1))

      dn = (df.close < lo24) & (df.close.shift(1) >= lo24.shift(1))

      brk = (up | dn) & r168.notna()

      with_trend = (up & (r168 > 0)) | (dn & (r168 < 0))

      a = spaced(brk & with_trend, 24)

      b = spaced(brk & ~with_trend, 24)

      signal = pd.Series(np.where(dn, -1, 1), index=df.index)

      '
  why_no_lookahead: The 168-bar return, the 24h high/low (shifted one bar) and the
    break test all use closes at or before the signal bar.
  how_it_trades: Enter in the break direction at the close of a trend-aligned 24h
    break and exit 24 bars later.
