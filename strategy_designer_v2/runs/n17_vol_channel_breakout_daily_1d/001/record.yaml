- id: keltner_up_break_long_net
  belief: A daily close crossing above a 20-day EMA plus 2 ATR marks new demand that
    keeps pushing price for about two weeks, enough to pay the round trip.
  measure: net_return
  horizon_bars: 10
  direction: positive
  min_effect: 0.01
  verdict: fail
  by_symbol:
    BTCUSD:
      effect: 0.03652911607759703
      n_a: 9
      n_b: 9
      windows:
      - 0.11604978201150767
      - 0.006491841708590797
      - 0.004678306798297673
      - 0.18023769568191877
      - -0.043335564391970616
      - 0.0507418527867044
      verdict: fail
      why: null
    LTCUSD:
      effect: 0.006822303090782654
      n_a: 12
      n_b: 12
      windows:
      - -0.2175959675602614
      - 0.009558272711191309
      - null
      - 0.003203936457593094
      - 0.30240390522206756
      - -0.1166617231848111
      verdict: fail
      why: null
  code: 'tr = pd.concat([df.high - df.low, (df.high - df.close.shift(1)).abs(), (df.low
    - df.close.shift(1)).abs()], axis=1).max(axis=1)

    atr = tr.rolling(20).mean()

    mid = df.close.ewm(span=20, adjust=False).mean()

    up = mid + 2 * atr

    cross = (df.close > up) & (df.close.shift(1) <= up.shift(1))

    a = spaced(cross, 10)

    b = ~a

    signal = pd.Series(1.0, index=df.index)

    '
