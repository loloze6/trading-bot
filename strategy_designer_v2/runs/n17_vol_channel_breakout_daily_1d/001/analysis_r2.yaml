run: n17_vol_channel_breakout_daily_1d / fold B (try folder not named in record.yaml)
observations:
  - "The plain upside Keltner break (EMA20 + 2 ATR20, 10-bar hold) cleared min_effect on BTC (net 0.0365 vs 0.01) but not on LTC (0.0068), and LTC had two large negative windows (-0.218 and -0.117)."
  - "No event claim was decidable: upside crosses spaced 10 bars gave only 9 BTC and 12 LTC events, and every event-based a or b set was below the 30-bar minimum (down-breaks 9 and 8, deep flushes 3 and 6)."
  - "Volatility expansion after a break nearly held: abs_ratio was 1.244 on BTC and 1.334 on LTC (min 1.2), but each coin had 2 of 6 windows below 1 (BTC 0.555 and 0.670, LTC 0.904 and 0.952) and only 22 and 26 events."
  - "Channel-position reversion nearly held, with the windows disagreeing with the pooled number: the 6 LTC windows were all positive (0.053 to 0.238) and 5 of 6 BTC windows were positive (up to 0.225), yet the whole-fold rank_corr was only -0.013 on BTC and 0.004 on LTC."
  - "Distance above the upper band predicted weaker follow-through on LTC, not stronger: rank_corr was -0.138 overall and negative in all 4 computed windows (-0.317 to -0.636), while BTC was mixed (-0.092 overall, windows from +0.729 to -0.254)."
  - "Downside breaks did not continue on BTC: shorting them gave mean_diff -0.043 at 10 bars. A long after a 2.5 ATR flush also lost at 5 bars (net -0.016 BTC, -0.035 LTC), so neither continuation nor quick bounce holds at the lower band."
  - "Volume-confirmed upside breaks beat thin-volume breaks on BTC (mean_diff 0.079, all 4 computed windows positive) but not cleanly on LTC (0.041, with a -0.102 window), and the thin-volume sets were tiny (6 and 4 bars)."
  - "The slow wide channel (SMA50 + 3 ATR50, 20 bars) split by coin: net 0.044 on BTC and -0.056 on LTC, and both coins had a window near or below -0.18."
  - "Staying in above the mean after a break helped BTC (mean_diff 0.025) but not LTC (-0.008), and LTC was negative in all 5 computed windows."
next_claim:
  id: stretched_channel_reversion_hit
  belief: "On daily BTC and LTC, a close stretched more than 1.5 ATR from its 20-day EMA tends to move back toward the mean over the next week more reliably than an unstretched close, so the edge of the channel fades rather than breaks out."
  claim:
    when: "bars whose close is more than 1.5 ATR20 above or below the 20-day EMA"
    then: "the 5-bar forward return points back toward the EMA more often"
    compared_to: "bars within 1.5 ATR20 of the EMA, with the same toward-the-mean signal"
    measure: hit_rate
    horizon_bars: 5
    direction: positive
    min_effect: 0.07
    code: |
      tr = pd.concat([df.high - df.low, (df.high - df.close.shift(1)).abs(), (df.low - df.close.shift(1)).abs()], axis=1).max(axis=1)
      atr = tr.rolling(20).mean()
      mid = df.close.ewm(span=20, adjust=False).mean()
      z = (df.close - mid) / atr
      valid = atr.notna() & (atr > 0) & (df.index >= df.index[19])
      a = valid & (z.abs() > 1.5)
      b = valid & (z.abs() <= 1.5)
      signal = (-np.sign(z)).replace(0, 1.0).fillna(1.0)
  why_no_lookahead: "ATR, EMA and z use only bars up to and including the current close; the forward return starts after it."
  how_it_trades: "When a daily close sits more than 1.5 ATR outside the EMA20, take the side toward the mean and hold for 5 days."
why: "Within each window, reversion from the channel mean held on both coins (all 6 LTC windows and 5 of 6 BTC windows positive), and stretched upside closes faded on LTC (all 4 windows negative); the tail-versus-centre hit-rate test keeps 30+ bars per set, which no event claim managed, and 0.07 is about 1.5 standard errors at roughly 120 stretched bars."
