  code: 'h, l, o, c = df.high, df.low, df.open, df.close

    avg_rng = (h - l).rolling(14).mean()

    top = (h.shift(1) >= h.shift(1).rolling(10).max()) & ((h - h.shift(1)).abs() <=
    0.35 * avg_rng) & (c < o)

    bot = (l.shift(1) <= l.shift(1).rolling(10).min()) & ((l - l.shift(1)).abs() <=
