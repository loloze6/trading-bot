  code: 'h, l, c = df.high, df.low, df.close

    hi10 = h.shift(1).rolling(10).max()

    lo10 = l.shift(1).rolling(10).min()

    brk_hi = h > hi10

    brk_lo = (l < lo10) & ~brk_hi

    fail = (brk_hi & (c < hi10)) | (brk_lo & (c > lo10))

    acc = (brk_hi & (c >= hi10)) | (brk_lo & (c <= lo10))

    a = fail.fillna(False)

    b = acc.fillna(False)

    signal = pd.Series(np.where(brk_hi, -1.0, 1.0), index=df.index)

