  code: 'base = df.volume.shift(5).rolling(30).median()

    vr = df.volume / base

    hot = (vr > 1.8).astype(int)

    run = hot.rolling(3).sum() == 3

    rng = (df.high - df.low).replace(0, np.nan)

    clv = ((df.close - df.low) - (df.high - df.close)) / rng

    clv3 = clv.rolling(3).mean()

    a = spaced(run & (clv3.abs() > 0.4), 10)

    b = ~a

    signal = np.sign(clv3).replace(0, 1)

    '
