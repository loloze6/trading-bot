brief: n03_eth_hourly_stretch_reversion_1h.md
source: analyst round 1
ideas:
- id: weekend_stretch_continuation
  belief: On thin, retail-driven weekends, a close far from the 24h VWAP reflects
    one-sided flow that liquidity providers do not absorb, so price keeps moving in
    the stretch direction over the next half day by more than cost.
  claim:
    when: Saturday or Sunday hourly bars whose close is more than 2 sigma (720-bar
      std of the deviation) from the rolling 24h VWAP, one event per 12 bars
    then: the 12-bar forward return has the same sign as the deviation, and its mean
      exceeds the round-trip cost by at least 0.3%
    compared_to: zero after cost (net_return)
    measure: net_return
    horizon_bars: 12
    direction: positive
    min_effect: 0.003
    code: 'tp = (df.high + df.low + df.close) / 3

      vwap = (tp * df.volume).rolling(24).sum() / df.volume.rolling(24).sum()

      dev = df.close / vwap - 1

      z = dev / dev.rolling(720).std()

      a = spaced((z.abs() > 2) & (dow >= 5), 12)

      b = ~a

      signal = np.sign(dev)

      '
  why_no_lookahead: The VWAP, the deviation, its rolling std and the weekday all use
    only bars at or before the signal bar's close.
  how_it_trades: On a weekend bar close with |z| > 2, enter in the direction of the
    deviation from the 24h VWAP and exit 12 bars later.
