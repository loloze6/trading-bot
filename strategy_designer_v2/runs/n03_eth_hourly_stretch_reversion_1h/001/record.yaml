      verdict: fail
      why: null
  code: 'tp = (df.high + df.low + df.close) / 3

    vwap = (tp * df.volume).rolling(24).sum() / df.volume.rolling(24).sum()

    dev = df.close / vwap - 1

    z = dev / dev.rolling(720).std()

    rv = ret.rolling(168).std()

    q = rv.rolling(720).rank(pct=True)

    st = z.abs() > 2

    a = spaced(st & (q < 0.33), 12)

    b = spaced(st & (q > 0.67), 12)

    signal = -np.sign(dev)

    '
- id: day_anchored_vwap_late_fade
  belief: Late in the UTC day, a close far from that day's own session VWAP (anchored
    at 00 UTC) marks a day-end imbalance that reverts as the new day's flow resets
    positioning.
  measure: mean_diff
  horizon_bars: 6
  direction: positive
  min_effect: 0.002
  verdict: fail
  by_symbol:
    ETHUSD:
      effect: 0.002920705265611321
      n_a: 204
      n_b: 17315
      windows:
      - 0.0022189300219361335
      - 0.00587457837836363
      - -0.006786921990757216
      - 0.003680843718315328
      - 0.010550793886624976
      - -0.0006887185420418541
      verdict: fail
      why: null
  code: 'tp = (df.high + df.low + df.close) / 3

    d = df.index.normalize()

    dvwap = (tp * df.volume).groupby(d).cumsum() / df.volume.groupby(d).cumsum()

    dev = df.close / dvwap - 1

    z = dev / dev.rolling(720).std()

    a = spaced((z.abs() > 2) & (hour >= 16) & (hour <= 23), 6)

    b = ~a

    signal = -np.sign(dev)

    '
