- id: asia_hours_stretch_fade
  belief: Stretches built during thin Asian hours (00-06 UTC), with Europe and the
    US away, reflect poor liquidity and are corrected once deeper books arrive in
    the European morning.
  measure: mean_diff
  horizon_bars: 8
  direction: positive
  min_effect: 0.002
  verdict: pass
  by_symbol:
    ETHUSD:
      effect: 0.005149532773483761
      n_a: 98
      n_b: 152
      windows:
