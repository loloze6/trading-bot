      - 0.006597887577197896
      - -0.006758135195859511
      - 0.009262099482056139
      verdict: pass
      why: null
  code: 'tp = (df.high + df.low + df.close) / 3

    vwap = (tp * df.volume).rolling(24).sum() / df.volume.rolling(24).sum()

    dev = df.close / vwap - 1

    z = dev / dev.rolling(720).std()

    st = z.abs() > 2

    a = spaced(st & (hour >= 0) & (hour <= 6), 8)

    b = spaced(st & (hour >= 12) & (hour <= 20), 8)

    signal = -np.sign(dev)

