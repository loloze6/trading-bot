brief: n03_eth_hourly_stretch_reversion_1h.md
fold: B
symbols:
- ETHUSD
bar_size: 1h
claims:
- id: vwap24_stretch_fade
  belief: When ETH closes far from its rolling 24h volume-weighted price, measured
    against how far it usually strays, the move overshoots and price drifts back toward
    the VWAP within half a day by more than cost.
  measure: net_return
  horizon_bars: 12
  direction: positive
  min_effect: 0.002
  verdict: fail
  by_symbol:
    ETHUSD:
      effect: -0.0005601349887565816
      n_a: 102
      n_b: 102
      windows:
      - 0.003900210911246989
      - -0.01122765806474729
      - -0.016690712905086526
      - -0.0012095252966530955
      - 0.010795678473859226
      - 0.0025067758814795115
      verdict: fail
      why: null
  code: 'tp = (df.high + df.low + df.close) / 3

    vwap = (tp * df.volume).rolling(24).sum() / df.volume.rolling(24).sum()

    dev = df.close / vwap - 1

    z = dev / dev.rolling(720).std()

    a = spaced(z.abs() > 2.5, 12)

    b = ~a

    signal = -np.sign(dev)

    '
- id: range_edge_inside_fade
  belief: A close pressed against the edge of the prior 24h range without breaking
    it shows a failed push, so price rotates back toward the range middle. The brief's
    already_tried note says closes beyond the range continue; this idea keeps only
    the inside case.
  measure: mean_diff
  horizon_bars: 8
  direction: positive
  min_effect: 0.002
  verdict: fail
  by_symbol:
    ETHUSD:
      effect: 0.0003081856746495491
      n_a: 593
      n_b: 16926
      windows:
      - 0.0007173516994606625
      - -0.00038197221115179186
      - -0.0012120255592126044
      - -0.0011889347393631239
      - 0.0008426848190868953
      - 0.0031745935667400874
      verdict: fail
      why: null
  code: 'hi = df.high.shift(1).rolling(24).max()

    lo = df.low.shift(1).rolling(24).min()

    pos = (df.close - lo) / (hi - lo)

    edge = ((pos > 0.85) & (pos <= 1.0)) | ((pos < 0.15) & (pos >= 0.0))

    a = spaced(edge, 8)

    b = ~a

    signal = -np.sign(pos - 0.5)

    '
- id: slow_ema_zscore_rank
  belief: The further ETH sits from its 3-day exponential mean in units of recent
    hourly volatility, the more negative the next 12 hours return in the direction
    of that distance.
  measure: rank_corr
  horizon_bars: 12
  direction: negative
  min_effect: -0.05
  verdict: fail
  by_symbol:
    ETHUSD:
      effect: -0.003429571485286382
      n_a: 17519
      n_b: 17519
      windows:
      - 0.0008634976909247613
      - -0.026498824216409145
      - -0.04675435463689171
      - 0.007810552883230491
      - -0.037787506749530096
      - -0.059920077640195774
      verdict: fail
      why: null
  code: 'ema = df.close.ewm(span=72, adjust=False).mean()

    sig = ret.rolling(168).std()

    feature = (df.close / ema - 1) / sig

    a = feature.notna()

    b = ~a

    '
- id: gradual_grind_stretch_fade
  belief: A VWAP stretch built by many small bars, with no shock bar, is an exhausting
    grind by impatient flow rather than news, and it reverts. This differs from the
    large-bar fades already tried on BTC.
  measure: mean_diff
  horizon_bars: 12
  direction: positive
  min_effect: 0.003
  verdict: fail
  by_symbol:
    ETHUSD:
      effect: 0.005056028099128823
      n_a: 55
      n_b: 17464
      windows:
      - 0.018404868325441016
      - -0.025164005116406207
      - 0.0030859295337172343
      - -0.008361313970700867
      - 0.009772960066191534
      - 0.009854641903338443
      verdict: fail
      why: null
  code: 'tp = (df.high + df.low + df.close) / 3

    vwap = (tp * df.volume).rolling(24).sum() / df.volume.rolling(24).sum()

    dev = df.close / vwap - 1

    z = dev / dev.rolling(720).std()

    sig = ret.rolling(168).std()

    no_shock = (ret.abs() > 2 * sig).astype(int).rolling(12).sum() == 0

    a = spaced((z.abs() > 2) & no_shock, 12)

    b = ~a

    signal = -np.sign(dev)

    '
