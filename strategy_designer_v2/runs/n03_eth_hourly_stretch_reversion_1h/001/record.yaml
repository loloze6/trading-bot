- id: calm_regime_stretch_fade
  belief: In a calm, range-bound volatility regime, stretches from VWAP are noise
    that reverts. In a volatile regime the same stretch belongs to a trend.
  measure: mean_diff
  horizon_bars: 12
  direction: positive
  min_effect: 0.003
  verdict: fail
