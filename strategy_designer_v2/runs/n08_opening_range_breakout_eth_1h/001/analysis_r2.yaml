run: strategy_designer_v2/runs/n08_opening_range_breakout_eth_1h/001
observations:
  - A plain first close beyond the 00-04 UTC range did not continue (net_return -0.0017 over 8 bars on 702 events), and only 1 of 6 windows was positive (+0.0035 in W4).
  - The US 13-15 UTC range break was the clearest failure (net_return -0.0024), negative in 5 of 6 windows. Even so, fading it would earn only about +0.0009 before cost, which is below the 0.0015 round trip.
  - False breaks back inside the range did not revert profitably (net_return -0.0015 on 440 events), and the London break of the Asia range was near zero (-0.0003), with windows split from -0.0063 to +0.0038.
  - On size, the first break bar was not followed by larger moves (abs_ratio 1.02 against 1.3 asked). Days still inside their range at 12 UTC were not quieter, and in fact moved more (abs_ratio 1.09 against below 0.85, on only 39 bars).
  - Where hour 3 closes inside the opening range predicted the next 20 hours (rank_corr 0.108, above 0.06). The effect was 0.15-0.19 in W2-W5, but about 0 in W1 (-0.0002) and weaker in W6 (0.054).
  - Volume confirmation nearly held: the mean_diff of 0.0024 cleared 0.002 on the whole fold. It failed on window sign, swinging from -0.0148 in W3 to +0.0125 in W6.
  - Breaks in the direction of the prior UTC day beat counter-trend breaks by 0.0024 over 8 bars, positive in 5 of 6 windows. In the engine it lost 42.8% at full size and had a median window Sharpe of -0.28, because cost drag reached 478% of gross in W5.
  - A close near the range edge (|loc|>=0.3) that agreed with the prior day gave net_return 0.0096 over 20 bars on 106 events. W1 was the only negative window (-0.0071), and W4 alone contributed +0.0334.
  - In the engine that same claim was net positive in 5 of 6 windows. At full size its worst drawdown was 49.9%. Under vol_target sizing the worst drawdown was 6.4%, but the median Sharpe of 0.90 missed the 1.0 bar, with W5 (0.20) and W6 (0.32) weakest.
  - Both claims that passed depend on the prior UTC day's direction, and W1 is weak or negative for both the location rank_corr and the combined net_return.
next_claim:
  id: prior_day_return_drift
  belief: The prior UTC day's return carries into the next day on ETH by itself, so the edge in the two passing claims may come from the prior-day trend more than from the opening range.
  claim:
    when: the 03 UTC hourly bar (close of the fourth hour of the UTC day), on days with a known prior-day return
    then: the next 20 hours' return ranks with the prior UTC day's close-to-close return
    compared_to: none (rank correlation on the when bars)
    measure: rank_corr
    horizon_bars: 20
    direction: positive
    min_effect: 0.08
    code: |
      t = df.index - pd.Timedelta(hours=1)
      day = pd.Series(t.normalize(), index=df.index)
      hod = pd.Series(t.hour, index=df.index)
      dc = df.close.groupby(day).last()
      prev = day.map(dc.pct_change().shift(1))
      a = (hod == 3) & prev.notna()
      b = ~a
      feature = prev
      signal = pd.Series(np.sign(prev).replace(0, 1).fillna(1), index=df.index)
  why_no_lookahead: prev is the full return of the UTC day before the bar's day, completed at least four hours before the 03 UTC bar closes.
  how_it_trades: At the 03 UTC close, go long after an up day and short after a down day, then exit 20 hours later.
why: Both passes rely on prior-day alignment, so testing prior-day drift alone at the same entry and horizon shows whether the opening range adds information. A 0.08 threshold is about two standard errors on roughly 730 days, above the 0.06 the location claim cleared.
