- id: break_aligned_with_prior_day
  belief: An opening-range break in the direction of the prior UTC day's move joins
    a running trend and continues, while a counter-trend break is more often a retracement
    that fails.
  measure: mean_diff
  horizon_bars: 8
  direction: positive
  min_effect: 0.002
  verdict: pass
