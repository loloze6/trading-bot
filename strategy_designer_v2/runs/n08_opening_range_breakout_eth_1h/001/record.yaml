- id: asia_or_break_continuation
  belief: A close beyond the 00-04 UTC opening range shows that the day's first directional
    flow has started, and it keeps going for the next several hours.
  measure: net_return
  horizon_bars: 8
  direction: positive
  min_effect: 0.002
  verdict: fail
  by_symbol:
    ETHUSD:
      effect: -0.0017251367302518403
      n_a: 702
      n_b: 702
      windows:
      - -0.010021978083221837
      - -0.0019643564396665653
      - -0.0010142113345521623
      - 0.0034513227296981155
      - -0.0007337201009391999
      - -0.0002661974122997032
      verdict: fail
      why: null
  code: 't = df.index - pd.Timedelta(hours=1)

    day = pd.Series(t.normalize(), index=df.index)

    hod = pd.Series(t.hour, index=df.index)

    inor = hod < 4

    post = hod >= 4

    or_hi = df.high.where(inor).groupby(day).transform(''max'')

    or_lo = df.low.where(inor).groupby(day).transform(''min'')

    up = post & (df.close > or_hi)

    dn = post & (df.close < or_lo)

    brk = up | dn

    a = brk & (brk.astype(int).groupby(day).cumsum() == 1)

    b = ~a

    signal = pd.Series(np.where(up, 1, -1), index=df.index)

    '
