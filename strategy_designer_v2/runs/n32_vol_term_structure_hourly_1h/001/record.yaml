  code: 'rv24 = ret.rolling(24).std()

    rv168 = ret.rolling(168).std()

    r = rv24 / rv168

    pk = np.log(df.high / df.low) ** 2

    pr = np.sqrt(pk.rolling(24).mean()) / np.sqrt(pk.rolling(168).mean())

    chop = (pr > 1.3) & (r < 1.0)

    pc6 = df.close.pct_change(6)

    a = spaced(chop, 6)

    b = spaced(r.notna() & pr.notna() & ~chop, 6)

    signal = -np.sign(pc6)

    '
