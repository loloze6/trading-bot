- id: range_expansion_without_close_expansion_chop
  belief: When intrabar ranges widen on the 24h/168h Parkinson ratio but close-to-close
    vol does not, the market is churning without direction, and the last 6h move reverts.
  measure: hit_rate
  horizon_bars: 6
  direction: positive
  min_effect: 0.03
  verdict: fail
