brief: n04_btc_daily_vol_timing_1d.md
source: analyst round 2
ideas:
- id: low_vs_high_vol_momentum_contrast
  belief: BTC 20-day momentum pays more in the bottom third of its past-year volatility
    than in the top third, so the volatility level, not momentum alone, is what times
    the trend rule.
  claim:
    when: bars whose 20-day realized volatility ranks in the bottom third of the past
      365 days
    then: the sign of 20-day momentum earns more over the next 10 bars
    compared_to: bars whose 20-day realized volatility ranks in the top third of the
      past 365 days, same momentum rule
    measure: mean_diff
    horizon_bars: 10
    direction: positive
    min_effect: 0.01
    code: 'vol20 = ret.rolling(20).std()

      pct = vol20.rolling(365).rank(pct=True)

      mom = df.close.pct_change(20)

      a = (pct < 0.33) & mom.notna()

      b = (pct > 0.67) & mom.notna()

      signal = np.sign(mom).replace(0, 1).fillna(1)

      '
  why_no_lookahead: The volatility rank and momentum use only rolling windows ending
    at the bar's close.
  how_it_trades: Hold the 20-day momentum direction only while volatility ranks low,
    and go flat when it ranks high.
