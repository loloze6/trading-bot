      - -0.0036732476482154866
      - -0.006132149114400425
      - 0.042791530374113824
      verdict: fail
      why: null
  code: 'vol20 = ret.rolling(20).std()

    pct = vol20.rolling(365).rank(pct=True)

    a = pct > 0.67

    b = pct < 0.33

    signal = -np.sign(df.close.pct_change(3)).replace(0, 1).fillna(1)

    '
- id: drawdown_vol_contraction_long
  belief: After a deep BTC drawdown, a calming of short-term volatility marks the
    end of capitulation and precedes a rebound.
  measure: net_return
  horizon_bars: 10
  direction: positive
  min_effect: 0.02
  verdict: fail
  by_symbol:
    BTCUSD:
      effect: -0.00973020601983642
      n_a: 16
      n_b: 16
      windows:
      - -0.037248604200074566
      - 0.004732313639377855
      - 0.05912438604233633
      - 0.15299106219530217
      - null
      - -0.054407111578760936
      verdict: fail
      why: null
  code: 'dd = df.close / df.close.rolling(60).max() - 1

    calm = ret.rolling(5).std() < 0.7 * ret.rolling(20).std()

    a = spaced((dd < -0.2) & calm, 5)

    b = ~a

    signal = pd.Series(1.0, index=df.index)

    '
- id: compression_breakout_direction
  belief: When BTC's range is compressed, the first close outside that range reveals
    the side that wins the coming expansion.
  measure: net_return
  horizon_bars: 10
  direction: positive
  min_effect: 0.015
  verdict: fail
  by_symbol:
    BTCUSD:
      effect: -0.008620556775457169
      n_a: 11
      n_b: 11
      windows:
      - 0.0548109608676274
      - -0.09982131738739924
      - null
      - 0.06735467845210986
      - 0.018828535293668736
      - -0.29933747830177965
      verdict: fail
      why: null
  code: 'rng = df.high.rolling(20).max() / df.low.rolling(20).min() - 1

    comp = rng.shift(1).rolling(365).rank(pct=True) < 0.25

    up = df.close > df.high.shift(1).rolling(20).max()

    dn = df.close < df.low.shift(1).rolling(20).min()

    a = spaced((up | dn) & comp, 10)

    b = spaced((up | dn) & ~comp, 10)

    signal = pd.Series(np.where(up, 1.0, -1.0), index=df.index)

    '
- id: upside_vol_expansion_continuation
  belief: In BTC, a volatility expansion that comes with rising prices reflects short
    squeezes and FOMO inflows that keep pushing price up.
  measure: net_return
  horizon_bars: 5
  direction: positive
  min_effect: 0.01
  verdict: fail
  by_symbol:
    BTCUSD:
      effect: -0.009280501795538843
      n_a: 34
      n_b: 34
      windows:
      - 0.05392754370532021
      - -0.12520209540700847
      - 0.017349305832065454
      - 0.09111586360823015
      - 0.011464374776527154
      - -0.13593729924220002
      verdict: fail
      why: null
  code: 'vr = ret.rolling(5).std() / ret.rolling(60).std()

    a = (vr > 1.5) & (df.close.pct_change(5) > 0)

    b = ~a

    signal = pd.Series(1.0, index=df.index)

    '
- id: vol_scaled_momentum_strength
  belief: Momentum measured in units of its own volatility predicts BTC's next moves
    better than raw momentum, which supports sizing by volatility.
  measure: rank_corr
  horizon_bars: 10
  direction: positive
  min_effect: 0.05
  verdict: fail
  by_symbol:
    BTCUSD:
      effect: 0.2091286926565131
      n_a: 731
      n_b: 731
      windows:
      - -0.045412875894159314
      - 0.03301489321626721
      - -0.1399504714243335
      - -0.020722124373391135
      - 0.3410173120834311
      - 0.17612309914743782
      verdict: fail
      why: null
  code: 'feature = df.close.pct_change(20) / (ret.rolling(20).std() * np.sqrt(20))

    a = feature.notna()

    b = ~a

    signal = np.sign(feature).replace(0, 1).fillna(1)

    '
- id: uptrend_vol_spike_exit
  belief: Within a BTC uptrend, a spike in volatility signals distribution and a weaker
    forward return, so longs should exit on expansion.
  measure: mean_diff
  horizon_bars: 10
  direction: positive
  min_effect: 0.01
  verdict: fail
  by_symbol:
    BTCUSD:
      effect: 0.07695935059547937
      n_a: 94
      n_b: 277
      windows:
      - 0.04539511657122175
      - null
      - 0.09915230473608369
      - null
      - -0.008016900382634778
      - 0.21691346365120123
      verdict: fail
      why: null
  code: 'upt = df.close > df.close.rolling(100).mean()

    pct = ret.rolling(20).std().rolling(365).rank(pct=True)

    a = upt & (pct > 0.8)

    b = upt & (pct <= 0.8)

    signal = pd.Series(-1.0, index=df.index)

    '
- id: close_vs_range_vol_efficiency
  belief: When close-to-close volatility is high relative to intraday high-low range,
    BTC moves are directional rather than choppy, so momentum works better.
  measure: mean_diff
  horizon_bars: 10
  direction: positive
  min_effect: 0.01
  verdict: fail
  by_symbol:
    BTCUSD:
      effect: -0.0048110258980364196
      n_a: 212
      n_b: 213
      windows:
      - 0.04520756264347314
      - 0.1109296701244876
      - -0.11480349981553643
      - -0.0048890065899487405
      - -0.11138625218870898
      - 0.04658645906473106
      verdict: fail
      why: null
  code: 'cc = ret.rolling(20).std()

    pk = np.log(df.high / df.low).rolling(20).mean()

    r = (cc / pk).rolling(365).rank(pct=True)

    a = r > 0.67

    b = r < 0.33

    signal = np.sign(df.close.pct_change(10)).replace(0, 1).fillna(1)

    '
- id: low_volume_shock_fade
  belief: A large BTC daily move on below-normal volume lacks real participation and
    tends to revert, while high-volume shocks hold.
  measure: mean_diff
  horizon_bars: 3
  direction: positive
  min_effect: 0.008
  verdict: fail
  by_symbol:
    BTCUSD:
      effect: -0.022389304596419923
      n_a: 4
      n_b: 103
      windows:
      - -0.1747555804944829
      - null
      - 0.022946540910311675
      - 0.02312989473442085
      - null
      - null
      verdict: fail
      why: null
  code: 'sd = ret.rolling(20).std().shift(1)

    big = ret.abs() > 1.5 * sd

    lowv = df.volume < df.volume.rolling(20).median().shift(1)

    a = big & lowv

    b = big & ~lowv

    signal = -np.sign(ret).replace(0, 1).fillna(1)

    '
- id: upside_semivariance_share
  belief: When most of BTC's recent variance comes from up days, buyers are driving
    volatility and returns continue up; downside-driven variance precedes weakness.
  measure: rank_corr
  horizon_bars: 10
  direction: positive
  min_effect: 0.05
  verdict: fail
  by_symbol:
    BTCUSD:
      effect: 0.1839469110880843
      n_a: 731
      n_b: 731
      windows:
      - -0.14007917216473365
      - 0.18610407076838684
      - -0.26068927267802555
      - 0.016928600460642186
      - 0.3735001867021786
      - 0.2063045749442159
      verdict: fail
      why: null
  code: 'up2 = (ret.clip(lower=0) ** 2).rolling(20).sum()

    tot = (ret ** 2).rolling(20).sum()

    feature = up2 / tot

    a = feature.notna()

    b = ~a

    signal = np.sign(feature - 0.5).replace(0, 1).fillna(1)

    '
- id: falling_vol_momentum_vs_rising
  belief: BTC momentum pays more while realized volatility is falling than while it
    is rising, because a contracting vol state means fewer forced exits interrupting
    the trend.
  measure: mean_diff
  horizon_bars: 10
  direction: positive
  min_effect: 0.01
  verdict: fail
  by_symbol:
    BTCUSD:
      effect: -0.01053197848268905
