claims:
- id: low_vol_regime_momentum
  belief: BTC trends persist when realized volatility is calm relative to its own
    past year, because calm markets carry less forced deleveraging that breaks trends.
  measure: net_return
  horizon_bars: 10
  direction: positive
  min_effect: 0.01
  verdict: pass
  by_symbol:
    BTCUSD:
      effect: 0.03874892477174613
      n_a: 291
      n_b: 291
      windows:
      - -0.0006335304472474171
      - 0.018208310818904023
      - 0.1387781468005665
      - 0.06727079283959461
      - 0.07068576502505801
      - 0.0011369580772931957
      verdict: pass
      why: null
  code: 'vol20 = ret.rolling(20).std()

    pct = vol20.rolling(365).rank(pct=True)

    mom = df.close.pct_change(20)

    a = (pct < 0.5) & mom.notna()

    b = ~a

    signal = np.sign(mom).replace(0, 1).fillna(1)

    '
- id: high_vol_regime_short_reversal
  belief: In high-volatility regimes, BTC's short moves are liquidation overshoots
    that revert, so the right rule switches from momentum to reversal.
