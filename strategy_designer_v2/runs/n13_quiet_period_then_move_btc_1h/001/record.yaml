- id: close_location_in_compression
  belief: When price sits at the edge of a compressed range, the side it presses on
    is the side of the coming release.
  measure: hit_rate
  horizon_bars: 6
  direction: positive
  min_effect: 0.05
  verdict: fail
  by_symbol:
    BTCUSD:
      effect: 0.029643453139299114
      n_a: 322
      n_b: 4846
      windows:
      - -0.021078682369004953
      - 0.1446274034414251
      - -0.03019725177304966
      - -0.06134969325153372
      - 0.06172632987621279
      - 0.07865761689291101
      verdict: fail
      why: null
  code: 'hi12 = df.high.rolling(12).max()

    lo12 = df.low.rolling(12).min()

    rng12 = (hi12 - lo12) / df.close

    quiet = rng12 <= rng12.rolling(168).quantile(0.2)

    loc = (df.close - lo12) / (hi12 - lo12)

    edge = (loc > 0.8) | (loc < 0.2)

    a = spaced(quiet & edge, 12)

    b = ~quiet & edge & rng12.rolling(168).quantile(0.2).notna()

    signal = np.sign(loc - 0.5).replace(0, 1)

    '
