run: n09_long_horizon_reversal_book_1d / fold A
observations:
  - The fold holds about 730 daily bars per symbol (n_a = 730 in the yearly-mean book), so the 12-month quantile rules found almost no events. The deep-loser long had n_a of 1, 4 and 4, and both winner-short rules had n_a = 0 on all three coins, so these claims were not computable rather than refuted.
  - The always-in yearly-mean book passed on XMR with +5.9% net per 60-day trade, positive in 5 of 6 windows.
  - The same book nearly held on LTC at +2.97% against a 3.0% bar, but window 1 (-24.4%) and window 2 (-5.9%) were negative, leaving only 4 of 6 positive windows.
  - The same book reversed on ZEC at -4.3%, with 5 of 6 windows negative (only window 1 was positive, at +27.8%), so ZEC trended away from its yearly mean instead of reverting.
  - ZEC spent 536 of 730 bars and LTC 339 of 730 more than 60% below their 12-month high, so a deep-drawdown long on these coins is in the market most of the fold, not on a rare event.
  - The drawdown hit-rate rule scored +0.40 on XMR, but in only 2 computed windows. On ZEC it was -0.05 on the whole fold even though all 4 computed windows were positive (+0.79, +0.23, +0.09, +0.52), so the whole fold and the windows disagree.
  - Contrary to its belief, the turned-up loser did worse than the still-falling loser: LTC windows were negative in 3 of 3 computed and XMR in 3 of 4, and XMR's whole-fold effect was -19.6%.
  - The quiet-base long was positive on XMR in 5 of 5 computed windows (+18.6% overall) but on only 6 events. ZEC was split 3 to 3 at -4.3%.
  - Stale-high exhaustion stayed below the 0.10 hit-rate bar on every coin (0.085 LTC, 0.032 XMR, 0.019 ZEC), with window signs split on each.
next_claim: none
why: Across every computable reversal book, ZEC ran against the reversal (-4.3% with 5 of 6 windows negative in the always-in book, -18.7% for the deep-loser long), and the one-year lookback leaves too few events in a 730-bar fold, so no distinct rule that is not a threshold change of the tried claims can honestly be expected to pass on all three coins.
