- id: mom_168h_works_in_calm_regime
  belief: Weekly momentum persists in calm markets, where trends come from slow flows,
    and breaks down in high-volatility regimes, where moves are liquidation noise.
  measure: mean_diff
  horizon_bars: 72
  direction: positive
  min_effect: 0.003
  verdict: fail
  by_symbol:
    ETHUSD:
      effect: 0.00015070511671840198
      n_a: 9564
      n_b: 7955
      windows:
      - 0.0224625570300516
      - -0.017923466670086943
      - -0.009203720772321719
      - 0.01382861885476966
      - 0.0008424719780288029
      - -0.007941512121021078
      verdict: fail
      why: null
  code: 'r168 = df.close / df.close.shift(168) - 1

    vol = ret.rolling(168).std()

    med = vol.rolling(720).median()

    valid = r168.notna() & med.notna()

    a = valid & (vol < med)

    b = valid & (vol >= med)

    signal = np.sign(r168).replace(0, 1).fillna(1)

    '
- id: mom_168h_volume_confirmed
  belief: A weekly trend that comes with rising volume reflects real participation
    and continues more than a trend on fading volume.
  measure: mean_diff
  horizon_bars: 72
  direction: positive
