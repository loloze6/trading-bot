  code: 'r24 = df.close.pct_change(24)

    net = (df.close - df.close.shift(24)).abs()

    path = df.close.diff().abs().rolling(24).sum()

    er = net / path

    med = er.rolling(720).median()

    base = (hour == 0) & r24.notna() & med.notna()

    a = base & (er > med)

    b = base & (er <= med)

    signal = np.sign(r24).replace(0, 1)

