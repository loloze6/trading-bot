- id: efficiency_ratio_gate
  belief: Trends whose last 24 hours moved in a clean path (high efficiency ratio)
    persist, while choppy paths with the same net move are whipsaw and revert.
  measure: mean_diff
  horizon_bars: 24
  direction: positive
  min_effect: 0.002
  verdict: fail
