brief: n10_hourly_trend_with_vol_gate_1h.md
source: analyst round 1
ideas:
- id: breakout_aligned_with_weekly_trend
  belief: A 72h breakout in the direction of the rising or falling weekly average
    carries further over the next day than a breakout against that average, which
    is more often a failed range break.
  claim:
    when: spaced 72h Donchian breakouts whose direction matches the sign of the 24-bar
      change in the 168h moving average
    then: the signed 24-bar forward return in the breakout direction is larger
    compared_to: spaced 72h Donchian breakouts against the 168h moving-average slope
    measure: mean_diff
    horizon_bars: 24
    direction: positive
    min_effect: 0.003
    code: 'hi = df.high.rolling(72).max().shift(1)

      lo = df.low.rolling(72).min().shift(1)

      up = df.close > hi

      dn = df.close < lo

      ev = spaced(up | dn, 24)

      ma = df.close.rolling(168).mean()

      slope = np.sign(ma - ma.shift(24))

      signal = pd.Series(np.where(up, 1, -1), index=df.index)

      ok = ev & slope.notna() & (slope != 0)

      a = ok & (signal == slope)

      b = ok & (signal != slope)

      '
  why_no_lookahead: The highs, lows and moving average use only past bars (shift(1)
    and trailing rolling windows), and the breakout is judged on the current close.
  how_it_trades: At the bar close, take the 72h breakout only when it agrees with
    the weekly MA slope, hold it 24 bars, and size it by vol target.
