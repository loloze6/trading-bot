brief: n01_session_vol_regime_book_1h.md
source: analyst round 1
ideas:
- id: us_open_regime_switched_extension
  belief: The direction of the US-open follow-through on a large 6-hour move depends
    on the trailing regime. It continues when the past week has been trending and
    reverts when the past week has been choppy, which explains why fixed continuation
    and fixed fade rules each won in different windows.
  claim:
    when: weekday bars at 13 or 14 UTC whose 6-hour move exceeds 1.5 trailing sigma,
      one event per 4 bars
    then: the 4-bar forward return goes in the move's direction if the trailing 168-bar
      efficiency ratio is above its 30-day median, and against it otherwise, and this
      pays after the 0.15% round trip
    compared_to: zero after cost (net_return)
    measure: net_return
    horizon_bars: 4
    direction: positive
    min_effect: 0.0015
    code: 'sd = ret.rolling(168).std().shift(1)

      r6 = df.close / df.close.shift(6) - 1

      er = (df.close / df.close.shift(168) - 1).abs() / ret.abs().rolling(168).sum()

      trend = er > er.rolling(720).median().shift(1)

      ext = (dow < 5) & hour.isin([13, 14]) & (r6.abs() > 1.5 * sd * np.sqrt(6))

      a = spaced(ext, 4)

      b = ~a

      signal = pd.Series(np.sign(r6) * np.where(trend, 1.0, -1.0), index=df.index)

      '
  why_no_lookahead: The 6-hour move, sigma and efficiency ratio use only closes at
    or before the bar, and the regime median is shifted by one bar.
  how_it_trades: At the 13 or 14 UTC close after a large 6-hour move, go with the
    move in a trending week or against it in a choppy week, hold 4 hours, and stay
    flat otherwise.
