run: n28_hourly_stretch_reversion_older_coins_1h_foldC
observations:
  - "Fading a 3-vol stretch from the 24h VWAP over 6 bars lost money: LTC net -0.22% with 5 of 6 windows negative, and XRP net +0.0007% with 4 of 6 windows negative."
  - "The 48h range-edge fade lost on both coins. LTC was -0.35% with 5 of 6 windows negative. XRP was -0.20%, with windows swinging from -1.44% to +0.90%."
  - "Slow-anchor fades over 24 bars lost the most. The EMA168 fade made LTC -0.69% and XRP -1.61% on about 55 events. The 72h-mean rank correlation was negative on both coins (LTC -0.106, XRP -0.095), so a larger stretch meant more continuation, not more reversion."
  - "Continuation nearly held. A stretch with a volume burst, followed over 12 bars, made LTC +0.224% net (limit 0.2%) and XRP +0.453% net. Both had only 4 of 6 windows positive, so the claim failed on window agreement, not on size."
  - "The wick test came out reversed and was stable. Stretched bars closing off their extreme had a lower 4-bar fade hit rate than bars closing at their extreme: LTC -3.8 points and XRP -6.6 points, each with 5 of 6 windows negative. A stretched bar that pulled back inside the bar tends to keep going."
  - "Stretches do mark larger moves, but not enough to pass. The 6-bar abs ratio was XRP 1.345 against the 1.35 limit and LTC 1.178. All 12 windows were above 1."
  - "Splitting by volatility regime showed a calm-regime stretch reverting less than a high-vol one: LTC -0.50% and XRP -1.03%, but each with only 5 of 6 or 4 of 6 windows agreeing. The high-vol continuation trade still lost: LTC -0.44% and XRP -0.77% net."
  - "No reversion variant had a positive whole-fold net return above cost on either coin. Thin-volume stretches (LTC +0.17%, XRP -0.18%) and US-hours stretches (LTC -0.07%, XRP -0.18%) both had the two coins disagreeing in sign."
next_claim:
  id: volume_burst_stretch_pullback_bar_continues
  belief: "On LTC and XRP, a stretch from the 24h VWAP that comes with a volume burst and a bar closing off its extreme is forced flow pausing inside the bar, and it keeps going over the next 12 hours."
  claim:
    when: "bars with |close/VWAP24 - 1| above 3 times the 48h hourly volatility, 3-bar volume above 2.5 times the 72h median, and the bar closing in the half of its range away from the stretch direction; one event per 12 bars"
    then: "price keeps moving in the stretch direction over the next 12 bars by more than the round-trip cost"
    compared_to: "the 0.15% round-trip cost"
    measure: net_return
    horizon_bars: 12
    direction: positive
    min_effect: 0.003
    code: |
      vol = ret.rolling(48).std()
      vwap = (df.close * df.volume).rolling(24).sum() / df.volume.rolling(24).sum()
      z = (df.close / vwap - 1) / vol
      vr = df.volume.rolling(3).mean() / df.volume.rolling(72).median()
      rng = (df.high - df.low).replace(0, np.nan)
      cp = (df.close - df.low) / rng
      cps = pd.Series(np.where(z > 0, cp, 1 - cp), index=df.index)
      a = spaced((z.abs() > 3) & (vr > 2.5) & (cps < 0.5), 12)
      b = ~a
      signal = np.sign(z).fillna(0)
  why_no_lookahead: "VWAP, volatility, volume ratio and the bar's close position all use only data up to the current bar's close."
  how_it_trades: "At the close of a qualifying bar, enter in the direction of the stretch and exit 12 bars later."
why: "Volume-burst continuation already cleared its size limit on both coins but missed on window agreement, and the off-extreme close was the most window-stable signal in the run (5 of 6 on both coins) pointing to continuation. Combining the two is a new condition, not a threshold change. The 0.3% net limit asks for more than the 0.22% LTC result."
