<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Research runs</title>
<style>
:root{--bg:#fcfcfb;--card:#ffffff;--ink:#0b0b0b;--ink2:#52514e;--line:#e4e3df;--accent:#2a78d6;--helpbg:#eef4fc;
  --good:#0a7d0a;--goodbg:#e3f3e3;--bad:#b42d2c;--badbg:#fbe6e6;--mid:#6a5a00;--midbg:#f6efcf;--nobg:#efeeea}
@media (prefers-color-scheme:dark){:root{--bg:#1a1a19;--card:#232321;--ink:#f0efec;--ink2:#c3c2b7;--line:#383835;--helpbg:#1f2a38;
  --accent:#3987e5;--good:#7fd67f;--goodbg:#173317;--bad:#f09a99;--badbg:#3d1c1c;--mid:#e6cf6a;--midbg:#3a3415;--nobg:#2e2e2b}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:860px;margin:0 auto;padding:12px 14px 60px;overflow-wrap:anywhere}
a{color:var(--accent);text-decoration:none}
h1{font-size:1.35rem;margin:.3em 0 .1em}
h2{font-size:1.1rem;margin:1.4em 0 .4em}
h3{font-size:1rem;margin:1em 0 .3em}
.sub{color:var(--ink2);font-size:.8rem;text-transform:uppercase;letter-spacing:.04em;margin:.9em 0 .1em}
.top{position:sticky;top:0;background:var(--bg);padding:8px 0;border-bottom:1px solid var(--line);z-index:2;font-size:.95rem}
.top a{display:inline-block;min-height:32px;padding:4px 0}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px;margin:10px 0}
.runlink{display:block;color:inherit}
.muted{color:var(--ink2);font-size:.9rem}
.small{font-size:.85rem}
.chip{display:inline-block;border-radius:6px;padding:1px 7px;margin:2px 4px 2px 0;font-size:.82rem;background:var(--nobg);color:var(--ink);overflow-wrap:anywhere}
.good{background:var(--goodbg);color:var(--good)}.bad{background:var(--badbg);color:var(--bad)}.mid{background:var(--midbg);color:var(--mid)}
.tag{font-size:.75rem;color:var(--ink2);border:1px solid var(--line);border-radius:5px;padding:0 5px;margin-right:6px}
ul.tree,ul.tree ul{list-style:none;margin:0;padding:0}
ul.tree ul{margin-left:9px;padding-left:9px;border-left:2px solid var(--line)}
ul.tree li{margin:6px 0}
.node{display:block;padding:6px 8px;border-radius:8px;background:var(--card);border:1px solid var(--line);color:inherit}
.node.untested{opacity:.6}
.node .t{font-weight:600}
details{margin:6px 0}
summary{cursor:pointer;min-height:32px;padding:4px 0;color:var(--accent)}
.help>button{display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;padding:0;margin-left:4px;
  border-radius:50%;border:1px solid var(--accent);background:none;color:var(--accent);font:700 .75rem system-ui,sans-serif;vertical-align:middle;cursor:pointer}
.help>.hb{display:none}
.help.open>.hb{display:block;background:var(--helpbg);border-radius:8px;padding:8px 10px;margin:4px 0 6px;font-size:.88rem;font-weight:400;
  color:var(--ink);text-transform:none;letter-spacing:0;white-space:normal;text-align:left}
.md p{margin:.4em 0}.md ul{margin:.3em 0;padding-left:1.2em}.md h1,.md h2,.md h3{font-size:1rem}
table{border-collapse:collapse;width:100%;font-size:.88rem;overflow-wrap:normal}
td,th{text-align:left;padding:4px 6px;border-bottom:1px solid var(--line);vertical-align:top}
th{color:var(--ink2);font-weight:600;white-space:nowrap}
td.n,th.n{text-align:right;white-space:nowrap}
.scroll{overflow-x:auto}
.kv td:first-child{color:var(--ink2);width:46%}
.step{border-left:3px solid var(--line);padding-left:10px;margin:12px 0}
.step>.h{font-weight:600;margin-bottom:2px}
.readout{font-size:.85rem;color:var(--ink2);min-height:1.3em}
.btn{display:inline-block;border:1px solid var(--accent);border-radius:8px;padding:6px 12px;margin:6px 0;min-height:36px}
.coins button{font:inherit;font-size:.85rem;background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:16px;padding:5px 12px;margin:3px 4px 3px 0;min-height:34px}
.coins button.on{border-color:var(--accent);color:var(--accent);font-weight:600}
svg text{fill:var(--ink2);font-size:11px}
.zoom button{font:inherit;font-size:.85rem;background:var(--card);color:var(--accent);border:1px solid var(--line);border-radius:8px;min-width:40px;min-height:34px;margin:4px 4px 4px 0}
.day{touch-action:pan-y;user-select:none;-webkit-user-select:none}
.legend{font-size:.8rem;color:var(--ink2)}.legend i{display:inline-block;width:14px;height:3px;border-radius:2px;vertical-align:middle;margin:0 4px 0 8px}
code{font-size:.85em}
</style>
</head>
<body>
<main id="app"></main>
<script>
const DATA = /*DATA*/null;
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const num = (x, d=2) => x == null || x === "" ? "–" : (typeof x === "number" ? (Math.abs(x) >= 1000 || Number.isInteger(x) ? String(x) : (+x.toPrecision(Math.max(d,3))).toString()) : esc(x));
const runBy = n => DATA.runs.find(r => r.name === n);
const href = (run, idea, bt) => "#r=" + encodeURIComponent(run) + (idea ? "&i=" + encodeURIComponent(idea) : "") + (bt ? "&b=" + encodeURIComponent(bt) : "");
const CHARTS = {};

// the steps' own words, shown as written; the colour only groups them
const TONE = {"plan":"good","confirmed":"good","profitable enough":"good","backtested":"good",
  "missing-components":"bad","untestable":"bad","rejected":"bad","not profitable enough":"bad","blocked at step 3":"bad",
  "inconclusive":"mid","not observable":"mid","mismatch":"mid"};
const chip = (text, status) => `<span class="chip ${TONE[status] || ""}">${esc(text)}</span>`;

// plain-words explanations, written from the step cards and steps_cards/common/measures.md
const HELP = {
  purpose: "What the run was for, copied from its run brief (written before the run started). Read every result below against it.",
  "backtested": "The idea's test ran: step 4 traded it in the backtest and steps 5 and 6 read the result.",
  "blocked at step 3": "Step 3 could not turn the idea into a test. 'missing-components': the bot lacks a building block the idea needs (e.g. volume against its average). 'untestable': the idea needs something outside one coin's own data, such as another coin.",
  "planned, not backtested": "Step 3 wrote a test plan, but no backtest of it is in the record (for example, the run stopped first).",
  "waiting in the queue": "Proposed by a step 7 line and waiting in the loop's queue. The loop always takes the idea with the best score next; these were not reached before the run stopped.",
  "duplicate": "The queue found the same idea already there, so it is not tested twice.",
  "not tested": "In the record, but no step took it up and no queue holds it (for example, a run without a loop).",
  cost: "What the model calls cost, summed over the run's journals (one line per step call). Backtests and checks cost nothing: no model.",
  time: "Time the step calls took, summed from the journals. Pauses between calls are not counted.",
  dates: "When the run's work happened, in UTC: the earliest and latest dated lines of its record (its journals, dated in full since 2026-11-17, and the backtest engine's own run times). Older runs without either: date not recorded.",
  dated: "When this idea's test was first run, in UTC: its first dated journal line, else the backtest engine's own run time.",
  turns: "How many ideas the loop picked and ran, one per turn.",
  brief: "A brief is one theory about how the market behaves, written before any data is seen. Step 2 turns it into ideas that can be tested; step 7 lines then propose new ideas from each result, which is how the family tree grows.",
  tree: "Each idea sits under the idea it came from. The name says it: '011-01_x.b1_y' is the first idea line 7.b wrote after testing '011-01_x'. The number at the start (011) is the brief.",
  s3: "Step 3 writes the test plan before seeing any data. 'plan': the idea can be tested. 'missing-components': the bot lacks a building block. 'untestable': it needs data or logic outside one coin's own bars.",
  fit: "'exact': the test measures the idea as stated. 'adapted': the same thing in the only form the bot allows (e.g. an on/off rule made graded, a holding period dropped).",
  book: "The book is what the strategy's money becomes, starting from 1. Each 4-month window is run separately on each coin; the window's return is averaged over the coins, and windows are chained in time order. Not the price of a coin.",
  s5: "Step 5 asks: is the idea real? It applies the plan's own rule, fixed before the data. 'confirmed': the market behaves as the idea says. 'rejected': it behaves the other way. 'inconclusive': enough cases, no clear answer. 'not observable': too few cases. 'mismatch': the test did not do what its plan said, so no verdict.",
  t: "The t-statistic says how far the measured effect is from zero, in units of its own noise. Beyond about 2 (or below -2) it is unlikely to be chance; between -2 and 2 it could be chance.",
  measure: "The one number the plan chose, before the data, to answer the question.",
  rule: "The thresholds the plan fixed before the data: what confirms, what rejects, the minimum number of cases.",
  decided: "Which of the plan's rules the numbers met.",
  support: "A second check the plan set. If it fails, a 'confirmed' becomes 'inconclusive'.",
  situation: "Does the test trade in the situation the idea describes, on the side it expects? This is the share of trading bars where it does. Below 90 % the test is a 'mismatch': it is not testing the idea.",
  cases: "How many independent cases the measure used. Few cases give weak evidence.",
  s6: "Step 6 asks: does the strategy's book pay, after its trading costs? 'profitable enough' only when all six measures pass the rule fixed in advance; one fail is enough to say no.",
  "Sharpe": "Gain against its ups and downs: the mean daily return divided by how much daily returns vary, scaled to a year. Above 0 means the book gains on average.",
  "Sharpe minus holding's Sharpe": "Does the book beat simply buying and holding the same coins, for the risk taken? Above 0 means yes.",
  "Mean daily return": "The average gain per day. The rule asks at least 0.05 % a day (about 20 % a year): small gains are not worth the effort.",
  "Lowest Sharpe, one window left out": "Each 4-month window is left out in turn and the Sharpe recomputed; the lowest must stay above 0, so one lucky period cannot carry the result.",
  "Calmar": "The yearly return divided by the deepest fall from a peak. 0.75 means a year earns three quarters of the worst drop.",
  "Trades per bar": "How often the book trades. At least 1 trade per 100 bars, so there are enough trades to judge it.",
  s7: "Step 7 lines read the backtest like a practitioner: findings drawn from its data, then new ideas resting on them. Which lines run depends on steps 5 and 6; 7.g always runs.",
  "7.a": "7.a, not observable: why the idea could not be observed, and how to make it observable.",
  "7.b": "7.b, inconclusive: why the result is unclear, and what idea would give a clear answer.",
  "7.c": "7.c, rejected: why the idea was rejected, and what other idea could be confirmed.",
  "7.d": "7.d, not profitable: why the book does not pay, and what idea would make it pay.",
  "7.e": "7.e, profitable but not proven: what the book really earns from.",
  "7.f": "7.f, real and profitable: what could break the idea and its book.",
  "7.g": "7.g, patterns: what patterns the bars and the book show, whatever the verdict.",
  cols: "Each row is one 4-month window on this coin. Ret %: its net return after fees. Trades: trades in the window. Win %: share of trades that gained after costs. Fall %: deepest fall of the book from a peak inside the window. Sharpe: the window's Sharpe, from the book's daily values. In %: share of the window's bars with a position open.",
  day: "Day by day on this coin, windows in time order (each 4-month window is a separate test; its lines are chained so they read as one). Price: the coin's close, with each trade's entry (filled dot) and exit (hollow dot), green if the trade gained after fees, red if it lost. Book: the strategy's money on this coin; Holding: the coin bought and kept; both start at 1, from each window's first bar (after that bar's fee if it trades on it, the same basis as step 6). Forecast: the strategy's view, -20 (strong short) to +20 (strong long). Position: the share of the book in the coin after each rebalance (negative = short). Pinch or use + / - to zoom, drag sideways to move, touch to read the values.",
  ran: "When the backtest engine ran (UTC), from the backtest's own record.",
};
const help = k => HELP[k] ? `<span class="help"><button type="button" aria-label="explain">?</button><span class="hb">${esc(HELP[k])}</span></span>` : "";
document.addEventListener("click", e => { const b = e.target.closest(".help>button"); if (!b) return;
  e.preventDefault(); e.stopPropagation(); b.parentElement.classList.toggle("open"); }, true);

function md(t){                      // a small Markdown: headings, lists, bold, code, tables, paragraphs
  if (!t) return "";
  const inline = s => esc(s).replace(/\*\*(.+?)\*\*/g,"<b>$1</b>").replace(/`([^`]+)`/g,"<code>$1</code>");
  const out = []; let list = false, table = [], para = false;
  const flushT = () => { if (!table.length) return;
    const rows = table.filter(r => !/^\|[\s|:-]+\|$/.test(r.trim())).map(r => r.trim().replace(/^\||\|$/g,"").split("|"));
    out.push('<div class="scroll"><table>' + rows.map((r,k)=>"<tr>"+r.map(c=>(k?"<td>":"<th>")+inline(c.trim())+(k?"</td>":"</th>")).join("")+"</tr>").join("") + "</table></div>");
    table = []; };
  for (const raw of t.split("\n")) {
    const l = raw.trimEnd();
    if (l.trim().startsWith("|")) { table.push(l); para = false; continue; } else flushT();
    const li = l.match(/^\s*(?:[-*]|\d+\.)\s+(.*)/);
    if (li) { para = false; if (!list) { out.push("<ul>"); list = true; } out.push("<li>" + inline(li[1]) + "</li>"); continue; }
    if (list && /^\s{2,}\S/.test(l)) { out[out.length-1] = out[out.length-1].replace(/<\/li>$/, " " + inline(l.trim()) + "</li>"); continue; }
    if (list) { out.push("</ul>"); list = false; }
    const h = l.match(/^(#{1,4})\s+(.*)/);
    if (h) out.push(`<h3>${inline(h[2])}</h3>`);
    else if (l.trim() && l.trim() !== "---") {      // a wrapped line continues its paragraph
      if (para) out[out.length-1] = out[out.length-1].replace(/<\/p>$/, " " + inline(l.trim()) + "</p>");
      else out.push("<p>" + inline(l) + "</p>");
      para = true; continue;
    }
    para = false;
  }
  flushT(); if (list) out.push("</ul>");
  return '<div class="md">' + out.join("") + "</div>";
}

function dur(sec){ if (sec == null) return "–"; if (sec < 60) return Math.round(sec) + " s"; const m = Math.round(sec/60); return m < 60 ? m + " min" : Math.floor(m/60) + " h " + String(m%60).padStart(2,"0"); }
function counts(o){ return Object.entries(o || {}).map(([k,v]) => chip(v + " " + k, k)).join(""); }
function when(d){ if (!d) return "date not recorded"; return d[0].slice(0,10) === d[1].slice(0,10) ? `${d[0]} to ${d[1].slice(11)} UTC` : `${d[0]} to ${d[1]} UTC`; }
const briefOf = id => DATA.briefs[id] || {title: "brief not in the record", text: null, runs: []};

function view(){
  const p = new URLSearchParams(location.hash.slice(1));
  const r = p.get("r") && runBy(p.get("r")), i = r && p.get("i") && r.ideas[p.get("i")], b = r && p.get("b") && r.backtests[p.get("b")];
  $("#app").innerHTML = !r ? runList() : b && i ? backtestPage(r, i, b) : i ? ideaView(r, i) : runView(r);
  document.querySelectorAll("[data-chart]").forEach(drawChart);
  const day = $("#day"); if (day) dayChart(day);
  document.querySelectorAll(".coins button").forEach(x => x.addEventListener("click", () => { location.replace(location.hash.replace(/&c=[^&]*/, "") + "&c=" + encodeURIComponent(x.dataset.c)); }));
  if (!p.get("c")) window.scrollTo(0, 0);
}

function runList(){
  return `<h1>Research runs</h1><p class="muted">${DATA.runs.length} runs, last updated first, read from the committed files of <code>steps_cards/</code>. Tap a run.</p>` +
    DATA.runs.map(r => { const t = r.totals; return `<a class="card runlink" href="${href(r.name)}">
      <div><b>${esc(r.name)}</b></div>
      <div class="muted small">${esc(when(r.dates))}</div>
      <div class="muted small">${t.ideas} ideas · ${(t.idea_states || {})["backtested"] || 0} backtested${t.usd != null ? " · " + t.usd.toFixed(2) + " USD" : ""}${t.seconds != null ? " · " + dur(t.seconds) + " of step time" : ""}</div>
      <div>${counts(t.step5)}${counts(t.step6)}</div></a>`; }).join("");
}

function ideaChips(r, i){
  if (!i.backtests.length) {
    const q = i.queue ? `${i.state} (${esc(i.queue.status)}${i.queue.score != null ? ", score " + num(i.queue.score) : ""})` : i.state;
    return chip(q, "");
  }
  return i.backtests.map(bid => { const b = r.backtests[bid]; let s = "";
    if (b.step3) s += chip("3 " + (b.step3.outcome === "plan" ? "plan" : "refused: " + b.step3.outcome), b.step3.outcome);
    if (b.step5) s += chip("5 " + b.step5.status + (b.step5.t != null ? " · t " + num(b.step5.t) : ""), b.step5.status);
    if (b.step6) s += chip("6 " + b.step6.status, b.step6.status);
    if (b.step7.length) s += chip("7 " + b.step7.map(x => x.line).join(" "), "");
    return s; }).join("<br>");
}

function tested(r, id){ const i = r.ideas[id]; return i.backtests.length > 0 || i.children.some(c => tested(r, c)); }
function below(r, id){ return r.ideas[id].children.reduce((n, c) => n + 1 + below(r, c), 0); }

function node(r, id, depth, maxDepth){ const i = r.ideas[id];
  const from = i.root && i.parent ? `<div class="muted small">from ${esc(i.parent.split(".").pop())}${i.parent_runs && i.parent_runs.length ? " (" + esc(i.parent_runs.join(", ")) + ")" : " (not in the record)"}</div>` : "";
  let kids = "";
  if (i.children.length) kids = maxDepth && depth >= maxDepth
    ? `<details><summary>${below(r, id)} more ideas below</summary>${tree(r, i.children, depth + 1, 0)}</details>`
    : tree(r, i.children, depth + 1, maxDepth);
  return `<li><a class="node ${i.backtests.length ? "" : "untested"}" href="${href(r.name, id)}">
    <div>${i.line ? `<span class="tag">${esc(i.line)}</span>` : ""}<span class="t">${esc(i.title)}</span></div>${from}
    <div>${ideaChips(r, i)}</div></a>${kids}</li>`; }

// maxDepth 0: ideas with a test in their branch first, the others folded; maxDepth n: n levels open, deeper folded
function tree(r, ids, depth = 1, maxDepth = 0){
  if (maxDepth) return "<ul class='tree'>" + ids.map(id => node(r, id, depth, maxDepth)).join("") + "</ul>";
  const on = ids.filter(id => tested(r, id)), off = ids.filter(id => !tested(r, id));
  return "<ul class='tree'>" + on.map(id => node(r, id, depth, 0)).join("") +
    (off.length ? `<li><details><summary>${off.length} idea${off.length > 1 ? "s" : ""} not tested</summary><ul class="tree">${off.map(id => node(r, id, depth, 0)).join("")}</ul></details></li>` : "") + "</ul>";
}

function runView(r){
  const t = r.totals, st = t.idea_states || {};
  const order = ["backtested", "blocked at step 3", "planned, not backtested", "waiting in the queue", "duplicate", "not tested"];
  const kv = [[`Ideas`, t.ideas]].concat(order.filter(k => st[k]).map(k => [`&nbsp;&nbsp;${esc(k)}${help(k)}`, st[k]]),
    [["Step 3 plans" + help("s3"), counts(t.step3) || "–"], ["Step 5 verdicts" + help("s5"), counts(t.step5) || "–"], ["Step 6 checks" + help("s6"), counts(t.step6) || "–"],
     ["Cost" + help("cost"), t.usd != null ? t.usd.toFixed(2) + " USD" : "not in the record"],
     ["Step time" + help("time"), t.seconds != null ? dur(t.seconds) : "not in the record"],
     ["Loop turns" + help("turns"), t.turns || "–"],
     ["Dates" + help("dates"), esc(when(r.dates))]]);
  const nums = [...new Set(r.briefs.map(b => b.id.slice(0,3)).concat(r.roots.map(id => r.ideas[id].brief)))].filter(n => /^\d{3}$/.test(n)).sort();
  const shared = r.run_brief && r.run_brief.toLowerCase() !== r.name.replace(/_run$/, "_RUN.md").toLowerCase();
  return `<div class="top"><a href="#">← Runs</a></div><h1>${esc(r.name)}</h1>
    <div class="sub">Purpose of the run${r.run_brief ? " · from " + esc(r.run_brief) : ""}${help("purpose")}</div>
    ${shared ? `<p class="muted small">This run has no run brief of its own; this one is shared with the runs whose name starts the same.</p>` : ""}
    ${r.purpose ? md(r.purpose) : `<p class="muted">No purpose paragraph in the record.</p>`}
    ${r.run_brief_text ? `<details><summary>The whole run brief</summary>${md(r.run_brief_text)}</details>` : ""}
    <div class="card"><table class="kv">${kv.map(([k,v]) => `<tr><td>${k}</td><td>${typeof v === "string" && v.includes("<") ? v : esc(v)}</td></tr>`).join("")}</table></div>
    <h2>Briefs and their ideas${help("brief")}</h2>
    <p class="muted small">Under each brief, its ideas as a family tree${help("tree")}. Chips: 3 = test plan, 5 = is it real (t), 6 = does its book pay, 7 = the lines that read it.</p>
    ${nums.map(n => { const b = briefOf(n), roots = r.roots.filter(id => r.ideas[id].brief === n);
      const own = r.briefs.some(x => x.id.startsWith(n + "_"));
      return `<h3>Brief ${n} · ${esc(b.title)}</h3>
        ${own ? "" : `<p class="muted small">Written in ${esc(b.runs.join(", ") || "another run")}; this run tested ideas from it.</p>`}
        ${b.text ? `<details><summary>The brief</summary>${md(b.text)}</details>` : ""}
        ${roots.length ? tree(r, roots) : `<p class="muted small">No idea from this brief in this run.</p>`}`; }).join("") || `<p class="muted">None in the record.</p>`}`;
}

function step(title, body){ return `<div class="step"><div class="h">${title}</div>${body}</div>`; }
const row = (k, v, h) => `<tr><td>${esc(k)}${help(h)}</td><td>${v}</td></tr>`;

function bookChart(id, values, years, windows, note){
  CHARTS[id] = {values, years, windows};
  return `${note ? `<div class="muted small">${note}</div>` : ""}<div class="readout" id="ro-${esc(id)}"></div><div data-chart="${esc(id)}"></div>`;
}

function backtestView(r, i, b){
  let h = `<h3>${esc(b.id.match(/_(\d+[smhdw])$/)?.[1] || "")} backtest</h3>`;
  if (b.step3) h += `<p class="muted small">${esc(b.step3.data)}</p>`;
  const s3 = b.step3;
  h += step("Step 3 · test plan" + help("s3"), s3 ? chip(s3.outcome === "plan" ? "plan" : "refused: " + s3.outcome, s3.outcome) +
    (s3.fit ? chip("fit: " + s3.fit, "") + help("fit") : "") + (s3.reason ? md(s3.reason) : "") : `<span class="muted">not in the record</span>`);
  const bk = b.book;

}

function crumbs(r, i, self){

function drawChart(el){
  const c = CHARTS[el.dataset.chart], v = c.values;
  const W = 360, H = 190, L = 40, R = 8, T = 8, B = 24;
  let lo = Math.min(1, ...v), hi = Math.max(1, ...v); const pad = (hi - lo) * .08 || .05; lo -= pad; hi += pad;
  const x = k => L + k * (W - L - R) / (v.length - 1), y = val => T + (hi - val) * (H - T - B) / (hi - lo);
  const ticks = [lo + pad, 1, hi - pad].filter((t, k, a) => a.findIndex(u => Math.abs(y(u) - y(t)) < 14) === k);
  let s = ticks.map(t => `<line x1="${L}" x2="${W-R}" y1="${y(t)}" y2="${y(t)}" stroke="var(--line)" ${t === 1 ? "" : 'stroke-dasharray="3 3"'}/>
    <text x="${L-4}" y="${y(t)+4}" text-anchor="end">${t.toFixed(2)}</text>`).join("");
  let last = "";
  c.years.forEach((yr, k) => { if (yr !== last) { s += `<text x="${x(k+1)}" y="${H-6}" text-anchor="middle">${yr}</text>`; last = yr; } });
  s += `<polyline fill="none" stroke="var(--accent)" stroke-width="2" stroke-linejoin="round" points="${v.map((val,k) => x(k)+","+y(val)).join(" ")}"/>`;
  s += `<line class="cx" y1="${T}" y2="${H-B}" stroke="var(--ink2)" stroke-width="1" visibility="hidden"/><circle class="cd" r="4" fill="var(--accent)" stroke="var(--card)" stroke-width="2" visibility="hidden"/>`;
  el.innerHTML = `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Book value by window" style="touch-action:pan-y">${s}</svg>`;
  const svg = el.firstChild, ro = document.getElementById("ro-" + el.dataset.chart);
  const show = e => { const r = svg.getBoundingClientRect(), px = (e.clientX - r.left) * W / r.width;
    const k = Math.max(0, Math.min(v.length - 1, Math.round((px - L) * (v.length - 1) / (W - L - R))));
    const cx = svg.querySelector(".cx"), cd = svg.querySelector(".cd");
    cx.setAttribute("x1", x(k)); cx.setAttribute("x2", x(k)); cd.setAttribute("cx", x(k)); cd.setAttribute("cy", y(v[k]));
    cx.setAttribute("visibility", "visible"); cd.setAttribute("visibility", "visible");
    ro.textContent = k === 0 ? "start: 1.00" : `after ${c.windows[k-1]} (${c.years[k-1]}): ${v[k].toFixed(3)} · this window ${((v[k]/v[k-1]-1)*100).toFixed(1)}%`; };
  svg.addEventListener("pointermove", show); svg.addEventListener("pointerdown", show);
  ro.textContent = `end: ${v[v.length-1].toFixed(3)} after ${v.length-1} windows`;
}

// ------------------------------------------------------------------ day by day (chart files, loaded on demand)
const FILES = {};
class Missing extends Error {}
async function fetchText(url){
  const r = await fetch(url);
  if (r.status === 404) throw new Missing(url.split("/").pop());
  if (!r.ok) throw new Error(url.split("/").pop() + ": " + r.status);
  const buf = new Uint8Array(await r.arrayBuffer());
  if (buf[0] === 0x1f && buf[1] === 0x8b)
    return await new Response(new Blob([buf]).stream().pipeThrough(new DecompressionStream("gzip"))).text();
  return new TextDecoder().decode(buf);
}
function csv(text){
  const lines = text.trim().split("\n"), head = lines.shift().split(",");
  return lines.map(l => { const v = l.split(","), o = {}; head.forEach((h, k) => o[h] = v[k]); return o; });
}
// the committed names first (a backtest confirmed or profitable enough), then the .local ones (any other backtest, on
// the disk where its run happened); neither: not in the record
async function chartFiles(path){
  const pair = suffix => Promise.all(["chart_bars", "chart_trades"].map(f => fetchText("../" + path + f + suffix)))
    .then(([b, t]) => ({bars: csv(b), trades: csv(t), local: suffix !== ".csv.gz"}));
  if (!FILES[path]) FILES[path] = pair(".csv.gz").catch(e => { if (e instanceof Missing) return pair(".local.csv.gz"); throw e; });
  return FILES[path];
}
const toNum = x => x === "" || x == null ? null : +x;
const day10 = t => String(t).replace(" ", "T").slice(0, 16).replace("T", " ").replace(/ 00:00$/, "");

function coinSeries(files, coin){
  const rows = files.bars.filter(r => r.coin === coin).sort((a, b) => a.timestamp < b.timestamp ? -1 : a.timestamp > b.timestamp ? 1 : 0);
  const n = rows.length, t = [], price = [], book = [], hold = [], fc = [], pos = [], win = [];
  let mB = 1, mH = 1, w0 = null, v0 = null, c0 = null, lastB = 1, lastH = 1;
  rows.forEach(r => {
    if (r.window !== w0) { mB = lastB; mH = lastH; w0 = r.window; v0 = toNum(r.value); c0 = toNum(r.close); win.push(t.length); }
    const v = toNum(r.value), c = toNum(r.close);
    t.push(r.timestamp); price.push(c); fc.push(toNum(r.forecast)); pos.push(toNum(r.position));
    lastB = v != null && v0 ? mB * v / v0 : lastB; lastH = c != null && c0 ? mH * c / c0 : lastH;
    book.push(lastB); hold.push(lastH);
  });
  const at = {}; t.forEach((x, k) => at[x.slice(0, 19).replace(" ", "T")] = k);
  const key = x => String(x).slice(0, 19).replace(" ", "T");
  const marks = [];
  files.trades.filter(r => r.coin === coin).forEach(r => {
    const good = toNum(r.realized_return) > 0;
    const e = at[key(r.entry_time)] ?? at[key(r.entry_time).slice(0, 10)], x = at[key(r.exit_time)] ?? at[key(r.exit_time).slice(0, 10)];
    if (e != null) marks.push({k: e, p: toNum(r.entry_price), good, entry: true, r});
    if (x != null) marks.push({k: x, p: toNum(r.exit_price), good, entry: false, r});
  });
  return {n, t, price, book, hold, fc, pos, win, marks, trades: files.trades.filter(r => r.coin === coin).length};
}

async function dayChart(el){
  let files;
  try { files = await chartFiles(el.dataset.path); }
  catch (e) {
    el.innerHTML = e instanceof Missing
      ? `<p class="muted small">Not in the record: no chart files for this backtest here. Committed ones exist for backtests confirmed by step 5 or profitable enough by step 6; the others' files stay on the disk where the run happened.</p>`
      : `<p class="muted small">Chart files could not be loaded (${esc(e.message)}). Open the page through a web server or the phone link, not as a local file.</p>`;
    return; }
  if (!document.body.contains(el)) return;
  const S = coinSeries(files, el.dataset.coin);
  if (!S.n) { el.innerHTML = `<p class="muted small">No bars for this coin in the chart files.</p>`; return; }
  const st = {i0: 0, i1: S.n - 1, cur: null};
  el.innerHTML = `<div class="zoom"><button data-z="in" aria-label="zoom in">+</button><button data-z="out" aria-label="zoom out">−</button><button data-z="all">All</button>
    <span class="muted small">${S.n} bars · ${S.trades} trades${files.local ? " · local files (not in git)" : ""}</span></div>
    <div class="readout" id="dro"></div><div class="day" id="dsvg"></div>`;
  const box = el.querySelector("#dsvg"), ro = el.querySelector("#dro");
  const W = 360, L = 44, R = 6, PANELS = [
    {h: 130, title: "Price", lines: [["price", "var(--ink2)"]], marks: true},
    {h: 110, title: "Book and holding (from 1)", lines: [["book", "var(--accent)"], ["hold", "#eb6834"]], one: true},
    {h: 60, title: "Forecast", lines: [["fc", "var(--accent)"]], zero: true},
    {h: 60, title: "Position", lines: [["pos", "var(--accent)"]], zero: true}];
  const GAP = 22, H = PANELS.reduce((a, p) => a + p.h + GAP, 0) + 16;
  const X = k => L + (k - st.i0) * (W - L - R) / Math.max(1, st.i1 - st.i0);
  function draw(){
    const i0 = st.i0, i1 = st.i1, step = Math.max(1, Math.floor((i1 - i0) / 700));
    let y0 = 0, s = "";
    // year ticks and window starts
    let lastY = "";
    for (let k = i0; k <= i1; k++) { const yr = S.t[k].slice(0, 4); if (yr !== lastY) {
      s += `<text x="${X(k)}" y="${H - 4}" text-anchor="${k === i0 ? "start" : "middle"}">${k === i0 && i1 - i0 < 400 ? day10(S.t[k]) : yr}</text>`; lastY = yr; } }
    PANELS.forEach(p => {
      y0 += GAP;
      const vals = []; p.lines.forEach(([key]) => { for (let k = i0; k <= i1; k++) if (S[key][k] != null) vals.push(S[key][k]); });
      if (p.one) vals.push(1); if (p.zero) vals.push(0);
      let lo = Infinity, hi = -Infinity; for (const v of vals) { if (v < lo) lo = v; if (v > hi) hi = v; } if (hi === lo) { hi += 1; lo -= 1; } const pad = (hi - lo) * .06; lo -= pad; hi += pad;
      const Y = v => y0 + (hi - v) * p.h / (hi - lo);
      s += `<text x="${L}" y="${y0 - 6}" style="font-weight:600">${p.title}</text>`;
      s += `<line x1="${L}" x2="${W - R}" y1="${y0 + p.h}" y2="${y0 + p.h}" stroke="var(--line)"/>`;
      S.win.forEach(k => { if (k > i0 && k <= i1) s += `<line x1="${X(k)}" x2="${X(k)}" y1="${y0}" y2="${y0 + p.h}" stroke="var(--line)" stroke-dasharray="2 3"/>`; });
      const ref = p.one ? 1 : p.zero ? 0 : null;
      if (ref != null) s += `<line x1="${L}" x2="${W - R}" y1="${Y(ref)}" y2="${Y(ref)}" stroke="var(--ink2)" stroke-width=".6"/>`;
      [hi - pad, lo + pad].forEach(v => s += `<text x="${L - 4}" y="${Y(v) + 4}" text-anchor="end">${fmtAxis(v)}</text>`);
      p.lines.forEach(([key, col]) => {
        let d = "", pen = false;
        for (let k = i0; k <= i1; k += step) { const v = S[key][k]; if (v == null) { pen = false; continue; }
          d += (pen ? "L" : "M") + X(k).toFixed(1) + " " + Y(v).toFixed(1); pen = true; }
        s += `<path d="${d}" fill="none" stroke="${col}" stroke-width="1.6" stroke-linejoin="round"/>`;
      });
      if (p.marks) {
        const vis = S.marks.filter(m => m.k >= i0 && m.k <= i1 && m.p != null);
        if (vis.length <= 300) vis.forEach(m => { const c = m.good ? "var(--good)" : "var(--bad)";
          s += `<circle cx="${X(m.k)}" cy="${Y(m.p)}" r="4" fill="${m.entry ? c : "var(--card)"}" stroke="${c}" stroke-width="1.6"/>`; });
        else s += `<text x="${W - R}" y="${y0 + 12}" text-anchor="end">zoom in to see the ${vis.length} trade marks</text>`;
      }
      if (p.lines.length > 1) s += `<text x="${W - R}" y="${y0 - 6}" text-anchor="end"><tspan fill="var(--accent)">— book</tspan>  <tspan fill="#eb6834">— holding</tspan></text>`;
      y0 += p.h;
    });
    if (st.cur != null && st.cur >= i0 && st.cur <= i1) s += `<line x1="${X(st.cur)}" x2="${X(st.cur)}" y1="${GAP}" y2="${H - 16}" stroke="var(--ink)" stroke-width=".8"/>`;
    box.innerHTML = `<svg viewBox="0 0 ${W} ${H}" width="100%">${s}</svg>`;
    readout();
  }
  function fmtAxis(v){ const a = Math.abs(v); if (a < 1e-9) return "0"; return a >= 1000 ? Math.round(v).toString() : a >= 10 ? v.toFixed(0) : a >= 1 ? v.toFixed(2) : v.toFixed(3); }
  function readout(){
    const k = st.cur;
    if (k == null) { ro.textContent = `${day10(S.t[st.i0])} to ${day10(S.t[st.i1])} · touch the chart to read a day`; return; }
    const tr = S.marks.filter(m => m.k === k).map(m => `${m.entry ? "entry" : "exit"} ${m.r.direction} ${num(toNum(m.r.realized_return), 3)} %`).join(", ");
    ro.textContent = `${day10(S.t[k])} · price ${num(S.price[k], 4)} · book ${num(S.book[k], 4)} · holding ${num(S.hold[k], 4)} · forecast ${num(S.fc[k])} · position ${num(S.pos[k], 3)}${tr ? " · " + tr : ""}`;
  }
  const idx = clientX => { const r = box.getBoundingClientRect(), x = (clientX - r.left) * W / r.width;
    return Math.max(st.i0, Math.min(st.i1, Math.round(st.i0 + (x - L) * (st.i1 - st.i0) / (W - L - R)))); };

  el.querySelectorAll("[data-z]").forEach(b => b.addEventListener("click", () => {
    if (b.dataset.z === "all") { st.i0 = 0; st.i1 = S.n - 1; draw(); } else zoom(b.dataset.z === "in" ? .5 : 2, st.cur); }));
  const ptr = new Map(); let g = null;
  box.addEventListener("pointerdown", e => { ptr.set(e.pointerId, e.clientX); box.setPointerCapture(e.pointerId);
    if (ptr.size === 1) { g = {x: e.clientX, i0: st.i0, moved: false}; st.cur = idx(e.clientX); draw(); }
    if (ptr.size === 2) { const [a, b] = [...ptr.values()]; g = {pinch: Math.max(24, Math.abs(a - b)), span: st.i1 - st.i0, c: idx((a + b) / 2)}; } });
  box.addEventListener("pointermove", e => {
    if (!ptr.has(e.pointerId)) { if (e.pointerType === "mouse") { st.cur = idx(e.clientX); readout(); draw(); } return; }
    ptr.set(e.pointerId, e.clientX);
    if (ptr.size >= 2 && g && g.pinch) { const [a, b] = [...ptr.values()]; const d = Math.max(24, Math.abs(a - b));
      const ns = g.span * g.pinch / d; zoom(ns / Math.max(1, st.i1 - st.i0), g.c); return; }
    if (g && ptr.size === 1) { const r = box.getBoundingClientRect(), dx = (e.clientX - g.x) * W / r.width;
      if (Math.abs(dx) > 6 || g.moved) { g.moved = true; const span = st.i1 - st.i0; pan(g.i0 - st.i0 - dx * span / (W - L - R)); }
      else { st.cur = idx(e.clientX); draw(); } } });
  const up = e => { ptr.delete(e.pointerId); if (!ptr.size) g = null; };
  box.addEventListener("pointerup", up); box.addEventListener("pointercancel", up);
  box.addEventListener("wheel", e => { e.preventDefault(); zoom(e.deltaY < 0 ? .8 : 1.25, idx(e.clientX)); }, {passive: false});
  draw();
}

window.addEventListener("hashchange", view);
view();
</script>
</body>
