# Step 6: the rule. One for every backtest, fixed before any is checked; never moved after seeing a check.
# Values: the old pipeline's profit bars (branch 3), without its deflated Sharpe and its drawdown ceiling.
# A measure marked "above" passes strictly above its value; "at least" passes at or above it.
sharpe_min: 0.0                         # above: the book's Sharpe, daily returns, annualised by sqrt(365)
sharpe_vs_hold_min: 0.0                 # above: the book's Sharpe minus holding the same coins' Sharpe
avg_daily_return_min: 0.0005            # at least: the book's mean daily return (0.05 % a day)
leave_one_window_out_sharpe_min: 0.0    # above: the lowest Sharpe with any one window left out
calmar_min: 0.75                        # above: annualised return divided by the deepest fall
trade_frequency_min: 0.01               # at least: trades per bar (closes forced at a window's end not counted)
