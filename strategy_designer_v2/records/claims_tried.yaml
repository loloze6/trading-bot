  verdict: fail
  run: n01_session_vol_regime_book_1h/001
- id: compression_release_on_volume
  belief: A volume surprise that arrives after a compressed 24-hour range marks the
    release of stored positioning. Its direction persists for hours, more than a volume
    spike in an already volatile tape, which tends to be exhaustion.
  measure: mean_diff
  verdict: fail
  run: n01_session_vol_regime_book_1h/001
- id: us_open_regime_switched_extension
