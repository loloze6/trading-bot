  verdict: fail
  run: real_01b_daily_breadth_ltc/001
- id: volume_absorption_expansion
  belief: A day of heavy volume with almost no net price change shows two-sided absorption
    (a large buyer meeting a large seller); when one side finishes, price breaks away
    and larger moves follow.
