    bars, even though the open bar's own move does not.
  measure: rank_corr
  verdict: fail
  run: n01_session_vol_regime_book_1h/001
- id: us_open_hour_overshoot_fade
  belief: The opening burst of US flow overshoots, which is why continuation from
