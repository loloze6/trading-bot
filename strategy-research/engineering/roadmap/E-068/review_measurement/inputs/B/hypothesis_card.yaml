hypothesis_id: SPARSE_HIGH_CONVICTION_EMA_TREND_1H
thesis: >
  Sparse, high-conviction trend bars (EMA direction + above-median volume + high body fraction)
  activate infrequently (~20% of bars) and reduce crowding relative to continuous EMA crossover
  signals. This lower activation may preserve edge that universal signals like EMA spread have
  lost on BTC/ETH 1h to arbitrage. Volatility scaling (external layer) protects against crash
  regimes.

rationale: >
  The campaign's known results (run_043: EMA_SPREAD ic=-0.021, edge_to_cost=0.36×; run_053:
  MACD sparse ic_active=-0.050) show even 92% sparse trend signals fail on BTC/ETH 1h. However,
  both prior variants used a single component or loose filters. This card combines three
  independent OHLCV gatekeepers (EMA direction, volume strength, candle conviction) firing
  simultaneously. Reducing activation to ~20% instead of 100% cuts crowding pressure. The brief's
  own mechanism ("slow-reacting flows") implies a subset of bars (high-conviction institutional
  moves) should embed the edge more cleanly than all bars. This is the test.

edge_source:
  category: persistent_behavioral_bias
  specific_mechanism: >
    Bars where EMA(9) direction is confirmed by above-median volume and high body fraction
    (>0.6) signal institutional participation and consensus. Market participants react to
    this consensus slowly over 1-4 hours, creating short-term continuation bias. Sparse activation
    (~20% of bars) reduces monitoring by casual researchers and arbitrage pressure relative to
    always-on MA signals.
  why_not_arbitraged: >
    The combination of three aligned conditions (EMA direction + volume > median + body > 0.6)
    is less standard than simple MA crossover. Sparse activation lowers the signal's visibility
    and reduces its appeal to scale-seeking algorithms (fewer trades per unit time = higher
    latency cost per trade). However, this is a crowding hypothesis, not a structural one, so
    edge is modest and fragile to competitive pressure.
  evidence_type: price_volume_only
  measurable_proxy: >
    EMA(9) vs EMA(21) direction, volume_ratio (current_volume / 20-bar MA), and body_fraction
    (abs(close-open)/(high-low)). The proxy is computable from OHLCV. Hypothesis predicts
    forward returns (next 1-4 bars) are directionally biased in the direction of the EMA when
    all three gates are met, vs. flat baseline on days when gates don't all align.
  requires_new_feed: null

signal_concept: >
  Quantity measured: three OHLCV-derived factors (EMA direction, volume strength, body
  conviction) combined into a composite forecast score, scaled to [-20, +20].
  
  Scaling: When EMA(9) > EMA(21) AND volume_ratio > 1.0 AND body_fraction > 0.6, forecast =
  EMA_direction × min(volume_ratio, 1.5) × body_fraction × 20, yielding [-20, +20]. When
  conditions don't all align, forecast = 0 (flat). Position size follows: allocation = forecast
  / 10, so forecast ±20 = ±2.0 notional, forecast 0 = flat, intermediate forecasts scale
  linearly.
  
  Restatement of on/off rule as graded: Original concept was "long when EMA9>EMA21 AND vol>
  median AND body>0.6; short when EMA9<EMA21 AND vol>median AND body>0.6; flat else." Graded
  version is responsive to the strength of each component within the activation set: forecast
  magnitude reflects how far volume_ratio and body_fraction exceed their thresholds, not just
  binary gate status. This allows subtle differences in conviction to influence position size.
  
  Not expressible in config: Volatility scaling (external to signal, part of strategy
  architecture's position-sizing layer, not this signal). The signal itself outputs forecast
  [-20, +20] on demand; strategy layer applies vol-inverse scaling separately.

target_market: BTCUSDT, ETHUSDT
timeframe: 1h
assumptions:
  - EMA(9) vs EMA(21) direction is a stable proxy for short-term trend (widely used, though
    not uniformly profitable; sparse conditioning aims to recover edge from dense version).
  - Above-median volume signals informed participation (institutional capital trades at higher
    velocity, moves "smart" capital).
  - Body fraction > 0.6 indicates strong directional consensus and confidence in the 1h bar.
  - Sparse activation (~20% of bars) materially reduces arbitrage pressure and monitoring cost
    for competitors vs. always-on signals (basis: lower frequency = lower incentive for marginal
    arbitrageurs).
  - Volatility scaling (external strategy layer) reduces losses during crash regimes and improves
    risk-adjusted returns (acknowledged by brief as the hedge mechanism).
  - 6 4-month windows (2022-2023) provide sufficient sample for era-consistency check despite
    being bear-market years (not "edge test" per brief, but sufficient for pattern validation).

expected_failure_modes:
  - Sparse signal still killed by costs. Grading sparse activation (~20% of bars, ~50 signals
    per window per coin) by volume_ratio and body_fraction helps, but 10 bps round-trip cost
    baseline on Kraken perp (config/cost_model.yaml) requires ~20 bps gross edge per trade.
    Prior sparse variants (MACD run_053, ic_active=-0.050) failed this bar. Sparsity alone may
    not overcome structural zero-edge floor on price-only 1h signals.
  - Conditioning bias towards extremes. Requiring body_fraction > 0.6 selects the 1h bars with
    the largest moves. These are precisely the bars hardest to forecast (mean-revert or extend
    unpredictably). The high-conviction criterion may select for noise rather than signal.
  - Era and regime instability. The brief's window (2022-2023, bear/chop years) may not
    generalize to bull markets or different volatility regimes. Robustness across eras is
    uncertain and must be tested (sign_consistent_by_era criterion addresses this).
  - Volume filtering confounded with liquidations. High-volume bars on crypto perps can signal
    forced liquidations (structural_forced_flow, predicts mean-reversion) as well as organic
    herding (persistent_behavioral_bias, predicts continuation). Without liquidation_data feed,
    the proxy is mechanism-impure (similar to the blocked H-041-B volume_impulse_continuation).
    Expected impact: modest (volume_ratio is only one of three gates), but present.

library_lookup:
  indicator_id: moving_average_crossover (with volume/body gating)
  regime_affinity_for_target: unfavorable (EMA is inherently trend-following, unfavorable in
    ranging regimes; this ungated variant fires on demand, so affinity is a prior risk factor,
    not a regime-detection claim)
  affinity_justification: >
    This hypothesis carries no regime detector, so it fires whenever conditions align. The EMA
    component inherently favors trending regimes (favorable affinity per library) but does not
    gate on them. This ungated variant therefore carries the regime-affinity mismatch as a prior
    failure mode: in ranging regimes, EMA whipsaws and the sparse gate may activate on false
    trends. Mitigation: the three-way gating (volume + body) should reduce whipsaw sensitivity
    compared to unfiltered EMA, but affinity risk remains.
  prior_campaign_failures:
    - run_id: run_043
      hypothesis_id: EMA_SPREAD_TREND_CONTINUATION_V1
      mechanism_tried: Unfiltered EMA(9/21) crossover, always-on
      mechanism_difference: This card adds volume + body gating to reduce activation and
        crowding. run_043 used the raw crossover (forecast_sparsity_pct=0.0, always-on). The
        sparse gating is a material mechanism change, not a parameter adjustment.
  crowding_risk: medium (lower than high-crowding EMA via sparsity, but still price-only and
    price-volume signals are widely monitored)
  crowding_deviation_justification: >
    Dense EMA crossover (run_043) has crowding_risk=high on the library. This variant reduces
    activation to ~20% of bars via two additional gates. Per the library's crowding rationale
    (indicator_library.yaml: "most widely taught," "heavily arbitraged on liquid crypto"), sparse
    conditioning lowers visibility and monitoring frequency. However, the KB findings
    (macd_trend_continuation_extended: 92% sparse but still ic_active=-0.050, cost_drag 25%+)
    suggest sparsity alone may not overcome the crowded-signal ceiling on BTC/ETH 1h. No
    less-crowded alternative (non-OHLCV) is available without new feeds (liquidation_data would
    enable structural_forced_flow variants). Accepted risk: medium crowding, not high, but still
    price-only.

power_parameters:
  activation_rate: 0.20
  plausible_ic_upper: 0.05
  plausible_ic_upper_basis: >
    A8.6 anchor table: "Dense OHLCV, medium crowding" band is 0.05–0.08. This variant is
    price+volume only (medium crowding, less universal than pure MA but still widely used),
    sparse activation (20% vs 100%), so plausible_ic_upper floor is 0.05. Rationale: ema_spread
    (run_043, all-bars) had ic=-0.021; macd sparse (run_053, 92% sparse) had ic_active=-0.050.
    Both anchors suggest even sparse price signals are fighting a structural ceiling on BTC/ETH
    1h. Using 0.05 as upper bound (modest, defensible from prior).
  n_bars: 15936
  n_bars_basis: >
    6 windows × 4 months × 30 days × 24 bars/day ÷ 2 symbols (computed as mean per symbol) = 
    ~2,880 bars per symbol. Rough estimate used for power arithmetic only; actual bar count
    from protocol will supersede.
  n_symbols: 2
  is_market_wide: false

criteria:
  - id: realized_edge_to_cost_ratio
  - id: sign_consistent_by_era

cost_feasibility:
  assumed_round_trip_cost_bps: 10.0
  assumed_round_trip_cost_bps_source: "config/cost_model.yaml perp.round_trip_cost_bps.default"
  expected_holding_bars:
    min: 1
    max: 4
  expected_trades_per_window: 50
  expected_trades_per_window_basis: >
    6 windows × 2 symbols × (~1200 bars/symbol/window × 0.20 activation / ~5 bars average hold)
    ≈ 120 trades per symbol over 6 windows, or ~50/window/symbol on average.
  required_gross_edge_bps_per_trade: 20.0
  required_gross_edge_per_trade_basis: "2.0 × round_trip_cost (config/cost_model.yaml safety_factor)"
  plausibility: marginal
  plausibility_rationale: >
    Cost baseline 10 bps (Kraken perp taker) requires 20 bps gross edge per trade to meet the
    2.2× edge_to_cost_ratio criterion. Prior sparse/dense EMA and MACD variants on 1h BTC/ETH
    failed to approach this threshold (run_043: edge_to_cost=0.36×; run_053: cost_drag ~25%,
    edge_to_cost_ratio not quoted but implied <<1×). The KB meta-finding "price-only technical
    indicators on BTC/ETH 1h face a structural zero-edge floor" is the dominant risk. Sparse
    gating is hypothesized to improve upon dense EMA (run_043), but even a 5–10× improvement
    (from 0.36× to 3.6–1.8×) is speculative. Marginal reflects cautious optimism: the mechanism
    is distinct enough to test, but prior results suggest the bar is very high.

claim:
  statement: >
    When a 1h bar has EMA(9) > EMA(21), volume > 20-bar median, and body fraction > 0.6
    (high-conviction institutional bar), the next 1–4 hours are more likely to extend in that
    direction than on days when these conditions don't all align.
  kind: conditional_behaviour
  tests:
    - name: sparse_high_conviction_continuation
      selector: {kind: event, field: forecast, op: "!=", value: 0}
      outcome: {kind: fwd_return, horizons: [1, 2, 4]}
      baseline: {kind: complement}
      statistic: mean_diff
      direction: greater
      floor: {min_events: 50, min_windows: 4}
      consistency: {unit: window, min_same_sign: 4}
  pass_if: >
    At every horizon (1h, 2h, 4h ahead), bars where the sparse high-conviction signal fires
    (all three gates aligned) have significantly higher mean forward returns than the baseline
    (all other bars), and the effect is consistent in sign across at least 4 of the 6 windows.
  fail_if: >
    At any horizon, the signal bars significantly underperform the baseline, indicating the
    mechanism predicts mean-reversion, not continuation.
  rationale: >
    If high-conviction bars signal true institutional participation, forward returns on those
    bars should exceed the average bar. The test isolates the rare moments (gate-confirmed
    consensus: EMA + volume + body all aligned) and checks for a measurable advantage. Sparse
    activation (~50 events per window per symbol, ~0.3% of all bars) means each event is a
    genuine market consensus point. Consistency across 4+ of the 6 brief windows defends against
    era-specific luck. At least 50 events per window threshold keeps the test grounded in
    sufficient sample despite sparsity.