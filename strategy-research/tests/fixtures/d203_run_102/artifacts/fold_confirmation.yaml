kind: conditional_behaviour
statement: 'After bars whose past 168-hour return is in the top 20% of its trailing
  500 bars, BTC returns over the next 6 and 24 hours are higher than on other bars.
  The slow trend leg therefore carries the persistent part of the forecast, and the
  negated 24-bar stretch leg, which bets on reversal, adds sign flips without a matching
  reversal edge.

  '
rule:
  name: noise_rule
  min_windows: 4
  windows_allowed_against: 1
  text: 'NOISE RULE, not a size rule and no cost comparison: not measurable when the
    claim''s own floor is not met at any horizon (pooled over the fold''s windows,
    as claim_measure computes it); else confirmed when, at every horizon with a value,
    the pooled effect has the claimed sign AND the claimed sign holds in all but at
    most 1 of the fold''s windows, a window with no value counting against (fewer
    of the fold''s windows with a value than all but 1, or than 4: not measurable).
    About an 11% chance per fold for a claim with no effect (6 windows), about 1%
    after two folds; every look is counted. Measured on the run built from the claim,
    on a fold its source run was not on; not proven.'
