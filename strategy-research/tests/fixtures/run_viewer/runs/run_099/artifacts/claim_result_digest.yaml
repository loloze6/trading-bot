statement: 'The long-only forecast ranks the next 5 and 20 daily returns positively
  (higher forecast, higher return), and after a forecast of 8 or more the return over
  the next 5 bars is lower than on the other bars (half (a) of the run_098 re-run
  question: whether the strongest long readings are already exhausted at 5 bars).

  '
