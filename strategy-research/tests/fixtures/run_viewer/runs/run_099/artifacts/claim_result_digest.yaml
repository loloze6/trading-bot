block_visibility: ok
manifest_kind: forecast
statistics_note: each test's `effect` is that test's own statistic (its `statistic_label`);
  none of them is the forecast_power report's forecast_return_corr, which is a Pearson
  correlation of the forecast with the next bar's return on active bars
