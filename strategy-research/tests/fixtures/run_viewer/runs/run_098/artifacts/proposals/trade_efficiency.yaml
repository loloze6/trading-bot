  forecast as the vehicle and dropped it: a sign flip of the whole signal is not a
  graded change, and it would be fitted to one fold whose long side is carried by
  the bull-market drift (longs earn on average, q5). A shorter or longer anchor period
  has no direction this observation fixes. The short losses concentrate in one window,
  so that window is a rival to any claim about the short side.

