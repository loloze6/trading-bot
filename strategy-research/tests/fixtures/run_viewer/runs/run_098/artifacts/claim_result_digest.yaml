  - variant_id: asset_ada
    kind: asset
    symbol: ADAUSDT
    patch: []
statement: 'On BTC daily bars, a higher forecast (closer to the 250-day high) is followed
  by higher returns over the next 1 and 2 bars. The top 30 percent of forecast days
  have higher next-day returns than other days.

  '
kind: direction_forecast
block_visibility: ok
manifest_kind: forecast
statistics_note: each test's `effect` is that test's own statistic (its `statistic_label`);
  none of them is the forecast_power report's forecast_return_corr, which is a Pearson
  correlation of the forecast with the next bar's return on active bars
