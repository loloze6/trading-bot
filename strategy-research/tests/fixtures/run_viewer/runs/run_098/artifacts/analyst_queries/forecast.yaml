schema_version: 1
note: every call of the analyst's query tools, in order, written before the result was returned; n_comparisons counts the
  numbers that relate a condition or group to an outcome
queries:
- id: q1
  function: list_columns
  params:
    variant: base
  status: ok
  n_comparisons: 0
  cumulative_comparisons: 0
  digest: 22 usable bar columns
  result_sha256: 6b86e60980c1628ea28930b883568d6266d84933529eec4ba4f979036d973f5b
  result:
    variant: base
    cadence: daily
    windows:
    - BTCUSD/2018-05
    - BTCUSD/2019-01
    - BTCUSD/2019-09
    - BTCUSD/2020-05
    - BTCUSD/2021-01
    - BTCUSD/2021-09
    bar_columns:
    - open | price | close | First price of the bar.
    - high | price | close | Highest price of the bar.
    - low | price | close | Lowest price of the bar.
    - close | price | close | Last price of the bar; the decision and fill price.
    - volume | base units | close | Traded volume of the bar.
    - forecast | forecast | close | The strategy's final forecast for the bar, clipped to -20..+
    - total_portfolio_value | USDT | close | Account value at this close, before this bar's trade (cash m
    - previous_allocation | alloc | close | Position value / account value at this close, before the tra
    - 'allocation_change | alloc | close | Target allocation (forecast / 10, or the held allocation on '
    - approved_rebalance | bool | fill | Risk manager's answer when `allocation_change` is non-zero (
    - succcess_execute_portfolio_rebalance | bool | fill | The order succeeded (empty when no order was attempted). Nam
    - 'postRebalance_total_value | USDT | fill | Account value after this bar''s trade and its commission, at '
    - postRebalance_current_allocation | alloc | fill | Allocation after this bar's trade.
    - portfolio_value | USDT | close | Copy of `total_portfolio_value`.
    - debug_info.forecast_delta | forecast | close | This bar's forecast minus the previous ready bar's forecast.
    - debug_info.bars_in_regime | bars | close | Consecutive bars in the current regime, this bar included.
    - 'debug_execute_portfolio_rebalance.price | price | fill | Fill price: close x (1 +/- slippage bps / 10000).'
    - 'debug_execute_portfolio_rebalance.quantity | base units | fill | Order size: positive for LONG/SHORT/REDUCE_*, the
      signed pos'
    - debug_info.components.anchor_position.last_history_value | component | close | The component's latest raw output (before
      its transform pipe
    - debug_info.components.anchor_position.post_pipeline_value | forecast | close | The component's value after its transform
      pipeline.
    - debug_info.components.anchor_position.weighted_contribution | forecast | close | weight_normalized x post_pipeline_value;
      the sum over compon
    - 'debug_approve_allocation_change.controls.min_allocation_change.passed | bool | fill | abs(change) >= threshold (default
      0.20): the no-trade band.'
    derived_columns:
    - past_return_<n> (n bars, 1..1000)
    - trailing_vol_<n> (n bars, 2..1000)
    - abs_forecast
    - forecast_sign_change
    - allocation_abs
    not_offered:
      label:
      - confidence
      - strategy
      - debug_info.components.anchor_position.weight_normalized
      never:
      - balances.USDT.free
      - balances.USDT.locked
      - balances.BTCUSD.free
      - balances.BTCUSD.locked
      - postRebalance_balances.USDT.free
      - postRebalance_balances.USDT.locked
      - postRebalance_balances.BTCUSD.free
      - postRebalance_balances.BTCUSD.locked
      not_numeric:
      - timestamp
      - regime
      - debug_info.regime
      - debug_info.regime_scores
      - debug_info.regime_margin
      - debug_approve_allocation_change.symbol
      - debug_approve_allocation_change.time
      - debug_execute_portfolio_rebalance.symbol
      - debug_execute_portfolio_rebalance.trade_type
    by_bars:
    - window
    - coin
    - regime
    - weekday
    - hour
    by_effect:
    - window
    - coin
    by_trades:
    - window
    - direction
    - regime_at_entry
    - weekday
    - hour
    trade_fields:
      entry_time:
      - side
      - entry_hour
      - entry_weekday
      - regime_at_entry
      - entry_forecast
      exit_time:
      - exit_cause
      - holding_bars
    trade_aggs:
      fields:
      - trade_net_return
      - post_exit_return
      - holding_bars
      - entry_forecast
      - trade_gross_return
      - trade_cost_pct
      stats:
      - mean
      - median
      - share_positive
      - count
    condition_kinds:
    - all
    - all_of
    - calendar
    - event
    - quantile
    - regime
    - regime_change
    - trade
    outcomes:
    - fwd_max_drawdown
    - fwd_return
    - fwd_volatility
    - trend_ends
    - trade_net_return
    - post_exit_return
    - trade_gross_return
    statistics:
    - decay_curve
    - hit_rate
    - mean_diff
    - rank_ic
    caps:
      groups: 12
      horizons: 6
      result_chars: 4000
      comparisons: 150
