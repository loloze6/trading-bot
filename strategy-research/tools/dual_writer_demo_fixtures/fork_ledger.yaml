# E-025 S4 two-sided demo -- FORK (Dorian) writer fixture.
#
# SYNTHETIC. Never feeds DSR, never touches market data, never merges into the
# live campaign_record/campaign_state.yaml. See master_ledger.yaml's header.
#
# Ids use the real disjoint convention (fork = run_d_NNN) in a 900-range. This
# is the `b` side of union_merge_trial_ledgers. run_900 rows are the shared
# ancestor -- byte-identical to master's, so the union keeps them once.
#
# Covers the full row spectrum, with the two accounting-critical classes kept
# DISTINCT:
#   * run_d_901 -- a KILLED trial: a prescreen kill, statistic_valid=neither,
#     no backtest row follows. A real recorded attempt with no Sharpe value.
#   * run_d_902 -- a FAILED backtest: source=backtest_failed, statistic_valid=
#     failed, forecast_hash null (the ONE contract-legal null -- the config
#     itself may be the failure). Distinct source, distinct class from a kill.
