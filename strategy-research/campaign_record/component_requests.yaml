- run_id: run_070
  stage: strategy_config_authoring
  variant_id: null
  reason: The hypothesis's core signal—one-bar price return negated and normalized
    by 20-bar ATR—is not available as a graded component in COMPONENT_CATALOG.md.
    No composition of existing components builds it without altering the mechanism.
    Component gap is genuine and blocking.
  blocking_issues:
  - kind: missing_catalog_component
    description: 'Required: graded component that outputs -(close[t] - close[t-1])
      / ATR(period, default 20), where ATR is average true range computed from high/low/close.
      This is the shock-magnitude formula central to the forced-liquidation-reversal
      hypothesis. Existing components either normalize by price (PriceEvolutionComponent)
      or by EMA-distance (KeltnerBreakoutComponent) or by historical return distribution
      (via ratio_to_mean), none of which express the ATR normalization. The ATR measure
      is specific to the mechanism: liquidation-cascade overshoot relative to typical
      intra-bar price range.'
- run_id: run_070
  stage: strategy_config_authoring
  variant_id: null
  reason: 'Missing required component: 1-bar price change divided by 20-bar ATR. No
    composition of existing catalog components reproduces this signal structure.'
  blocking_issues:
  - needed_component: ShockMagnitudeComponent (or OneBarATRNormalizedChangeComponent)
    kind: graded_signal_component
    reason: 'The hypothesis''s core signal formula is shock = -(close[t] - close[t-1])
      / ATR[20-bar], which requires a component that: (1) measures 1-bar absolute
      price change (the most recent close minus the prior close), (2) normalizes specifically
      by 20-bar ATR (average true range, not stddev or close price), (3) produces
      a graded, signed, continuous output suitable for scaling into [-20, +20] forecast
      range. Composition attempts and failures: (A) PriceEvolutionComponent with period=1
      outputs (close[t-1] - close[t-2]) / close[t-2] x 100—percent change with close
      as denominator, not ATR; (B) KeltnerBreakoutComponent with atr_period=20 outputs
      (close - EMA) / ATR—different numerator (EMA distance, not 1-bar change); (C)
      vol_normalize transform divides by (stddev_24 x close), not ATR; (D) Multi-component
      composition impossible because: no component outputs raw ATR as a value, no
      transform op implements division by ATR, and no history op extracts ATR from
      available columns. ATR is a specific volatility metric (true-range average)
      not available as a reusable signal input. The hypothesis''s edge source (structural
      forced-flow mechanism) depends critically on ATR as the denominator—approximating
      with EMA-distance (Keltner) or stddev (vol_normalize) would falsify the intended
      shock detection.'
- run_id: run_071
  stage: strategy_config_authoring
  variant_id: null
  reason: Body fraction (|close-open|/(high-low)) is required by the hypothesis signal_concept
    but no available component exposes this intrabar calculation. No composition of
    existing components can recreate it.
  blocking_issues:
  - 'BodyFractionComponent missing: intrabar body-to-range ratio (|close-open|/(high-low))
    required for signal, requires open price access not exposed in COMPONENT_CATALOG.md'
  tried:
  - config: DonchianBreakoutComponent(period=20)
    fails_on: Approximates extremeness via 20-bar close range positioning (not intrabar
      high-low), AND provides no body_fraction measurement. Covers only half the required
      signal; both components must be present and both are missing or misaligned.
  - config: DonchianBreakoutComponent(period=20) + PriceEvolutionComponent(period=1,
      scaling_factor=1.0)
    fails_on: Donchian normalizes by 20-bar close range; PriceEvolution by prior close;
      neither normalizes by intrabar high-low. PriceEvolution is a different yardstick
      for move magnitude. Combined signal lacks the specific body-fraction calculation.
  - config: PriceEvolutionComponent(period=1) with [zscore, scale(factor=10.0)]
    fails_on: Measures directional move strength (1-bar return z-score), not body_fraction.
      Normalizes by 1-bar return volatility, not intrabar body ratio. A different
      yardstick for conviction; does not express the hypothesis's quantity.
  tried_warning: null
- run_id: run_071
  stage: strategy_config_authoring
  variant_id: null
  kind: deviation
  run_continued: true
  reason: 'deviation: The calculation (close - open) / (high - low) requiring independent
