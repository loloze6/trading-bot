            1 and 1
          missing: a 720-bar standard-deviation scale (standardise windows are capped
            at 500 and use mean absolute value, not standard deviation)
          effect: The scale is the mean absolute value over 500 past bars instead
            of the standard deviation over 720 bars. The relative weight of S and
            D shifts only slightly, since both series are near zero-mean. The forecast
            is half of f_t, which does not change rank or sign, and readiness comes
            at about 290 bar...
        - clause: price_minus_long_sma, L_t = close_t / SMA_168(close)_t - 1
          built_instead: nothing as a separate component; the long-SMA information
            enters through the S_t component
          missing: null
          effect: None on the forecast, because f_t does not use L_t.
        - clause: 'exits and holding rules: a forecast cannot say when to leave a
            trade'
