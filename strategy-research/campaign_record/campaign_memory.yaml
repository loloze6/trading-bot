        n_deviations: 3
        deviations:
        - clause: body_fraction >= 0.70 (high conviction, candle body size as primary
            selection criterion)
          built_instead: PriceEvolutionComponent(period=1, scaling_factor=10.0) +
            ratio_to_mean + scale(10) measuring current bar's close return from prior
            bar, normalized by historical mean
          missing: The calculation (close - open) / (high - low) requiring independent
            per-bar intrabar high-low usage; no catalog component isolates current-bar
            intrabar range in this way
          effect: Substitutes percentage close-return (cross-bar) for body-fraction
            (intrabar); captures move magnitude via different yardstick, same directional
            signal; sensitivity to volatility-adjusted body size differs but correlation
            with move strength remains
        - clause: extremeness_percentile >= 0.90 or <= 0.10 (close position within
            current bar's intrabar high-low range, 0-1 scale)
          built_instead: DonchianBreakoutComponent(period=20, scaling_factor=10.0)
            + ratio_to_mean + scale(10) measuring close position within recent 20-bar
            high-low range, normalized by historical mean
          missing: The calculation of close percentile within current bar's intrabar
            high-low only; no catalog component provides per-bar intrabar range context
          effect: Uses 20-bar range context instead of 1-bar intrabar context for
            extremeness ranking; detects multi-bar extremeness instead of single-bar
            intrabar position; may admit slightly different bars as 'extreme' but
            maintains directional signal on high-conviction moves
        - clause: Fixed 4-bar hold, exited at close regardless of subsequent signals;
            no take-profits or stops
          built_instead: No position state or time-based hold logic in config; forecast
            regenerated per bar from current conviction signal
          missing: Position state tracking (entry price, bars held); time-based exit
