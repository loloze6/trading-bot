    mark the broader persistent_behavioral_bias / SMA-trend-family search space exhausted
    (one parameterization tested, per the outcome_reason framing above).'
  reactivation_condition: null
  engine_provenance_caveat: 'Filed 2026-07-19 (run_059 close-out, tz-bug arc):
    protocol_version ts_trend_daily_v1 executed on 1d bars BEFORE the 2026-07-18
    CandleBuilder._align() fix (commit 2529f5b). Pre-fix, every daily candle''s
    start_time was silently shifted to a fixed non-zero hour (01:00 or 02:00
    depending on DST) by a naive local-system-timezone epoch round-trip,
    instead of true UTC midnight -- see PIPELINE_IMPROVEMENTS ledger v6 and
    trading-bot/data/data_manager.py''s own _align() docstring. This does
    NOT change bar OHLCV values (only the candle''s timestamp LABEL), so
    day-ordering, closes, and the SMA(100) computation itself are
    unaffected; the only plausible effect is a possible off-by-one-bar
    shift at monthly window boundaries in tools/run_protocol.py''s
    timestamp-range filtering, and equivalent exposure to DST-transition-week
    anomalies (the fixed hour differs by 1h across the March/October DST
    boundary). No re-derivation was performed and none is ordered by this
    entry -- the run_054/run_057 verdicts above (kill_er_gate_mechanism_falsified)
    are MAINTAINED, not relitigated; this caveat exists so a future reader
    auditing window-edge trade counts knows the historical alignment context.

    '
