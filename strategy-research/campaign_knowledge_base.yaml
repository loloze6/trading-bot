  signal_property_audit_note: '2026-07-10: per_trade_expectancy_bps backfilled (this
    field predates the A3.4 schema and was previously absent -- the gap that masked
    daily_timeframe_er_overlay''s predicate evaluation as missing_field instead of
    a clean false). Computed, not estimated, EPISODE-level (not fragment-level) from
