- id: er_detector_unusable_btc_eth_1h
  mechanism: ER-threshold single-indicator stateless regime detector on BTC/ETH 1h
  detector_family: efficiency_ratio_threshold
  evidence_runs:
  - run_039
  evidence_count: 1
  outcome: unusable_for_this_symbol_timeframe
  root_cause: 'Pareto conflict: activation in [10%, 40%] band (intrinsic criterion)
    and transitions/window ≤ 4 (stability criterion) cannot be simultaneously satisfied
    on 1h crypto. Best achievable: score 5/8, transitions ≈ 18/window at dwell=24
    (not directly implementable), or transitions ≈ 40/window at dwell=1. No ER-family
    configuration overcomes this structural constraint.

    '
  exhausted_basis: 'Analytic: the Pareto conflict is a structural property of the
    signal family and timeframe, not a calibration failure. evidence_count=1 is sufficient
    per A5.1 rule (analytic failure). A full 48-cell grid confirming the ceiling is
    analytic evidence.

    '
  protocol_version: baseline_v2
  detector_version: c647ee20
  policy_consequence: 'Per A2.3 post-unusable policy: no replacement detector built
    until an ungated edge exists with regime-dependent performance in Improvement
    03 diagnostics. Candidate detector families in config/detector_wishlist.yaml.
    Preferred first candidate: daily-timeframe regime overlay on 1h strategies.

    '
  closes_ac4: true
  closes_ac4_note: 'AC4 of Improvement 02 required the post-unusable standing policy
    to be recorded. This entry, in the permanent KB, serves as the durable record.

    '
  exhausted: true
