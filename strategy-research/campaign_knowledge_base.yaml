    (protocol_summary.json + per-window bars.csv/trades.json under results/runs/<run_id>/):
    reconstructed 67 real position episodes from the activity-transition boundaries
    on each window''s bars.csv forecast column, grouped all 163 trades.json fragments
    into those 67 episodes by real entry timestamp (0 fragments unassigned), summed
    each episode''s real net_portfolio_profit_loss_percent into one episode PnL in
    bps, then took mean/se/t_stat over the 67 episode-level observations (2024 cohort
    n=28 mean=-64.62bps; 2025 cohort n=39 mean=-140.42bps; pooled n=67 mean=-108.74bps,
    se=58.62, t=-1.855). This differs materially from the FRAGMENT-level figure already
    on record elsewhere (skills/verdict-interpreter/SKILL.md''s A3.5 keltner_163 fixture:
    pooled n=163, mean=-44.6bps, t=-4.637) -- both are negative (this signal has no
    case for a positive per-trade edge under either basis), but the magnitude and
    significance differ because 163 fragments collapse into only 67 real episodes
    here (an average of ~2.4 LIFO fragments per real position episode) -- unlike run_054''s
    SMA signal, this Keltner mean-reversion signal DOES scale positions and DOES fragment
    materially. See docs/TIMEFRAME_CHANGE_PLAYBOOK.md section 2(c). Both figures kept
    on record (fragment-level in SKILL.md, episode-level here) -- this KB entry''s
    signal_property now carries the episode-level number since that is the basis decision-consumed
    metrics must use.

    '
