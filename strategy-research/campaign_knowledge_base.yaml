  chain_narrative: 'Both run_043''s and run_044''s campaign_review (2026-07-04) recommended
    recommendation: reframe toward a daily-timeframe ADX/HMM regime overlay (detector_wishlist.yaml
    priority-1/2 candidates: daily_timeframe_er_overlay, adx_threshold) as the next
    research direction. Neither review checked detector_wishlist.yaml''s own trigger_condition
