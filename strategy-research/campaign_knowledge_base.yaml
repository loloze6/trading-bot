    — every KB finding to date is no_edge_observed, inconclusive, or invalidated_artifact.
    Recommending the wishlist family anyway would have converted a deliberately- deferred
    idea back into a live run without its deferral condition ever being satisfied.

    '
  implication: 'The two resulting research briefs (DAILY_REGIME_OVERLAY_1H_EXECUTION,
    DAILY_REGIME_OVERLAY_SIGNAL_QUALITY — recovered from an unrelated run-ID collision,
    F8, into runs/run_045 and runs/run_046 respectively) are annotated status: parked_pending_a23_trigger
    and MUST NOT be launched until detector_wishlist.yaml''s trigger_condition fires.
    skills/campaign-review/SKILL.md now has a "Wishlist-gated recommendations" section
    requiring any future recommendation that draws on detector_wishlist.yaml or feed_wishlist.yaml
    to check and cite the specific entry''s trigger condition before recommending
    a run; if untriggered, record as wishlist support (continue), not a reframe.

    '
  applicable_rule: campaign-review SKILL.md 'Wishlist-gated recommendations' (added
    2026-07-04)
- id: keltner_root_cause_reattribution
  title: 'Keltner families: root cause is signal quality, not regime availability'
  outcome: root_cause_reattribution
  protocol_version: baseline_v2
  detector_version: c647ee20
  ac4_for_improvement_05: true
  chain_narrative: 'The linear carryover chain (findings_carryover.yaml entries from
    run_017 onward) recorded the Keltner/TRENDING failure as "regime_availability":
    TRENDING regime absent in 7/22 (then 14/48) window-symbol slots. The campaign_review
    (run_039) recommended layering an orthogonal secondary signal to fill the zero-trade
    months. The chain accumulated 25+ runs before this conclusion was reached.

    '
  what_the_chain_missed: 'The regime-availability narrative was a misdiagnosis. Run_039''s
    full-range prescreen (A8.3) computed ic_active_bars = -0.032 (p=0.83, n_active=1125)
    on the TRENDING-labeled bars — the exact bars where the signal "worked." The Keltner
    signal produces no directional content even on the bars the detector selects as
    its operating regime. Zero-trade months were a symptom (TRENDING regime absent
    → no trades), but the causal chain ran deeper: had TRENDING been active in every
    month, per-trade expectancy would still have been negative (as confirmed: -26
    bps on keltner_163).

    '
  implication: "1. The root cause for keltner_mean_reversion and keltner_trend_mean_reversion\
    \ is\n   upgraded from regime_availability to signal_quality in this KB (see findings\
    \ above).\n   Their failed_families entries in campaign_state.yaml carry the old\
    \ tag but are\n   superseded by this KB entry.\n2. A secondary signal layered\
    \ on the existing Keltner primary would not have fixed\n   the zero-trade problem\
    \ at its root — it would have added a new signal on top of\n   a null primary.\
    \ The campaign burned ~10 runs on this path.\n3. The vocabulary error (A5.2):\
    \ forecast_return_corr=0.2145 was recorded as\n   \"confirmed stable edge\" in\
    \ the campaign_review.yaml and propagated through\n   carryover. This correlation\
    \ was: (a) computed on regime-gated bars (~1% of all\n   bars), (b) never validated\
    \ per trade (per-trade expectancy was -26 bps), and\n   (c) a small-sample artifact\
    \ (per-window n_active=5-35, IC SE=0.18-0.58). The\n   KB's A5.2 rule makes this\
    \ unwritable going forward: signal_property field\n   carries the correlation;\
    \ outcome field carries no_edge_observed.\n"
  evidence_runs:
  - run_017
  - run_024
  - run_027
  - run_033
  - run_039
  evidence_count: 2
  applicable_rule: A8.2 closure; A5.2 vocabulary; A5.3 detector scope
- id: daily_signal_power_floor
  title: Daily-frequency signals need 2018+ data on BTC/ETH — 2-year window is systematically
    underpowered
  outcome: structural_floor_identified
  protocol_version: baseline_v2
  detector_version: not_applicable
  chain_narrative: 'H-041-A and H-041-C each independently produced insufficient_sample_inconclusive.
    Each run''s findings_carryover logged the individual power failure but the pattern
    was not generalized.

    '
  what_the_chain_missed: 'Any signal with daily-or-lower activation frequency (< ~50
    active bars/year) on BTC/ETH 1h over a 2-year window will produce n_eff < 15.
    At n_eff=15, the minimum detectable IC at p < 0.10 is ~0.42 — above the plausible
    IC range for all known behavioral and structural signal classes (literature: 0.05-0.20).
    This is a structural feature of the data window, not a signal-specific failure.
    A8.6 mandates this check at registration (a-priori power), making it deterministic
    arithmetic before any component is built.

    '
  implication: 'Any future daily-frequency hypothesis registered against 2024-2025
    data only should be immediately routed to insufficient_power_a_priori with a "extend
    to 2018+" note. The consolidated backward-extension pass (A8.6) will re-prescreen
    all power-parked hypotheses simultaneously rather than per-hypothesis.

    '
  evidence_runs:
  - run_041
  - run_042
  evidence_count: 2
operational:
