    \ to be implemented at the validation gate (hypothesis registration step). Formula:\n\
    \  expected_active_n = activation_rate × n_bars_in_window × n_symbols_effective\n\
    \  expected_n_eff = expected_active_n / block_size_24\n  min_detectable_ic = 1\
    \ / sqrt(max(expected_n_eff - 3, 1))\nFor market-wide signals: n_symbols_effective\
    \ ≈ 1 (correlated returns; additional symbols add sublinear power — use sqrt(n_symbols)\
    \ as upper bound). If min_detectable_ic > plausible_ic_upper (literature/prior),\
    \ route to insufficient_power_a_priori. No component built, no trial spent. Implement\
    \ when convenient; not a blocking item for current build steps.\n"
