# Feed Wishlist
# Aggregated, prioritized case for future feed integrations.
# Generated by hypothesis-design when a hypothesis requires a feed
# not in config/available_feeds.yaml.
#
# Format: each entry is one feed request. Entries accumulate across runs.
# Human reviews this file when planning the next infrastructure sprint.
#
# Schema per entry:
#   feed_name: string            — canonical name (matches available_feeds.yaml unavailable list)
#   evidence_type: string        — the evidence_type enum value this feed would satisfy
#   hypotheses_blocked: list     — hypothesis_ids (or descriptions) that could not enter the queue
#   priority_rationale: string   — why this feed would unlock material edge candidates
#   estimated_hypotheses_unblocked: int   — count of hypotheses currently on the wishlist for this feed
#   created_at: ISO date
#   last_updated: ISO date

version: "1.0"
created_at: "2026-07-03"

wishlist:
  - feed_name: liquidation_data
    evidence_type: liquidation_data
    hypotheses_blocked:
      - "H-041-B (volume-impulse continuation): volume_ratio × body_fraction proxy is
        mechanism-impure — activates equally on herding (→ continuation) and on
        liquidation cascades (→ mean-reversion). Without liquidation feed, the signal
        measures net effect of two competing mechanisms with opposite predictions. Cannot
        make an honest category assignment or directional claim without this feed."
    priority_rationale: >
      Liquidation_data would resolve the dominant ambiguity in all volume-based hypotheses
      on crypto perpetuals. High-volume bars are either: (a) organic consensus (herding →
      continuation), or (b) forced liquidations (structural_forced_flow → mean-reversion).
      These have opposite strategy implications. With liquidation data, volume-based
      hypotheses become mechanism-pure and testable. Without it, the signal direction is
      an empirical question with no a priori claim — a weaker hypothesis foundation.
      Additionally, liquidation data enables a new structural_forced_flow hypothesis
      class (liquidation-cascade mean-reversion) that does not depend on price/volume
      proxies at all.
    estimated_hypotheses_unblocked: 3
    created_at: "2026-07-03"
    last_updated: "2026-07-03"

