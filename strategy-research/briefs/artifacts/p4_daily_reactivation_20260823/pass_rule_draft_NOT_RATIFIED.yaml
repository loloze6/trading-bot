pass_rule:
  statement: >
    DRAFT / NOT EVALUABLE AS WRITTEN. Criteria (a) and (b) below are
    directly inheritable from protocols/ts_trend_daily_v1.json's own
    pre-registered promotion block (median_sharpe_gt: 0,
    max_abs_drawdown_pct_lt: 30) and are NOT tuned to any of runs 053/054/057's
    measured results -- both values were fixed in the protocol before any of
    those runs executed. Criterion (c), the sample-floor/evaluability gate
    tied to the operator's 2026-08-22 floor-5 ruling, could NOT be given an
    honest, a-priori-derived PASSABLE threshold: see
    honesty_notes.sample_floor_finding below and
    daily_neff_output.txt in this directory. This pass_rule is therefore
    published as evidence for the STOP recommendation, not as a rule ready
    for any run to be evaluated against.
  window_set_ref: protocols/ts_trend_daily_v1.json  # unmodified by this draft; symbol list would need editing to the 17-pair universe before any run -- NOT done here (out of scope: "do not run any backtest or campaign")
  honesty_notes:
    - id: i
      text: >
        Criteria (a)/(b) sources and pre-registration dates: (a)
        median_sharpe_gt: 0 and (b) max_abs_drawdown_pct_lt: 30 both appear at
        protocols/ts_trend_daily_v1.json:130-131, part of the original
        promotion block installed 2026-07-08, before run_054 (2026-07-09),
        run_057 (2026-07-11), or any density probe (2026-07-23/24) existed.
        Reusing them here is NOT re-deriving from those runs' measured
        outcomes; it is inheriting a pre-existing, dated, unmodified
        pre-registration.
    - id: ii
      text: >
        kill_median_sharpe_lt: -1 (ts_trend_daily_v1.json:133) is likewise
        inherited unmodified and is not encoded as a separate pass_rule
        criterion here; it is the protocol's own kill-branch threshold and
        would route to the FAIL-a branch's kill outcome the same as any other
        criterion-(a) failure once evaluated (median_sharpe <= 0 already
        fails (a); the -1 kill threshold is redundant with FAIL-a for a
        long-only signal and is not given a separate criterion id to avoid
        double-gating the same statistic).
    - id: sample_floor_finding
      text: >
        CRITERION (c) COULD NOT BE COMPLETED. Two SEPARATE power questions
        exist for this hypothesis and must not be conflated: (1) the
        pooled-all-bars block-bootstrap IC significance test
        (pre_registration.significance_methodology_for_single_magnitude_signals
        in ts_trend_daily_v1.json) -- ALREADY established adequately_powered
        in the KB (power_disposition.status, expected_n_eff: 117 for the
        original 2-symbol registration), unaffected by this finding, and if
        anything reinforced by pooling more (correlated) symbols; and (2) the
        per-window median_sharpe criterion (a)'s own reliability, which
        depends on how many window-symbol observations survive the A3.4
        floor-5 exclusion (config/campaign_config.yaml:141,
        tools/run_protocol.py's _SPARSE_TRADE_FLOOR=5) and how INDEPENDENT
        (correlation-discounted) those surviving observations actually are.
        (2) is what KB condition (d) and this package's Task 2 measure, and
        (2) is what criterion (c) below was supposed to gate. See
        compute_daily_neff.py / daily_neff_output.txt for the measurement and
        REACTIVATION_PACKAGE.md for the full derivation and sensitivity
        analysis. Bottom line: required n_eff >= 3.0 (derived from
        CLAUDE.fork.md's standing >=30-independent-episode Sharpe-quoting
        floor, divided by the brief's own conservative low-end expectation of
        10 transitions/symbol over the registered span -- both pre-existing,
        neither tuned to this measurement); measured n_eff = 1.694 (primary
        17-pair universe, pairwise-complete Pearson) / 1.692 (listwise
        cross-check) -- roughly 56% of what is required, and even the
        brief's own MIDPOINT estimate (17.5 transitions/symbol, required
        n_eff=1.71) is not cleared. Only the brief's own UPPER bound (25/symbol,
        required n_eff=1.20) would pass, and selecting that endpoint now,
        after measuring n_eff, is exactly the after-the-fact threshold
        selection this project's protocol forbids. No criterion (c) is
        written below with a numeric threshold for this reason.
  criteria:
    - id: a
      metric: median_sharpe
      metric_basis: bar_level
      comparator: '>'
      per_symbol_threshold: {}  # to be populated with the 17-pair primary universe symbols (Kraken ccxt-native tickers) if this rule is ever completed and registered -- NOT done here, no universe was launched
      null_handling: fails_threshold
      source: >
        Inherited verbatim from protocols/ts_trend_daily_v1.json:130
        (promotion.median_sharpe_gt: 0), pre-registered 2026-07-08, before
        any of runs 053/054/057 executed.
    - id: b
      metric: max_abs_drawdown_pct
      metric_basis: bar_level
      comparator: <
      per_symbol_threshold: {}  # same population note as criterion a
      null_handling: fails_threshold
      source: >
        Inherited verbatim from protocols/ts_trend_daily_v1.json:131
        (promotion.max_abs_drawdown_pct_lt: 30), pre-registered 2026-07-08.
    - id: c
      metric: NOT_AUTHORED
      status: BLOCKED -- see honesty_notes.sample_floor_finding
      source: >
        Would-be metric: below_floor_pct (trade_diagnostics_summary /
        hypothesis_verdict.diagnostics, pooled across the primary 17-symbol
        universe x 15 windows -- A3.4-native, tools/run_protocol.py:912-917)
        thresholded against a correlation-adjusted required sample. No
        a-priori-derivable passable threshold exists at the measured n_eff;
        see honesty_notes above. NOT wired into criteria evaluation.
  outcomes:
    - branch: PASS
      hypothesis_verdict: null  # not evaluable -- criterion c is unauthored
      lineage_routing: null
    - branch: FAIL-a
      hypothesis_verdict: kill
      lineage_routing: terminate
    - branch: FAIL-b
      hypothesis_verdict: kill
      lineage_routing: terminate
    - branch: FAIL-c
