hypothesis:
  primary: >
    H-041-C-v2: the ORIGINAL H-041-C Fear & Greed contrarian mechanism
    (extreme sentiment predicts contrarian mean-reversion), evaluated with
    explicit era-conditioning per the KB's own 2026-07-06 era-sign-flip
    finding. PASS-GATED evaluation is restricted to era_2018_pre_funding +
    era_2019_2023_full_feed (2018-01-01 to 2023-12-31, both symbols);
    era_2024_burned + era_2024_2025_walk_forward_extension (2024-01-01 to
    2025-12-31) are DIAGNOSTIC-ONLY and never gate the verdict. This is
    H-041-C's LAST registration: every FAIL branch terminates both the
    hypothesis and the lineage -- no refine, pivot, or escalate anywhere in
    this brief's pass_rule.

mechanism_construction:
  source_citation: >
    Signal construction and polarity copied VERBATIM from
    runs/run_042/artifacts/hypothesis_card.yaml's "signal_concept" (the
    original H-041-C registration). Component/feed shape mirrors
    runs/run_048/artifacts/candidate_strategy_config.json (the executed
    config for H-041-C's second, extended-data evidence run). NEITHER
    source, nor runs/run_052/artifacts/research_brief.yaml (the
    never-launched polarity-flip scaffold), shows any funding-rate
    involvement -- confirmed by direct read, 2026-07-15.
  signal_concept: >
    Signal fires ONLY at the daily boundary bar (UTC hour == 0) when the
    previous day's Fear & Greed index (alternative.me, +1 day A8.4
    alignment shift applied) is extreme:
      fear_greed < 25 -> forecast = +10.0 (contrarian long)
      fear_greed > 75 -> forecast = -10.0 (contrarian short)
      otherwise       -> forecast = 0.0 (inactive)
    ORIGINAL polarity, unchanged from run_042/run_048 -- explicitly NOT
    run_052's negated-polarity scaffold.
  component: FearGreedContrarianComponent
  params:
    fear_threshold: 25.0
    greed_threshold: 75.0
    scaling_factor: 10.0
  aux_feeds: [fear_greed]
  symbols: [BTCUSDT, ETHUSDT]
  timeframe: "1h"   # copied verbatim from hypothesis_card.yaml -- unambiguous, unchanged
  ungated: true     # no regime filter -- A2.3 standing policy, unchanged from original
  no_funding_involvement: >
    Confirmed absent from every real H-041-C artifact (run_042, run_048,
    run_052) and from config/campaign_data_policy.yaml's own era note.
    Funding rate belongs exclusively to the independent, separately
    exhausted H-041-A mechanism (see lineage.predecessor_kb_entries above).

gate_definition:
  # No strategy-internal ENTRY gate exists in this design (unlike
  # P4_ts_trend's ER(20) gate, the precedent brief's own gate_definition).
  # "Gating" in H-041-C-v2 operates at the EVALUATION layer (which eras
  # count toward pass/fail), not as a signal-level transform. Stated here
  # explicitly to satisfy the refinement-brief schema's required key
  # without implying a P4_ts_trend-style entry filter exists.
  indicator: none
  application: >
    No entry-conditional gate on the signal itself. All "gating" in this
    brief refers to which walk-forward windows the pass_rule's criteria are
    computed over (see era_conditioning and evaluation below) -- a
    window/evaluation scoping decision, not a signal transform.
  frozen: true

era_conditioning:
  boundary_source: >
    config/campaign_data_policy.yaml's `eras` block, dates quoted verbatim
    (frozen, not invented for this brief). Era names/framing are also
    already used, in substance, in runs/run_052/artifacts/research_brief.yaml
    (the diagnostic run that surfaced the sign-flip finding this brief
    responds to).
  pass_gated_eras:
    - era_id: era_2018_pre_funding
      range: ["2018-01-01", "2019-09-09"]
      note: >
        campaign_data_policy.yaml, verbatim: "funding_rate does not exist
        yet (pre-Binance-perpetual-futures); H-041-A cannot be tested in
        this era, H-041-C can." Fully pass-gated, NO per-symbol
        funding-start carve-out -- funding is not part of this mechanism at
        all, so per-symbol funding-availability dates (relevant only to
        H-041-A) do not apply to this brief's window construction. Amended
        design ruling, 2026-07-15 (corrects an earlier drafting error).
    - era_id: era_2019_2023_full_feed
      range: ["2019-09-10", "2023-12-31"]
  diagnostic_only_eras_never_gated:
    eras:
      - era_id: era_2024_burned
        range: ["2024-01-01", "2024-11-30"]
      - era_id: era_2024_2025_walk_forward_extension
        range: ["2024-12-01", "2025-12-31"]
    justification: >
      campaign_knowledge_base.yaml, fear_greed_contrarian_inconclusive,
      quoted verbatim: "Sign is negative throughout 2018-2023 (BTC -0.058
      to -0.073, ETH -0.071 to -0.135) and positive throughout 2024-2025
      (BTC +0.101 to +0.182, ETH +0.094 to +0.163) -- consistent across
      both symbols and all 8 era-symbol pairs." These are the exact eras
      whose divergence MOTIVATED this registration; they cannot also serve
      as pass/fail evidence for a hypothesis that exists specifically
      because of their disagreement with the earlier eras. Reported for
      continuity/context only -- never gating.
  holdout_untouched:
    era_id: era_2026_holdout
    range: ["2026-01-01", "2026-06-30"]
    note: >
      Matches config/campaign_data_policy.yaml's holdout_range exactly.
      Standard single-use promotion gate only -- no special treatment for
      this hypothesis.
  mechanical_implementation_note: >
    tools/verdict_criteria_evaluator.py's per-symbol metric lookup
    (per_symbol_summary[symbol][metric]) is POOLED over whichever windows
    the protocol_ref'd protocol file itself contains -- confirmed by reading
    tools/run_protocol.py and tools/verdict_criteria_evaluator.py; the
    B11/C7 pass_rule schema has no per-era scoping field. Therefore
    protocols/h041c_v2_backext.json's own `windows` array contains ONLY the
    two pass-gated eras (71 monthly sub-windows, 2018-02 through 2023-12)
    -- this is how "evaluated over the PASS-GATED windows only" is made
    mechanically true, not via a schema field.
    EXPLICIT NON-PROMISE (2026-07-15 pre-launch audit F1 correction): the
    2024-burned and 2024-2025-walk-forward-extension diagnostic-only eras
    are NOT computed, reported, or otherwise touched by this run in any
    automatic way -- there is no wired mechanism in this campaign's
    tooling that produces a per-era stratified breakdown for THIS
    protocol/brief pair on its own. The earlier draft's claim that this
    reporting is "expected via the SAME episode-blocked era-stratified
    significance methodology (A8.5.1a) already used ... in run_048/run_052"
    overstated what exists: that reporting was produced by THOSE runs'
    OWN pipeline stages for THEIR OWN protocol/window set, not by anything
    this brief or protocol triggers for the 2024-25 eras. If 2024-25
    era diagnostics are wanted, the operator must explicitly ORDER a
    separate, manual, post-verdict A8.5.1a-style analysis after this run
