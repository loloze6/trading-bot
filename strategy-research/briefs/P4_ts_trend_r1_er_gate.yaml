brief_id: P4_ts_trend_r1_er_gate
lineage:
  parent_queue_entry: P4_ts_trend
  parent_run: run_054
  relation: refine            # in-lineage refinement: appended to the parent
  parent_verdict: refine_pending_regime_gating   # entry's run_ids; NOT a new
source: user_delivered                            # registration or reactivation
status: ready

motivating_observation: >
  fragment_patterns.yaml (writer: tools/fragment_patterns.py), run_054
  duration table: long-hold fragments 65.6% WR / +14,557 net vs short- and
  medium-duration fragments net-negative. Per TIMEFRAME_CHANGE_PLAYBOOK
  section 7 three-role model, this observation MOTIVATES the gate hypothesis
  only — it is not evidence, not a tuning input, and confirms nothing. No
  parameter below was chosen by reference to it or to any run_054 per-window
  or per-trade artifact.

hypothesis:
  primary: >
    H-P4-r1: Gating SMA(100) long-only daily entries on Kaufman Efficiency
    Ratio ER(20) >= 0.30 at signal time removes negative-expectancy whipsaw
    entries, such that the gated strategy's bar-level median Sharpe is >=
    the ungated run_054 baseline on BOTH symbols, while per-episode
    expectancy of taken entries remains positive.
  secondaries:   # descriptive/supporting only; CANNOT flip the primary verdict
    - S1_robustness: same gate at ER(10) >= 0.30 (Kaufman's original
        lookback). Reported alongside; directional agreement expected, not
        required.
    - S2_mechanism_localization: entries EXCLUDED by the primary gate have
        per-episode expectancy <= 0. The mechanism's own prediction about
        where the drag lives; failure weakens the whipsaw story even if the
        primary passes, and is written back as such.
  mechanism_claim_discipline: >
    Whichever way this resolves, the KB writeback describes gated-variant
    performance only. It does NOT assert "chop regime confirmed/refuted" —
    ER(20) here is a strategy-internal entry filter with frozen parameters,
    not a validated regime detector (Step-02 gate never run on it). Regime
    attribution stays off-limits until a detector clears the 02 gate.

gate_definition:
  indicator: kaufman_efficiency_ratio
  formula: "ER_t(n) = abs(close_t - close_{t-n}) / sum_{i=t-n+1..t} abs(close_i - close_{i-1})"
  lookback_n: 20            # primary; a-priori, convention-based
  threshold: 0.30           # a-priori, convention-based; >= passes
  computable_at: >
    bar close t, closes up to and including t only (no lookahead). ER is
    computed on the SAME warmed-up price series the SMA(100) uses (warmup
    bars prepended before the 181-bar eval span, per the run_054 protocol),
    so the gate is defined from the first eval bar of every window — no
    undefined-gate bars, no improvised early-window rule.
  application: >
    Entry-only. An SMA(100) cross-up signal at close t is TAKEN iff
    ER_t(20) >= 0.30, else skipped entirely (no deferred entry). Exits are
    the unchanged parent rule (cross-down); in-position ER changes have no
    effect.
  parameter_rationale: >
    n=20 ~ one trading month of daily bars, within the lookback range of
    Kaufman's published ER usage (KAMA standard n=10 is covered by S1);
    0.30 is the conventional trending-vs-choppy cutoff in the ER
    literature. Chosen without inspection of run_054 per-window or
    per-trade artifacts.
  frozen: true              # no retune, no sweep, no post-hoc threshold moves

inherited_unchanged_from_parent:
  strategy_config_ref: runs/run_054/artifacts/candidate_strategy_config.json
  strategy_config_copy_in: runs/run_054/artifacts/backtest_spec.yaml (config:)
  component: SmaTrendLongOnlyComponent
  symbols: [BTCUSDT, ETHUSDT]
  timeframe: 1d
  lookback_L: 100           # SMA(100)
  scaling_factor: 10.0
  execution_convention: >
    Verbatim from parent research_brief.yaml constraints: "Execution:
    next-day open after signal change. Engine caveat: this backtester fills
    at bar close, not next-bar open -- see
    strategies/strategy_components.py::SmaTrendLongOnlyComponent's docstring
    for the one-bar-lag approximation actually used; not identical to true
    next-open execution." The gate inherits this unchanged: ER_t(20) gates
    the same signal the engine acts on with its existing one-bar lag. The
    ONLY delta in this refinement is the entry gate.
  cost_model: config/cost_model.yaml, taker
  window_set: >
    protocols/ts_trend_daily_v1.json — 15 explicit semi-annual windows per
    symbol ("2018-04" .. "2025-04"), ~181-bar eval spans (observed 180-182
    rows), 30 window-symbol results total. NOT validation_protocol.yaml's
    12x21x5 figures, which are a superseded pre-2026-07-08 design draft
    (see deferred_fixes below). Last window ends 2025-09-28; holdout
    2026-H1 untouched.

evaluation:
  metric_basis: >
    Bar-level ONLY for Sharpe: each window's bars.csv total_portfolio_value,
    full window span including flat bars, pct_change(), sqrt(365)
    annualization — per the run_054 metric-basis correction and INCIDENT.md
    arbitration. Fragment-level (trades.json) Sharpe is inadmissible for
    the verdict.
  baseline_comparators:     # re-confirmed by independent recomputation 2026-07-10
    ungated_median_sharpe_btc: 0.5791   # n=15 windows
    ungated_median_sharpe_eth: 0.0318   # n=15 windows
  pass_rule: >
    PASS (-> refine/promote routing per verdict-interpreter) iff:
    (a) gated bar-level median Sharpe >= 0.5791 (BTCUSDT) AND >= 0.0318
        (ETHUSDT), computed over the same 15-window sets; and
    (b) per-episode expectancy of taken entries > 0 (sign plus
        expectancy +/- SE; no t-stat bar, pre-registered as such because
        the gated subset has strictly fewer trades); and
    (c) A3.4 sparse rule: any window whose gated episode count falls below
        the trade floor contributes null Sharpe, and expectancy +/- SE is
        primary for the aggregate judgment.
    FAIL on (a) or (b) -> the gate did not rescue the edge; verdict routing
    decides kill vs pivot; no threshold adjustment permitted within this
    brief.
  multiplicity: one primary endpoint; S1/S2 reported, never verdict-bearing.
  trial_recording: >
    Every data contact (prescreen ER computation included) is a recorded
    trial, deduplicated by forecast-series hash, per standing rule 2.

pre_registration:
  registered_before_data_contact: true
  no_parameter_may_change_after_first_artifact: true
  disputed_verdicts_arbitrated_by: >
    recomputation from immutable raw artifacts (bars.csv, trades.json) only
    — never by narrative or recency.

