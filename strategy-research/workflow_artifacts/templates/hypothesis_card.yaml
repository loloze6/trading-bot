# The four-step hypothesis card (D-190): 0 Mode, 1 Idea, 2 Statement, 3 Proof.
# The skill (hypothesis-design/SKILL.md, "The card") says what each field holds.
hypothesis_id: "H-XXX"
thesis: "<opens with the brief's research_goal, word for word>"

# Step 1 -- the idea: the operator's words first, then the formula, computable from the brief's feeds
idea_quantities:
  - words: "<the quantity in the operator's words>"
    formula: "<its formula>"
not_expressible:
  - "<a part of the idea a forecast cannot express: an exit, a hold, position state>"

edge_source:
  category: "<information_asymmetry | structural_forced_flow | liquidity_provision | cross_venue_dislocation | persistent_behavioral_bias>"
  specific_mechanism: "<1-2 sentences naming the causal chain AND a measurable proxy in an available feed>"
  why_not_arbitraged: "<why this edge persists despite being exploitable>"
  evidence_type: "<price_volume_only | funding_open_interest | fear_and_greed | order_book | liquidation_data | cross_exchange | on_chain | options_flow | other_external>"
  measurable_proxy: "<the specific observable from an available feed that differs if mechanism is real vs absent>"
  # requires_new_feed: "<feed_name>"  # uncomment and set if evidence_type is not in available_feeds.yaml

library_lookup:
  indicator_id: null              # id from config/indicator_library.yaml, null if none
  regime_affinity_for_target: null  # favorable | unfavorable | neutral (null if indicator_id is null)
  crowding_risk: null             # low | medium | high (null if indicator_id is null)

target_market: "<symbol; plus the regime condition if the idea has one>"
timeframe: "1h"

# Step 2 -- the statement, then the criterion picked from it (2b)
statement:
  predicts: "<what the forecast predicts>"
  horizon_bars: 1                 # bars of `timeframe` ahead, an integer of 1 or more
  condition: "<when the statement applies>"
  if_pass: "<what a pass would mean for the idea>"
  if_fail: "<what a fail would mean for the idea>"
criteria:                         # only when config/criterion_menu.yaml is among the inputs
  - id: "<menu id>"
criteria_rationale: "<what the statement predicts, at which horizon, hence which measure>"
