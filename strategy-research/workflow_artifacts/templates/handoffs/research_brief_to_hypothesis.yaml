run_id: "template"
from_stage: "init"
to_stage: "hypothesis_generation"
objective: "Translate the research brief into a hypothesis card: the idea in the operator's words and in formulas, its statement, and the proof of the statement."
primary_input_artifact: "artifacts/research_brief.yaml"
required_inputs:
  - path: "artifacts/research_brief.yaml"
    reason: "Contains the base requirements, market universe, constraints, and research goal."
  - path: "../../config/indicator_library.yaml"
    reason: "The indicator library: the entries the card's library_lookup.indicator_id can name, with their regime_affinity and crowding_risk."
optional_inputs:
  - path: "artifacts/run_context.yaml"
    reason: "Present on instrument escalation runs. Overrides the asset field in research_brief.yaml. If present, all hypothesis artifacts must target run_context.target_symbol and run_context.target_timeframe — not the asset listed in research_brief.yaml."
constraints:
  - "Must not propose ideas that require replacing the whole existing bot architecture."
  - "Do not write code."
  - "Keep the mechanism explicit and interpretable."
  - "A1.3 anti-confabulation: specific_mechanism must name a measurable proxy in an available feed."
deliverables:
  - "hypothesis_card.yaml"
assigned_engine: "claude"
