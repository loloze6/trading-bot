run_id: "template"
from_stage: "hypothesis_generation"
to_stage: "innovation_expansion"
objective: "Expand the base hypothesis into novel, testable variants."
primary_input_artifact: "artifacts/hypothesis_card.yaml"
required_inputs:
  - path: "artifacts/research_brief.yaml"
    reason: "Ensures variants respect the architectural constraints."
  - path: "artifacts/hypothesis_card.yaml"
    reason: "The base hypothesis to expand. Inherits edge_source block — all variants must preserve or refine the declared mechanism."
  - path: "../../config/indicator_library.yaml"
    reason: "The indicator library: each variant's category and data_requirements, read for the innovation_notes diversity_audit."
optional_inputs:
  - path: "artifacts/refinement_notes.yaml"
    reason: "CRITICAL: If this exists, you are in a refinement loop. You MUST apply these fixes to the rejected variants."
injected_context: {}
constraints:
  - "If modifying an existing variant based on refinement notes, state explicitly how the blocker was resolved."
deliverables:
  - "expanded_hypothesis_card.yaml"
  - "innovation_notes.yaml"
assigned_engine: "claude"
