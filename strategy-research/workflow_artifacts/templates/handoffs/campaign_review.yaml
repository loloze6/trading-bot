handoff_version: 1
run_id: "PLACEHOLDER"
from_stage: verdict_interpreter
to_stage: campaign_review
assigned_engine: claude
objective: >
  Step back from per-run decisions and assess the full campaign. Detect patterns across
  all runs that indicate whether to continue, reframe, escalate, or terminate.
primary_input_artifact: ../../campaign_state.yaml
required_inputs:
  - path: ../../campaign_state.yaml
    reason: full history of all runs, families tried, diagnostics across all iterations
  - path: artifacts/research_brief.yaml
    reason: the original research question to compare against current search direction
  - path: ../../campaign_knowledge_base.yaml
    reason: >
      A5.1-5.3: durable KB of all tested mechanisms, power-parked hypotheses, and
      bans (exhausted_mechanisms, D-055). Must be read before any continue/reframe/terminate decision.
      Required to answer the three KB questions below.
deliverables:
  - campaign_review.yaml
constraints:
  - Do not recommend terminate with fewer than 3 instruments tried AND 1 component built.
  - Cite specific diagnostic values from diagnostics_log, not general impressions.
  - If recommendation is reframe, next_research_question must be a complete research_brief.
  - >
    KB GATE — before any recommendation, answer these three questions using
    campaign_knowledge_base.yaml (answers must appear in campaign_review.yaml):
    (1) UNTESTED CELLS: Which mechanism × venue × timeframe cells in coverage_matrix
        have not been tested and are worth trying? List them.
    (2) BANNED CELLS: Which entries are in exhausted_mechanisms? Exact match only:
    a listed ban blocks ONLY re-proposing the same hypothesis id, or the same mechanism
    with the same config (same component classes, parameters, timeframe and symbols as
    the ban's evidence_runs). A different config of that mechanism is allowed; say what
    differs. Every other KB finding (exhausted: true or not) is information, never a ban (D-055).
    (3) COMBINATION CANDIDATES: Are any power-parked findings (outcome=inconclusive)
        combinable — e.g., two signals whose joint activation rate meets the power floor?
        List any credible combinations.
stop_conditions:
  - All reasonable options exhausted → recommendation: terminate with full evidence.
