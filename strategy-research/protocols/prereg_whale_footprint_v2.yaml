    - >
      (4) days_to_fire is re-derived and the ATTESTATION FRACTION IT USES IS
      CORRECTED FROM A UNIT ERROR. v2 computed days-to-fire as
      `bars / (24 * 0.99939)`, where 0.99939 is the journal's TIME-coverage
