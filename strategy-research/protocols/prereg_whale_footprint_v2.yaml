    attested_equivalent_days: 311.83  # 7484 / 24
    attestation_fraction_used: 0.99939  # dispatch W9 step 2, steady-state EXCLUDING the diagnosed 4h06m no_attestation hole
    attestation_fraction_source: >
      python -m recorder.coverage_report --start 2026-07-27T13:43:04.595471Z
      against the live journal, dispatch W9 step 2: elapsed 44471.45s,
      captured 29660.20s (66.695% raw, includes the hole), one
      no_attestation gap of 14793.07s (2026-07-27T16:42:20.055Z ..
      20:48:53.121Z, matching the ~4h06m 16:42-20:48Z hole this dispatch was
      asked to confirm is now surfaced — it is). Steady-state excluding that
      gap: 29660.20 / (44471.45 - 14793.07) = 99.939%.
    required_raw_calendar_days: 312.02  # 311.83 / 0.99939
    required_raw_calendar_years: 0.854
    comparison_to_v1: >
      v1 (uncorrected 7.8% attestation): ~3998 raw days (~10.95 years).
      v2 context figure (corrected 99.939% steady-state): ~312 raw days
      (~0.85 years). The coverage-report fix alone is a ~12.8x improvement
      in this number — but it does not change economic_ic_threshold's
      verdict, which is what actually governs v2.

# ---------------------------------------------------------------------------
# (f) SINGLE-USE (unchanged discipline from v1; this is a NEW, separate
# single-use instance for v2 — v1's own single-use is untouched and remains
# separately unconsumed)
# ---------------------------------------------------------------------------
single_use:
  fires_exactly_once: true
  consumption_recorded_on_execution: true
  consumption_field: consumed_by  # harness stamps {hypothesis_id, run_id, timestamp} here on first execution
  consumed_by: null  # unconsumed as of registration
  discipline: >
    Same discipline as v1 and as holdout_range (campaign_data_policy.yaml):
    repeated peeking as attested-bar data accumulates toward the gate is the
    exact failure mode this exists to prevent. The harness must refuse a
    second execution against a `consumed_by` that is already populated.
    NOTE: with economic_ic_threshold blocking first, this single-use mark
    will not be consumed by any execution while that gate remains true — a
    BLOCKED_ECONOMIC_INFEASIBILITY result does not stamp consumption, same
    as every other blocked-gate status.

# ---------------------------------------------------------------------------
# (g) TOTAL verdict mapping — no "routing decides" (unchanged from v1)
# ---------------------------------------------------------------------------
verdict:
  mapping:
    PASS: >
      Pooled Spearman IC for at least one of the 3 features clears
      alpha_corrected=0.0125 (two-sided) AND sign_consistency holds for that
      feature (see below). NOTE: per economic_ic_threshold above, a PASS
      under this statistical mapping alone would still not be economically
      actionable at the registered bar frequency unless a future amendment
      changes that finding — this mapping is unchanged from v1 because it
      answers the STATISTICAL hypothesis (a), not the economic question,
      which is now a separate, earlier gate.
    UNSTABLE: >
      Pooled Spearman IC for at least one feature clears alpha_corrected AND
      sign_consistency FAILS for every feature that cleared magnitude.
    # QUOTED DELIBERATELY. Bare `NULL:` is the YAML 1.1 null literal, so this
    # key parsed as Python `None` and the branch was not addressable by name --
    # `mapping["NULL"]` raised KeyError against v1 and v2 alike. Latent rather
    # than harmful (whale_footprint_evaluation.py derives the trichotomy in code
    # and never reads this mapping), but a registered branch nobody can look up
    # is not registered in any useful sense. Found by W11 step 5; no threshold or
    # wording is changed by the quoting itself.
    "NULL": >
      No feature's pooled Spearman IC clears alpha_corrected (0.0125,
      two-sided) against bar_forward_return, at bar_seconds=3600, on the
      attested panel, with the frozen feature parameters in (c).
      THRESHOLD UNCHANGED BY W11 — the condition above is exactly what v1 and v2
      registered. What W11 adds is `null_scope` below, which states what this
      outcome licenses. The wording change is a restriction on interpretation,
      not on the test.
  # -------------------------------------------------------------------------
  # W11 step 5: NULL was reading as a general no-edge result. It is not one.
  # Nothing below moves a threshold; this section constrains what may be
  # CONCLUDED from the outcome, which was previously left to the reader.
  # -------------------------------------------------------------------------
  null_scope:
    what_null_means: >
      EXACTLY THIS: no effect was detected at or above the registered
      magnitude, at the registered bar frequency, under the registered
      aggregation. Spelled out, a NULL result says the pooled Spearman rank
      correlation between each of the three frozen features and the SAME bar's
      forward 1-bar return, computed on 1h bars over the attested capture, did
      not clear alpha_corrected = 0.0125 two-sided after Bonferroni correction
      across the family of 4.
      It is a bounded negative result about ONE point in a parameter space, not
      a statement about the whale-footprint idea.
    it_is_not_a_statement_that: >
      - the features carry no information (an IC below the detection threshold
        is not an IC of zero — the panel is powered to 0.1445 at 80%, so a true
        IC of, say, 0.05 would produce NULL the large majority of the time);
      - the features are useless at other bar frequencies. bar_seconds=3600 was
        chosen for CONSUMER CONVENIENCE (the pipeline's bar) and for feature (a)
        being non-degenerate there — see design_provenance.bar_seconds_choice.
        It was never argued to be the frequency at which order-flow information
        is strongest, and microstructure signals are conventionally faster;
      - the features are useless at other horizons. The target is the bar's OWN
        forward 1-bar return. Nothing here tests 4h, daily, or multi-bar
        forward returns;
      - the features are useless under other aggregations. LTI is a per-bar
        ratio and CVD a per-bar delta; sums, EWMAs, cross-sectional ranks and
        z-scores of these columns are different signals and are untested;
      - the features are useless as inputs to a composite. The test is
        univariate per feature plus one pooled combination. A feature with no
        standalone IC can still carry weight in a multi-signal forecast (e.g. as
        a conditioner or a regime input), and this registration says nothing
        about that;
      - the family should be closed.
    what_null_routes_to: >
      Route: PARK the univariate 1h formulation, RETAIN the instrument.
      Concretely — (1) the three features and the recorder that produces them
      stay built and stay running; nothing is deleted or reverted on a NULL.
      (2) The 1h univariate own-bar-forward-return formulation is marked tested
      and closed, and MUST NOT be re-run under this registration (single_use).
      (3) The feature family returns to the hypothesis queue as a candidate for
      a NEW pre-registration at a different frequency, horizon, aggregation, or
      as a composite input — each of which requires its own registration, its
      own power derivation, and its own single-use mark. A NULL here is evidence
      to be weighed when prioritising that queue, not a bar to entering it.
    what_null_does_not_authorize: >
      - re-running this same test on more data, at a different alpha, or with
        any feature parameter in (c) changed. That is what single_use forbids
        and it is the failure mode the whole registration exists to prevent;
      - closing, deleting, or de-scoping the whale-footprint family, the
        recorder, or the reserved capture;
      - declaring order-flow / microstructure features generally unpromising for
        this campaign;
      - treating "we tested whale features and got nothing" as a citable prior
        in any later artifact without the frequency, horizon and aggregation
        qualifiers stated alongside it. A NULL quoted without its scope becomes
        a general claim within about two hops of reuse, and this campaign has
        already had one number (sigma 15.0) travel that way into a terminal
        verdict.
    symmetry_note: >
      This section constrains the NEGATIVE outcome only because that is the one
      that was under-specified. PASS is already tightly bounded — it asserts a
      statistical relationship at this frequency and, per
      economic_ic_threshold, does NOT by itself assert tradeability.
  sign_consistency:
    definition: >
      Unchanged from v1. For a given feature, compute the per-pair Spearman
      IC across all 19 pairs (using only pairs with >= 30 attested bars).
      sign_consistency HOLDS if at least 80% of those per-pair ICs share the
      same sign as the pooled IC.
  exhaustiveness: >
    Every reachable outcome once single-use, economic feasibility, the
    minimum-N gate and the coverage floor all pass is exactly one of {PASS,
    UNSTABLE, NULL}. There is no fourth outcome and no discretionary routing
    step. (economic_ic_threshold currently makes this branch unreachable —
    see gate_rule above.)

# ---------------------------------------------------------------------------
# (h) REQUIRED-COVERAGE FLOOR — recomputed from step 2's measured
# steady-state attestation (dispatch W9 step 5)
# ---------------------------------------------------------------------------
required_coverage_floor:
  metric: attested_bar_fraction
  floor: 0.80
  derivation: >
    v1's floor (0.05) was set below a WRONG measurement (0.078, from a tool
    that could not detect a gap with no closing record). The corrected
    steady-state attestation (dispatch W9 step 2, coverage-report fix
    applied) is ~99.939% excluding the one diagnosed ~4h06m hole. Setting
    the floor at 0.80 keeps the same PURPOSE v1 stated (catch a REGRESSION,
    not relitigate whether the current level is "enough" — that is what
    economic_ic_threshold and minimum_n_gate do) while now being wide enough
    to trip on a real operational failure (e.g. the sleep-related hole
    recurring, or a comparable new one) well before it silently erodes weeks
    of capture, rather than sitting so low (0.05) it could never catch
    anything short of near-total data loss. `whale_attested` is itself
    directly derived from journal.coverage_intervals (whale_features.py:
    "attested = not any(g.start < bar_end and g.end > bar_start for g in
    gaps)"), so this floor inherits the dispatch W9 step-1 fix automatically
    — a future no_attestation-caused hole is now visible to this metric,
    where before the coverage bug would have hidden it here too.
  gate_rule: >
    Unchanged mechanism from v1: the harness refuses to execute (returns
    BLOCKED_COVERAGE_FLOOR) if the pooled attested-bar fraction across the
    19 pairs is below 0.80 at evaluation time. Checked after single-use and
    economic feasibility, before minimum-N (see whale_footprint_evaluation.py
    module docstring).
  w11_status: >
    THIS GATE IS CURRENTLY BLOCKING, AND IT IS THE BINDING CONSTRAINT ON THE
    WHOLE REGISTRATION. Measured attested_bar_fraction is 0.4178 over the
    capture so far and 0.5455 restricted to post-hole steady state, against a
    floor of 0.80 (tools/recorder/whale_persistence.py, artifact
    results/w11/whale_persistence_20260728T070340Z.txt). The harness would
    return BLOCKED_COVERAGE_FLOOR today and would keep doing so however many
    bars accumulate, because the shortfall is a RATE, not a backlog.
    CAUSE. Not the diagnosed 4h06m process-freeze hole, which is a one-off and
    is excluded from the 0.5455 figure. The cause is ordinary reconnect churn:
    six ws_disconnects (code 1006, 2-6 seconds each) in the ~10.2h since the
    hole closed. Each costs a WHOLE 1h bar, because a bar is unattested if any
    gap of any length touches it. Six seconds of dead air per hour is 0.17% of
    the time and 100% of that hour's bar. At ~0.59 disconnects/hour the expected
    attested-bar fraction is e^-0.59 ~ 0.55, which is what is observed — so this
    is a stable rate, not a transient.
    WHY THE FLOOR IS NOT LOWERED. Lowering it to ~0.50 would let the evaluation
    proceed and would be the wrong repair twice over. First, the floor's stated
    purpose is to catch a regression before it silently erodes weeks of capture,
    and this IS that regression — moving the line to wherever the metric happens
    to sit is how a tripped alarm gets turned into a new normal. Second, and
    more concretely, the same interruption rate that fails this floor is what
    makes avg_holding_bars unmeasurable (attested runs of at most 2 bars, see
    avg_holding_bars_primary.w11_measurement_attempt), so accepting the low
    coverage would not buy a clean evaluation — it would buy an evaluation whose
    economic threshold is still set by a borrowed constant.
    WHAT WOULD FIX IT. Reconnect handling in tools/recorder/record_kraken_ws.py, not
    more capture time and not a threshold change. The target is <= 0.0345
    interruptions per bar (one per ~29 hours) to also clear the censoring
    problem; anything at or below ~0.22/bar clears this floor alone. This is an
    operator decision and is deliberately left open by W11 — see the dispatch
    hand-off in SESSION_LOG.md. NO GATE WAS RELAXED TO ROUTE AROUND IT.

# ---------------------------------------------------------------------------
# W14 STATUS ADDENDUM (2026-07-28) — informational only. NO VALUE IN THIS FILE
# CHANGED. Records a second, downstream blocker discovered outside this file
# and states the registered resolution for both, so neither reads as an
# invitation to relax a gate.
# ---------------------------------------------------------------------------
w14_status_addendum:
  made_before_any_evaluation: true
  no_value_in_this_file_changed: true
  two_blockers:
    a_this_files_own_test_is_blocked: >
      required_coverage_floor.w11_status (above) already documents this in
      full; restated here only so it sits next to (b). Measured
      attested_bar_fraction is 0.4178 (whole capture) / 0.5455 (post-hole
      steady state) against the registered floor of 0.80 — the harness
      returns BLOCKED_COVERAGE_FLOOR today and will keep doing so at any
      sample size, because the shortfall is a RATE (reconnect churn), not a
      backlog.
    b_a_downstream_component_is_also_blocked_by_the_same_cause: >
      Dispatch W13 built WhaleLargeTradeImbalanceComponent
      (trading-bot/strategies/strategy_components.py) as a SEPARATE,
      sustained-subset hypothesis test — NOT a re-routing of THIS
      pre-registration's univariate test. Dispatch W14 (director ruling, R4)
      explicitly REJECTED routing this file's evaluation through that
      component's forecast: the pre-registration's hypothesis is univariate
      on the raw feature column, the component's forecast is conditioned on a
      3-bar sustained subset of it, and those are different hypotheses. This
      file's gates, thresholds, and required-IC derivation are UNCHANGED and
      UNAFFECTED by the component's existence. It is recorded here only
      because that component requires persistence_bars=3 consecutive
      fully-attested bars to ever produce a non-NaN forecast, and W11's own
      measurement (avg_holding_bars_primary.w11_measurement_attempt, above)
      already shows attested bars arriving in runs of AT MOST 2 — so it
      cannot fire on the current capture either, for the identical reason (a)
      is blocked.
  shared_root_cause: >
    Both blockers trace to the same measured fact: ~6 ws_disconnects per 10
    hours since the diagnosed process-freeze hole closed, each destroying a
    whole 1h bar's attestation regardless of the disconnect's own duration (a
    bar is unattested if ANY gap touches it — see
    minimum_n_gate.days_to_fire_derivation and
    required_coverage_floor.w11_status above).
  registered_fix: >
    HOST MIGRATION — moving the recorder off its current host/network — NOT
    threshold relaxation. Explicitly NOT an acceptable response to either
    blocker: lowering required_coverage_floor below 0.80, lowering
    minimum_n_gate.required_attested_bars_per_pair below its W11-derived
    value, or lowering WhaleLargeTradeImbalanceComponent's persistence_bars
    below 3. Any of those would fit a gate to the capture's defects instead of
    fixing the defect — the exact failure mode required_coverage_floor.
    w11_status already declined for blocker (a) alone; this addendum extends
    the same refusal to blocker (b). NO LATER SESSION SHOULD READ EITHER
    BLOCKED GATE AS AN INVITATION TO LOWER IT.

# ---------------------------------------------------------------------------
# Design provenance — data-dependent choices that are NOT this hypothesis test
