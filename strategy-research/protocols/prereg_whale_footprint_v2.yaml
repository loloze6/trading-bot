    "270": {n_eff: 10724.4, mde_ic: 0.0322}
    "365": {n_eff: 14497.8, mde_ic: 0.0277}
    "545": {n_eff: 21647.4, mde_ic: 0.0227}
    "730": {n_eff: 28995.6, mde_ic: 0.0196}
  target_detectable_ic: 0.1445  # W11; == economic_ic_threshold.required_ic_at_registered_frequency
  superseded_target_detectable_ic: [0.2507, 2.4667]  # W10 value; W9 value (void)
  w11_coupling_note: >
    STATED BECAUSE IT IS COUNTER-INTUITIVE AND WILL OTHERWISE BE MISREAD AS A
    RELAXATION. v2's design sets this gate's target IC EQUAL to the economic
    required IC, so a single input change moves the two gates in OPPOSITE
    directions. A lower required IC (economically easier) is a smaller effect to
    detect (statistically harder, more bars). W11's sigma correction lowers the
    required IC from 0.2507 to 0.1445 and therefore RAISES the sample
    requirement from 105 to 321 attested bars per pair — a 3.06x increase. The
    economic gate is not weakened by this (0.1445 was always going to pass a
    < 1.0 test) and the sample gate is strictly tightened. Nothing here is a
    relaxation in either direction.
    The coupling itself is registered v2 design and W11 does NOT change it, but
    it is worth flagging for a future revision: tying "what edge is worth
    trading" to "what edge we have the data to see" means any improvement in the
    cost estimate is automatically paid for in capture time, which is a real
    design property and not obviously the intended one.
  target_detectable_ic_derivation: >
    v1 used a JUDGMENT CALL (0.03, "not derived from any observed effect").
    v2 uses the economic_ic_threshold derivation above instead — the IC a
    strategy trading these features AT their registered bar frequency would
    actually need to clear costs, not a statistically-modest-sounding
    magnitude chosen by convention. W10 keeps that PRINCIPLE unchanged and
    corrects only the two inputs the derivation was fed (sigma_bar_bps and
    avg_holding_bars); 2.4667 -> 0.2507.
  required_attested_bars_per_pair: 321   # W11; was 105 (W10), null before that
  superseded_required_attested_bars_per_pair: 105
  required_n_eff: 531.26   # = 321 * 1.655
  required_n_derivation: >
    W11. Inverting the mde_formula at target_detectable_ic = 0.1445:
    artanh(0.1445) = 0.145519; n_eff - 3 = (3.3393 / 0.145519)^2 = 526.59;
    n_eff = 529.59. Converting to attested bars per pair via
    n_eff = bars_per_pair * n_eff_symbols(1.655): 529.59 / 1.655 = 320.00.
    Registered as 321, NOT 320, and the reason is worth recording because the
    round-up rule alone does not settle it: 320 does satisfy the target, but
    only by 4.9e-06 (MDE 0.14449893 vs target 0.14450384), a margin four orders
    of magnitude smaller than the 4-decimal precision at which the target itself
    is registered — i.e. inside the rounding noise of its own derivation. 321
    gives a real margin (MDE 0.14427556, 2.3e-04) and is the first integer that
    does. Rounding UP past an ambiguous boundary is the direction this
    registration always rounds; rounding down would register a gate the target
    does not robustly satisfy.
    Verification at the registered integer: 321 * 1.655 = 531.255 n_eff,
    MDE = tanh(3.3393/sqrt(528.255)) = 0.1443 <= 0.1445. PASSES.
    SUPERSEDED (W10, at target 0.2507): artanh(0.2507) = 0.25603;
    n_eff = 172.96; 104.51 -> 105 bars/pair.
  days_to_fire_at_corrected_attestation: 13.38   # at the registered 0.99939; see the unit warning below
  days_to_fire_measured_bar_attestation: 24.52   # at the MEASURED steady-state 0.5455 — the honest figure
  days_to_fire_derivation: >
    W11 step 3. days = required_attested_bars_per_pair / (24 bars/day *
    attestation_fraction), giving 321 / (24 * A).

      A = 0.99939  ->  13.38 days   as registered by W10 — but see the unit error below
      A = 0.5455   ->  24.52 days   MEASURED bar attestation, post-hole steady state
      A = 0.4178   ->  32.01 days   MEASURED bar attestation, whole capture incl. the 4h06m hole

    UNIT ERROR IN THE REGISTERED FIGURE, CORRECTED HERE. The 0.99939 W9/W10
    used is the coverage journal's TIME-coverage fraction — the share of
    SECONDS attested. This formula needs the BAR-attestation fraction, and the
    two are not interchangeable. Bar attestation is all-or-nothing:
    whale_features marks a bar unattested if ANY gap of ANY length intersects
    it ("attested = not any(g.start < bar_end and g.end > bar_start ...)"), so a
    6-second reconnect destroys a full 1h bar. A capture can therefore be
    99.939% attested BY TIME and 54.55% attested BY BAR at the same instant, and
    it currently is. Measured directly over the 19 pairs
    (tools/recorder/whale_persistence.py, artifact
    results/w11/whale_persistence_20260728T070340Z.txt): 150/359 = 0.4178
    overall, 114/209 = 0.5455 restricted to post-hole steady state.
    The registered 13.38 is retained above because the dispatch specified
    computing at 99.939%, but 24.52 days is the figure that should be planned
    against, and it is contingent on the coverage floor being met at all — which
    it currently is not (see required_coverage_floor.w11_status). Under the
    superseded 105-bar requirement the same three bases give 4.38 / 8.02 / 10.47
    days.
    CAVEAT, unchanged from W10 and still the most important sentence here:
    this is when the panel becomes large enough to DETECT an IC of 0.1445 at 80%
    power — not a prediction that the features will show one. The gate fires on
    sample size; the verdict still depends on the measurement.
