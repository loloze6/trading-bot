# ---------------------------------------------------------------------------
# (a) Hypothesis — ONE falsifiable claim (unchanged from v1)
# ---------------------------------------------------------------------------
hypothesis:
  statement: >
    At least one of the three whale-footprint bar features
    (whale_lt_imbalance, whale_cvd_delta, whale_size_shift), computed on
    forward-recorded Kraken trade data at 1h bars, has a nonzero Spearman
    rank correlation with that bar's own forward 1-bar return, of consistent
    sign across the 19 captured pairs, after Bonferroni correction for
    testing three features plus one pooled combination.
  falsifiable_if: >
    No feature clears the corrected significance threshold, OR a feature
    clears magnitude but its sign is inconsistent across pairs per the
    numeric definition in verdict.sign_consistency below. AS OF v2: even a
    feature that clears BOTH is not economically actionable at the
    registered bar frequency — see economic_ic_threshold below. The
    statistical hypothesis above is unchanged; what changed is the standard
    v2 requires before that statistical result is call it decisive at Layer
    2's cost gate.

# ---------------------------------------------------------------------------
# (b) Data — exact scope (unchanged from v1)
# ---------------------------------------------------------------------------
data:
  source: forward_recorded_capture_only
  source_id: kraken_ws_forward_recorder  # campaign_data_policy.yaml
  capture_root: trading-bot/local_data/recorded_reserved/kraken_ws_v2/
  window:
    start: kraken_ws_forward_recorder.span[0]   # "2026-07-27" (13:43 UTC launch)
    end: as_of_evaluation_run_time
  pairs: 19  # BTC ETH XRP SOL ADA SUI ZEC DOGE XMR LTC ONDO NEAR LINK TAO AVAX TRX AAVE INJ UNI, all quote USD
  explicitly_excluded:
    - trading-bot/local_data/holdout_sealed/2026_H1/kraken_q1_2026/  # era_2026_holdout, sealed, single_use
    - trading-bot/local_data/recorded_reserved/kraken_ws_v2/**/2026-07-26.ndjson  # pre-launch stub run (10 min, run_id 5988e0cb), out of scope
  target_variable: bar_forward_return
  target_definition: >
    ret[T] = (close[T] - close[T-1]) / close[T-1] using the SAME 1h OHLCV bar
    grid the whale feature is aligned to (data_manager.py CandleBuilder
    convention: bar T covers [T, T+1), delivered once T+1 begins). This is
    each bar's OWN realized return, matching how the feature itself is
    timestamped (whale_features.py: "timestamp": bar_start) — see
    causality_provenance below.

causality_provenance:
  audit: SESSION_LOG.md 2026-07-27 (dispatch W8 step 3)
  canary_test: trading-bot/tests/test_aux_feed_causality_canary.py
  finding: >
    Unchanged from v1: the real whale fetcher is correctly bounded to each
    bar's own window and the merge attaches a bar's own value to that same
    bar, never a future one.
  update_w9: >
    Dispatch W9 step 3 added a SHARED-CODE defense-in-depth guard at the
    merge boundary (data_manager.py's AuxFeedCausalityError /
    _merge_asof_with_causality_guard) — every aux feed now declares the
    window it aggregates (window_seconds), and the merge REFUSES to attach a
    value whose declared window ends after the bar it would be merged onto.
    This closes the STOP-level gap the W8 canary found (no independent
    pipeline defense against a mistimed feed); the whale fetcher was already
    correctly bounded and needed no behavior change, only its
    RESERVED_FEED_REGISTRY entries gained a window_seconds declaration
    (data/feed_registry.py FEED_WINDOW_SECONDS, == whale_features.py's own
    bar_seconds — the features aggregate the forward window
    [timestamp, timestamp + bar_seconds)).

# ---------------------------------------------------------------------------
# (c) Features — FROZEN parameters (unchanged from v1)
# ---------------------------------------------------------------------------
features:
  frozen: true  # the evaluation may NOT tune these
  bar_seconds: 3600
  large_quantile: 0.99
  baseline_seconds: 86400
  min_baseline_trades: 200
  min_bar_trades: 10
  names:
    - whale_lt_imbalance
    - whale_cvd_delta
    - whale_size_shift

# ---------------------------------------------------------------------------
# (d) Test statistic and multiple-comparison correction (unchanged from v1)
# ---------------------------------------------------------------------------
test_statistic:
  statistic: spearman_rank_correlation
  per_pair: true
  pooling_scheme: >
    Report each feature's Spearman IC against bar_forward_return per pair,
    plus ONE pooled statistic per feature (rank-pool across all 19 pairs'
    attested bars).
  multiple_comparison_correction:
    method: bonferroni
    family_size: 4  # 3 features tested individually + 1 pooled combined-feature test
    alpha_nominal: 0.05
    alpha_corrected: 0.0125  # 0.05 / 4
    derivation: >
      Unchanged from v1. Family size counts every hypothesis this
      registration can produce a verdict from: whale_lt_imbalance alone,
      whale_cvd_delta alone, whale_size_shift alone, and the
      pooled/combined-feature test.

# ---------------------------------------------------------------------------
# (NEW in v2) ECONOMIC IC THRESHOLD — derived from
# strategy-research/config/cost_model.yaml (dispatch W9 step 4). Checked by
# the harness BEFORE minimum_n_gate (whale_footprint_evaluation.py) because
# it is data-independent: if the derivation below shows the required IC
# exceeds what a Spearman correlation can express, no amount of additional
# capture time or sample size changes that.
# ---------------------------------------------------------------------------
economic_ic_threshold:
  derivation_method: >
    Layer 2's own cost-check formula (strategy-research/tools/
    prescreen_signal.py::_cost_check, documented in cost_model.yaml's
    "Layer 2 formula" block), inverted to solve for the IC a strategy would
    need instead of the IC a strategy has:
      required_gross_edge_bps_per_trade = safety_factor * round_trip_cost_bps
      estimated_gross_edge_bps_per_trade = abs(IC) * sigma_bar_bps * sqrt(avg_holding_bars)
      => IC_required = (safety_factor * round_trip_cost_bps)
                        / (sigma_bar_bps * sqrt(avg_holding_bars))
    This is the SAME formula and the SAME safety margin (2x round-trip cost)
    every other strategy in this campaign is gated on at Layer 2 — no new
    convention was invented for this feature family.
  assumptions_stated:
    safety_factor:
      value: 2.0
      source: "strategy-research/config/cost_model.yaml:62 (safety_factor) — campaign-wide, not feature-specific"
    round_trip_cost_bps:
      value: 18.5
      source: >
        cost_model.yaml round_trip_cost_bps.default (taker execution style,
        the HARD-RULE-mandated path for any gating decision — maker is
        sensitivity-only per cost_model.yaml's own top-of-file rule). The
        19 Kraken pairs this capture covers are not individually listed in
        cost_model.yaml's per-symbol tables (those are Binance USDT pairs);
        `default` is used as the Kraken proxy, the same convention
        cost_model.yaml's own PERP CALIBRATION block already uses elsewhere
        ("Binance-vs-Kraken funding basis is an open calibration question...
        in-sample re-costing uses the Binance 8h series above as the
        proxy"). Using Kraken's OWN (generally lower) fee schedule would
        only strengthen this finding's direction (lower cost -> lower
        required IC), so this is the conservative-against-the-finding choice.
    sigma_bar_bps:
      value: 61.6052   # CORRECTED by dispatch W10 (2026-07-28); was 15.0
      superseded_value: 15.0
      correction_rationale: >
        W10 ERROR 1 OF 2. The original 15.0 was
        strategy-research/tools/prescreen_signal.py:102
        ::_DEFAULT_SIGMA_BAR_BPS. That constant is NOT a campaign measurement
        of 1h-crypto bar volatility despite its comment saying so: it is the
        <5-record FALLBACK in _sigma_from_records (prescreen_signal.py:639-643),
        reached only when a run has too little data to estimate sigma at all.
        Every real Layer-2 gating decision this campaign has made measured
        sigma directly instead. Across all 15 archived prescreen artifacts,
        the measured 1h sigma_bar_bps is 61.6052-82.9013 — never 15.0. The
        constant is ~4.1x too low (15 bps/1h annualizes to ~14% vol; 62 bps
        annualizes to ~58%, the realistic crypto figure). Corrected to
        61.6052, the MINIMUM measured 1h value in the archive
        (results/../runs/run_043/prescreen/prescreen_result.yaml:56), because
        the lowest sigma yields the HIGHEST required IC and is therefore the
        conservative-against-this-correction choice.
    avg_holding_bars_primary:
      value: 5.74   # CORRECTED by dispatch W10 (2026-07-28); was 1
      superseded_value: 1
      correction_rationale: >
        W10 ERROR 2 OF 2. The original value rested on the inference
        "recomputed fresh every 1h bar with no persistence mechanism =>
        avg_holding_bars = 1". That conflates the RECOMPUTATION frequency of
        a feature with the TURNOVER of a position, which are not the same
        quantity. This campaign defines avg_holding_bars operationally, in
        tools/prescreen_signal.py:505-545 (_compute_turnover_proxy), as
        active_bars_total / activity_transitions — a measure of how long the
        SIGN of the signal persists, not of how often the feature is
        recalculated. A feature recomputed every bar whose sign persists for
        20 bars has avg_holding_bars = 20, not 1. Nothing about hourly
        recomputation implies a full round-trip every hour.
        Corrected to 5.74 = the mean realized holding period measured from
        archived trade logs (W10 step 2): the three highest-trade-count runs
        in the archive (run_031 438 trades, run_034 430, run_021 430; all 1h,
        ~27.5d windows) show mean realized holding of 5.74 / 6.11 / 6.11 bars
        and median 3.0 bars, from each trade's recorded duration_minutes.
        5.74 is the lowest of the three means, i.e. the highest-turnover
        measurement available, and is therefore the conservative choice.
        Measured notional turnover corroborates: 0.35-0.45x portfolio value
        per symbol-bar across both legs, i.e. ~0.18-0.22 round-trips per bar,
        not the 1.0 round-trip per bar the original value assumed.
        NOTE the original value is not merely conservative but out of the
        measured range entirely: only one archived prescreen (run_053) ever
        recorded avg_holding_bars = 1.0; the other fourteen recorded
        6.38-261.0. The measured 1h prescreen median is ~28.7.
        NOTE ALSO that the live pipeline applies no turnover damping that
        would push holding UP toward this figure artificially: config.json:16
        sets rebalance_threshold 0.20, but its only code reference
        (trading-bot/core/launcher.py:110) is commented out, so the engine
        currently rebalances to target every bar. The measured 5.74-bar
        holding is therefore signal persistence, not a threshold artifact.
  ic_to_expected_return_mapping: >
    expected_gross_edge_bps_per_trade(IC, H) = abs(IC) * sigma_bar_bps *
    sqrt(H), H = avg_holding_bars. A strategy clears Layer 2's cost gate
    when expected_gross_edge_bps_per_trade >= safety_factor *
    round_trip_cost_bps = 37.0 bps. Solving for IC at a given H:
    IC_required(H) = 37.0 / (61.6052 * sqrt(H)).
    [W10: sigma corrected from 15.0 to 61.6052; the FORMULA itself is
    unchanged and was never in question — see units_check below.]
  required_ic_at_registered_frequency: 0.2507  # = 37.0 / (61.6052 * sqrt(5.74))
  superseded_required_ic_at_registered_frequency: 2.4667  # was 37.0 / (15.0 * sqrt(1))
  max_possible_spearman_ic: 1.0
  economically_untradeable_at_registered_frequency: false  # CORRECTED by W10; was true
  finding: >
    CORRECTED BY DISPATCH W10 (2026-07-28). The prior STOP-LEVEL FINDING
    below is WITHDRAWN: it was an arithmetic consequence of two wrong inputs,
    not a property of the cost model.
    Re-derived with corrected inputs, IC_required = 37.0 / (61.6052 *
    sqrt(5.74)) = 0.2507. This is below 1.0, so the "exceeds the mathematical
    bound of a Spearman correlation" argument does not hold, and the family
    is NOT untradeable before data collection. 0.2507 remains a demanding
    target — modestly above this campaign's own observed ceiling for its
    strongest signals (~0.15-0.20) — but it is achievable in principle and
    must be settled by measurement, not by arithmetic.
    Note that correcting sigma ALONE is sufficient to withdraw the finding:
    even retaining the original avg_holding_bars=1, IC_required = 37.0/61.6052
    = 0.6006 < 1.0. The infeasibility claim never survived either correction
    independently.
  withdrawn_finding_retained_for_audit: >
    ORIGINAL TEXT, SUPERSEDED — DO NOT ACT ON: "STOP-LEVEL FINDING, not a
    statistics bug... At the registered 1h bar frequency (avg_holding_bars=1),
    IC_required = 2.4667 — this EXCEEDS 1.0, the mathematical maximum a
    Spearman correlation coefficient can ever take. No finite sample size,
    no amount of additional capture time, and no achievable measured IC can
    ever satisfy this: the family is untradeable at its registered frequency
    BEFORE any data is collected."
  w10_falsification_evidence: >
    The withdrawn derivation referenced no whale data, so it applied to EVERY
    1h strategy in this campaign — and the campaign's own archive contradicts
    it directly. Four archived runs PASSED the Layer-2 cost gate
    (edge_to_cost_ratio >= safety_factor 2.0) at measured ICs of 0.0348 to
    0.1905: run_042 (IC 0.1905, H 28.73, sigma 62.52, ratio 3.7545, 1h),
    run_054 (IC 0.0348, ratio 4.3151), run_059 (IC 0.0378, ratio 2.2927), and
    the ts_trend daily shakedown (IC 0.0359, ratio 4.4504). Under the
    withdrawn required-IC of 2.4667 none of these could ever have passed. The
    inconsistency resolves against the derivation and in favour of the runs:
    the runs used MEASURED sigma and MEASURED avg_holding_bars through
    _cost_check, while the derivation substituted a fallback constant and an
    asserted turnover for those same two inputs.
  sensitivity_table_avg_holding_bars_to_required_ic:
    # W10-CORRECTED. IC_required(H) = 37.0 / (61.6052 * sqrt(H)); holding_days = H/24
    "1":     {holding_days: 0.04, ic_required: 0.6006}   # W9's asserted H (superseded)
    "2":     {holding_days: 0.08, ic_required: 0.4247}
    "4":     {holding_days: 0.17, ic_required: 0.3003}
    "5.74":  {holding_days: 0.24, ic_required: 0.2507}   # PRIMARY — measured realized
    "9":     {holding_days: 0.38, ic_required: 0.2002}   # ~= campaign's plausible_ic_upper (0.20)
    "16":    {holding_days: 0.67, ic_required: 0.1501}
    "28.73": {holding_days: 1.20, ic_required: 0.1121}   # median measured 1h prescreen H
    "50":    {holding_days: 2.08, ic_required: 0.0849}
    "100":   {holding_days: 4.17, ic_required: 0.0601}
  superseded_sensitivity_table_note: >
    The v2-as-written table (H=1 -> 2.4667 through H=6760 -> 0.0300) was
    computed with sigma=15.0 and is void; every entry was ~4.1x too high.
  sensitivity_finding: >
    W10-CORRECTED. At the measured realized turnover (H=5.74) IC_required is
    0.2507, and it falls to this campaign's own historical ceiling for its
    STRONGEST signals (~0.15-0.20) at H≈9-16 (0.4-0.7 days) — a holding
    period entirely compatible with a fast microstructure order-flow signal,
    and well inside the 6.38-261.0 range of avg_holding_bars this campaign
    has actually measured. The economic premise of the feature family and the
    turnover required for economic viability are therefore NOT in conflict,
    which is the opposite of what the superseded table implied. The required
    IC is demanding but not out of reach, and no plausible turnover makes the
    family untradeable a priori.
  gate_rule: >
    The harness (whale_footprint_evaluation.py:171-178) refuses to execute
    (returns BLOCKED_ECONOMIC_INFEASIBILITY, no verdict computed, no data
    read) whenever economically_untradeable_at_registered_frequency is
    true — checked immediately after single-use and before the coverage
    floor or minimum-N gate, since it needs no panel data to decide.
    W10 STATUS: the mechanism is UNCHANGED and still armed; its condition is
    now false, so it no longer fires. The coverage floor (0.80) and the
    minimum-N gate downstream of it are consequently LIVE again — neither was
    weakened by this correction; they were previously unreachable and are now
    reachable at their registered strengths.
  units_check: >
    W10 step 4. sigma_bar_bps is PER-BAR — the standard deviation of 1-bar
    close-to-close returns expressed in bps (cost_model.yaml:261,
    prescreen_signal.py:639-643 computes stdev over records'
    next_return_bps). It is neither annualized nor per-day. It is divided
    against safety_factor * round_trip_cost_bps, also in bps, per round trip.
    bps/bps cancels and IC_required is correctly dimensionless. The sqrt(H)
    factor scales a per-bar volatility to an H-bar holding period, matching
    a cost figure charged once per round trip. CONCLUSION: the units are
    consistent and the formula is sound. The 9.8x error was NOT a units
    mismatch — it was two wrong scalar inputs (a fallback constant used as if
    it were a measurement, and an asserted turnover contradicted by every
    measurement in the archive).

# ---------------------------------------------------------------------------
# (e) MINIMUM-N GATE — recomputed from step 4 (dispatch W9 step 5).
# W10 (2026-07-28): this gate is NO LONGER MOOT. economic_ic_threshold above
# no longer blocks (its condition is now false), so this gate is live and
# must carry a real number. Per v2's own instruction ("A future amendment
# that revisits avg_holding_bars_primary with a written economic
# justification would need to set both target_detectable_ic AND
# required_attested_bars_per_pair together"), W10 sets BOTH together below.
# The previous nulls were correct for target_detectable_ic=2.4667 (tanh is
# bounded in (-1,1), so no finite N solved the mde_formula); at the corrected
# target 0.2507 a finite N exists and is registered. Leaving the nulls in
# place would ALSO have crashed the harness, which compares
# `avg_attested < required_n` at whale_footprint_evaluation.py:192-194.
# ---------------------------------------------------------------------------
minimum_n_gate:
  derivation_method: >
    Unchanged pure-statistics method from v1 (effective-N from in-sample
    PRICE/RETURN properties only — NOT whale data, NOT holdout; see v1 for
    the full rho_bar/autocorrelation derivation, reproduced unchanged below
    since it does not depend on the economic question).
    n_eff_symbols = 19 / (1 + 18*0.5824) = 1.655.
    n_eff per T bars/pair = T * n_eff_symbols.
  multiple_comparison_correction: bonferroni family_size=4 (alpha_corrected=0.0125, see (d))
  power_target: 0.80
  mde_formula: >
    Fisher z-transform normal approximation: SE = 1/sqrt(n_eff - 3);
    z_required = z_(1-alpha_corrected/2) + z_power = 2.4977 + 0.8416 = 3.3393;
    MDE_spearman_ic = tanh(z_required * SE). Bounded in (-1, 1) by
    construction — this is why the SUPERSEDED target of 2.4667 could not be
    solved for a finite N. The W10-corrected target 0.2507 is inside the
    bound and solves at n_eff = 173.0 (see required_n_eff below).
  detectable_ic_curve_attested_days:
    # unchanged from v1 -- pure statistics, does not depend on the economic
    # finding or the attestation-fraction correction.
    "7":   {n_eff: 278.0,   mde_ic: 0.1987}
    "14":  {n_eff: 556.1,   mde_ic: 0.1410}
    "30":  {n_eff: 1191.6,  mde_ic: 0.0966}
    "60":  {n_eff: 2383.2,  mde_ic: 0.0683}
    "90":  {n_eff: 3574.8,  mde_ic: 0.0558}
    "180": {n_eff: 7149.6,  mde_ic: 0.0395}
    "270": {n_eff: 10724.4, mde_ic: 0.0322}
    "365": {n_eff: 14497.8, mde_ic: 0.0277}
    "545": {n_eff: 21647.4, mde_ic: 0.0227}
    "730": {n_eff: 28995.6, mde_ic: 0.0196}
  target_detectable_ic: 0.2507  # == economic_ic_threshold.required_ic_at_registered_frequency
  superseded_target_detectable_ic: 2.4667  # W9 value, void — see economic_ic_threshold
  target_detectable_ic_derivation: >
    v1 used a JUDGMENT CALL (0.03, "not derived from any observed effect").
    v2 uses the economic_ic_threshold derivation above instead — the IC a
    strategy trading these features AT their registered bar frequency would
    actually need to clear costs, not a statistically-modest-sounding
    magnitude chosen by convention. W10 keeps that PRINCIPLE unchanged and
    corrects only the two inputs the derivation was fed (sigma_bar_bps and
    avg_holding_bars); 2.4667 -> 0.2507.
  required_attested_bars_per_pair: 105   # W10; was null (unsolvable at the void target)
  required_n_eff: 173.78
  required_n_derivation: >
    Inverting the mde_formula above at target_detectable_ic = 0.2507:
    artanh(0.2507) = 0.25603; n_eff - 3 = (3.3393 / 0.25603)^2 = 169.96;
    n_eff = 172.96. Converting to attested bars per pair via
    n_eff = bars_per_pair * n_eff_symbols(1.655): 172.96 / 1.655 = 104.51,
    rounded UP to 105 (never down — rounding down would register a gate the
    target does not actually satisfy). Verification at the registered
    integer: 105 * 1.655 = 173.78 n_eff, MDE = tanh(3.3393/sqrt(170.78))
    = 0.2501 <= 0.2507. PASSES.
  days_to_fire_at_corrected_attestation: 4.38
  days_to_fire_derivation: >
    W10 step 5(b). required_attested_bars_per_pair (105) / (24 bars/day *
    0.99939 attestation) = 4.378 raw calendar days per pair. At the corrected
    steady-state attestation of 99.939% the attested and calendar figures are
    within 0.006 days of each other; the attestation fraction is no longer
    the binding constraint on the timeline that it was under v1's 7.8%
    figure. SUPERSEDED COMPARISON: under the void 2.4667 target this was
    infinite (no finite N existed), which is what made the family look
    permanently blocked. It is ~4.4 days.
    CAVEAT, stated because it changes how this number should be read: 4.38
    days is when the panel becomes large enough to DETECT an IC of 0.2507 at
    80% power — not a prediction that the features will show one. The gate
    fires on sample size; the verdict still depends on the measurement.
  gate_status: >
    LIVE (W10). Previously MOOT while economic_ic_threshold blocked earlier;
    that block is withdrawn, so this gate now governs. Unchanged in method,
    power target, alpha correction, and n_eff_symbols — only the target IC it
    is solved at was corrected.
  context_only_v1_target_at_corrected_attestation:
    # FOR COMPARISON ONLY -- does NOT gate v2 (economic_ic_threshold does).
    # Answers "how much did the coverage-report fix alone (dispatch W9 step
    # 1-2) change the timeline, holding v1's original 0.03 target fixed?"
    target_detectable_ic: 0.03
    required_attested_bars_per_pair: 7484  # unchanged from v1 -- pure statistics
    attested_equivalent_days: 311.83  # 7484 / 24
    attestation_fraction_used: 0.99939  # dispatch W9 step 2, steady-state EXCLUDING the diagnosed 4h06m no_attestation hole
    attestation_fraction_source: >
      python -m recorder.coverage_report --start 2026-07-27T13:43:04.595471Z
      against the live journal, dispatch W9 step 2: elapsed 44471.45s,
      captured 29660.20s (66.695% raw, includes the hole), one
      no_attestation gap of 14793.07s (2026-07-27T16:42:20.055Z ..
      20:48:53.121Z, matching the ~4h06m 16:42-20:48Z hole this dispatch was
      asked to confirm is now surfaced — it is). Steady-state excluding that
      gap: 29660.20 / (44471.45 - 14793.07) = 99.939%.
    required_raw_calendar_days: 312.02  # 311.83 / 0.99939
    required_raw_calendar_years: 0.854
    comparison_to_v1: >
      v1 (uncorrected 7.8% attestation): ~3998 raw days (~10.95 years).
      v2 context figure (corrected 99.939% steady-state): ~312 raw days
      (~0.85 years). The coverage-report fix alone is a ~12.8x improvement
      in this number — but it does not change economic_ic_threshold's
      verdict, which is what actually governs v2.

# ---------------------------------------------------------------------------
# (f) SINGLE-USE (unchanged discipline from v1; this is a NEW, separate
# single-use instance for v2 — v1's own single-use is untouched and remains
# separately unconsumed)
# ---------------------------------------------------------------------------
single_use:
  fires_exactly_once: true
  consumption_recorded_on_execution: true
  consumption_field: consumed_by  # harness stamps {hypothesis_id, run_id, timestamp} here on first execution
  consumed_by: null  # unconsumed as of registration
  discipline: >
    Same discipline as v1 and as holdout_range (campaign_data_policy.yaml):
    repeated peeking as attested-bar data accumulates toward the gate is the
    exact failure mode this exists to prevent. The harness must refuse a
    second execution against a `consumed_by` that is already populated.
    NOTE: with economic_ic_threshold blocking first, this single-use mark
    will not be consumed by any execution while that gate remains true — a
    BLOCKED_ECONOMIC_INFEASIBILITY result does not stamp consumption, same
    as every other blocked-gate status.

# ---------------------------------------------------------------------------
# (g) TOTAL verdict mapping — no "routing decides" (unchanged from v1)
# ---------------------------------------------------------------------------
verdict:
  mapping:
    PASS: >
      Pooled Spearman IC for at least one of the 3 features clears
      alpha_corrected=0.0125 (two-sided) AND sign_consistency holds for that
      feature (see below). NOTE: per economic_ic_threshold above, a PASS
      under this statistical mapping alone would still not be economically
      actionable at the registered bar frequency unless a future amendment
      changes that finding — this mapping is unchanged from v1 because it
      answers the STATISTICAL hypothesis (a), not the economic question,
      which is now a separate, earlier gate.
    UNSTABLE: >
      Pooled Spearman IC for at least one feature clears alpha_corrected AND
      sign_consistency FAILS for every feature that cleared magnitude.
    NULL: >
      No feature's pooled Spearman IC clears alpha_corrected.
  sign_consistency:
    definition: >
      Unchanged from v1. For a given feature, compute the per-pair Spearman
      IC across all 19 pairs (using only pairs with >= 30 attested bars).
      sign_consistency HOLDS if at least 80% of those per-pair ICs share the
      same sign as the pooled IC.
  exhaustiveness: >
    Every reachable outcome once single-use, economic feasibility, the
    minimum-N gate and the coverage floor all pass is exactly one of {PASS,
    UNSTABLE, NULL}. There is no fourth outcome and no discretionary routing
    step. (economic_ic_threshold currently makes this branch unreachable —
    see gate_rule above.)

# ---------------------------------------------------------------------------
# (h) REQUIRED-COVERAGE FLOOR — recomputed from step 2's measured
# steady-state attestation (dispatch W9 step 5)
# ---------------------------------------------------------------------------
required_coverage_floor:
  metric: attested_bar_fraction
  floor: 0.80
  derivation: >
    v1's floor (0.05) was set below a WRONG measurement (0.078, from a tool
    that could not detect a gap with no closing record). The corrected
    steady-state attestation (dispatch W9 step 2, coverage-report fix
    applied) is ~99.939% excluding the one diagnosed ~4h06m hole. Setting
    the floor at 0.80 keeps the same PURPOSE v1 stated (catch a REGRESSION,
    not relitigate whether the current level is "enough" — that is what
    economic_ic_threshold and minimum_n_gate do) while now being wide enough
    to trip on a real operational failure (e.g. the sleep-related hole
    recurring, or a comparable new one) well before it silently erodes weeks
    of capture, rather than sitting so low (0.05) it could never catch
    anything short of near-total data loss. `whale_attested` is itself
    directly derived from journal.coverage_intervals (whale_features.py:
    "attested = not any(g.start < bar_end and g.end > bar_start for g in
    gaps)"), so this floor inherits the dispatch W9 step-1 fix automatically
    — a future no_attestation-caused hole is now visible to this metric,
    where before the coverage bug would have hidden it here too.
  gate_rule: >
    Unchanged mechanism from v1: the harness refuses to execute (returns
    BLOCKED_COVERAGE_FLOOR) if the pooled attested-bar fraction across the
    19 pairs is below 0.80 at evaluation time. Checked after single-use and
    economic feasibility, before minimum-N (see whale_footprint_evaluation.py
    module docstring).

# ---------------------------------------------------------------------------
# Design provenance — data-dependent choices that are NOT this hypothesis test
# (unchanged from v1)
# ---------------------------------------------------------------------------
design_provenance:
  bar_seconds_choice:
    value: 3600
    basis: >
      Unchanged from v1: a 60s diagnostic measured on REAL capture (trade
      density only, NO return information) found bar_seconds=60 collapsed
      whale_lt_imbalance to a bare sign for 51% of scored bars; 3600s (1h)
      was chosen to keep enough qualifying trades per bar. Not re-run for
      v2 either.
    not_rerun: true

