# ---------------------------------------------------------------------------
# Amendment rationale (required by dispatch W9 step 5 — stated in the file
# itself, not just in SESSION_LOG.md)
# ---------------------------------------------------------------------------
amendment:
  supersedes: prereg_whale_footprint_v1.yaml
  made_before_any_evaluation: true
  v1_single_use_status_at_amendment: >
    UNCONSUMED. No `prereg_whale_footprint_v1.yaml.consumed.json` sidecar
    exists anywhere in the repo (checked directly, dispatch W9 step 5) — v1
    was never executed against real or synthetic-smoke data through
    `evaluate(..., prereg_path=...)`. Amending an unconsumed, unevaluated
    pre-registration is the case single-use discipline is designed to permit
    freely; this is not a post-hoc relaxation of an observed result.
  what_changed_and_why:
    - >
      (e) minimum_n_gate.target_detectable_ic moved from a STATISTICAL
      CONVENTION (v1: 0.03, explicitly labeled "A JUDGMENT CALL... not
      derived from any observed effect") to a COST-MODEL DERIVATION (v2: see
      `economic_ic_threshold` below, derived from
      `strategy-research/config/cost_model.yaml` — what IC a strategy
      trading these features at their OWN registered 1h bar frequency would
      need to clear round-trip costs by this campaign's standard 2x safety
      margin). This is strictly more decisive than a judgment call: it is
      the IC magnitude required for ECONOMIC viability, independent of
      whether that magnitude is statistically achievable at all.
    - >
      (h) required_coverage_floor.floor recomputed from the CORRECTED
      steady-state attestation measurement (dispatch W9 step 2, using the
      coverage-gap-detection fix from step 1) — v1's floor rested on an
      attestation_fraction (0.078) that "was never it" (dispatch W9's own
      framing): the tool used to measure it could not detect a gap with no
      closing record, and a real ~4h06m capture hole read as ~100% covered.
      The true, corrected steady-state attestation (excluding that hole,
      which the coverage-report fix now surfaces) is ~99.94%, not 7.8%.
    - >
      minimum_n_gate's raw-calendar-day conversion recomputed with the
      corrected attestation for CONTEXT (see minimum_n_gate.context_only_v1_
      target_at_corrected_attestation below) — included for comparison even
      though it is not what gates v2 (see next point).
    - >
      [WITHDRAWN BY W10 — see w10_correction below. The gate is retained but
      its condition is now false; the untradeability conclusion in this
      bullet is void.]
      NEW: `economic_ic_threshold` is added as a distinct, EARLIER gate than
      minimum_n_gate. It found the family economically untradeable at its
      registered bar frequency — a required IC that exceeds the mathematical
      bound of a Spearman correlation (1.0) — which makes the sample-size
      question moot regardless of how the coverage fix improved the
      attestation timeline. Both fixes are reported because they answer
      different questions, but the economic gate is what actually governs
      v2's verdict today.
  verdict_mapping_and_single_use_discipline: unchanged from v1 (see (f), (g) below).

