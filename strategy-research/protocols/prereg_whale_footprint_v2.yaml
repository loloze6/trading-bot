    - >
      (5) verdict.mapping.NULL is restated to say exactly what it does and does
      not license. No threshold moved. See verdict.mapping.NULL and
      verdict.null_scope below.
    - >
      (6) A NEW BLOCKING OBSERVATION, not a change: the registered
      required_coverage_floor of 0.80 is NOT currently met. Measured
      attested_bar_fraction is 0.4178 (0.5455 steady state). The harness will
