# ---------------------------------------------------------------------------
# W11 CORRECTION (2026-07-28) — in-place amendment to v2, NOT a v3.
#
# W10 fixed the two inputs to the required-IC derivation by finding better
# NUMBERS for them. W11 asks the prior question — whether either number is a
# property of THIS feature family at all — and MEASURES both from the pair set
# and the capture the pre-registration actually names.
# ---------------------------------------------------------------------------
w11_correction:
  made_before_any_evaluation: true
  single_use_status_at_correction: >
    UNCONSUMED. v2 has still never been executed: no
    `prereg_whale_footprint_v2.yaml.consumed.json` sidecar exists, and no
    verdict has been computed against any panel.
  why_this_amendment_cannot_be_a_peek: >
    THE CENTRAL CLAIM OF THIS AMENDMENT, stated so it can be checked rather
    than trusted. Both amended inputs were measured by programs that are
    STRUCTURALLY incapable of computing the quantity under test.
      - H (feature sign persistence) from tools/recorder/whale_persistence.py, which
        imports no price loader, opens no OHLCV cache, and reads only the
        `trades` stream. It has no access to a return.
      - sigma_bar_bps from tools/measure_bar_sigma.py, which opens exactly one
        kind of file (local_data/kraken_<BASE>USD_1h.csv) and never touches the
        recorded capture or any whale feature. It has no access to a feature.
    The hypothesis under test is a feature-vs-return relationship. Neither
    program can see both sides of it, and they share no data, so no number
    produced by either can encode the relationship. NO IC, correlation,
    regression, or forward return involving a whale feature was computed by W11
    — the dispatch that produced this amendment forbade it explicitly and the
    tool split is the enforcement, not the promise.
  what_changed:
    - >
      (1) sigma_bar_bps: 61.6052 -> 106.8726. W10's figure was a real
      measurement but of the WRONG INSTRUMENT SET — the minimum 1h sigma across
      archived prescreen runs, which cover BTC and AVAX only, two of the
      nineteen pairs and neither chosen for being representative. Measured
      across all 19 recorded pairs the pooled figure is 106.8726 bps, 1.73x
      W10's. See economic_ic_threshold.assumptions_stated.sigma_bar_bps.
    - >
      (2) avg_holding_bars_primary: 5.74 RETAINED, but its status is corrected
      from an apparently-measured input to an explicitly BORROWED and
      UNMEASURED one, with a registered obligation to re-measure. W10 measured
      5.74 from archived Keltner/MACD trade logs on BTC/AVAX. That is a
      property of THOSE STRATEGIES' forecasts, not of these features. W11
      attempted the direct measurement on the whale features' own sign series
      and it FAILED for a reason that more capture time will not fix — see
      avg_holding_bars_primary.w11_measurement_attempt. Rather than substitute
      a censored number that is known to be a lower bound, the borrowed figure
      is kept and LABELLED. It is now the single largest unquantified risk in
      this registration and is recorded as such.
    - >
      (3) Consequently required_ic_at_registered_frequency 0.2507 -> 0.1445,
      minimum_n_gate.target_detectable_ic 0.2507 -> 0.1445, and
      required_attested_bars_per_pair 105 -> 321. The sample requirement TRIPLES;
