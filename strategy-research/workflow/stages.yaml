version: 1

stages:
  research_brief:
    outputs:
      - runs/{run_id}/artifacts/research_brief.yaml
    next:
      - hypothesis

  hypothesis_generation:
    skill: workflow_artifacts/skills/hypothesis-design/SKILL.md
    required_inputs:
      - runs/{run_id}/artifacts/research_brief.yaml
      - config/available_feeds.yaml
      - config/indicator_library.yaml
    outputs:
      - runs/{run_id}/artifacts/hypothesis_card.yaml
    next:
      - innovation_expansion

  innovation_expansion:
    skill: workflow_artifacts/skills/innovation-expansion/SKILL.md
    required_inputs:
      - runs/{run_id}/artifacts/research_brief.yaml
      - runs/{run_id}/artifacts/hypothesis_card.yaml
    outputs:
      - runs/{run_id}/artifacts/expanded_hypothesis_card.yaml
      - runs/{run_id}/artifacts/innovation_notes.yaml
    next:
      - validation

  # E-032 S2a: anti-adjacency gate (declarative documentation only -- this
  # file is not read by the orchestrator's live routing today; STAGE_CONFIGS
  # and run_tool_worker in workflow/run_phase1_research.py are. Documented
  # here to match the signal_prescreen contract exactly, per
  # engineering/roadmap/E-032/artifacts/s1_idea_generation.md Task 3's build
  # list item 4. NOT wired into the live pipeline's next: graph by this
  # story -- see EPIC.md's S2a log entry for the scoping decision).
  # Deterministic tool, not LLM. ADMIT/REFUSE a candidate hypothesis using
  # two layers, KB-reactivation-clause-first (campaign_knowledge_base.yaml,
  # matched at mechanism/hypothesis_id grain), refreshed per-family
  # (family, instrument, timeframe) triples second (campaign_record/
  # exclusion_digest.yaml, built by tools/build_exclusion_digest.py) --
  # never campaign_state.yaml's flat instruments_tried/timeframes_tried
  # lists as a global veto.
  anti_adjacency_gate:
    tool: tools/anti_adjacency_gate.py
    description: >
      Deterministic tool, mirrors signal_prescreen's pattern. Evaluates a
      candidate hypothesis_card.yaml/expanded_hypothesis_card.yaml variant
      against campaign_knowledge_base.yaml (Layer 1, mechanism grain) and
      campaign_record/exclusion_digest.yaml (Layer 2, family grain). Route:
      admit | refuse. A precedence rule governs disagreement between a
      KB parent's open reactivation_condition and a child run's registered
      lineage_routing=terminate -- see anti_adjacency_gate.py's module
      docstring.
    required_inputs:
      - runs/{run_id}/artifacts/hypothesis_card.yaml
      - campaign_record/campaign_knowledge_base.yaml
      - campaign_record/exclusion_digest.yaml
    outputs:
      - runs/{run_id}/artifacts/anti_adjacency_result.yaml
    next:
      - validation   # route=admit
      - hypothesis_generation   # route=refuse (not yet wired -- see note above)

  refinement_planner:
    skill: workflow_artifacts/skills/refinement-planner/SKILL.md
    required_inputs:
      - runs/{run_id}/artifacts/validation_decision.yaml
      - runs/{run_id}/artifacts/expanded_hypothesis_card.yaml
    outputs:
      - runs/{run_id}/artifacts/refinement_notes.yaml
    next:
      - innovation_expansion  # when implementation_allowed=true
      - human_pause           # when implementation_allowed=false

  validation:
    skill: workflow_artifacts/skills/quant-validation/SKILL.md
    required_inputs:
      - runs/{run_id}/artifacts/research_brief.yaml
      - runs/{run_id}/artifacts/expanded_hypothesis_card.yaml
      - runs/{run_id}/artifacts/innovation_notes.yaml
    outputs:
      - runs/{run_id}/artifacts/validation_protocol.yaml
      - runs/{run_id}/artifacts/validation_decision.yaml
    next: [backtest_specification]

  backtest_specification:
    skill: workflow_artifacts/skills/backtest-engineering/SKILL.md
    required_inputs:
      - runs/{run_id}/artifacts/expanded_hypothesis_card.yaml
      - runs/{run_id}/artifacts/validation_protocol.yaml
    outputs:
      - runs/{run_id}/artifacts/backtest_spec.yaml
      - runs/{run_id}/artifacts/decision.yaml
    next:
      - signal_prescreen

  # Improvement 08 + 09: cheap IC + cost gate before full walk-forward.
  # A8.1: 08 and 09 land together — no standalone IC pass; cost_check is always required.
  # A9.1: Keltner config with ungated IC≈0 must fail cost_check despite historical gated IC=0.2145.
  # A2.3: ic_by_regime is suspended; ungated IC only until a trustworthy detector exists.
  signal_prescreen:
    tool: tools/prescreen_signal.py
    description: >
      Deterministic tool. Runs backtest on a subset of walk-forward windows (prescreen
      budget: first 2 windows per symbol). Computes pooled IC, block-adjusted significance
      (block=24 bars for 1h), turnover proxy, and cost_check from config/cost_model.yaml.
      Route: proceed_to_backtest (IC significant AND cost_check.pass) | kill_no_ic |
      refine_inverted_ic | refine_cost_hurdle | kill_cost_hurdle.
      Prescreen kills are recorded as trials in campaign_state.trial_sharpes (A6.2).
    required_inputs:
      - runs/{run_id}/artifacts/candidate_strategy_config.json
      - config/cost_model.yaml
      - config/campaign_data_policy.yaml
    outputs:
      - runs/{run_id}/artifacts/prescreen_result.yaml
    next:
      - protocol_execution   # when route=proceed_to_backtest
      - verdict_interpreter  # when route=kill_* or refine_*

  protocol_execution:
    tool: tools/run_protocol.py
    required_inputs:
      - runs/{run_id}/artifacts/candidate_strategy_config.json
      - runs/{run_id}/artifacts/validation_protocol.yaml
    outputs:
      - runs/{run_id}/artifacts/protocol_result.yaml
    next:
      - verdict_interpreter

  verdict_interpreter:
    skill: workflow_artifacts/skills/verdict-interpreter/SKILL.md
    required_inputs:
      - runs/{run_id}/artifacts/protocol_result.yaml
      - runs/{run_id}/artifacts/validation_protocol.yaml
      - runs/{run_id}/artifacts/backtest_spec.yaml
      - runs/{run_id}/artifacts/research_brief.yaml
      - workflow_artifacts/skills/quant-fundamentals/SKILL.md
    outputs:
      - runs/{run_id}/artifacts/verdict_interpretation.yaml
    next: []

  campaign_review:
    skill: workflow_artifacts/skills/campaign-review/SKILL.md
    required_inputs:
      - campaign_state.yaml
      - runs/{run_id}/artifacts/research_brief.yaml
      - workflow_artifacts/skills/quant-fundamentals/SKILL.md
    outputs:
      - runs/{run_id}/artifacts/campaign_review.yaml
    next: []

  # Improvement 02: regime detector validation (campaign-scoped, not per-run)
  regime_detector_validation:
    tool: tools/validate_regime_detector.py
    description: >
      Standalone deterministic tool. Runs the regime detector over historical data,
      computes persistence/sensitivity/activation metrics, writes campaign-root
      regime_detector_report.yaml. Triggered before verdict_interpreter when report
      is absent or stale.
    required_inputs:
      - runs/{run_id}/artifacts/candidate_strategy_config.json
      - config/campaign_data_policy.yaml
    outputs:
      - regime_detector_report.yaml
    next:
      - regime_auditor

  regime_auditor:
    skill: workflow_artifacts/skills/regime-auditor/SKILL.md
    description: >
      LLM skill that reads regime_detector_report.yaml and produces regime_audit_decision.yaml.
      Decides trustworthy / needs_retune / unusable and checks A2.1 ungated escape.
    required_inputs:
      - regime_detector_report.yaml
      - runs/{run_id}/artifacts/protocol_result.yaml
    outputs:
      - runs/{run_id}/artifacts/regime_audit_decision.yaml
    next:
      - verdict_interpreter

  # Improvement 06: single-use holdout evaluation gate (tool stage, no LLM)
  # Routes here after verdict_interpreter emits promote (provisional).
  # Terminal promotion only after DSR gate + holdout pass.
  holdout_evaluation:
    tool: tools/deflate_sharpe.py
    description: >
      Tool stage. Checks promotion_audit.yaml passes_deflated_threshold; enforces
      holdout_consumed_by single-use from config/campaign_data_policy.yaml;
      evaluates holdout_result.yaml (pass/fail/inconclusive). Failure is terminal.
      Pre-registration: expected_range in holdout_result.yaml must be written BEFORE
      running the holdout backtest.
    required_inputs:
      - runs/{run_id}/artifacts/promotion_audit.yaml
      - config/campaign_data_policy.yaml
    optional_inputs:
      - runs/{run_id}/artifacts/holdout_result.yaml
    outputs:
      - runs/{run_id}/artifacts/holdout_result.yaml
    next:
      - completed_promoted   # when holdout_result.status = pass
      - completed_rejected   # when DSR fails or holdout_result.status = fail
      - human_pause          # when holdout_result.yaml is absent