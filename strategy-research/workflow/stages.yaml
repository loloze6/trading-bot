version: 1

stages:
  research_brief:
    outputs:
      - runs/{run_id}/artifacts/research_brief.yaml
    next:
      - hypothesis

  hypothesis:
    skill: skills/hypothesis-generation/SKILL.md
    required_inputs:
      - runs/{run_id}/artifacts/research_brief.yaml
    outputs:
      - runs/{run_id}/artifacts/hypothesis_card.yaml
    next:
      - innovation_expansion

  innovation_expansion:
    skill: skills/innovation-expansion/SKILL.md
    required_inputs:
      - runs/{run_id}/artifacts/research_brief.yaml
      - runs/{run_id}/artifacts/hypothesis_card.yaml
    outputs:
      - runs/{run_id}/artifacts/expanded_hypothesis_card.yaml
      - runs/{run_id}/artifacts/innovation_notes.yaml
    next:
      - validation

  validation:
    skill: skills/validation/SKILL.md
    required_inputs:
      - runs/{run_id}/artifacts/research_brief.yaml
      - runs/{run_id}/artifacts/expanded_hypothesis_card.yaml
      - runs/{run_id}/artifacts/innovation_notes.yaml
    outputs:
      - runs/{run_id}/artifacts/validation_protocol.yaml
      - runs/{run_id}/artifacts/validation_decision.yaml
    next: [backtest_specification]

  backtest_specification:
    skill: skills/backtest-engineering/SKILL.md
    required_inputs:
      - runs/{run_id}/artifacts/expanded_hypothesis_card.yaml
      - runs/{run_id}/artifacts/validation_protocol.yaml
    outputs:
      - runs/{run_id}/artifacts/backtest_spec.yaml
      - runs/{run_id}/artifacts/decision.yaml
    next:
      - protocol_execution

  protocol_execution:
    tool: tools/run_protocol.py
    required_inputs:
      - runs/{run_id}/artifacts/candidate_strategy_config.json
      - runs/{run_id}/artifacts/validation_protocol.yaml
    outputs:
      - runs/{run_id}/artifacts/protocol_result.yaml
    next:
      - verdict_interpreter

  verdict_interpreter:
    skill: skills/verdict-interpreter/SKILL.md
    required_inputs:
      - runs/{run_id}/artifacts/protocol_result.yaml
      - runs/{run_id}/artifacts/validation_protocol.yaml
      - runs/{run_id}/artifacts/backtest_spec.yaml
      - runs/{run_id}/artifacts/research_brief.yaml
      - skills/quant-fundamentals/SKILL.md
    outputs:
      - runs/{run_id}/artifacts/verdict_interpretation.yaml
    next: []

  campaign_review:
    skill: skills/campaign-review/SKILL.md
    required_inputs:
      - campaign_state.yaml
      - runs/{run_id}/artifacts/research_brief.yaml
      - skills/quant-fundamentals/SKILL.md
    outputs:
      - runs/{run_id}/artifacts/campaign_review.yaml
    next: []

  # Improvement 02: regime detector validation (campaign-scoped, not per-run)
  regime_detector_validation:
    tool: tools/validate_regime_detector.py
    description: >
      Standalone deterministic tool. Runs the regime detector over historical data,
      computes persistence/sensitivity/activation metrics, writes campaign-root
      regime_detector_report.yaml. Triggered before verdict_interpreter when report
      is absent or stale.
    required_inputs:
      - runs/{run_id}/artifacts/candidate_strategy_config.json
      - config/campaign_data_policy.yaml
    outputs:
      - regime_detector_report.yaml
    next:
      - regime_auditor

  regime_auditor:
    skill: skills/regime-auditor/SKILL.md
    description: >
      LLM skill that reads regime_detector_report.yaml and produces regime_audit_decision.yaml.
      Decides trustworthy / needs_retune / unusable and checks A2.1 ungated escape.
    required_inputs:
      - regime_detector_report.yaml
      - runs/{run_id}/artifacts/protocol_result.yaml
    outputs:
      - runs/{run_id}/artifacts/regime_audit_decision.yaml
    next:
      - verdict_interpreter