# Coin universe for instrument escalation
# Ordered within each category by: liquidity (high->low), data_available (confirmed first)
# Add new coins here; the pipeline reads this file for all instrument pivots.

version: 1
default_timeframe: 1h
default_exchange: binance

categories:

  store_of_value:
    description: "Digital gold / macro assets. Deep liquidity, slow regime transitions,
      trending signals durable. Mean-reversion works in chop but rarely fires."
    strategy_affinity: [trending, momentum_continuation]
    coins:
      - symbol: BTCUSDT
        name: Bitcoin
        data_cached: true
        min_trade_count_floor: 20   # override default if needed
        notes: "Primary research asset. Most liquid, tightest spreads."
      - symbol: ETHUSDT
        name: Ethereum
        data_cached: true
        notes: "Second primary. Slightly more vol than BTC, tracks BTC closely."

  smart_contract_infra:
    description: "Layer-1/2 platforms. Adoption-driven trends, regime changes tied to
      ecosystem events. Trending signals with longer lookbacks work well."
    strategy_affinity: [trending, breakout]
    coins:
      - symbol: SOLUSDT
        name: Solana
        data_cached: true
        exchange: kraken
        cache_key: kraken_SOLUSD_1h
        notes: "High beta to BTC. More dramatic trending regime. Verified via Phase 2
          Track A Kraken bulk-archive ingestion (2026-07-22), NOT Binance -- this
          file's default_exchange: binance does not apply to this entry. 39,743 rows,
          2021-06-17 -> 2025-12-31, within-life missing 0.15%. See
          docs/session_reports/20260722_xs_momentum_universe.md."
      - symbol: AVAXUSDT
        name: Avalanche
        data_cached: true
        exchange: kraken
        cache_key: kraken_AVAXUSD_1h
        notes: "Verified via Kraken bulk-archive ingestion (2026-07-22). 35,285 rows,
          2021-12-21 -> 2025-12-31, within-life missing 0.08% -- best data quality of
          the 19-pair breadth set."
      - symbol: DOTUSDT
        name: Polkadot
        data_cached: false

  defi:
    description: "DeFi protocols. Funding-rate sensitive, mean-reversion in range markets.
      Higher correlation with ETH than BTC. Regime transitions faster."
    strategy_affinity: [mean_reversion, funding_rate]
    coins:
      - symbol: UNIUSDT
        name: Uniswap
        data_cached: true
        exchange: kraken
        cache_key: kraken_UNIUSD_1h
        notes: "Verified via Kraken bulk-archive ingestion (2026-07-22). 45,507 rows,
          2020-10-15 -> 2025-12-31, within-life missing 0.39%."
      - symbol: AAVEUSDT
        name: Aave
        data_cached: true
        exchange: kraken
        cache_key: kraken_AAVEUSD_1h
        notes: "Verified via Kraken bulk-archive ingestion (2026-07-22). 44,001 rows,
          2020-12-15 -> 2025-12-31, within-life missing 0.49%."
      - symbol: LINKUSDT
        name: Chainlink
        data_cached: true
        exchange: kraken
        cache_key: kraken_LINKUSD_1h
        notes: "Oracle token -- less defi-native, more infra. Verified via Kraken
          bulk-archive ingestion (2026-07-22). 54,430 rows, 2019-09-25 -> 2025-12-31,
          within-life missing 0.94%."

  payment:
    description: "Payment / remittance focused. Utility-capped upside, mean-reversion
      dominant. Lower vol than smart contract platforms."
    strategy_affinity: [mean_reversion, range_trading]
    coins:
      - symbol: XRPUSDT
        name: XRP
        data_cached: true
        exchange: kraken
        cache_key: kraken_XRPUSD_1h
        notes: "Verified via Kraken bulk-archive ingestion (2026-07-22). 75,440 rows,
          2017-05-18 -> 2025-12-31, within-life missing 0.19%."
      - symbol: XLMUSDT
        name: Stellar
        data_cached: false

  memecoin:
    description: "Sentiment-driven, extremely high vol, regime transitions are fast and
      unpredictable. Only test here after a strategy shows robustness on store_of_value.
      Mean-reversion signals may work on shorter timeframes (15m) better than 1h."
    strategy_affinity: [sentiment, short_timeframe_mean_reversion]
    risk_note: "HIGH RISK -- test last, never first. Liquidity can vanish."
    coins:
      - symbol: DOGEUSDT
        name: Dogecoin
        data_cached: true
        exchange: kraken
        cache_key: kraken_DOGEUSD_1h
        notes: "Verified via Kraken bulk-archive ingestion (2026-07-22). 50,232 rows,
          2019-12-19 -> 2025-12-31, within-life missing 5.05% (2017+) -- FLAGGED:
          materially above the 0.11% pilot benchmark. See breadth-viability flags in
          ledger G2 and docs/session_reports/20260722_xs_momentum_universe.md before
          weighting this pair in a cross-sectional signal."
      - symbol: SHIBUSDT
        name: Shiba Inu
        data_cached: false

