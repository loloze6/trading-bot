escalation_order:
  description: "When escalating to a new instrument, try in this order.
    Skip if data_cached: false and data fetch fails."
  sequence:
    - category: store_of_value
      priority: 1
      rationale: "Most liquid, most data, most comparable to primary research asset"
    - category: smart_contract_infra
      priority: 2
      rationale: "Higher vol, same regime structure as BTC -- good generalization test"
    - category: defi
      priority: 3
      rationale: "Different regime drivers (protocol usage vs macro) -- true diversification test"
    - category: payment
      priority: 4
    - category: memecoin
      priority: 5
      rationale: "Last resort -- only if all other categories exhausted"

timeframe_escalation:
  description: "When escalating timeframe (not instrument), try in this order."
  sequence:
    - timeframe: 4h
      rationale: "4x fewer trades, 4x less cost drag -- often resolves cost_drag > 80% without signal change"
    - timeframe: 15m
      rationale: "Higher frequency -- useful for mean-reversion if 1h signals fire too rarely"
    - timeframe: 1d
      rationale: "Daily -- only for macro trend signals with very long lookbacks"
