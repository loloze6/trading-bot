  ingested: "2026-07-22"
  cache_dir: local_data/  # kraken_<BASE>USD_1h.csv, exchange-qualified cache_key
  quote: USD  # NB: USD, not USDT -- a documented venue divergence vs the BTCUSDT/
              # ETHUSDT Binance feeds above, not a bug (ledger G1).
