      symbol: BTCUSDT
      timeframe: 3600s
      declared_bar_count: 768  # whole tile; 744 in-sample (Dec) + <=24 in holdout
      rows_in_holdout: 22  # as previously recorded in SESSION_LOG.md:2708-2709; NOT
