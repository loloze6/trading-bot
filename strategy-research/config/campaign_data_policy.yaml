# Holdout-contaminated BACKTEST RUNS (quarantined 2026-07-26, dispatch W5). Two run
# directories whose declared data range crosses the holdout_range (:18) start boundary.
# Distinct from binance_cache_holdout_contaminated above: that entry covers INPUT cache
# files, this one covers RUN OUTPUTS that already consumed holdout bars.
#
# CHRONOLOGY VERDICT: RUNS PREDATE SEAL. Measured 2026-07-26, not inferred:
#   run created_utc (manifest.json)   : 2026-07-02T09:18:06Z and 2026-07-02T09:29:25Z
#   engine git_sha the runs executed  : 5b39d142, dated 2026-06-30 17:40:45 +0200
#   holdout_range first declared      : commit 410512a, 2026-07-02 12:52:46 +0200
#                                       (= 10:52:46 UTC), which is also the commit that
#                                       CREATED this file (git log --diff-filter=A).
#                                       Confirmed earliest repo-wide via `git log -S`
#                                       over --all for both 'holdout_range' and the
#                                       literal '"2026-01-01", "2026-06-30"'.
# The runs therefore precede the seal by ~1h34m and ~1h23m, and the code that produced
# them predates the policy file by two days. This is NOT a violation of a rule in force
# at the time -- no seal existed to violate. It is pre-seal contamination surfaced after
# the fact. The bars are spent regardless: single-use is a property of the DATA, not of
# the operator's intent, so holdout_failure_is_terminal (:199) reasoning still applies
# to any future use of 2026-01-01 for these two symbol/config pairs.
#
# ROOT CAUSE (structural, not a one-off): the sweep that produced these emits monthly
# tiles of the form [month M 00:00, month M+1 day 1 23:00] -- every tile deliberately
# overspills 24 bars into the following month. All 24 sibling tiles per symbol share
# this shape (verified across all 48 manifests carrying config_sha 18fad381). Only the
# final 2025-12 tile lands that overspill inside holdout_range. The generator has no
# clamp against the seal boundary; a future sweep extended by one month would breach
# again by construction. Fixing that generator is NOT actioned here (out of dispatch
# W5's write scope) -- filed as an open item.
