                           # contaminated rows, which dispatch W5 forbids.
      files: 7
      bytes: 274748
    - run_id: 20260702T092925Z_18fad381
      created_utc: "2026-07-02T09:29:25.639140+00:00"
      symbol: ETHUSDT  # NB: SESSION_LOG.md:2708 calls both runs BTCUSDT; the manifest
                       # says ETHUSDT for this one. Manifest is authoritative.
      timeframe: 3600s
      declared_bar_count: 768
      rows_in_holdout: 23  # same provenance/caveat as above
      files: 7
      bytes: 445376
  config_sha256: 18fad381e4995a5b2716428ca838a299eff7809414de07d3dfc56abf1ae88c06
  engine_git_sha: 5b39d1420fe8cb46dbb2916be8878eeff657446e
  strategy_identity: >
    threshold_rules regime detector (EfficiencyRatioRegimeComponent period=24 smooth=5,
    VarianceRatioComponent k=5 window=100; trending iff er>=0.5 AND vr>=1.2) mapped to a
    single KeltnerBreakoutComponent (ema=20, atr=20, mult=2.0, scaling=-20.0) on the
    trending regime only; all other regimes null. This is the keltner_163 baseline_v2
    family. Stated purpose: no purpose/description field exists in the manifest schema;
    the runs are month-tiles of the sweep under protocol 20260702T091324Z_18fad381.
  dangling_reference:
    # NOT remediated (dispatch W5: no self-remediation). Recorded so the next operator
    # inherits it explicitly rather than discovering it as a broken path.
    parent_protocol: strategy-research/results/protocols/20260702T091324Z_18fad381/protocol_summary.json
    cites_runs_at_lines: [1224, 2520]
    consequence: >
      The parent protocol_summary.json still references both run_ids, and its aggregate
