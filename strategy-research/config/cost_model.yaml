# config/cost_model.yaml
# Single source of truth for fee/spread/cost assumptions.
# Consumed by: the backtest engine (_cost_paid_bps in run_protocol.py, and -- as of
#              2026-07-20 -- the actual per-trade commission_rate threaded into
#              run_backtest() via run_protocol.py's --cost-product flag; see
#              PERP CALIBRATION block below),
#              the post-backtest cost check (trading-bot/reporting/run_artifact.py),
#              and the cost_drag diagnostic rule in verdict-interpreter.
# Also handed, as information only, to step 1a (cost_feasibility estimate) and to the
# validation stage. O-3 (operator, 2026-10-01): costs are judged ONLY by the backtest --
# no estimate built from these numbers may refuse, park, drop or down-rank an idea
# before it is backtested. The former pre-backtest "Layer 1" (validation) and "Layer 2"
# (prescreen, removed E-039 step 5) gates are retired.
#
# RULE: No fee or spread constant may be hardcoded anywhere else after Improvement 09.
# Grep audit: search for hardcoded fee constants in tools/ and skills/.
#
# Created: 2026-07-02 (Improvement 09)
# Updated: 2026-07-04 (Cost-structure revision) — see execution_style block below.
# Updated: 2026-07-20 (Perp calibration) — see PERP CALIBRATION block below.

version: "1.2"
created_at: "2026-07-02"
updated_at: "2026-07-20"

# ---------------------------------------------------------------------------
# FEE-TIER VERIFICATION (2026-07-04, cost-structure revision)
# ---------------------------------------------------------------------------
# Verified against Binance's published spot fee schedule (binance.com/en/fee/schedule,
# accessed 2026-07-04). Account has no live API keys configured (trading-bot/config.json
# api.key/secret empty, test_mode=true) and no trading history, so tier cannot be read
# back from the account directly — assumed tier is Regular/VIP0, confirmed by user.
#
# Regular/VIP0 (< $1,000,000 30-day volume, any BNB balance):
#   Maker 0.100% / Taker 0.100%  →  with 25% BNB discount: Maker 0.075% / Taker 0.075%
# IMPORTANT: at VIP0, maker and taker are the SAME rate upstream (both 0.100%), so the
# BNB-discounted rate is identical for both execution styles: 7.5 bps / 7.5 bps.
# Maker/taker fee rates only diverge starting VIP1 (>= $1M 30-day volume AND >= 5 BNB
# held): Maker 0.0675% / Taker 0.075% with BNB discount. This account does not meet
# VIP1 thresholds, so no fee-rate benefit is currently achievable from maker execution —
# any maker-execution cost advantage at this tier comes ONLY from avoiding the spread
# and market-impact/slippage of crossing the book, not from a lower fee. See
# execution_style block below, which models this correctly (identical fee_bps,
# spread_cost_bps=0 for maker).
# Re-verify this section if account volume/BNB balance changes tier.

# ---------------------------------------------------------------------------
# HARD RULE (2026-07-04, cost-structure revision)
# ---------------------------------------------------------------------------
# verdict_execution_style: taker
# Every post-backtest pass/fail decision and all promotion
# evidence (promotion_audit, holdout_result, verdict_interpretation) MUST use the
# taker cost path (top-level fee_rate_bps / round_trip_cost_bps, equivalently
# execution_style.taker) — never execution_style.maker. The maker variant is
# SENSITIVITY-ONLY: it may be reported alongside a taker-based verdict to show "how
# much would this change under an unvalidated fill-rate assumption," but it may never
# be the basis for a pass/fail decision, a plausibility rating, or a promotion. This
# is because maker's fill-rate haircut is an unvalidated assumption (see
# execution_style.maker below and engineering/improvements/done/design_and_docs/10_maker_execution_assessment.md) — no
# order-book data exists to calibrate it, so it cannot support a gating decision.
# A verdict or promotion audit that reports a pass driven by
# execution_style.maker numbers without an accompanying taker-based pass is invalid.
verdict_execution_style: taker

# Safety factor: required_gross_edge = safety_factor × round_trip_cost
# Used AFTER the backtest only (post_backtest_cost_check in run_artifact.py, information).
safety_factor: 2.0

# One-way taker fee in bps (basis points, 1 bps = 0.01%)
# Binance spot, Regular/VIP0 tier, BNB discount applied (0.075% per side)
# NOTE: used by run_protocol.py _cost_paid_bps() as 'fee_rate_bps[symbol]'
# NOTE: this top-level block is the TAKER path and is what existing code consumes
# (run_artifact.py._load_cost_model / _round_trip_cost_bps, run_protocol.py._cost_paid_bps
# both read these keys directly at the root; prescreen_signal.py, which also did, was removed). Do not restructure these keys — see
# execution_style block below for the additive maker variant.
fee_rate_bps:
  BTCUSDT: 7.5
  ETHUSDT: 7.5
  SOLUSDT: 7.5
  AVAXUSDT: 7.5
  BNBUSDT: 6.0    # maker tier discount on BNB
  default: 7.5

# Typical bid-ask spread estimate in bps (one-way, applied once per round-trip)
spread_estimate_bps:
  BTCUSDT: 1.5
  ETHUSDT: 2.0
  SOLUSDT: 3.0
  AVAXUSDT: 4.0
  BNBUSDT: 2.0
  default: 3.0

# Market impact / slippage estimate in bps (one-way)
slippage_estimate_bps:
  BTCUSDT: 0.5
  ETHUSDT: 0.5
  SOLUSDT: 1.0
  AVAXUSDT: 1.5
  BNBUSDT: 0.5
  default: 1.0

# Pre-computed round-trip cost in bps:
#   round_trip_cost = 2 * taker_fee + spread + slippage
# BTCUSDT: 2*7.5 + 1.5 + 0.5 = 17.0
# ETHUSDT: 2*7.5 + 2.0 + 0.5 = 17.5
# SOLUSDT: 2*7.5 + 3.0 + 1.0 = 19.0
# AVAXUSDT: 2*7.5 + 4.0 + 1.5 = 20.5
round_trip_cost_bps:
  BTCUSDT: 17.0
  ETHUSDT: 17.5
  SOLUSDT: 19.0
  AVAXUSDT: 20.5
  BNBUSDT: 15.0
  default: 18.5

# ---------------------------------------------------------------------------
# PERP CALIBRATION (2026-07-20, Phase 1.2 / Dispatch H)
# ---------------------------------------------------------------------------
# Additive block, NOT a replacement for the top-level (spot) fee_rate_bps above and
# NOT read by default. run_protocol.py only consumes this block when explicitly
# invoked with --cost-product=perp (see that file's _commission_rate_for_symbol);
# every other invocation continues to read the top-level fee_rate_bps exactly as
# before this block existed -- this is deliberate, so unrelated spot runs are never
# silently re-costed at perp rates.
#
# Why this exists: the 2026-07-20 recon (engineering/sessions/session_reports/20260720_venue_cost_wiring.md,
# Dispatch F2) found that trading-bot/execution/portfolio_info.py's SHORT trades
# (present in rsi_momentum_trending_cost_drag/run_018 and
# keltner_scoremode_no_edge/run_028+030) are simulated via margin borrow/sell/repay
# mechanics, not literal perpetual futures. Dispatch G's venue research
# (docs/analysis-reports/venue_survey_20260719.md, 2026-07-20 supplement) then found Kraken spot-margin's
# legal availability for French/EU retail is NOT confirmed either way, while Kraken
# perpetual futures ARE confirmed available to French/EU retail (CySEC licence 342/17,
# subject to a MiFID II appropriateness test -- see the original 2026-07-19 survey
# body). Given that gap, this dispatch costs these two price-based, SHORT-containing
# targets as if executed via Kraken's perp product (the confirmed-available
# shortable venue) rather than margin (unconfirmed) -- a deliberate substitution for
# costing purposes, not a claim that the engine executes real perpetual contracts.
#
# fee_rate_bps: Kraken perpetual-futures taker fee, base tier -- 0.05% = 5 bps
# (docs/analysis-reports/venue_survey_20260719.md's original comparison table, "Perp maker/taker
# (base tier)" row: "Official docs: 0.0200% / 0.0500% at $0+"). Flat across all
# symbols/default: the source is a single tiered schedule, not per-symbol, so no
# per-symbol breakdown is fabricated here.
#
# round_trip_cost_bps: 2 * 5.0 = 10.0 (same 2-events-per-round-trip convention as
# the top-level spot block -- confirmed symmetric between LONG and SHORT by direct
# code read of portfolio_info.py's update_local_balance, see
# _commission_rate_for_symbol's docstring in run_protocol.py). Funding is NOT
# included in this figure -- see the funding note immediately below.
#
# FUNDING NOT MODELED: this cost figure prices ONLY the taker fee round-trip. Kraken
# perpetual funding cash flows (docs/analysis-reports/venue_survey_20260719.md's 2026-07-20
# supplement: EEA funding interval 1h, rate bound +/-0.5%/hr, representative BTC
# rate ~1.8738%/year per the CF Benchmarks KFRI index) are NOT modeled anywhere in
# this cost_model.yaml or in run_protocol.py's wiring. Consequently this
# round_trip_cost_bps is valid ONLY for price-based strategies whose edge does not
# depend on funding-rate carry. Funding-carry strategies (the FUNDING_MR_DAILY_RETEST
# family) are explicitly EXCLUDED from being costed with this block -- a fee-only
# perp re-run of them would omit the funding credit that is their entire thesis,
# understating or mis-signing their true edge. They remain deferred to a dedicated
# funding-modeling build, not re-run here.
perp:
  fee_rate_bps:
    default: 5.0
  round_trip_cost_bps:
    default: 10.0
  # FUNDING ACCRUAL (2026-07-24, additive off-by-default mechanism per
  # engineering/sessions/session_reports/20260724_funding_cashflow_model_design.md §5).
  # Declares WHERE the funding series comes from and its sign convention so no
  # funding constant is hardcoded in code (honoring the top-of-file HARD RULE). The
  # engine mechanism (trading-bot: CommonPortfolioDef.apply_funding + the flag-gated
  # hook in TradingBot._process_symbol_candle_completion) is OFF by default and reads
  # NO constant from here; this block is the documented source id + convention that a
  # future funding-costed re-run (a re-pinned protocol, not yet authored) resolves the
  # daily funding series against. No re-cost has been run.
  funding:
    modeled: false            # mechanism exists but is off by default; no re-cost run
    source_id: binance_perp_funding_8h
    # Per-symbol 8h Binance funding CSVs on disk (trading-bot/local_data/
    # {symbol}_funding_8h.csv), summed to a daily COST series by
    # data/feed_registry.py::build_daily_funding_series. This is DISTINCT from the
    # forward-filled funding_rate SIGNAL feed the strategy component reads.
    cadence: 8h_settlements_summed_to_daily
    sign_convention: positive_funding_longs_pay_shorts
    # Binance-vs-Kraken funding basis is an open calibration question (design §6 Q1);
    # in-sample re-costing uses the Binance 8h series above as the proxy.
    venue_note: in_sample_proxy_binance_8h_live_venue_kraken_perp_1h

# ---------------------------------------------------------------------------
# EXECUTION STYLE VARIANTS (2026-07-04, cost-structure revision)
# ---------------------------------------------------------------------------
# Additive block — NOT yet read by any code path. The top-level keys above remain
# the only keys run_artifact.py and run_protocol.py consume today (taker path).
# This block is the documented single source for a future maker-path opt-in; wiring
# it into the engine/backtest is a backlog item (see engineering/improvements/done/design_and_docs/10_maker_execution_assessment.md),
# out of Phase P research scope per the cost-structure revision instructions.
#
# P2 universe only (BTCUSDT/ETHUSDT/SOLUSDT/AVAXUSDT) — confirmed by user 2026-07-04.
#
# taker: mirrors the top-level keys exactly (kept here for symmetry so future code
#        can loop execution_style[style][symbol] uniformly instead of special-casing).
#
# maker: post-only / LIMIT_MAKER order assumption.
#   fee_bps            — IDENTICAL to taker at this account's Regular/VIP0 tier (see
#                         FEE-TIER VERIFICATION above). Maker saves nothing on the fee
#                         rate itself here; it only avoids spread + most slippage.
#   spread_cost_bps     — 0. A resting order at/inside the best bid/ask is matched at
#                         its own quote, not crossing the spread. Conservative: we do
#                         NOT credit spread capture as a positive edge, only its absence
#                         as a cost.
#   adverse_selection_bps — proxy for the real risk of resting orders: being filled
#                         disproportionately right before the market moves against the
#                         quote. Modeled as 50% of the taker slippage_estimate_bps per
#                         symbol. UNVALIDATED ASSUMPTION — no order-book data exists to
#                         calibrate this (order_book feed is unavailable per
#                         config/available_feeds.yaml). Backlog: calibrate once/if
#                         order_book feed is acquired.
#   round_trip_cost_bps_if_filled = 2*fee_bps + spread_cost_bps(0) + adverse_selection_bps
#   assumed_fill_rate   — UNVALIDATED ASSUMPTION. Higher for BTC/ETH (deep books, tight
#                         typical spread → resting orders near touch fill reliably before
#                         a 1h signal decays), lower for SOL/AVAX (thinner books). No
#                         historical fill-rate data exists for this account; these are
#                         placeholder priors pending calibration (see backlog doc).
#   unfilled_handling   — assumed policy used to compute the blended cost below: an
#                         unfilled maker order is cancelled and re-submitted as a taker
#                         market order (chase-fill). This is an ASSUMPTION for cost
#                         modeling purposes, not an implemented behavior.
#   round_trip_cost_bps_blended = fill_rate * round_trip_cost_bps_if_filled
#                                 + (1 - fill_rate) * taker.round_trip_cost_bps[symbol]
#                         This is the number a backtest should use if it wants to assume
#                         maker execution — per the cost-structure revision instructions,
#                         ONLY with this explicit fill-rate haircut, never the unfilled
#                         (best-case, fill_rate=1.0) number.
execution_style:
  taker:
    fee_bps:            {BTCUSDT: 7.5, ETHUSDT: 7.5, SOLUSDT: 7.5, AVAXUSDT: 7.5, default: 7.5}
    spread_cost_bps:    {BTCUSDT: 1.5, ETHUSDT: 2.0, SOLUSDT: 3.0, AVAXUSDT: 4.0, default: 3.0}
    slippage_bps:       {BTCUSDT: 0.5, ETHUSDT: 0.5, SOLUSDT: 1.0, AVAXUSDT: 1.5, default: 1.0}
    round_trip_cost_bps: {BTCUSDT: 17.0, ETHUSDT: 17.5, SOLUSDT: 19.0, AVAXUSDT: 20.5, default: 18.5}

  maker:
    fee_bps:                 {BTCUSDT: 7.5, ETHUSDT: 7.5, SOLUSDT: 7.5, AVAXUSDT: 7.5, default: 7.5}
    spread_cost_bps:         {BTCUSDT: 0.0, ETHUSDT: 0.0, SOLUSDT: 0.0, AVAXUSDT: 0.0, default: 0.0}
    adverse_selection_bps:   {BTCUSDT: 0.25, ETHUSDT: 0.25, SOLUSDT: 0.5, AVAXUSDT: 0.75, default: 0.5}
    # round_trip_cost_bps_if_filled = 2*fee + spread_cost(0) + adverse_selection
    #   BTC: 2*7.5+0+0.25=15.25  ETH: 15.25  SOL: 2*7.5+0+0.5=15.5  AVAX: 2*7.5+0+0.75=15.75  default: 15.5
    round_trip_cost_bps_if_filled: {BTCUSDT: 15.25, ETHUSDT: 15.25, SOLUSDT: 15.5, AVAXUSDT: 15.75, default: 15.5}
    assumed_fill_rate:       {BTCUSDT: 0.65, ETHUSDT: 0.65, SOLUSDT: 0.50, AVAXUSDT: 0.45, default: 0.50}
    unfilled_handling: cancel_and_convert_to_taker  # assumption; not implemented in engine
    # round_trip_cost_bps_blended = fill_rate*if_filled + (1-fill_rate)*taker.round_trip_cost_bps
    #   BTC:  0.65*15.25 + 0.35*17.0 = 15.86
    #   ETH:  0.65*15.25 + 0.35*17.5 = 16.04
    #   SOL:  0.50*15.5  + 0.50*19.0 = 17.25
    #   AVAX: 0.45*15.75 + 0.55*20.5 = 18.36
    #   default: 0.50*15.5 + 0.50*18.5 = 17.0
    round_trip_cost_bps_blended: {BTCUSDT: 15.86, ETHUSDT: 16.04, SOLUSDT: 17.25, AVAXUSDT: 18.36, default: 17.0}

# RETIRED AS GATES (O-3, 2026-10-01). Kept as the definitions behind information-only
# fields: step 1a's / validation's cost_feasibility estimate, and the post-backtest cost
# check in run_artifact.py. Neither may refuse, park or drop an idea before its backtest.
#
# cost_feasibility estimate (step 1a / validation, LLM, information only):
#   required_gross_edge_bps_per_trade = safety_factor * round_trip_cost_bps[symbol]
#   e.g. BTCUSDT: 2.0 * 17.0 = 34.0 bps required gross edge per trade
#
# Edge estimate (formerly the prescreen's Layer 2 gate; now computed after the backtest
# from its own trades, run_artifact.py post_backtest_cost_check, information only):
#   estimated_gross_edge_bps_per_trade = abs(IC) * sigma_bar_bps * sqrt(avg_holding_bars)
#   where:
#     IC             = Pearson forecast/forward-return correlation on active bars
#                      (forecast != 0)
#     sigma_bar_bps  = std dev of 1-bar close returns in bps
#     avg_holding_bars = the backtest's avg_trade_duration_bars
#   edge_to_cost_ratio = estimated_gross_edge_bps_per_trade / round_trip_cost_bps
#   (historical: the prescreen passed an idea when edge_to_cost_ratio >= safety_factor;
#   the A9.1 Keltner calibration fixture belonged to that retired gate.)
# The binding cost test is card E's pooled realized_edge_to_cost_ratio, measured from the
# backtest's trades (config/criterion_menu.yaml, config/profitability_bars.yaml).
