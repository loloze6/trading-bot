      # brief is marked exhausted after decide_next.BRIEF_MAX_CONSECUTIVE_EMPTY_R2
      # (2) consecutive R2 requests with no new card, so R2 terminates; the
      # loop stops only when no eligible brief is open. Legacy briefs (no brief_status) never trigger R2 and
      # get a one-time "[obsolete] ..." queue-entry title (brief file untouched).
  verdict_routing_retired:
