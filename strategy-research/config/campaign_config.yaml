      # finished entry is saved `done` only after that (a failure is retried).
      # Novelty = the exact match (config hash + measured symbols + the
      # protocol file's timeframe + a content hash of its windows) against
      # campaign_memory.yaml, binding; the legacy digest is recorded for
      # information only. Ranking: confidence_real desc, distance_to_profitable
