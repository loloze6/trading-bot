  score_provenance:
    enabled: false
      # C5.7b-1 (D-048; engineering/review_2026-09-27/C5_7B_PROVENANCE_S1.md,
      # review finding C12). OFF BY DEFAULT, read by
      # run_phase1_research._score_provenance_enabled(). HARD DEPENDENCY: raises
      # (strict bool; on without specialist_readers) in run_loop's pre-flight
