      # byte-identical (tests/test_c5_7b1_model_id_stamp.py).
      #
      # While true: the model that actually answered (AssistantMessage.model)
      # is captured on each reader call and each Claude stage call. The reader
      # proposals' and the brief-card scores' `model_id` is STAMPED by code with
      # that observed id (several distinct models: sorted, comma-joined); the
      # model's own self-report is kept only in the audit log. The stage's
      # audit-log entry gains a `provenance` block: requested, observed
      # (observed_models), self_reported, mismatch (the observed model differs
      # from the REQUESTED one -- not from the self-report, which differs on most
      # calls) and self_report_differs (informational). Nothing raises, retries
      # or stops on a mismatch. No observed model (a stub, an empty stream)
