      # sections 2, 2.3 and 4). OFF BY DEFAULT, read by
      # run_phase1_research._claim_tests_enabled(). HARD DEPENDENCY: raises if
      # true while config_direct_authoring.enabled is false/absent. While
      # false: nothing is read or written (byte-identical).
      #
      # While true (a claim is INFORMATION ONLY: nothing here ever stops,
      # parks or reroutes a run): step 1a gets workflow_artifacts/skills/
      # hypothesis-design/CLAIM_TESTS.md (the SKILL files are untouched) and
      # writes a `claim` block in every card (a statement, its kind, 1-3 tests
      # composed from the four slots and/or criteria_refs, pass_if/fail_if,
      # rationale), or `tests: none` with missing_block. tools/claim_card.py
      # checks every card before 1b: a refused claim or a min_events floor above
      # (bars / longest horizon) x coins gets 1a's one retry; whatever remains
      # is recorded (artifacts/claim_test_status.yaml, campaign_record/
      # claim_test_coverage.yaml, counted in the campaign summary; `tests: none`
      # also appends campaign_record/test_requests.yaml) and the run continues.
      # A queued card launched at 1b is checked there, warn-only. Regime-
      # selector tests are effect-size only (verdict_possible: false). After
      # 1b, a 1a/1b mismatch is a warning in artifacts/claim_match.yaml.
      # E-068 slice 3 (CUL-393, D-067): after protocol_execution, every test
      # of the run's own card is MEASURED on each graded variant's saved
      # bars.csv (tools/claim_measure.py): effect sizes and window signs per
      # coin, "measured, not proven" -> artifacts/variants/<vid>/
      # claim_test.yaml, artifacts/claim_measurement.yaml (measured / not_measured
      # with a reason), counted in claim_test_coverage.yaml. No p-value, no
      # verdict (CUL-394); not a grid criterion; any error is recorded and
      # the run continues.
  reader_findings:
    enabled: false
      # E-068 slice 5 (CUL-403, D-073, DESIGN_PROPOSAL.md sections 6 and 8).
      # OFF BY DEFAULT, read by run_phase1_research._reader_findings_enabled().
      # HARD DEPENDENCY: raises if true while claim_tests.enabled or
      # specialist_readers.enabled is false/absent. While false: byte-
      # identical (the v2 reader SKILLs, handoffs, prompts and files are
      # untouched; v3 files already written still load).
      #
      # While true: readers v3. Short SKILLs under workflow_artifacts/skills/
      # readers_v3/ plus READING_CONTRACT.md; CLAIM_TESTS.md replaces the
      # design guide (the catalogue stays); added inputs: claim_measurement.yaml,
      # artifacts/claim_result_digest.yaml (the variants' claim_test.yaml
      # numbers, bound to this attempt's bars) and artifacts/
      # findings_summary_for_readers.yaml (earlier runs' findings). Code skips
      # regime_power when the manifest lists /regime_detector as scaffolding
      # or the detector is constant, and component_attribution when every
      # variant has at most one component: a `skipped` reading with its rule
      # (never `[]`), counted in campaign_record/reader_skips.yaml and the
      # campaign summary. Each reader writes ONE reading: an explanation,
      # 0-2 side findings (claim blocks, check_claim) and at most one patch
      # (resolved against the base config, never on scaffolding). No verdict
      # field. Decide-next takes a side finding as a candidate whose brief
      # carries the claim pre-filled; a repeated spec_hash or a block claim
      # whose tests cannot see the block is a warning, never a refusal.
  observable_backtest:
    enabled: false
      # E-073 (P-CUL-81, D-081): the observable-backtest epic's ONE flag. OFF
      # BY DEFAULT, read by run_phase1_research._observable_backtest_enabled().
      # HARD DEPENDENCY: raises if true while reader_findings.enabled is
      # false/absent (step 1 changes only the v3 readers' inputs). While false:
      # byte-identical (the v3 readers' handoffs and prompts are untouched).
      #
      # While true (step 1): docs/DATA_DICTIONARY_READERS.md -- the readers'
      # subset of docs/DATA_DICTIONARY.md (generated by tools/data_dictionary.py;
      # no bars.csv section, no per-trade labels): every field the readers
      # read, its meaning, unit, the code that writes it and whether it is
      # known at the bar's close or only after the fact, plus the audit
      # findings and what is not recorded -- is an extra required input of
      # every v3 reader, with one line in the handoff telling the reader to
      # look a field up there before citing it. Later E-073 steps (citation
      # checks, E-029, E-027) will add to this flag.
  operator_approval:
    enabled: false
      # E-068 PR 4 (D-071, CUL-399). OFF BY DEFAULT, read by
      # run_campaign._operator_approval_enabled(). HARD DEPENDENCY: refused by
      # the launch pre-flight if true while decide_next.enabled or
      # verdict_routing_retired.enabled is false/absent (without the latter the
      # legacy refine/pivot/escalate routing mints continuation runs that no
      # approval holds).
      # While false: byte-identical (every entry is created exactly as before).
      #
      # While true: every queue entry the AGENT creates or flips to `ready` is
      # instead created/left as `blocked_on_operator_approval` -- decide-next's
      # reader candidate, a brief's extra card (queued -> held), R2's new and
      # waiting requests, R1's composition, and the campaign-review reframe.
      # Applied at apply time in run_campaign (tools/decide_next.py stays pure);
      # the decision record says so (picked.status, r2 enqueued status and
      # awaiting_approval). The held entry counts as an operator hold (a held R2
      # request or extra card holds its brief: R2 never mints behind it) and is
      # never auto-picked. The
      # operator approves one with `run_campaign.py --approve <id>` (sets it
      # ready). Operator actions (`register`, --unpark, --resume) are unchanged.
  nearest_build:
    enabled: false
      # E-068 (operator, 2026-10-05; D-075). OFF BY DEFAULT, read by
      # run_phase1_research._nearest_build_enabled(). HARD DEPENDENCY: raises if
      # true while config_direct_authoring.enabled or claim_tests.enabled is
      # false/absent (step 1b, the stage it changes, runs only in the config-
      # direct flow; the deviations go into the claim's finding and the readers'
      # digest, which exist only under claim_tests -- the finding itself is
      # written at regroup_record). While false: byte-identical.
      #
      # While true: step 1b builds the NEAREST version of an idea instead of
      # parking it (workflow_artifacts/skills/strategy-config-authoring/
      # NEAREST_BUILD.md, a flag-on-only input; the SKILL is untouched): the
      # closest config the components and transforms allow, spec_ready, each
      # difference in decision.yaml `deviations` (clause, built_instead,
      # missing, effect). Code writes artifacts/deviations.yaml, appends each
      # missing piece to campaign_record/component_requests.yaml as `kind:
      # deviation, run_continued: true` (never an --unpark, quarantine-cap or
      # decide-next request-count input), and shows the deviations FIRST in the
      # finding ("this run tested an approximation of the idea: ..."), the
      # findings summary row (a deviations count) and the readers' digest. A
      # component_gap must name `core_lost: {clause, why}` (else O-21's one
      # retry); it is recorded in deviations.yaml and on the request row.
  explore_confirm:
    enabled: false
      # E-072 (P-CUL-80, D-080, engineering/roadmap/E-072/PHASE_A.md). OFF BY
      # DEFAULT, read by run_phase1_research._explore_confirm_enabled(). HARD
      # DEPENDENCY: raises if true while reader_findings.enabled or
      # variant_loop.enabled is false/absent. While false: byte-identical (no
      # split, no artifacts/exploration/, the readers' handoffs unchanged).
      #
      # While true (tools/explore_confirm.py; information only): at
      # protocol_execution entry, BEFORE the backtests, the run's protocol
      # windows are split and recorded in artifacts/explore_confirm.yaml (in
      # time order, first half = exploration, the rest = confirmation; the
      # 6 x 4-month 2022-2023 protocol: 2022-01/05/09 vs 2023-01/05/09). The
      # readers see exploration windows only: code writes their copies under
      # artifacts/exploration/ (the five reports, the grid re-reduced on those
      # windows with pooled criteria and the idea status withheld, the claim
      # digest measured again on those windows, the earlier findings and the
      # registry summary with their numbers withheld) plus
      # readers_v3/EXPLORATION.md. After the readers, each side finding is
      # measured on the confirmation windows: a price-only finding in the same
      # run (claim_measure on the base variant's bars), a block claim
      # (forecast/regime) `pending` until the run built from it measures its
      # own claim on its own confirmation windows. Recorded as
      # confirmation_sign_retained: true | false | pending in
      # artifacts/confirmation.yaml and campaign_record/confirmations.yaml,
      # which counts every look (tests and test x horizon comparisons) per
      # confirmation set; the campaign summary shows the counts. The bar is
      # "the sign held on unseen windows, counted against the looks", never
      # "proven". Nothing here routes, stops, parks or ranks a run.
  cost_bar_all_costs:
    enabled: false
      # CUL-414 (D-082; audit finding A7 in docs/DATA_DICTIONARY.md). OFF BY
      # DEFAULT, read by run_phase1_research._cost_bar_all_costs_enabled(). No
      # dependency. While false: byte-identical (run_protocol.py's arguments,
      # the trade records, the summary and both D-038 bars unchanged).
      #
      # While true (a DECLARED OUTPUT CHANGE: the bar gets stricter): the
      # D-038 "survives 2x costs" ratio (> 2.2) compares the gross edge per
      # trade BEFORE fees and slippage with the cost per trade = fees +
      # slippage, both legs, as the engine modelled them for that trade.
      # Flag off it compares a return already net of slippage (fill prices)
      # with fees only. run_protocol.py gets --cost-bar-all-costs: each trade
      # record also carries gross_return_before_costs, slippage_paid and
      # cost_paid_all (from the fills and the bar closes they were priced
      # from), the summary realized_edge_to_cost_ratio_all_costs. The menu
      # criterion realized_edge_to_cost_ratio reads that field (evaluate_grid)
      # and profit_bars_v2's cost_edge_ratio_min uses
      # pooled_edge_to_cost_ratio(all_costs=True). Existing fields keep their
      # values. Operator decision 2026-10-08: switch on before the next
      # comparison of results.
# ---------------------------------------------------------------------------
# Verdict interpreter thresholds (SKILL.md reference)
# ---------------------------------------------------------------------------

verdict_interpreter:
  # These are defined in SKILL.md and applied by the LLM agent, not code.
  # Listed here as the canonical reference for future deterministic migration.
  trade_floor_per_window: 5      # per-window "sparse" threshold (A3.4 gate)
  cumulative_trade_floor: 15     # hard cumulative floor below which run is "not validated"
  edge_arbitraged_threshold: 30  # >= 30 total trades required for edge_arbitraged_away diagnosis
  cost_drag_pct_threshold: 80    # cost consumes > 80% of gross PnL → cost_drag root cause
  weak_signal_ic_floor: 0.03     # |IC| < 0.03 → no directional edge (Rule 2)
  signal_inversion_ic_ceiling: -0.03  # IC < -0.03 AND significant → signal_inversion (Rule 3)
  min_bars_per_regime: 20        # regime window with < 20 bars treated as noise (Rule 4)

# ---------------------------------------------------------------------------
# A8.6 — Symbol correlation (used in n_eff_symbols = n / (1 + (n-1)*rho) formula)
# ---------------------------------------------------------------------------

symbol_correlation:
  btc_eth_return_correlation_1h: 0.82
  # Formula: n_eff_symbols = n / (1 + (n-1) * rho)
  # At rho=0.82, two symbols give n_eff_symbols ≈ 1.10 (not sqrt(2) ≈ 1.41).
  # This is the A8.6-mandated correction replacing the sqrt(n) heuristic.
  # A sqrt(n) approximation materially overstates power and is not acceptable (A8.6 amendment).
  #
  # To measure: compute Pearson correlation of close-to-close log returns on 1h OHLCV.
  #   import pandas as pd; from scipy.stats import pearsonr
  #   btc_ret = pd.read_parquet("btc_1h.parquet")["close"].pct_change().dropna()
  #   eth_ret = pd.read_parquet("eth_1h.parquet")["close"].pct_change().dropna()
  #   aligned = pd.concat([btc_ret, eth_ret], axis=1).dropna()
  #   rho, _ = pearsonr(aligned.iloc[:,0], aligned.iloc[:,1])
  # Campaign range: 2024-01-01 to 2025-12-31. Update this value when measured.
