# campaign_config.yaml
# Campaign-specific constants that encode venue / timeframe / market assumptions.
# Constants justified as mathematical or statistical conventions stay in code (see comments).
# Version: 1.1  Created: 2026-07-03 (Portability audit, Improvement 05)
#              Updated: 2026-07-04 (A8.6 rho formula, Fix 1)
#
# NOTE — "config-only new campaign" bar is NOT yet met.
# The constants listed here are canonical references; the running code still reads
# its own named module-level constants (e.g. _BLOCK_SIZE_1H = 24 in prescreen_signal.py).
# A runtime-loading refactor (config read at startup) is deferred. Until that lands,
# test_campaign_config_sync.py enforces that config values and code constants stay in sync.
# A divergence is a hard failure in the regression suite.

# ---------------------------------------------------------------------------
# Prescreen / IC computation (prescreen_signal.py)
# ---------------------------------------------------------------------------

prescreen:
  block_size_1h: 24          # bars per autocorrelation episode at 1h (= bars per day)
                              # Governs N_eff = active_bars / block_size
  block_size_1d: 1           # 2026-07-07: a daily bar IS already one calendar day --
                              # no intra-day autocorrelation block to divide out.
                              # Mirrors block_size_1h's own logic (bars-per-day ==
                              # block_size); see prescreen_signal.py._BLOCK_SIZE_1D
                              # and run_phase1_research.py._A86_BLOCK_SIZE_BY_TIMEFRAME.
  significance_threshold: 0.10  # p-value gate; IC is "significant" only when p < this
  sigma_bar_bps_degenerate_fallback: 15.0
    # Degenerate placeholder ONLY: _sigma_from_records() returns this literal value
    # when len(returns) < 5 (data-starved edge case — statistics.stdev() is not
    # computed at all below this floor). It is NEVER used when >= 5 return
    # observations are available, which includes every real run to date (e.g.
    # run_042: full-sample pooled BTC/ETH sigma_bar_bps = 62.52, measured).
    # Do NOT read this as a "typical 1h crypto volatility" assumption — it isn't
    # one, and treating it as such previously produced a 4.17x cost-ratio error
    # in a viable-space projection (see engineering/improvements/done/design_and_docs/11_viable_space_map.md Part 1).

  # Constants staying in code (mathematical / statistical — not campaign assumptions):
  #   dof = n_eff - 3        (Fisher z-transform DOF correction)
  #   z_95 = 1.96            (95% CI z-multiplier)
  #   near_zero_multiplier: 2.0  (|IC| < 2*SE ≈ p > 0.05)
  #   active_threshold: 1e-6 (numerical precision floor for "signal fired")
  #   min_bars_for_stdev: 5  (need ≥ 5 bars to compute stdev; statistical minimum)
  #   min_block_size_floor: 6 (degenerate-block floor for non-1h timeframes)

# ---------------------------------------------------------------------------
# A8.5.1a — episode-blocked significance (episode_significance.py)
# ---------------------------------------------------------------------------
# New methodology for sparse signals over multi-era backfilled data (P1b). See
# engineering/improvements/done/design_and_docs/AMENDMENTS_01-06.md "A8.5.1a-spec" for the full specification.

episode_significance:
  gap_bars: 48                    # max inactive bars between active bars within one episode
                                    # (48 bars @ 1h ~= 2 days). Gaps > this, or an era
                                    # boundary, close the episode.
  density_fallback_pct: 50.0       # if activation >= this %, episodes degenerate into the
                                    # whole series -> use the existing 24-bar block method.
  min_n_episodes: 8                # below this floor, no significance claim is made
                                    # (disposition stays insufficient_sample_inconclusive
                                    # regardless of p-value).
  n_resamples: 2000                # bootstrap resample count (episodes resampled with
                                    # replacement, same episode count as observed)

# ---------------------------------------------------------------------------
# Regime detector validation (validate_regime_detector.py)
# ---------------------------------------------------------------------------

regime_detector:
  activation_band_min: 0.10   # lower bound of plausibility band for trending activation rate
  activation_band_max: 0.40   # upper bound; activation outside [10%, 40%] caps confidence at medium
                               # Encodes 1h BTC/ETH crypto regime plausibility
  default_start: "2024-01-01" # campaign walk-forward start date (CLI default)
  default_end:   "2025-12-31" # campaign walk-forward end date (CLI default)

  # Constants staying in code (detector architecture, not campaign assumptions):
  #   high_persistence: 24    (min bars per regime episode for high confidence)
  #   high_transitions: 4     (max transitions per window for high confidence)
  #   high_sensitivity: 0.15  (max gate sensitivity for high confidence)
  #   medium_persistence: 12  (min persistence for medium confidence)
  #   medium_sensitivity: 0.25
  #   rare_label_threshold: 0.10  (switch to class-conditional sensitivity below this)
  #   bars_per_window: 720    (~30 days at 1h; detector architecture constant)
  #   perturbation_down: 0.90 / up: 1.10  (±10% sensitivity analysis; methodology constant)

# ---------------------------------------------------------------------------
# Orchestrator / pipeline governance (run_phase1_research.py)
# ---------------------------------------------------------------------------

orchestrator:
  token_budget_per_run: 300000          # SUPERSEDED by token_budget_per_run_weighted_units below
                                         # (F4c, 2026-07-05) — kept only as a historical reference of
                                         # the old raw-token-sum semantics; no longer read by the loop.
  token_budget_per_run_weighted_units: 1500000
    # F4c circuit breaker, ACTUALLY read at runtime by _load_token_budget() (unlike every other
    # constant in this file — see the module docstring's "declared parity only" note; this one is an
    # explicit exception because it's an operational knob, not an architectural constant).
    # Units are cost-WEIGHTED tokens (input x1.0, output x5.0, cache_read x0.1, cache_creation x1.25 —
    # see _weighted_token_units()), not raw token counts. A raw sum treated a heavily-discounted
    # cache-read token as equally expensive as a fresh output token, so a single validation call with
    # 836,461 cache_read tokens (session-cumulative per claude_agent_sdk's own accounting across
    # num_turns internal turns) tripped the old 300k raw-token breaker even though its true dollar
    # cost was $0.35 (see run_047, 2026-07-05). Empirically, hypothesis_generation +
    # innovation_expansion + validation together came to ~478,000 weighted units for a real,
    # legitimately-approved reactivation hypothesis with a multi-turn validation call; 1,500,000
    # leaves headroom for the remaining LLM stages (backtest_specification, verdict_interpreter)
    # while still catching genuinely runaway behavior. Revisit if a normal run trips this again —
    # widen the constant, don't disable the breaker.
  max_refinements_default: 2            # default fallback when not in pipeline_state.yaml governance block
  review_every_n_runs_default: 6        # default campaign-review cadence
  distinct_failed_families_trigger: 2   # campaign review triggered when this many distinct families fail
  below_floor_pct_threshold: 50.0       # switch to expectancy mode when > this % of windows are sparse
                                         # (same value as verdict-interpreter; must stay in sync)
  halt_policy:
    quarantine_enabled: false
      # E-030 S2a. OFF BY DEFAULT and read at runtime by run_campaign._quarantine_enabled()
      # (a second explicit exception to this file's "declared parity only" rule, alongside
      # token_budget_per_run_weighted_units above — it is an operational knob, not an
      # architectural constant). While false, EVERY halt behaves exactly as it did before
      # E-030 S2a landed: `paused:<reason>` on the queue entry, the HALT line in
      # campaign_log.md, the halt_history append, and the campaign process exits. Proven by
      # tests/test_halt_quarantine_policy.py's flag-off/flag-on byte-comparison
      # (EPIC.md Done-when #3).
      #
      # While true, and ONLY for the four reasons the S1 taxonomy classified as
      # quarantine-safe on evidence (no_signal_artifact, component_execution_error,
      # component_gap, new_component_escalation), the campaign marks the entry and
      # CONTINUES instead of halting. Everything else — including unhandled_exception,
      # which covered 6 of the 14 measured halts and at least four unrelated root causes
      # (taxonomy R2) — still escalates to a human exactly as today. The escalate default
      # is the point: quarantine is the narrow, evidenced exception.
      #
      # NOT a retry switch. S2a deliberately ships the quarantine half only; see
      # E-030/EPIC.md S2 and the taxonomy's R2.
  exclusion_digest_input:
    enabled: false
      # E-032 S2a. OFF BY DEFAULT and read at runtime by
      # run_phase1_research._exclusion_digest_input_enabled() -- same shape as
      # halt_policy.quarantine_enabled just above (a third explicit exception to
      # this file's "declared parity only" rule). While false,
      # _apply_exclusion_digest_input() is a no-op: hypothesis_generation and
      # innovation_expansion's handoffs are never mutated, so the fully-assembled
      # prompt text those stages receive (_build_stage_prompt's output) is
      # byte-identical to before this feature existed. Proven by
      # tests/test_exclusion_digest_input.py's flag-off/flag-on prompt-text diff
      # (E-032 S2a's own off-by-default bar -- comparing assembled PROMPT TEXT,
      # not just asserting the code path is skipped).
      #
      # While true, campaign_record/exclusion_digest.yaml (built by
      # tools/build_exclusion_digest.py -- family-scoped (family, instrument,
      # timeframe) triples, freshly derived from run artifacts, never from
      # campaign_state.yaml's stale flat instruments_tried/timeframes_tried
      # lists) is unioned into optional_inputs for hypothesis_generation and
      # innovation_expansion ONLY, and only when the file exists on disk.
      #
      # This is raw material for the LLM stage, never a binding gate by itself
      # -- the mechanical refusal decision is tools/anti_adjacency_gate.py (a
      # deterministic `tool:` stage, same class as signal_prescreen), which
      # reads campaign_knowledge_base.yaml directly for its KB layer and this
      # digest for its per-family fallback layer. See
      # engineering/roadmap/E-032/EPIC.md and
      # engineering/roadmap/E-032/artifacts/s1_idea_generation.md Task 3.
  stale_input_path_fix:
    enabled: false
      # E-032 S2b. OFF BY DEFAULT and read at runtime by
      # run_phase1_research._stale_input_path_fix_enabled() -- same shape as
      # exclusion_digest_input.enabled just above (a fourth explicit exception
      # to this file's "declared parity only" rule). Repoints
      # hypothesis_generation's two OPTIONAL inputs that have never resolved
      # since the E-002 restructure (8f162fa6, 2026-08-06) moved them under
      # campaign_record/: campaign_knowledge_base.yaml and feed_wishlist.yaml.
      # While false, _apply_stale_input_path_fix() is a no-op -- the handoff
      # dict is never mutated, so the assembled prompt (_build_stage_prompt's
      # output) is byte-identical to before this feature existed. Proven by
      # tests/test_stale_input_path_fix.py's flag-off/flag-on prompt-text diff.
      #
      # While true, hypothesis_generation actually receives real KB and
      # feed-wishlist content for the first time in the pipeline's life --
      # declared here as a behavior change, not slipped in as a silent
      # bugfix (per the dispatching session's own framing of this class of
      # bug). Does NOT touch campaign_review's two REQUIRED inputs with the
      # identical stale-path bug, nor verdict_interpreter's one optional
      # instance -- see the code comment above _STALE_INPUT_PATH_FIXES for
      # why those are out of this story's scope.
  anti_adjacency_retry:
    enabled: false
      # E-032 S2c. OFF BY DEFAULT and read at runtime by
      # run_phase1_research._anti_adjacency_retry_enabled() -- same shape as
      # exclusion_digest_input.enabled / stale_input_path_fix.enabled just
      # above (a fifth explicit exception to this file's "declared parity
      # only" rule). Operator ruling (2026-08-23, E-032/EPIC.md Log):
      # "Retry up to 4 times with the exclusion list, then escalate to me."
      #
      # While false, _route_post_innovation_expansion() returns
      # STAGE_CONFIGS['innovation_expansion']['default_next'] ('validation')
      # immediately -- the anti_adjacency_gate tool is never imported, the
      # exclusion digest / KB are never read, and no new pipeline_state.yaml
      # field is written. run_loop's stage-advance logic is byte-identical to
      # its pre-E-032-S2c behavior. Proven by
      # tests/test_anti_adjacency_retry_policy.py's flag-off/flag-on
      # behavior comparison (same acceptance bar as S2a/S2b: compare actual
      # output, not just assert the code path is skipped).
      #
      # While true: right after innovation_expansion produces its
      # deliverables, the run's hypothesis_card.yaml is evaluated by
      # tools/anti_adjacency_gate.py (Layer 1 campaign_knowledge_base.yaml,
      # Layer 2 campaign_record/exclusion_digest.yaml). ADMIT -> validation,
      # attempt counter reset. REFUSE -> loop back to hypothesis_generation
      # with the refusal reason carried into its next prompt (a dedicated
      # counter, state['anti_adjacency_gate_retry']['attempts'], independent
      # of BOTH counters.refinements_used and stage_attempts -- E-030 S1.5
      # Piece 2 precedent). The 4th CONSECUTIVE REFUSE for the same lineage
      # step stops auto-actioning and escalates via the project's existing
      # human_pause mechanism (status=paused_for_human, flags.
      # anti_adjacency_gate_exhausted -> run_campaign._classify_human_pause).
      #
      # See engineering/roadmap/E-032/EPIC.md's S2c story entry and
      # 2026-08-23 operator-ruling Log entry.
  variant_selection_record:
    enabled: false
      # E-034 S2. OFF BY DEFAULT and read at runtime by
      # run_phase1_research._variant_selection_record_enabled() -- same
      # shape as exclusion_digest_input.enabled / stale_input_path_fix.enabled
      # / anti_adjacency_retry.enabled above (a sixth explicit exception to
      # this file's "declared parity only" rule).
      #
      # While false, _record_variant_selection() is a no-op: it returns
      # before reading anything else on disk, so no artifact is written and
      # backtest_specification's own outputs (backtest_spec.yaml,
      # decision.yaml) and every subsequent stage's inputs are byte-identical
      # to before this feature existed. Proven by
      # tests/test_variant_selection_record.py's flag-off/flag-on comparison
      # (same acceptance bar as S2a/b/c: compare actual pipeline
      # state/output, not just assert the code path is skipped).
      #
      # While true: right after backtest_specification produces a spec_ready
      # backtest_spec.yaml, its (schema-documented but NOT schema-enforced --
      # see engineering/roadmap/E-034/EPIC.md's 2026-08-24 S1-review entry --
      # no schema under workflow_artifacts/schemas/ is loaded by any code)
      # selected_variant_id field is read and matched against
      # expanded_hypothesis_card.yaml's expanded_variants menu. Missing or
      # unmatched -> RAISES (fail loud, halts the run) rather than writing a
      # broken record. On a match: writes artifacts/variant_selection.yaml
      # (the chosen variant, resolved instrument/timeframe, the LLM's own
      # rationale) and artifacts/variants_not_pursued.yaml (every other menu
      # entry, verbatim). See engineering/roadmap/E-034/artifacts/
      # s1_selection_record.md Task 3 for the full design.

# ---------------------------------------------------------------------------
# Verdict interpreter thresholds (SKILL.md reference)
# ---------------------------------------------------------------------------

verdict_interpreter:
  # These are defined in SKILL.md and applied by the LLM agent, not code.
  # Listed here as the canonical reference for future deterministic migration.
  trade_floor_per_window: 5      # per-window "sparse" threshold (A3.4 gate)
  cumulative_trade_floor: 15     # hard cumulative floor below which run is "not validated"
  edge_arbitraged_threshold: 30  # >= 30 total trades required for edge_arbitraged_away diagnosis
  cost_drag_pct_threshold: 80    # cost consumes > 80% of gross PnL → cost_drag root cause
  weak_signal_ic_floor: 0.03     # |IC| < 0.03 → no directional edge (Rule 2)
  signal_inversion_ic_ceiling: -0.03  # IC < -0.03 AND significant → signal_inversion (Rule 3)
  min_bars_per_regime: 20        # regime window with < 20 bars treated as noise (Rule 4)

# ---------------------------------------------------------------------------
# A8.6 — Symbol correlation (used in n_eff_symbols = n / (1 + (n-1)*rho) formula)
# ---------------------------------------------------------------------------

symbol_correlation:
  btc_eth_return_correlation_1h: 0.82
  # Formula: n_eff_symbols = n / (1 + (n-1) * rho)
  # At rho=0.82, two symbols give n_eff_symbols ≈ 1.10 (not sqrt(2) ≈ 1.41).
  # This is the A8.6-mandated correction replacing the sqrt(n) heuristic.
  # A sqrt(n) approximation materially overstates power and is not acceptable (A8.6 amendment).
  #
  # To measure: compute Pearson correlation of close-to-close log returns on 1h OHLCV.
  #   import pandas as pd; from scipy.stats import pearsonr
  #   btc_ret = pd.read_parquet("btc_1h.parquet")["close"].pct_change().dropna()
  #   eth_ret = pd.read_parquet("eth_1h.parquet")["close"].pct_change().dropna()
  #   aligned = pd.concat([btc_ret, eth_ret], axis=1).dropna()
  #   rho, _ = pearsonr(aligned.iloc[:,0], aligned.iloc[:,1])
  # Campaign range: 2024-01-01 to 2025-12-31. Update this value when measured.
