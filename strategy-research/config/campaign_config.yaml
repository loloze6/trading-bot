# campaign_config.yaml
# Campaign-specific constants that encode venue / timeframe / market assumptions.
# Constants justified as mathematical or statistical conventions stay in code (see comments).
# Version: 1.1  Created: 2026-07-03 (Portability audit, Improvement 05)
#              Updated: 2026-07-04 (A8.6 rho formula, Fix 1)
#
# NOTE — "config-only new campaign" bar is NOT yet met.
# The constants listed here are canonical references; the running code still reads
# its own named module-level constants (e.g. _BLOCK_SIZE_1H = 24 in prescreen_signal.py).
# A runtime-loading refactor (config read at startup) is deferred. Until that lands,
# test_campaign_config_sync.py enforces that config values and code constants stay in sync.
# A divergence is a hard failure in the regression suite.

# ---------------------------------------------------------------------------
# Prescreen / IC computation (prescreen_signal.py)
# ---------------------------------------------------------------------------

prescreen:
  block_size_1h: 24          # bars per autocorrelation episode at 1h (= bars per day)
                              # Governs N_eff = active_bars / block_size
  block_size_1d: 1           # 2026-07-07: a daily bar IS already one calendar day --
                              # no intra-day autocorrelation block to divide out.
                              # Mirrors block_size_1h's own logic (bars-per-day ==
                              # block_size); see prescreen_signal.py._BLOCK_SIZE_1D
                              # and run_phase1_research.py._A86_BLOCK_SIZE_BY_TIMEFRAME.
  significance_threshold: 0.10  # p-value gate; IC is "significant" only when p < this
  sigma_bar_bps_degenerate_fallback: 15.0
    # Degenerate placeholder ONLY: _sigma_from_records() returns this literal value
    # when len(returns) < 5 (data-starved edge case — statistics.stdev() is not
    # computed at all below this floor). It is NEVER used when >= 5 return
    # observations are available, which includes every real run to date (e.g.
    # run_042: full-sample pooled BTC/ETH sigma_bar_bps = 62.52, measured).
    # Do NOT read this as a "typical 1h crypto volatility" assumption — it isn't
    # one, and treating it as such previously produced a 4.17x cost-ratio error
    # in a viable-space projection (see engineering/improvements/done/design_and_docs/11_viable_space_map.md Part 1).

  # Constants staying in code (mathematical / statistical — not campaign assumptions):
  #   dof = n_eff - 3        (Fisher z-transform DOF correction)
  #   z_95 = 1.96            (95% CI z-multiplier)
  #   near_zero_multiplier: 2.0  (|IC| < 2*SE ≈ p > 0.05)
  #   active_threshold: 1e-6 (numerical precision floor for "signal fired")
  #   min_bars_for_stdev: 5  (need ≥ 5 bars to compute stdev; statistical minimum)
  #   min_block_size_floor: 6 (degenerate-block floor for non-1h timeframes)

# ---------------------------------------------------------------------------
# A8.5.1a — episode-blocked significance (episode_significance.py)
# ---------------------------------------------------------------------------
# New methodology for sparse signals over multi-era backfilled data (P1b). See
# engineering/improvements/done/design_and_docs/AMENDMENTS_01-06.md "A8.5.1a-spec" for the full specification.

episode_significance:
  gap_bars: 48                    # max inactive bars between active bars within one episode
                                    # (48 bars @ 1h ~= 2 days). Gaps > this, or an era
                                    # boundary, close the episode.
  density_fallback_pct: 50.0       # if activation >= this %, episodes degenerate into the
                                    # whole series -> use the existing 24-bar block method.
  min_n_episodes: 8                # below this floor, no significance claim is made
                                    # (disposition stays insufficient_sample_inconclusive
                                    # regardless of p-value).
  n_resamples: 2000                # bootstrap resample count (episodes resampled with
                                    # replacement, same episode count as observed)

# ---------------------------------------------------------------------------
# Regime detector validation (validate_regime_detector.py)
# ---------------------------------------------------------------------------

regime_detector:
  activation_band_min: 0.10   # lower bound of plausibility band for trending activation rate
  activation_band_max: 0.40   # upper bound; activation outside [10%, 40%] caps confidence at medium
                               # Encodes 1h BTC/ETH crypto regime plausibility
  default_start: "2024-01-01" # campaign walk-forward start date (CLI default)
  default_end:   "2025-12-31" # campaign walk-forward end date (CLI default)

  # Constants staying in code (detector architecture, not campaign assumptions):
  #   high_persistence: 24    (min bars per regime episode for high confidence)
  #   high_transitions: 4     (max transitions per window for high confidence)
  #   high_sensitivity: 0.15  (max gate sensitivity for high confidence)
  #   medium_persistence: 12  (min persistence for medium confidence)
  #   medium_sensitivity: 0.25
  #   rare_label_threshold: 0.10  (switch to class-conditional sensitivity below this)
  #   bars_per_window: 720    (~30 days at 1h; detector architecture constant)
  #   perturbation_down: 0.90 / up: 1.10  (±10% sensitivity analysis; methodology constant)

# ---------------------------------------------------------------------------
# Orchestrator / pipeline governance (run_phase1_research.py)
# ---------------------------------------------------------------------------

orchestrator:
  token_budget_per_run: 300000          # SUPERSEDED by token_budget_per_run_weighted_units below
                                         # (F4c, 2026-07-05) — kept only as a historical reference of
                                         # the old raw-token-sum semantics; no longer read by the loop.
  token_budget_per_run_weighted_units: 1800000
    # E-068 PR 4 (D-071, operator decision 2026-10-04): raised from 1,500,000. run_070 (the E-068
    # validation run, a normal run under the new pipeline with five readers) measured 1,212,255
    # weighted units = 80.8% of the old budget; 1,800,000 leaves about 30% headroom on such a run
    # (1,212,255 / 1,800,000 = 67.3%).
    # F4c circuit breaker, ACTUALLY read at runtime by _load_token_budget() (unlike every other
    # constant in this file — see the module docstring's "declared parity only" note; this one is an
    # explicit exception because it's an operational knob, not an architectural constant).
    # Units are cost-WEIGHTED tokens (input x1.0, output x5.0, cache_read x0.1, cache_creation x1.25 —
    # see _weighted_token_units()), not raw token counts. A raw sum treated a heavily-discounted
    # cache-read token as equally expensive as a fresh output token, so a single validation call with
    # 836,461 cache_read tokens (session-cumulative per claude_agent_sdk's own accounting across
    # num_turns internal turns) tripped the old 300k raw-token breaker even though its true dollar
    # cost was $0.35 (see run_047, 2026-07-05). Empirically, hypothesis_generation +
    # innovation_expansion + validation together came to ~478,000 weighted units for a real,
    # legitimately-approved reactivation hypothesis with a multi-turn validation call; 1,500,000
    # leaves headroom for the remaining LLM stages (at the time: backtest_specification,
    # verdict_interpreter) while still catching genuinely runaway behavior. CORRECTED 2026-09-28:
    # that stage list is 2026-07-05 history, not today's — under orchestrator.config_direct_
    # authoring.enabled, backtest_specification is a code/tool stage, not LLM (strategy_config_
    # authoring is the new LLM stage instead), and under orchestrator.specialist_readers.enabled,
    # five reader calls replace verdict_interpreter. Revisit if a normal run trips this again —
    # widen the constant, don't disable the breaker.
  max_refinements_default: 2            # default fallback when not in pipeline_state.yaml governance block
  review_every_n_runs_default: 6        # default campaign-review cadence
  distinct_failed_families_trigger: 2   # campaign review triggered when this many distinct families fail
  below_floor_pct_threshold: 50.0       # switch to expectancy mode when > this % of windows are sparse
                                         # (same value as verdict-interpreter; must stay in sync)
  halt_policy:
    quarantine_enabled: false
      # E-030 S2a. OFF BY DEFAULT and read at runtime by run_campaign._quarantine_enabled()
      # (a second explicit exception to this file's "declared parity only" rule, alongside
      # token_budget_per_run_weighted_units above — it is an operational knob, not an
      # architectural constant). While false, EVERY halt behaves exactly as it did before
      # E-030 S2a landed: `paused:<reason>` on the queue entry, the HALT line in
      # campaign_log.md, the halt_history append, and the campaign process exits. Proven by
      # tests/test_halt_quarantine_policy.py's flag-off/flag-on byte-comparison
      # (EPIC.md Done-when #3).
      #
      # While true, and ONLY for the four reasons the S1 taxonomy classified as
      # quarantine-safe on evidence (no_signal_artifact, component_execution_error,
      # component_gap, new_component_escalation), the campaign marks the entry and
      # CONTINUES instead of halting. Everything else — including unhandled_exception,
      # which covered 6 of the 14 measured halts and at least four unrelated root causes
      # (taxonomy R2) — still escalates to a human exactly as today. The escalate default
      # is the point: quarantine is the narrow, evidenced exception.
      #
      # NOT a retry switch. S2a deliberately ships the quarantine half only; see
      # E-030/EPIC.md S2 and the taxonomy's R2.
  exclusion_digest_input:
    enabled: true
      # E-032 S2a. SWITCHED ON 2026-09-02 (E-041, flag 2 of 7) -- DECLARED
      # OUTPUT CHANGE: hypothesis_generation and innovation_expansion's
      # assembled prompt text now carries campaign_record/exclusion_digest.yaml
      # content (that file already exists on disk, last built 2026-08-23, so
      # this takes effect immediately). E-041's decision (Jeremy, 2026-09-01):
      # a finished, tested feature defaults ON; staying off needs a stated
      # reason, and this one had none -- it was ready since E-032 S2a shipped.
      # Read at runtime by
      # run_phase1_research._exclusion_digest_input_enabled() -- same shape as
      # halt_policy.quarantine_enabled just above (a third explicit exception to
      # this file's "declared parity only" rule). While false,
      # _apply_exclusion_digest_input() is a no-op: hypothesis_generation and
      # innovation_expansion's handoffs are never mutated, so the fully-assembled
      # prompt text those stages receive (_build_stage_prompt's output) is
      # byte-identical to before this feature existed. Proven by
      # tests/test_exclusion_digest_input.py's flag-off/flag-on prompt-text diff
      # (E-032 S2a's own off-by-default bar -- comparing assembled PROMPT TEXT,
      # not just asserting the code path is skipped).
      #
      # E-036 S2a (2026-09-27; engineering/roadmap/E-036/S1_FINDINGS_SLICE8.md
      # operator decision 3): when campaign_record/campaign_memory.yaml
      # exists, the two stages get artifacts/tried_ideas.yaml INSTEAD of the
      # digest -- derived at prompt time by tools/campaign_memory.tried_ideas:
      # one row per recorded run (idea hypothesis_id, coins, timeframe, the
      # grid's idea_status), no family grouping, at most TRIED_IDEAS_MAX_ROWS
      # rows. With no memory file (orchestrator.regroup_record off, today's
      # default) they get campaign_record/exclusion_digest.yaml exactly as
      # before (same path and reason text): the default prompt input is
      # byte-identical. Only the two skills' IMPROVEMENT 05 text changed.
      #
      # This is raw material for the LLM stage, never a binding gate by itself
      # -- the mechanical refusal is the 5a exact-match check
      # (orchestrator.variant_anti_adjacency_gate below, tools/novelty.py).
  stale_input_path_fix:
    enabled: true
      # E-032 S2b. SWITCHED ON 2026-09-02 (E-041, flag 3 of 7) -- DECLARED
      # OUTPUT CHANGE: hypothesis_generation now receives real
      # campaign_knowledge_base.yaml and feed_wishlist.yaml content for the
      # first time in the pipeline's life (both files exist on disk; the
      # paths were simply wrong since the 2026-08-06 restructure). E-041's
      # decision (Jeremy, 2026-09-01): a finished, tested feature defaults
      # ON, staying off needs a stated reason -- this one had none. Read at
      # runtime by
      # run_phase1_research._stale_input_path_fix_enabled() -- same shape as
      # exclusion_digest_input.enabled just above (a fourth explicit exception
      # to this file's "declared parity only" rule). Repoints
      # hypothesis_generation's two OPTIONAL inputs that have never resolved
      # since the E-002 restructure (8f162fa6, 2026-08-06) moved them under
      # campaign_record/: campaign_knowledge_base.yaml and feed_wishlist.yaml.
      # While false, _apply_stale_input_path_fix() is a no-op -- the handoff
      # dict is never mutated, so the assembled prompt (_build_stage_prompt's
      # output) is byte-identical to before this feature existed. Proven by
      # tests/test_stale_input_path_fix.py's flag-off/flag-on prompt-text diff.
      #
      # While true, hypothesis_generation actually receives real KB and
      # feed-wishlist content for the first time in the pipeline's life --
      # declared here as a behavior change, not slipped in as a silent
      # bugfix (per the dispatching session's own framing of this class of
      # bug). Does NOT touch campaign_review's two REQUIRED inputs with the
      # identical stale-path bug, nor verdict_interpreter's one optional
      # instance -- see the code comment above _STALE_INPUT_PATH_FIXES for
      # why those are out of this story's scope.
  variant_selection_record:
    enabled: true
      # E-034 S2. SWITCHED ON 2026-09-02 (E-041, flag 4 of 7) -- DECLARED
      # OUTPUT CHANGE: writes artifacts/variant_selection.yaml and
      # variants_not_pursued.yaml, and RAISES if backtest_spec.yaml lacks
      # selected_variant_id or the ID does not match any expanded_variants
      # entry -- intentional fail-loud enforcement of the requirement
      # backtest-engineering/SKILL.md has stated since 84fc6eb9 (2026-08-25).
      # Verified 2026-09-02: only 1 run exists since that date (run_060,
      # 2026-08-28) and it complies; every non-compliant historical run
      # (40 of 41) predates the requirement, so this is not "will break most
      # runs" but "the only sample since the fix already conforms." Jeremy,
      # 2026-09-01, explicit on this flag by name: "let's turn it on ...
      # it does not prevent us to activate it until [E-033] is developed."
      # Read at runtime by
      # run_phase1_research._variant_selection_record_enabled() -- same
      # shape as exclusion_digest_input.enabled / stale_input_path_fix.enabled
      # above (an explicit exception to this file's "declared parity only"
      # rule).
      #
      # While false, _record_variant_selection() is a no-op: it returns
      # before reading anything else on disk, so no artifact is written and
      # backtest_specification's own outputs (backtest_spec.yaml,
      # decision.yaml) and every subsequent stage's inputs are byte-identical
      # to before this feature existed. Proven by
      # tests/test_variant_selection_record.py's flag-off/flag-on comparison
      # (same acceptance bar as S2a/b/c: compare actual pipeline
      # state/output, not just assert the code path is skipped).
      #
      # While true: right after backtest_specification produces a spec_ready
      # backtest_spec.yaml, its (schema-documented but NOT schema-enforced --
      # see engineering/roadmap/E-034/EPIC.md's 2026-08-24 S1-review entry --
      # no schema under workflow_artifacts/schemas/ is loaded by any code)
      # selected_variant_id field is read and matched against
      # expanded_hypothesis_card.yaml's expanded_variants menu. Missing or
      # unmatched -> RAISES (fail loud, halts the run) rather than writing a
      # broken record. On a match: writes artifacts/variant_selection.yaml
      # (the chosen variant, resolved instrument/timeframe, the LLM's own
      # rationale) and artifacts/variants_not_pursued.yaml (every other menu
      # entry, verbatim). See engineering/roadmap/E-034/artifacts/
      # s1_selection_record.md Task 3 for the full design.
  variant_anti_adjacency_gate:
    enabled: false
      # E-034 S3, REDESIGNED by E-036 S2a (2026-09-27, delivery_plan_v26.md
      # slice 8.1; engineering/roadmap/E-036/S1_FINDINGS_SLICE8.md + operator
      # decision). OFF BY DEFAULT, read at runtime by
      # run_phase1_research._variant_anti_adjacency_gate_enabled().
      #
      # The 5a exact-match repeat check: binary REPEAT/NOVEL on the key
      # decide_next already binds on (tools/novelty.py: config hash, sorted
      # symbols, the protocol file's timeframe and a hash of its windows),
      # looked up in campaign_record/campaign_memory.yaml. No family, no
      # NEIGHBOUR, no composition fingerprint. Layer 1 (the KB) is recorded as
      # an advisory warning and never refuses. It covers every queue origin:
      # decide_next checks only the candidates it mints; this checks the
      # config a backtest is about to run.
      #
      # Two call sites. Legacy LLM backtest_specification flow
      # (_route_post_variant_selection, after candidate_strategy_config.json
      # is written; requires variant_selection_record): REPEAT ->
      # status=paused_for_human, flags.variant_anti_adjacency_gate_refused.
      # Config-direct tool-stage 5a (_gate_config_direct_variants): a REPEAT
      # variant is marked not_tested ("repeat: ...") and gets no backtest and
      # no trial row; every variant a repeat ends the run
      # completed_no_new_hypothesis. With no campaign_memory.yaml and
      # regroup_record off, the gate raises (nothing would ever write what it
      # reads).
      #
      # While false, both call sites return before reading anything: no
      # artifact, no state field, byte-identical (tests/
      # test_e036_s2a_exact_match_gate.py). Switched on only after the E-036
      # S2b corpus replay has published refuse/admit counts and the operator
      # has reviewed them (feature_flag_register.yaml).
  schedulability_block:
    enabled: true
      # E-031 S2. SWITCHED ON 2026-09-02 (E-041, flag 5 of 7) -- DECLARED
      # OUTPUT CHANGE: process_once() now writes
      # campaign_record/schedulability.yaml on every step (ready/in_progress/
      # blocked counts, dwell time, blocker strings). Purely additive: no
      # decision reads this file yet (E-031 S3, the refill-vs-escalate
      # consumer, is not built), so this cannot change any run's outcome --
      # it only starts populating the diagnostic E-030's own blind-spot
      # finding said was missing. Read at runtime by
      # run_campaign._schedulability_block_enabled() -- same shape as the
      # five orchestrator.<name>.enabled flags above (the sixth such flag; a
      # seventh explicit exception to this file's "declared parity only" rule,
      # counting halt_policy.quarantine_enabled). Count corrected 2026-08-26:
      # the prior "seven above / an eighth" was refutable and wrong.
      #
      # While false, process_once() never computes or writes
      # campaign_record/schedulability.yaml -- byte-for-byte the same
      # behavior as before this feature existed on every path (normal
      # launch/continue AND the queue-exhausted return). Proven by
      # tests/test_schedulability_block.py's flag-off/flag-on comparison
      # (same acceptance bar as every prior story in this chain: compare
      # actual campaign_record/ contents, not just assert the code path is
      # skipped).
      #
      # While true: run_campaign._write_schedulability() runs on EVERY
      # process_once() step, BEFORE the queue-exhausted `entry is None`
      # return -- closing the blind spot E-031/EPIC.md measured directly:
      # all four of E-030's _write_loop_health() call sites sit strictly
      # AFTER a non-None _select_entry() result, so the one condition that
      # actually stopped the loop (2026-07-19, "Queue exhausted") never
      # produced any instrument at all. Writes ready/in_progress/done/
      # blocked counts, days since the last campaign_log.md DONE line, and
      # per-blocked-entry dwell time (derived from that entry's last
      # campaign_log.md mention -- the queue schema has no per-entry
      # timestamp field) plus its blocker string. Re-derived from primary
      # records on every call, never accumulated -- same posture as
      # loop_health.yaml, safe to delete. See engineering/roadmap/E-031/
      # EPIC.md's S2 Log entry and artifacts/s1_refill_sources.md Task 2.
  grid_evaluation:
    enabled: false
      # E-046b S2 (the grid, engineering_roadmap.html card C). OFF BY
      # DEFAULT and read at runtime by
      # run_phase1_research._grid_evaluation_enabled() -- same shape as the
      # orchestrator.<name>.enabled flags above (an eighth explicit
      # exception to this file's "declared parity only" rule, counting
      # halt_policy.quarantine_enabled).
      #
      # While false, protocol_execution's existing
      # verdict_criteria_evaluator.evaluate_pass_rule_criteria() call and its
      # pass_rule_evaluation.yaml write are completely untouched, and
      # artifacts/grid_evaluation.yaml / artifacts/idea_status.yaml are never
      # written -- byte-identical to before this feature existed. Proven by
      # tests/test_grid_evaluation.py's flag-off byte-identity test.
      #
      # While true AND the run's pre_registration.yaml pass_rule is
      # menu-shaped (criteria carry source/reducer fields,
      # config/criterion_menu.yaml v1): ALSO calls
      # verdict_criteria_evaluator.evaluate_grid() and writes
      # artifacts/grid_evaluation.yaml + artifacts/idea_status.yaml,
      # mechanically grading criteria x variants per card C. Routing
      # (validated -> promote, refuted -> kill/terminate, inconclusive ->
      # human_pause) is written into idea_status.yaml in the same shape
      # pass_rule_evaluation.yaml uses when binding, but is NOT yet wired
      # into any _resolve_verdict_fields call site -- that repointing is
      # slice 6c's scope (S1_FINDINGS.md §6), so no existing routing
      # behavior changes yet even when this flag is on. Blocked on E-046b
      # slice 3+ (the variant registry and config-authoring machinery that
      # produce real multi-variant, menu-shaped pre_registration.yaml
      # pass_rules) before this is genuinely usable end-to-end.
  profit_bars_file:
    enabled: false
      # delivery_plan_v26.md 0.2 (item 2, "config/profitability_bars.yaml and
      # the branch-3 stop" -- engineering_roadmap.html's "One campaign-wide
      # profitability-bars file, written once by hand"). OFF BY DEFAULT and
      # read at runtime by run_phase1_research._profit_bars_file_enabled() --
      # same shape as orchestrator.grid_evaluation.enabled directly above.
      #
      # While false, _dispatch_verdict_route's promote branch is completely
      # untouched: _write_promotion_audit runs and the branch unconditionally
      # returns "holdout_evaluation", byte-identical to before this feature
      # existed -- config/profitability_bars.yaml is never read and
      # artifacts/profit_bars_evaluation.yaml is never written. Proven by
      # tests/test_profit_bars_stop.py's flag-off byte-identity test.
      #
      # While true: after _write_promotion_audit succeeds, ALSO evaluates
      # every bar in config/profitability_bars.yaml
      # (run_phase1_research._evaluate_profit_bars) against promotion_audit.yaml
      # / protocol_result.yaml's real numbers for this run, writing
      # artifacts/profit_bars_evaluation.yaml. If every bar passes, sets
      # pipeline_state.flags.profit_bars_reached=true and status=paused_for_human,
      # returning "human_pause" INSTEAD OF "holdout_evaluation" --
      # run_campaign._classify_human_pause reads that flag (ranked above the
      # existing provisional_promote_awaiting_holdout check, for the same
      # reason research_only_unverified is) and reports
      # profit_bars_reached, with a RUNBOOK §3 row.
      #
      # config/profitability_bars.yaml ships as an unratified DRAFT
      # (ratified_by/ratified_at both null, placeholder threshold values) --
      # turning this flag on today produces real PASS/FAIL/NOT_EVALUABLE
      # verdicts against those placeholder numbers, not against an operator-
      # reviewed bar. avg_daily_return_min in particular always reads
      # NOT_EVALUABLE (nothing in this pipeline's artifacts computes a mean
      # daily return today), which means the overall result can never
      # currently be PASS with real inputs -- an honest consequence of "every
      # bar must pass," not a bug. Held off_incomplete (see
      # config/feature_flag_register.yaml) until the operator ratifies real
      # thresholds and a daily-return figure exists somewhere in the pipeline
      # for that one bar to read.
  profit_bars_every_backtest:
    enabled: false
      # Branch 3 on EVERY backtest (operator-approved 2026-09-24; delivery_plan_v26.md
      # target row "8 · profit bars ... one file, every backtest, stop rule"). OFF BY
      # DEFAULT, read by run_phase1_research._profit_bars_every_backtest_enabled().
      # REQUIRES profit_bars_file.enabled above AND regroup_record.enabled (hence
      # specialist_readers, grid_evaluation, category_reports): on without them (or
      # a non-bool value) fails the run in run_loop's pre-flight, before any spend.
      #
      # While false: byte-identical -- nothing new is read or written, the
      # promote-path check above works exactly as before, and
      # campaign_memory.yaml keeps `profit_bars: null` + "not evaluated before
      # regroup".
      #
      # While true, in the target order judge -> learn -> profit check -> regroup +
      # record -> decide: right after protocol_execution (after its conformance
      # check) every variant tested on THAT attempt (the grid's columns; a
      # conformance-invalidated trial is never graded) is graded against
      # config/profitability_bars.yaml -- Sharpe/DSR with the promotion audit's
      # own math, per-coin minimum trade count, and drawdown + avg_daily_return_min
      # on the equal-weight portfolio of all tested coins, built from the
      # per-window equity files (definitions, and the `basis` recorded on each
      # bar row, in config/profitability_bars.yaml) -- into a per-variant
      # artifacts/profit_bars_evaluation.yaml (scope: every_backtest).
      # protocol_execution completes normally (no pause there). regroup_record
      # records the per-variant results in campaign_memory.yaml's `profit_bars`.
      # Then, before the grid's route, the EXISTING profit_bars_reached stop is
      # raised if any variant passed (same flag, pause and RUNBOOK row) -- even
      # when the grid does not validate the idea; idea_status is never touched.
      # A resume continues forward from regroup_record (never re-runs the
      # backtests, never re-pauses on the same evaluation). The promote-path
      # check is skipped only for a run holding its own every_backtest
      # evaluation. A malformed bars file fails the run loudly (never a
      # defaulted threshold). Still blocked on ratified bar values.
  profit_bars_v2:
    enabled: false
      # E-062 S2b-1 (engineering/roadmap/E-062/S1_FINDINGS.md Q7/G8; D-034..D-039).
      # OFF BY DEFAULT, read by run_phase1_research._profit_bars_v2_enabled().
      # REQUIRES profit_bars_every_backtest.enabled above (hence profit_bars_file
      # and regroup_record): on without it (or a non-bool value) fails the run in
      # run_loop's pre-flight and run_campaign's launch pre-flight, before any spend.
      #
      # While false: nothing changes -- the v1 definitions, the v1 loader schema,
      # no `bars_definitions` key in profit_bars_evaluation.yaml.
      #
      # While true: the per-backtest check and the composition grid's profit_bars
      # cell grade every variant on the v2 definitions (see
      # config/profitability_bars.yaml's header): whole-test chained drawdown,
      # Sharpe and avg daily return on the equal-weight portfolio; trades per coin
      # over the whole test without end_of_window forced closes; beats buy-and-hold
      # after costs; pooled realized edge / cost ratio > cost_edge_ratio_min with a
      # cost_edge_min_trades floor. The bars file must carry the v2 keys. The
      # evaluation records `bars_definitions: v2`, and a holdout spend refuses
      # `bars_changed` when the evaluation's definitions differ from this flag now.
      # E-062 S2b-2b (D-041/D-046): every backtest's trial-ledger row also carries
      # a `whole_test` block (its whole-test daily Sharpe, T, skew, kurtosis; a
      # failure is recorded in the block, the row is still written), and the DSR
      # bar is the Bailey & Lopez de Prado 2014 DSR of the whole-test daily Sharpe
      # (basis deflated_sharpe_whole_test_daily_on_campaign_trial_ledger; below
      # dsr_min_same_basis_trials same-basis values the benchmark is sigma_null);
      # the sparse-trading branch / expectancy t-stat no longer reach branch 3,
      # the grid or the spend. The evaluation's dsr_basis records sharpe_basis,
      # n_same_basis, min_same_basis and the recompute overlay's presence and
      # sha256; a spend refuses a sharpe_basis mismatch. E-062 S2b-3b (D-047):
      # the D-042 partial-coverage cap is lifted -- a partial asset variant is
      # graded on its trade minimum and cost-ratio trade floor max(ceil(100 * f),
      # trade_count_min_floor 60) and its drawdown limit 20 * sqrt(f) (f = its
      # share of the run protocol's calendar days; full-coverage rows unchanged),
      # the grid no longer caps its idea at inconclusive, a spend re-derives those
      # thresholds (bars_changed otherwise), and sign_consistent_by_era with fewer
      # than 2 represented eras reads INCONCLUSIVE on EVERY variant (7 of 13
      # committed protocols are single-era even for the base; a zero-median
      # single era stays FAIL). The bars file must
      # also carry trade_count_min_floor. The legacy promote path keeps the cap
      # (G9). The legacy promote path and the deflate_sharpe CLI never use v2.
  category_reports:
    enabled: false
