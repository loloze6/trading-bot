# E-041 S2: the register. Every off-by-default feature flag in this project,
# with an owner and a switch-on criterion -- or, if not yet switched on, the
# specific epic it's blocked on. Mechanically checked against the real code
# by tests/test_feature_flag_register.py: a flag that exists in code with no
# entry here, or an entry whose config_key/state no longer matches reality,
# fails the suite. This file must never drift -- it is generated-against,
# never hand-trusted (E-041's own Risks section: "must be generated or tested
# against the code, never hand-maintained").
#
# Two kinds of flag live here, in `kind`:
#   orchestrator_config -- an `orchestrator.<name>.enabled` key in
#     config/campaign_config.yaml, read at runtime by a matching
#     run_phase1_research._<name>_enabled() / run_campaign._<name>_enabled().
#   engine_param -- a keyword parameter on the trading-bot engine itself
#     (default False in trading-bot/core/launcher.py / core/trading_bot.py),
#     switched on not by flipping that engine default but by the one caller
#     that matters (strategy-research/tools/run_protocol.py) explicitly
#     passing True -- the engine's own bit-identity discipline stays intact.
#
# `state` is "on" or "off_incomplete". "off_incomplete" always names the
# specific epic it is waiting on via `blocked_on` -- E-041's own finding was
# that "off, no reason given" was never a legitimate state for a finished,
# tested feature.

flags:
  - name: exclusion_digest_input
    kind: orchestrator_config
    config_key: orchestrator.exclusion_digest_input.enabled
    reader: run_phase1_research._exclusion_digest_input_enabled
    owner: Jeremy
    state: "on"
    criterion: >
      Switched on 2026-09-02. Finished, tested (E-032 S2a); the digest file
      already existed on disk, so it fires immediately with no unmet
      condition.

  - name: stale_input_path_fix
    kind: orchestrator_config
    config_key: orchestrator.stale_input_path_fix.enabled
    reader: run_phase1_research._stale_input_path_fix_enabled
    owner: Jeremy
    state: "on"
    criterion: >
      Switched on 2026-09-02. Both target files
      (campaign_knowledge_base.yaml, feed_wishlist.yaml) verified present on
      disk before flipping.

  - name: variant_selection_record
    kind: orchestrator_config
    config_key: orchestrator.variant_selection_record.enabled
    reader: run_phase1_research._variant_selection_record_enabled
    owner: Jeremy
    state: "on"
    criterion: >
      Switched on 2026-09-02 (E-034 S2). Compliance checked before flipping
      -- the one real run since the SKILL.md requirement landed already
      complies. Tied to E-033 D1's variant-count work, but Jeremy's call is
      that this does not block turning it on now.

  - name: schedulability_block
    kind: orchestrator_config
    config_key: orchestrator.schedulability_block.enabled
    reader: run_campaign._schedulability_block_enabled
    owner: Jeremy
    state: "on"
    criterion: >
      Switched on 2026-09-02 (E-031 S2). Purely additive -- no consumer
      reads the file it writes yet (E-031 S3, the refill-vs-escalate
      decision, is unbuilt), so it cannot change any run's outcome.

  - name: anti_adjacency_retry
    kind: orchestrator_config
    config_key: orchestrator.anti_adjacency_retry.enabled
    reader: run_phase1_research._anti_adjacency_retry_enabled
    owner: Jeremy
    state: off_incomplete
    blocked_on: E-036
    criterion: >
      E-032 S2c's own fix (composition-fingerprint adjacency) shipped and is
      verified working as designed, but Jeremy REJECTED the underlying
      design on review (2026-09-02): a flat (regime, component, params,
      weight) fingerprint doesn't convincingly answer "are these two
      strategies the same idea," given the real strategy structure (a
      regime detector mapping to per-regime, weighted sub-strategy
      compositions). Unpark trigger: E-036 restarted with a reconsidered
      design, not merely re-reviewed.

  - name: variant_anti_adjacency_gate
    kind: orchestrator_config
    config_key: orchestrator.variant_anti_adjacency_gate.enabled
    reader: run_phase1_research._variant_anti_adjacency_gate_enabled
    owner: Jeremy
    state: off_incomplete
    blocked_on: E-036
    criterion: >
      Same rejected design as anti_adjacency_retry above -- both are call
      sites of the same tools/anti_adjacency_gate.py mechanism and the same
      rejected fingerprint.

  - name: grid_evaluation
    kind: orchestrator_config
    config_key: orchestrator.grid_evaluation.enabled
    reader: run_phase1_research._grid_evaluation_enabled
    owner: Jeremy
    state: off_incomplete
    blocked_on: E-046b
    criterion: >
      Landed 2026-09-20 (E-046b S2, the grid -- engineering_roadmap.html
      card C). Off by default: the mechanics (evaluate_grid(),
      config/criterion_menu.yaml v1, the artifacts/grid_evaluation.yaml +
      idea_status.yaml writer) are built and tested
      (tests/test_grid_evaluation.py), but a real multi-variant,
      menu-shaped pre_registration.yaml pass_rule doesn't exist yet -- that
      needs the variant registry and config-authoring machinery from
      E-046b's later slices (3+). Turning this on today would be additive
      and inert on every current run (no pre_registration.yaml in the
      corpus is menu-shaped, so evaluate_grid is never actually reached),
      so switching it on has no unmet correctness criterion blocking it,
      only a "nothing would use it yet" one -- held off_incomplete rather
      than on until a real menu-shaped run exists to prove it end-to-end.
      Also unwired: idea_status.yaml's validated/refuted/inconclusive ->
      promote/kill/human_pause mapping is written into the artifact but not
      yet read by any _resolve_verdict_fields call site (slice 6c's scope).

  - name: category_reports
    kind: orchestrator_config
    config_key: orchestrator.category_reports.enabled
    reader: run_phase1_research._category_reports_enabled
    owner: Jeremy
    state: off_incomplete
    blocked_on: "E-046a slice 5b (specialist readers -- the first real consumer of artifacts/reports/*.yaml)"
    criterion: >
      Landed 2026-09-21 (E-046a S5a, delivery_plan_v26.md "Slice 5 -- Reports
      and readers"). Off by default: tools/build_reports.py is built and
      tested (tests/test_e046a_category_reports.py) -- it re-projects
      protocol_result.yaml / trade_diagnostics.json / each window's bars.csv
      / the campaign-level regime_detector_report.yaml into the five
      artifacts/reports/*.yaml files, additive and inert on every current
      run (no existing artifact changes shape or content either way).
      Turning this on today would be additive and harmless, but the reports
      it writes have no reader yet -- slice 5b's five specialist skills are
      the first thing that consumes artifacts/reports/*.yaml -- so this is
      held off_incomplete for "nothing would use it yet," the same reasoning
      grid_evaluation above was held back for, not an unmet correctness
      criterion.

  - name: profit_bars_file
    kind: orchestrator_config
    config_key: orchestrator.profit_bars_file.enabled
    reader: run_phase1_research._profit_bars_file_enabled
    owner: Jeremy
    state: off_incomplete
    blocked_on: "item 2 (profit-bars ticket, delivery_plan_v26.md 0.2 / engineering_roadmap.html)"
    criterion: >
      Landed 2026-09-20 (delivery_plan_v26.md 0.2 item 2, the branch-3 stop).
      Off by default: the mechanics (the loader/schema-validated
      config/profitability_bars.yaml, _evaluate_profit_bars(), the
      artifacts/profit_bars_evaluation.yaml writer, the
      profit_bars_reached pause classification in
      run_campaign._classify_human_pause) are built and tested
      (tests/test_profit_bars_stop.py). Two things block turning it on: (1)
      config/profitability_bars.yaml ships as an unratified DRAFT
      (ratified_by/ratified_at both null) -- the shipped threshold values are
      placeholders invented to exercise the loader, not an operator's real
      sign-off, so a PASS verdict against them today would not mean what the
      branch-3 stop is supposed to mean; (2) avg_daily_return_min always
      reads NOT_EVALUABLE (nothing in this pipeline's artifacts -- neither
      protocol_result.yaml nor trading-bot's off-by-default bar_equity
      metrics.json block -- computes a mean daily return), so the overall
      result can never currently be PASS with real inputs regardless of (1).
      No epic number exists yet for this ticket (engineering_roadmap.html
      lists it as "new ticket" as of 2026-09-19); blocked_on names the item
      directly rather than inventing an E-XXX identifier.

  - name: data_availability_gate
    kind: orchestrator_config
    config_key: orchestrator.data_availability_gate.enabled
    reader: run_phase1_research._data_availability_gate_enabled
    owner: Jeremy
    state: "on"
    criterion: >
      Switched on BY DEFAULT 2026-09-20 (delivery_plan_v26.md s:0.4 item 14)
      -- the ONE flag in this register whose default is true, not false.
      E-054 Layer 2 (the data-availability gate itself) is complete and
      tested (shipped 2026-09-11); it originally shipped off-by-default
      behind an env var (E054_DATA_AVAILABILITY_GATE) with no process ever
      deciding when to turn it on -- exactly the E-041 anti-pattern this
      register exists to prevent. The operator's own brief requires this
      control to run for every hypothesis, not opt-in, so the switch-on
      criterion here is inverted from every other entry: the unmet
      condition was "prove someone will actually turn it on," not "prove it
      is safe to turn on." Explicit `enabled: false` in
      config/campaign_config.yaml still disables it and reproduces the old
      env-var-unset behavior byte-identically (tests/test_e054_stage_
      wiring.py's explicit-off case). The "refine -> variant not tested"
      behavior change (replacing today's loop pause) is deferred to a later
      slice that does not exist yet; until then a "refine" outcome still
      pauses for a human exactly as before.

  - name: bar_equity
    kind: engine_param
    engine_default_files:
      - trading-bot/core/launcher.py
      - trading-bot/core/backtester.py
    caller: >
      strategy-research/tools/run_protocol.py -- both call sites pass
      bar_equity=True explicitly.
    owner: Jeremy
    state: "on"
    criterion: >
      Switched on 2026-09-02. Proven since 2026-07-31 (bit-identity test
      plus a real reference run's bar-level vs trade-exit Sharpe/maxDD
      comparison); no criterion was ever unmet. The engine's own default
      parameter stays False (bit-identity discipline) -- turned on by the
      research pipeline's one caller that matters explicitly passing True,
      never by changing the engine's own default.

  - name: model_funding
    kind: engine_param
    engine_default_files:
      - trading-bot/core/launcher.py
      - trading-bot/core/trading_bot.py
    caller: >
      strategy-research/tools/run_protocol.py -- never passes
      model_funding=True.
    owner: Jeremy
    state: off_incomplete
    blocked_on: E-014
    criterion: >
      Not a caution -- a real gap. Raises below daily bars, so it is not a
      finished feature yet. "A partially working feature (funding) is a
      delayed bomb until a bug is found" (Jeremy, 2026-09-01). Unblocking
      belongs to E-014.
