---
# ============================================================================
# research_brief_new_pipeline.yaml -- first-run brief template for the "new
# pipeline" (E-061 C1.7; config_direct_authoring / strategy_config_authoring,
# the config-direct path this delivery plan brought up -- see
# engineering/review_2026-09-27/A3_all_flags_on.md §1's target v26 flag set).
#
# HOW TO USE
# ----------
# 1. Copy this file to strategy-research/briefs/<your_brief_name>.md (the
#    `register` CLI reads a frontmatter .md; the leading '---'-delimited
#    block below IS the research_brief.yaml content, exactly as
#    run_campaign.py::_parse_brief_frontmatter expects -- see RUNBOOK.md
#    "Start a campaign on the new pipeline").
# 2. Replace every "<FILL IN...>" placeholder below with your idea. Every
#    field run_campaign.py::REFRAME_BRIEF_REQUIRED_KEYS requires
#    (strategy_domain, market_universe, timeframe, research_goal, venue,
#    product) must be non-empty or registration raises immediately.
# 3. Register it: `python workflow/run_campaign.py register --brief
#    briefs/<your_brief_name>.md --priority <n> --notes "<n>"` (RUNBOOK.md
#    §1a-bis has the pre-launch checks to run before spending any LLM
#    budget).
#
# WHY criteria_from + machine_constraints ARE PRE-FILLED
# --------------------------------------------------------
# `criteria_from: hypothesis_generation` (== the orchestrator's own
# PASS_RULE_PENDING_AT_1A / CRITERIA_FROM_1A constant,
# workflow/run_phase1_research.py) defers pass_rule authorship to step 1a
# (hypothesis_generation), which fits real criteria from
# config/criterion_menu.yaml to the idea actually generated -- this is the
# same mechanism the orchestrator's own campaign-review reframe briefs use
# (run_phase1_research.py::_write_reframe_brief). It means YOU do not have to
# hand-author a pass_rule to get a first run going; do not add one here, or
# _materialize_run's guard raises (a brief cannot both defer to step 1a and
# carry a pre-registered pass_rule).
#
# `machine_constraints.protocol_ref` pins an EXISTING, already-vetted
# protocol file so the run never falls through to a stale
# campaign_state.last_escalation (RUNBOOK.md §1a-bis point 1) and never
# executes against the abolished generic promotion block (D-3 /
# tools/protocol_resolution.py::assert_promotion_ratified). The pin below,
# protocols/diagnostic_btceth_4h.json, was chosen from the five protocols
# A3 §3.3 measured as NOT carrying that unratified block (checked directly
# against protocol_resolution.assert_promotion_ratified on this checkout:
# diagnostic_btceth_4h, funding_mr_4h_retest_v1, funding_mr_daily_retest_v1,
# h041c_v2_backext, ts_trend_daily_v1) because it is the most GENERIC of the
# five -- BTCUSDT+ETHUSDT, both symbols with full ohlcv/fear_greed/
# funding_rate coverage across every non-holdout era in
# config/campaign_data_policy.yaml, 4h bars (fast to iterate, sparse enough
# that a diagnostic promotion.min_trade_count_gte of 10 is realistic), and a
# name ("Diagnostic protocol") that says outright it is a starting point, not
# a specific hypothesis family's pre-registered window set the way
# funding_mr_*/ts_trend_daily_v1/h041c_v2_backext are. Swap it for a protocol
# that actually matches your idea's timeframe/universe once you have one --
# this pin is a safe DEFAULT, not a recommendation to test on 4h BTC/ETH.
#
# `protocol_ref_content_hash` is the STRUCTURAL hash
# (_compute_protocol_content_hash: canonical JSON with protocol_version/
# protocol_content_hash removed) measured against protocols/
# diagnostic_btceth_4h.json on THIS checkout. If that file's content ever
# changes, the pin's own guard (run_phase1_research.py::
# _ensure_protocol_ref_pinned) raises rather than silently running your
# hypothesis against different windows -- recompute it (RUNBOOK.md
# §1a-bis's check-all-four snippet) before your first real launch if you are
# not registering this on the same day you read this comment.
# ============================================================================

brief_status: open

strategy_domain: "<FILL IN: e.g. momentum, mean_reversion, funding_carry, breadth>"
market_universe:
  - "<FILL IN: e.g. BTCUSDT -- must exist in config/coin_universe.yaml for the
    universe you intend; single-symbol or multi-symbol both valid>"
timeframe: "<FILL IN: e.g. 4h -- must match data actually available;
  see docs/DATA_AVAILABILITY.md before registering a NEW timeframe>"
venue: "<FILL IN: e.g. kraken -- must be a (venue, product) pair marked
  tradable: true in config/venue_tradability.yaml, or the run is auto-flagged
  research_only>"
product: "<FILL IN: e.g. spot or perp -- see config/venue_tradability.yaml
  for which pairs are currently tradable>"
research_goal: >
  <FILL IN: one paragraph. What edge are you testing, and why do you expect
  it to survive fees and slippage at your size? (CLAUDE.fork.md's three
  HYPOTHESIS.md questions -- who is on the other side, why the edge survives
  costs, why it hasn't been arbitraged away -- are the bar this needs to
  eventually clear, even though this brief itself defers formal criteria to
  step 1a via criteria_from below.)>
constraints: []
available_data: []

criteria_from: hypothesis_generation

machine_constraints:
  protocol_ref: protocols/diagnostic_btceth_4h.json
  protocol_ref_content_hash: sha256:424968e14b412add34e8288b2370e414127aeb672c78a6b04135a87422ab3cb9
---

