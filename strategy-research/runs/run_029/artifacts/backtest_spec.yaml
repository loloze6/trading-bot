hypothesis_id: KELTNER_SCOREMODE_4H
variant_id: KELTNER_SCOREMODE_4H_V1_BASE
status: "spec_ready"
config:
  regime_detector:
    mode: "score_product"
    min_score: 0.25
    min_margin: 0.0
    components:
      - id: "er"
        class: "strategies.strategy_components.EfficiencyRatioRegimeComponent"
        params:
          period: 24
          smooth_period: 5
      - id: "vr"
        class: "strategies.strategy_components.VarianceRatioComponent"
        params:
          k: 5
          window: 100
    regimes:
      mean_reversion:
        components:
          - id: "er"
            divisor: 1.0
            transforms:
              - op: "identity"
          - id: "vr"
            divisor: 2.0
            transforms:
              - op: "identity"
    default_regime: "unknown"
  strategies:
    warmup: 51
    regimes:
      mean_reversion:
        components:
          - id: "keltner_mr"
            class: "strategies.strategy_components.KeltnerBreakoutComponent"
            params:
              ema_period: 20
              atr_period: 20
              atr_multiplier: 1.5
              scaling_factor: -20.0
            weight: 1.0
            lookback: 500
            transforms:
              - op: "ratio_to_mean"
              - op: "scale"
                params:
                  factor: 10.0
              - op: "threshold_filter"
                params:
                  min_abs: 15.0
      trending: null
      chop: null
      unknown: null
config_rationale:
  - "Hypothesis thesis 'Keltner mean-reversion at 4h' → KeltnerBreakoutComponent with mean_reversion setting (lower-band, scaling_factor: -20.0)"
  - "Score-mode regime gating min_score=0.25 → score_product mode enabling multiplicative composition of ER and VR components"
  - "Regime formula (ER/1.0) × (VR/2.0) ≥ 0.25 → regimes.mean_reversion with ER divisor 1.0, VR divisor 2.0, both identity transforms"
  - "Inactive regimes (trending, chop) set to null; stay flat outside score-qualified window"
  - "KeltnerBreakoutComponent transforms: ratio_to_mean (500-bar history) → scale 10× → threshold_filter (min_abs=15) matches production normalization"
component_gap: null