run_id: "run_018"
stage: "backtest_specification"
status: "spec_ready"
selected_variant: "V2-PIVOT-A-CONSERVATIVE"
config:
  regime_detector:
    mode: "threshold_rules"
    components:
      - id: "er"
        class: "strategies.strategy_components.EfficiencyRatioRegimeComponent"
        params:
          period: 24
          smooth_period: 5
      - id: "vr"
        class: "strategies.strategy_components.VarianceRatioComponent"
        params:
          k: 5
          window: 100
    rules:
      - regime: "trending"
        any_of:
          - - id: "er"
              op: "gte"
              value: 0.50
            - id: "vr"
              op: "gte"
              value: 1.20
    default_regime: "trending"
  strategies:
    warmup: 51
    regimes:
      trending:
        components:
          - id: "rsi_momentum"
            class: "strategies.strategy_components.RSIPullbackComponent"
            params:
              period: 14
              scaling_factor: 0.4
              long_only: false
            weight: 1.0
            lookback: 500
            history_transforms:
              - op: "vol_normalize"
            transforms:
              - op: "ratio_to_mean"
              - op: "negate"
              - op: "scale"
                params:
                  factor: 10.0
              - op: "threshold_filter"
                params:
                  min_abs: 15.0
      mean_reversion: null
      chop: null
      unknown: null
config_rationale:
  - "Hypothesis claim: RSI momentum (overbought/oversold) signals trend continuation in TRENDING regime (ER ≥ 0.50, VR ≥ 1.20)"
  - "Base signal: RSIPullbackComponent (period=14) outputs (50−RSI)×0.4; when RSI=70 this is −8, when RSI=30 this is +8 (mean-reversion interpretation)"
  - "Momentum inversion: Apply negate transform to flip interpretation from pullback (50−RSI) to continuation (RSI−50); when RSI=70 now +8 (long), when RSI=30 now −8 (short)"
  - "Regime gate: threshold_rules with rule ER≥0.50 AND VR≥1.20 classifies bars as TRENDING; non-matching bars default to TRENDING (conservative assumption)"
  - "Signal normalization pipeline: store vol_normalized history (50−RSI)×0.4/(stddev_24×close) in 500-bar deque; at forecast compute ratio_to_mean (current_norm/mean|history|) to normalize by signal history, then negate (flip to momentum), scale by 10 (mean signal ≈ 10), threshold (drop |signal|<15, 1.5× stronger than average)"
  - "Forecast range: final output clipped to [−20,+20] by engine default; positive = long momentum signal, negative = short momentum signal"
  - "Walk-forward protocol: Sharpe and win_rate gates per validation protocol (median Sharpe > 0.30, win_rate > 0.45, min 30 trades/window)"
component_gap: null