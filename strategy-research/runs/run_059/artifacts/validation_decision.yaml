hypothesis_id: "run_059-funding-mr-daily-retest-v1"

status: "conditional_approve"

rationale: "Mechanism is sound: Binance 8h funding-rate sign-flips trigger real settlement-driven forced-liquidation cascades, and daily bars provide adequate duration for mean-reversion pressure to resolve (lookahead bias risk is manageable with daily-resample-last discipline). Pre-registered pass_rule is explicit (median Sharpe > 0.8, max drawdown < 30%, zero_trade_slot_pct <= 50%) and binding. However, cost-feasibility analysis reveals a critical gap: estimated gross edge (5–15 bps per trade) falls 2–7× below required threshold (34–35 bps). Conditional approval is granted on the explicit condition that either (1) backtest reveals forecast_return_corr >= 0.01 and the pass_rule gates are cleared, OR (2) a cost-structure reassessment occurs (e.g., higher leverage, tighter position sizing, regime gating to reduce holding-period variance). Without one of these, the strategy cannot sustain transaction costs at the proposed daily-bar execution style."

blocking_issues:
  - "Cost-edge mismatch: Estimated gross edge per trade (5–15 bps) is 2–7× below round-trip cost (17–17.5 bps). Backtest MUST demonstrate either (a) gross edge >= 34–35 bps (implying higher forecast_return_corr or win rate > 55%), OR (b) win_rate >= 52% on sparse samples (to amortize cost over holding period). Failure on both fronts is terminal."
  - "Lookahead bias risk: Funding settlement times (UTC 00:00, 08:00, 16:00) and daily-bar close alignment create potential for implicit lookahead. Implementation MUST use daily-resample-last with explicit settlement-time handling. Any ad-hoc intraday logic forfeits the conditional approval."
  - "Sparse sample instability: ~4–5 trades per monthly window. Sharpe estimated on n < 10 is highly unstable. Any window with trade_count < 5 is null-excluded per A3.4 rule, potentially cutting median denominator in half. Criterion (a) median_sharpe > 0.8 may be met by chance on a handful of high-Sharpe outlier windows; hold-forward validation (walk_forward_extension 2024–2025 and holdout 2026–06-30) is critical to falsify spurious edge."
  - "Regime-dependence unvalidated: Pass-gated window (2019–2023) includes prolonged bear market and choppy consolidation (peak regime-dependence periods for mean-reversion). Walk-forward extension (2024–2025, prolonged bull) and holdout (2026, unknown) are REQUIRED to show edge portability. If forward-period Sharpe drops below 0.3, mechanism is regime-bound and unfit for live trading."

conditions:
  - "Implementation MUST use daily-resample-last for funding CSV → daily OHLCV alignment with zero freedom for manual settlement-time tuning. Any deviation forfeits conditional status."
  - "Backtest activation trace (trade entry times, funding sign-flip source row, holding period in bars) MUST be logged and spot-checked for off-by-one or leakage."
  - "If pass_rule gate is cleared (all three criteria (a, b, c) pass), THEN forecast_return_corr >= 0.01 MUST be demonstrated via pooled IC (all symbols, all windows). If IC < 0.01, promotion_audit re-inspects cost block; 'marginal' plausibility triggers cost-check rejection per cost_feasibility rules."
  - "Holdout evaluation (2026-01-01..06-30) is mandatory post-promotion. Hypothesis must maintain Sharpe > 0.8 on holdout. If holdout Sharpe < 0.3, no further escalation path exists (holdout_failure_is_terminal per campaign_data_policy.yaml)."
  - "Walk-forward extension (2024-12-01..2025-12-31) is diagnostic-only (not gated), but MUST show regime-adjusted edge persistence. If Sharpe collapses below 0.3 on forward-period 2024–2025 bull market, document as 'regime-dependent' and defer to regime-specific sub-hypothesis (future work, not this queue entry)."