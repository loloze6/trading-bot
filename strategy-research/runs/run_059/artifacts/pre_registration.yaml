    LAST escalation per the KB''s own reactivation_condition (no further timeframe
    exists under it) -- no refine, pivot, or escalate anywhere in this mapping.

    '
  window_set_ref: protocols/funding_mr_daily_retest_v1.json
  honesty_notes:
  - id: i
    text: 'Daily activation is structurally ~always-on: the 1h evidence run''s ~12.5%
      activation rate (run_044, 8h-settlement granularity) is a bar-granularity artifact
      of counting 1h bars, not a property of the mechanism. On daily bars, effective
      trade count equals the number of funding-sign FLIPS across consecutive days,
      measured directly from the funding CSVs (command: pandas daily-resample-last
      + sign-flip count, this session): over the pass-gated 49-month window (2019-12-01
      to 2023-12-31), BTCUSDT 228 flips, ETHUSDT 220 flips; over the diagnostic 24-month
      window (2024-01-01 to 2025-12-31), BTCUSDT 76 flips, ETHUSDT 94 flips; full
      73-month span total BTCUSDT 304 / ETHUSDT 314.

      '
  - id: ii
    text: '1h sign-consistency expectation (the settlement-driven impulse materializing
      within the 1h evidence run''s own holding period, per its lag_mismatch_to_regime_persistence
      root_cause) is recorded here as prescreen-level context only, not encoded as
      a pass_rule criterion -- the same division of labor H-041-C-v2''s adequacy_division
      note describes (sample/timing adequacy is a prescreen-stage concern, not re-litigated
      at this gate).

      '
  - id: iii
    text: 'run_044 (the 1h evidence run this reactivation is based on) ran against
      protocols/baseline_v1.json, not the canonical protocols/baseline_v2.json --
      per campaign_knowledge_base.yaml''s funding_rate_continuous_mean_reversion_expanded_auto
      entry''s own protocol_version_note. This registration pins its own protocol
      explicitly via machine_constraints.protocol_ref (K3 lint-enforced) so the same
      default-selection drift cannot recur here.

      '
  - id: iv
    text: 'Criterion (c) (zero_trade_slot_pct <= 50%) is an ENGINE-CONFORMANCE detector
      here, not a selection criterion: with threshold=0.0, trade timing is fully deterministic
      from the funding CSV alone (honesty note i''s flip counts), so zero_trade_slot_pct
      is predetermined by the data, independent of any real trading edge. Criterion
      (c) exists to catch an F5a-class implementation breakage (the divide-by-zero
      bug that previously zeroed every settlement bar for this exact component, see
      the KB''s funding_rate_mean_reversion_run047_invalidated-style entries), which
      would manifest as zero_trade_slot_pct near 100%. The H-041-C-v2 precedent''s
      flat 40% threshold is deliberately NOT reused here: ETHUSDT''s own deterministic
      base rate (see criterion c''s source below) sits within ~1-2 percentage points
      of 40%, leaving no real margin.

      '
  - id: v
    text: 'Diagnostic-only conformance expectation (never gated): funding sign-flip
      counts over the full proposed 2019-12-01..2025-12-31 span are BTCUSDT 304 /
      ETHUSDT 314 (honesty note i). These are reported for continuity/context only,
      mirroring diagnostic_only_eras_never_gated''s own "never gating" framing.

      '
  median_sharpe_semantics: 'Same A3.4 null-window exclusion as H-041-C-v2''s own median_sharpe_semantics
    note: any window with trade_count < 5 gets a null per-window Sharpe (tools/run_protocol.py''s
