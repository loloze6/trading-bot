behavioral_features_rationale:
  reverse_hypothesis: >
    Mechanistic symmetry test: if edge is structural (trend bias), inverse signal
    (short when close < SMA) should not generate opposite edge. Validates directionality.
  activation_sparsity: >
    Pre-registered power calc assumes 45% activation rate. Actual sparsity may differ,
    affecting cost model validation. High sparsity improves per-bar signal quality;
    low sparsity increases cost drag.
  multi_regime_validation: >
    Per brief, edge_source claims regime-invariant mechanism. Prescreen (A8.5.1a)
    will decompose pooled_ic across eras (bull/bear/sideways) to confirm mechanism
    is not era-conditional. If pooled_ic is driven by single era, mechanism is fragile.
  crowding_decay_monitor: >
    SMA(100) is widely known (textbook). Daily execution is less crowded than 1h,
    but adoption risk exists. Track rolling IC to detect crowding collapse early.
    Compare 2024-2025 periods; establish baseline for future lookback.

