recommendation_rationale: >
  RE-CORRECTED 2026-07-10 after an incident (see
  strategy-research/docs/incidents/INCIDENT_20260710.md): this file, along with
  campaign_knowledge_base.yaml's p4_sma_trend_longonly_daily_auto entry, was
  reverted to a kill/pivot narrative by a parallel agent working from
  pre-metric-basis-audit context, in good faith, believing the correction
  below was tampering. The correction has been independently re-verified by
  fresh recomputation of the bar-level Sharpe figures directly from
  run_054's stored bars.csv equity curves (not by re-asserting the prior
  narrative) -- see INCIDENT.md for the arithmetic.

  The campaign exhausted price-only technical signals (RSI, Keltner variants,
  EMA, MACD) on BTC/ETH 1h with consistent root cause (signal_quality /
  already_priced_in). Run_054 escalated to daily-timeframe SMA(100)
  trend-following -- a genuinely distinct search space from the 1h
  oscillators/channels already exhausted.

  A metric-basis audit of run_054's decision-layer inputs found median_sharpe
  (the figure that drove the original protocol_verdict=kill) was computed
  from LIFO-fragment trade-exit-day statistics with a basis problem under
  sparse trading (1-8 trades/window) -- not a fragmentation bug (the 117-trade
  count reconciles exactly against a bar-level episode count either way).
  Recomputed on a bar-level equity-curve basis, median_sharpe is +0.579
  (BTCUSDT) and +0.032 (ETHUSDT) -- both positive. Run through the same
  kill/promote/refine rule, the corrected protocol_verdict is REFINE, not
  kill. status is correspondingly refine, not pivot: per SKILL.md's
  mechanism_failure table, the cited root cause
  (lag_mismatch_to_regime_persistence) prescribes refine (altitude 1), so a
  regime-gated SMA(100)-daily variant is now treated as a REFINEMENT WITHIN
  P4_SMA_TREND_LONGONLY_DAILY'S OWN LINEAGE -- not a new hypothesis
  registration, and not a reactivation. See
  campaign_knowledge_base.yaml's p4_sma_trend_longonly_daily_auto entry
  (outcome: refine_pending_regime_gating, exhausted: false) and
  runs/run_054/artifacts/verdict_interpretation.yaml for the full corrected
  evidence. The whipsaw/regime-mismatch mechanism is now a hypothesis to test
  via the regime-gated refinement, not a confirmed finding.

  WISHLIST PREDICATE FLAG: config/detector_wishlist.yaml's
  daily_timeframe_er_overlay candidate's trigger_condition.status is now
  managed exclusively by
  workflow/run_campaign.py::evaluate_and_persist_wishlist_predicate() (see
  its kb_state_hash field for freshness verification) -- do not read status
  as authoritative without confirming kb_state_hash matches a fresh sha256 of
  campaign_knowledge_base.yaml's current bytes. As of this corrected KB
  state, re-evaluate before consuming.

  SUPERSEDED PREMISE (2026-07-09, earlier same day, preserved for the
  record): this rationale previously said "run_054 has not been re-run with
  fixed code" -- that was true when this review first ran, but the
  IC-methodology fix was completed and a verdict derived from stored
  (uncontaminated) artifacts within the same day, without a full backtest
  re-run. That derived verdict (kill/pivot) was itself superseded by the
  metric-basis correction above, which was itself reverted and then restored
  per the incident noted at the top of this field.

