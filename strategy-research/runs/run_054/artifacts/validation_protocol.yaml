hypothesis_id: "P4_SMA_TREND_LONGONLY_DAILY"

falsifiable_statement: "The SMA(100) daily trend-following signal (long when close > SMA(100), flat otherwise) generates statistically significant positive risk-adjusted returns on BTCUSDT and ETHUSDT, independent of regime and after transaction costs. The edge is structural (recurs across eras and regimes), not era-specific or arbitraged away over the observation period."

null_expectation: "Expected returns after costs are zero or negative; signal outperformance is indistinguishable from passive buy-and-hold; edge decays over time due to crowding; reverse-polarity signal (short-only) produces equivalent positive returns (indicating mean-reversion, not trend-following); activation rate is >70% (whipsaw cost drag exceeds benefit)."

required_evidence:
  - "Walk-forward pooled IC (Spearman, all bars ungated) ≥ 1.5–2.0% across 12 overlapping 30-day windows on both BTCUSDT and ETHUSDT, 2024-12-01 to 2025-12-31"
  - "Per-era decomposition: IC must remain significant (p < 0.05 block-bootstrapped) on backward_extension eras (era_2018_pre_funding, era_2019_2023_full_feed) AND walk_forward_extension (era_2024_2025_walk_forward_extension), confirming regime-invariance"
  - "Reverse-polarity test: short-only signal (close < SMA(100)) shows IC ≤ 0 or statistically indistinguishable from zero, confirming edge is directional, not universal mean-reversion"
  - "Activation sparsity (n_active_bars / n_total_bars): ≤60% on both symbols (prefer ≤50%) to confirm whipsaw drag does not dominate"
  - "Layer 2 cost check: estimated gross edge ≥ 34 bps (BTCUSDT) or ≥ 35 bps (ETHUSDT) per formula, estimated_gross_edge = abs(IC) × sigma_bar_bps × sqrt(avg_holding_bars)"
  - "Minimum holding period validation: back-computed from trade history to verify edge does not collapse with <3 day average holds (where cost drag becomes prohibitive)"

bias_risks:
  - "Look-ahead bias (candle timing): RISK=LOW if SMA(100) computed from bar 0..i known at bar-i close. RISK=MEDIUM if intradata ticks leak into close or SMA calculation. Mitigation: verify timestamp alignment (daily closes at 00:00 UTC, no intrabar data in backtest candle set)."
  - "Leakage via portfolio state: if signal entry/exit is influenced by realized PnL or margin ratio, edge is not price-pure. Mitigation: confirm signal is computed from price data only, independent of PortfolioInfo state."
  - "Regime selection bias: walk-forward windows (2024-12-01 to 2025-12-31) may not represent all market regimes. Holdout (2026-01-01 to 2026-06-30) era_2026_holdout may have different volatility/trend properties. Mitigation: stratified per-era reporting (multi_regime_validation) to identify any era-conditional degradation."
  - "Crowding feedback: SMA(100) is a textbook strategy. Adoption increases slippage and reduces edge. Mitigation: monitor rolling 6-month pooled_ic for cliff-drop (crowding_decay_monitor feature); if IC declines >50% from 2024 to 2025, crowding risk is elevated."
  - "Parameter overfitting: SMA(100) must be pre-registered per brief (no sweep). Mitigation: confirm SMA(100) is stated in research_brief.yaml or prior trial protocol, not selected post-hoc from [10,20,50,100,150,200] scan."
  - "Survivorship/universe bias: backtest includes only BTCUSDT/ETHUSDT (existing since Binance inception). Live universe may expand to delisted or new symbols with different trend properties. Mitigation: document universe scope explicitly; note that results are not generalized to alt-symbols."

failure_modes:
  - "Failure mode 1 — Whipsaw cost drag: Actual activation_sparsity > 60% means frequent false reversals of the SMA(100) signal, each costing 17–17.5 bps round-trip. High turnover erases edge. Trigger: if prescreen reports activation_rate > 65%, edge_to_cost_ratio collapses below safety_factor=2.0."
  - "Failure mode 2 — Era-driven false positive: Edge is entirely driven by 2017-2021 bull market (era_2018_pre_funding or early era_2019_2023). Post-hoc testing on bear markets (2022 or 2026-Q2) shows IC ≤ 0. Trigger: per-era IC decomposition shows all significant IC in single era; other eras have IC consistent with zero."
  - "Failure mode 3 — Crowding collapse: By 2025-Q4, many funds adopt SMA(100) trend-following. Liquidity dries up at daily open. Slippage blows to 5–10 bps (instead of 0.5 bps model). Realized cost rises to 25–30 bps, edge evaporates. Trigger: rolling 6-month pooled_ic shows >50% decline from 2024 to 2025."
  - "Failure mode 4 — Reverse polarity holds: Short-only signal (close < SMA(100)) shows IC > 0, comparable to long-only IC. Edge is mean-reversion, not trend-following; mechanism is wrong. Strategy outperforms in mean-reversion regimes (sideways markets), not structural trend bias. Trigger: reverse_hypothesis IC test shows IC > 1% (statistically significant) on short-only."
  - "Failure mode 5 — Execution slippage underestimation: Model assumes 0.5 bps slippage at daily open. Real slippage on BTC/ETH opens is 1–3 bps during market dislocations (2–4% overnight gaps). Cost model underestimates round-trip by 1–4 bps per trade. Trigger: if walk-forward edge is ≤35 bps (near cost threshold), live slippage kills profitability."
  - "Failure mode 6 — Look-ahead bias: Daily close used for SMA includes intrabar ticks or is forward-biased (published before actual bar close). SMA signal is known before entry window closes, violating next-bar-open execution rule. Trigger: holdout performance >50% worse than walk-forward (typical look-ahead bias degradation)."
  - "Failure mode 7 — Parameter overfitting: SMA(100) selected post-hoc from parameter sweep [10, 20, ..., 200]. Brief constraint ('no parameter sweep') is violated. Edge is not structural but overfitted to walk-forward data. Trigger: prescreen warns 'parameter_overfitting_risk' if SMA period is not confirmed in research_brief.yaml."

sample_split_design:
  walk_forward_range: "2024-12-01 to 2025-12-31 (matches walk_forward_extension in campaign_data_policy.yaml)"
  holdout_range: "2026-01-01 to 2026-06-30 (FROZEN per A6.1; single-use per hypothesis_id)"
  holdout_note: "Single-use per Improvement 06 / A6.1. Once P4_SMA_TREND_LONGONLY_DAILY reaches holdout_evaluation stage, this range is consumed. If hypothesis fails at holdout stage, rejection is terminal (holdout_failure_is_terminal=true per campaign_data_policy.yaml). The hypothesis cannot be re-evaluated; the holdout range is locked for future hypotheses."
  backward_extension_range: "2018-01-01 to 2023-12-31 (available for era-stratified IC decomposition; not consumed in walk-forward optimization)"
  backward_extension_eras:
    - "era_2018_pre_funding (2018-01-01 to 2019-09-09): funding_rate unavailable; ohlcv + fear_greed only; trend-following IC should be computed on price alone"
    - "era_2019_2023_full_feed (2019-09-10 to 2023-12-31): all feeds available; use to validate regime-invariance across funding-rate-available period"
  walk_forward_eras:
    - "era_2024_burned (2024-01-01 to 2024-11-30): prior walk-forward window; available for background era validation but NOT used in current walk-forward search"
    - "era_2024_2025_walk_forward_extension (2024-12-01 to 2025-12-31): primary search window; stratified reporting by this era boundary"
  holdout_era: "era_2026_holdout (2026-01-01 to 2026-06-30): FROZEN"
  windows: 12
  window_size_bars: 21
  step_size_bars: 5
  window_size_bars_note: "21 trading days ≈ 1 calendar month; crypto spot markets trade 24/7; ~21 bars represents 3 weeks, sufficient for trend dynamics to manifest"
  step_size_bars_note: "5 bar step ≈ 1 week; creates ~12 overlapping windows across 13-month walk-forward range; balances sample independence vs. data reuse for hyperparameter stability monitoring"
  era_stratification_requirement: "Each walk-forward window must report pooled_ic separately by era_id (e.g., era_2024_2025_walk_forward_extension) and globally pooled. Prescreen must emit per_era IC breakdown to validate that edge is NOT driven by a single time-period or regime."
  holdout_enforcement: "Holdout range [2026-01-01, 2026-06-30] is FROZEN. No diagnostic, prescreen, or intermediate validation phase may compute metrics using holdout data. Holdout data is consumed only by holdout_evaluation stage AFTER deflated Sharpe gate passes screening (per RUNBOOK.md, stage 8). Orchestrator verifies holdout_range in campaign_data_policy.yaml.holdout_consumed_by before allowing holdout_evaluation run."

decision_rules:
  - "PASS Layer 1 validation: hypothesis is falsifiable, failure modes are explicit, cost model is consulted"
  - "PASS Layer 2 prescreen cost_check: estimated gross edge ≥ safety_factor (2.0) × round_trip_cost, i.e., ≥34 bps (BTCUSDT) or ≥35 bps (ETHUSDT)"
  - "PASS Layer 2 activation_sparsity: actual activation_rate ≤ 60% on both symbols (preferred ≤50%)"
  - "PASS Layer 2 per-era IC decomposition: block-bootstrapped pooled_ic is statistically significant (p < 0.05) on BOTH backward_extension (eras 2018-2023) AND walk_forward (era 2024-2025), confirming regime-invariance"
  - "PASS Layer 2 reverse-polarity test: short-only signal IC ≤ 0 or p > 0.10 (not statistically significant), confirming edge is directional trend-following, not universal mean-reversion"
  - "ADVANCE to screening_backtest: if all Layer 2 checks pass, emit screening_backtest specification with conditional approval of cost_feasibility (see below)"
  - "REJECT at Layer 2: if cost_feasibility.plausibility = implausible (see below), set decision status = reject with blocking_issue = 'turnover/cost mismatch'; no conditional_approve allowed"
  - "CONDITIONAL_APPROVE with conditions: if cost_feasibility.plausibility = plausible or marginal, approve with explicit conditions (see output YAML)"

cost_feasibility:
  assumed_round_trip_cost_bps:
    BTCUSDT: 17.0
    ETHUSDT: 17.5
  primary_symbol: "BTCUSDT (default analysis symbol)"
  primary_cost_bps: 17.0
  safety_factor: 2.0
  required_gross_edge_bps_per_trade:
    BTCUSDT: 34.0
    ETHUSDT: 35.0
  signal_class: "Trend-following (SMA-based momentum continuation)"
  timeframe: "Daily (1d candles)"
  expected_holding_bars:
    min: 5
    max: 40
    reasoning: "SMA(100) trend typically lasts 1–8 weeks. If trend reverses, exit within 1–5 days. Average holding: 10–20 bars (~2–4 weeks). Cost amortization window is wide."
  expected_trades_per_window: "10–15 complete round-trips per symbol per 30-day walk-forward window"
  expected_trades_per_window_reasoning: "Pre-registered activation_sparsity = 0.45 → ~45% of 21 bars per window = ~9.5 active bars, roughly 1 trade per 2–2.5 bars → ~8–10 round-trips per window; empirical count will refine this."
  plausibility: "plausible"
  plausibility_rationale: "SMA(100) trend-following on daily timeframe is an established signal class with strong academic support (Moskowitz et al. 2012, 'Time Series Momentum'; Jegadeesh & Titman 1993, 'Returns to Buying Winners and Selling Losers'). Typical daily trend-following in crypto earns 15–50 bps gross per trade under favorable regimes. Required edge (34–35 bps) is at the lower end of this range, plausible if: (a) activation rate ≤50%, (b) average holds are ≥10 bars (2 weeks, amortizes costs), (c) trend bias is robust across regimes. Daily resolution (vs. 1h) significantly reduces execution slippage and market-impact risk, improving plausibility. If activation_sparsity proves >60% or avg_holds <5 bars in empirical prescreen, plausibility downgrades to marginal."
  plausibility_rubric_applied: "Established signal (✓) + demonstrated edge range 15–50 bps on daily (✓) + cost amortization window is wide (✓) + primary symbol's cost (17.0 bps) is moderate relative to typical daily edge (✓) → plausible"
  sensitivity_analysis:
    maker_execution:
      round_trip_cost_bps_blended:
        BTCUSDT: 15.86
        ETHUSDT: 16.04
      note: "Maker execution (UNVALIDATED fill-rate assumption, NOT approved for gating decisions per cost_model.yaml HARD RULE) would reduce required gross edge to ~31.7 bps (BTCUSDT). This is reported for transparency only; verdict decisions MUST use taker path (17.0 / 17.5 bps)."
    improved_regime_filtering:
      mechanism: "If in-regime gating (e.g., high volatility or strong trend environment) reduces activation to <20%, then required edge per trade increases (fewer, higher-conviction trades). Offset: each trade becomes higher-conviction, edge per trade typically rises. Mitigation: test as separate hypothesis variant (not in current run due to brief constraint)."
  cost_check_gate: "If estimated_gross_edge_bps_per_trade (Layer 2, computed from prescreen IC and signal stats) < required_gross_edge_bps_per_trade, hypothesis FAILS prescreen cost_check and does NOT advance."