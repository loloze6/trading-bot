primary_failure_mode: "Signal has no directional edge at 4h timeframe; edge that existed at 1h (corr=+0.214, run_017) collapsed to 0.0136 at 4h."
config_to_failure_map: |
  KeltnerBreakoutComponent with scaling_factor=-20.0, atr_multiplier=2.0, ema_period=20
  was validated at 1h (run_017: forecast_return_corr=+0.214). Configuration ported unchanged
  to 4h per escalation hypothesis. At 4h, the same configuration yields median_forecast_return_corr=0.0136,
  indicating the edge is timeframe-specific and does not transfer to longer bars.
  The escalation assumption (signal independence from timeframe) is violated.

untested_criteria:
  - "V1 Sharpe > V2 Sharpe + 0.5: V2 (upper-band, scaling_factor=+20) reverse test not executed"

proposed_change_dimension: "signal_component"
hypothesis_family: "keltner_mean_reversion"
altitude_justification: |
  Rule 2: abs(median_forecast_return_corr=0.0136) < 0.03 threshold. Signal produces no
  directional edge at 4h despite ample trade volume (358+ trades). The 1h baseline of
  corr=+0.214 was NOT preserved, ruling out Keltner as viable at this timeframe. Pivot
  required to test alternative signal structure while maintaining 4h timeframe and
  TRENDING regime to isolate whether any mean-reversion signal can capture 4h alpha.