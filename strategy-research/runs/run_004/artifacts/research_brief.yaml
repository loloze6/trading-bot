research_goal: >
  Identify a volume-confirmed momentum or mean-reversion anomaly on BTCUSDT spot 
  that delivers robust, risk-adjusted profitability (e.g., Out-of-Sample Sharpe > 1.2, 
  low max drawdown) and maintains statistical significance across both TRENDING and 
  RANGING market regimes, without overfitting to recent price action.
existing_context:
