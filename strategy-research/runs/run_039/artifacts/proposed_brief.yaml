hypothesis_id: TEMPORAL_COVERAGE_MULTI_REGIME
asset: "BTCUSDT, ETHUSDT"
timeframe: 1h
research_question: "Can we achieve uniform monthly signal activation (>= 1 trade per window-symbol slot in >= 21 of 22 slots) and forecast_return_corr >= 0.15 by layering the Keltner/TRENDING signal with a RELAXED ER threshold (0.45 instead of 0.50) combined with RSI mean-reversion secondary, tuned to fire in sparse months?"
signal_concept: "Composite 2-signal strategy: (1) Primary: Keltner/TRENDING with ER >= 0.45 filter (relaxed from 0.50 to increase regime frequency from 4–7 to 7–10 windows per symbol, targeting 40+ cumulative trades per symbol). (2) Secondary: RSI mean-reversion (period=14, scaling_factor=0.4, long_only=false) designed to activate in sparse months. Composite forecast = weighted_average(keltner_forecast, rsi_forecast) with weights 0.60/0.40 (unchanged from V1). Hypothesis: relaxing ER threshold by conservative 0.05 step will allow sufficient regime activation for proper signal validation without the over-relaxation penalty observed in run_034."
constraints:
  - "Measurement: cumulative trade count must improve from 22 to 40+ per symbol (targeting >= 50 per symbol). This is a prerequisite gate for reliable Sharpe and correlation estimation."
  - "Preserve forecast_return_corr >= 0.15 (primary gate). Current -0.0724 with n=22 is too sparse to evaluate; with n=40+, if true edge exists, corr should rise above 0.03 and approach 0.15."
  - "Cost_drag < 50% (secondary gate). Current 28.99% acceptable; relaxing ER will increase trade frequency moderately (expect 35–45%) due to lower threshold, not threshold-induced false signals."
  - "Walk-forward Sharpe >= 0.40 (validation gate). Current 0.0 and -4.088 are unreliable (computed from 1–18 trades per window); with 40+ trades, Sharpe will become statistically meaningful."
  - "If this ER=0.45 refinement produces corr < 0.03 with n=40+, do NOT relax further. Pivot to V2_STOCHASTIC_CROSSOVER secondary signal instead."
change_from_previous: "Single parameter refinement: ER threshold relaxed from 0.50 to 0.45 in regime_detector.rules[trending] any_of[0]. Rationale: current ER >= 0.50 triggers trending regime in only 4–7 windows per symbol (22 total trades). Cumulative trade count falls below statistical validation floor of 50. Root cause is regime starvation, not signal failure: RSI secondary cannot fire when the regime gate never opens. Precision 0.05 step is conservative (run_034 precedent: 0.50 → 0.30 caused corr collapse). This change directly isolates whether RSI adds value by enabling sufficient data collection. All other config unchanged (RSI period=14, weights 0.60/0.40, scaling)."