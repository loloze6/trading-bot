base_hypothesis_id: TEMPORAL_COVERAGE_MULTI_REGIME
variant_selected: V1_RSI_CONSERVATIVE
status: spec_ready
config:
  regime_detector:
    mode: threshold_rules
    components:
      - id: er
        class: strategies.strategy_components.EfficiencyRatioRegimeComponent
        params:
          period: 24
          smooth_period: 5
      - id: vr
        class: strategies.strategy_components.VarianceRatioComponent
        params:
          k: 5
          window: 100
    rules:
      - regime: trending
        any_of:
          - - id: er
              op: gte
              value: 0.50
            - id: vr
              op: gte
              value: 1.10
          - - id: er
              op: gte
              value: 0.50
            - id: vr
              op: between
              low: 0.90
              high: 1.20
      - regime: mean_reversion
        any_of:
          - - id: vr
              op: lte
              value: 0.90
    default_regime: unknown
  strategies:
    warmup: 51
    regimes:
      trending:
        components:
          - id: keltner
            class: strategies.strategy_components.KeltnerBreakoutComponent
            params:
              ema_period: 20
              atr_period: 20
              atr_multiplier: 1.5
              scaling_factor: 20.0
            weight: 0.60
            lookback: 500
            history_transforms: []
            transforms:
              - op: identity
          - id: rsi
            class: strategies.strategy_components.RSIPullbackComponent
            params:
              period: 14
              scaling_factor: 0.4
              long_only: false
            weight: 0.40
            lookback: 500
            history_transforms:
              - op: vol_normalize
            transforms:
              - op: ratio_to_mean
              - op: scale
                params:
                  factor: 10.0
      mean_reversion: null
      chop: null
      unknown: null
config_rationale:
  - "Primary signal (Keltner breakout): KeltnerBreakoutComponent in trending regime captures momentum directional moves; scaling_factor 20.0 produces forecast in ±20 range."
  - "Secondary signal (RSI pullback): RSIPullbackComponent with period=14, long_only=false enables bidirectional mean-reversion detection; scales to (50-RSI) × 0.4."
  - "Regime gate: ER >= 0.50 required per hypothesis; paired with VR >= 1.10 (confirmed trend) OR VR in [0.90, 1.20] (moderate volatility trend)."
  - "Composite weights: Keltner 0.60 (primary), RSI 0.40 (secondary); ensemble sums weighted outputs / sum weights, clipped ±20."
  - "Normalization pipeline: RSI uses vol_normalize (history) + ratio_to_mean (forecast) + scale 10x to make its signal comparable to Keltner's already-scaled output."
  - "Sparse-month behavior: RSI naturally fires more frequently when price oscillates (low ER); in sparse/low-volume months, this increases signal density without explicit temporal gating."
component_gap: null