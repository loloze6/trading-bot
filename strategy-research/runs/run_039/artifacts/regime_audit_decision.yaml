recommended_action: 'The structural blocker is transition_frequency (~40 transitions/window
  observed on the best directly-implementable config, vs <=4 required for high confidence).
  This cannot be resolved by ER threshold tuning alone. The only detector-intrinsic
  path to lower transitions is adding min_dwell >= 24 bars to the engine — the retune
  grid projects this reduces transitions to ~18/window (er=0.30, dwell=24, exit=0.240;
  see regime_retune_results.yaml). Even at ~18/window the high gate (<=4) is not met.
  No ER-based single-indicator configuration on BTC/ETH 1h achieves high confidence
  simultaneously on all four intrinsic criteria (persistence, activation-in-band,
  class-conditional sensitivity, transition frequency). Per A2.3 post-unusable policy:
  record candidate detector families in config/detector_wishlist.yaml; do not build
  a replacement detector until a confirmed ungated edge exists with regime-dependent
  performance in Improvement 03 diagnostics.

  '
