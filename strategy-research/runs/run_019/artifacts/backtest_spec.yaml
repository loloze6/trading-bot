status: "spec_ready"

config:
  regime_detector:
    mode: "threshold_rules"
    components:
      - id: "er"
        class: "strategies.strategy_components.EfficiencyRatioRegimeComponent"
        params:
          period: 24
          smooth_period: 5
      - id: "vr"
        class: "strategies.strategy_components.VarianceRatioComponent"
        params:
          k: 5
          window: 100
    rules:
      - regime: "trending"
        any_of:
          - - id: "er"
              op: "gte"
              value: 0.50
            - id: "vr"
              op: "gte"
              value: 1.20
    default_regime: "unknown"

  strategies:
    warmup: 51
    regimes:
      trending:
        components:
          - id: "rsi"
            class: "strategies.strategy_components.RSIPullbackComponent"
            params:
              period: 14
              scaling_factor: 0.4
              long_only: true
            weight: 1.0
            lookback: 500
            history_transforms:
              - op: "vol_normalize"
            transforms:
              - op: "ratio_to_mean"
              - op: "scale"
                params:
                  factor: 10.0
              - op: "threshold_filter"
                params:
                  min_abs: 20.0
      mean_reversion: null
      chop: null
      unknown: null

config_rationale:
  - "Hypothesis 'TRENDING regime only (ER ≥ 0.50, VR ≥ 1.20)' → Config: EfficiencyRatioRegimeComponent (period=24) + VarianceRatioComponent (k=5, window=100) with rule-based detection of both thresholds. Non-TRENDING regimes (mean_reversion, chop, unknown) set to null to suppress trading."
  - "Hypothesis 'RSI period=14 with min_abs=20.0 threshold' → Config: RSIPullbackComponent with period=14, scaling_factor=0.4, long_only=true; threshold_filter transform min_abs=20.0 implements primary target (33% stricter than baseline 15.0, targeting 40-50% trade reduction)."
  - "Hypothesis 'Volume-adaptive, quantile-based dynamic filtering' → Config: history_transforms=[vol_normalize] for volatility normalization; transforms=[ratio_to_mean, scale(10.0), threshold_filter(20.0)] provide quantile-scaled signal with high-conviction entry filtering."

component_gap: null