decision_tree_for_validation_gate:
  stage: "validation_gate"
  primary_candidate: "V1-Conservative (exact specification; conservative per persona checklist)"
  
  if_V1_Sharpe_positive:
    decision: "Pass to backtest_specification; V1 is primary candidate."
    secondary: "Run V3 and V5 as robustness stress-tests in parallel."
  
  if_V1_Sharpe_zero_or_negative:
    step_1: "Run V2 (lower threshold); determine if trade frequency is limiting factor."
    step_2a_if_V2_positive: "Threshold ≥0.3 is optimal; refine to V2 or intermediate (0.35)."
    step_2b_if_V2_negative: "Trade frequency is not limiting; edge is regime-type dependent. Test V4."
    step_3_if_V4_positive: "Keltner thrives in anti-trend (choppy) regimes; invert V1 to V4."
    step_3b_if_V4_negative: "Score-mode regime definition is fundamentally broken at SOLUSDT 4h; escalate to alternative data."

alternative_data_justification:
  defer_reason: "Keltner ATR already encodes volatility regime. Spread/funding rates marginal first pass."
  trigger_for_escalation: "If V1, V2, V3, V4, V5 all fail (Sharpe ≤ 0 for all), then regime model is insufficient. Escalate to microstructure or positioning proxies."

