  expansion_scope: "Threshold tuning (V1, V2), weighting validation (V3), regime direction reversal (V4), persistence stress-test (V5)."

variant_mapping_to_failure_modes:
  V1_Conservative:
    addresses_failure_mode: "Baseline; validates whether score-mode ≥0.4 is calibrated for SOLUSDT 4h."
    dependency: "Primary gate. If Sharpe ≤ 0, escalate to V2 or V4."
  
  V2_LowerThreshold:
    addresses_failure_mode: "regime_score threshold 0.4 is still too tight; Sharpe ≤ 0, insufficient trades."
    escalation_path: "If V1 fails due to low trade count, V2 expands sample to 20-35 trades."
  
  V3_SymmetricWeighting:
    addresses_failure_mode: "VR weighting (2.0) may over-dominate; regime sensitivity to weighting unknown."
    escalation_path: "Secondary stress-test; run only if V1 succeeds but weight contribution unclear."
  
  V4_InverseRegime:
    addresses_failure_mode: "Signal edge exists only in true AND-gate regimes (high ER AND high VR); score-mode dilutes selectivity."
    escalation_path: "If V1 Sharpe ≤ 0, test inverse to determine regime type directional bias."
  
  V5_SmoothedRegime:
    addresses_failure_mode: "Score-mode fires too noisily; regime transitions are noisy spikes, not sustained shifts."
    escalation_path: "If trade clustering is excessive (high churn), test SMA smoothing for regime persistence."

