pattern_detected: "same_root_cause_different_families"
pattern_evidence:
  - "Signal_quality failure across mechanistically distinct price-only technical indicators:"
  - "  - RSI(14): forecast_return_corr=-0.022 (run_014, no directional content)"
  - "  - Keltner mean-reversion: ic_active_bars=-0.032, p=0.83 on regime-labeled bars (runs 017/024/027/033, KB A8.3 full-range prescreen run_039)"
  - "  - Keltner breakout: forecast_return_corr=-0.171 (run_015, inverted signal)"
  - "  - EMA spread: ic_all_bars=-0.021091, p=0.588, n_eff=664 (run_043, dense always-on signal, no edge)"
  - "  - MACD: ic=-0.050271 (run_053, prescreen kill on extended 2-year data)"
  - "  - Keltner scoremode: forecast_return_corr=0.2953 (run_028) but cost_drag=84% → structural cost barrier overwhelms signal"
  - "KB attribution (keltner_root_cause_reattribution): Zero-trade months in regime-gated tests were a symptom of deeper signal failure. Run_039 full-range prescreen confirmed ic_active_bars=-0.032 even on TRENDING-labeled bars the detector selected as its operating regime. Root cause reattributed from regime_availability to signal_quality."
  - "KB attribution (ema_spread_trend_continuation_v1_auto): 'EMA crossover is a textbook, universally-taught technical signal on the most liquid crypto pair — consistent with this campaign's established finding that no price-only technical indicator (RSI, Keltner in any variant, now EMA spread) shows exploitable directional content on BTC/ETH 1h.'"
  - "Interpretation: Across 6+ mechanistically distinct families (RSI, Keltner mean-reversion, Keltner breakout, Keltner scoremode, EMA, MACD), all are failing on THE SAME ROOT CAUSE: weak or zero correlation on price-only technical signals at 1h granularity on the most liquid, most efficient crypto pair (BTC/ETH)."

forecast_return_corr_trend: "No monotonic improvement. Keltner variants cluster at 0.2145 (deterministic identical signal, not improving). RSI variants cluster near zero or negative. EMA=-0.021. MACD=-0.050. Terminal runs (run_043, run_048, run_053) show no recovery. Trend: worsening or stable-null."

cost_drag_trend: "Highly variable by family: RSI_momentum_trending 273%, Keltner_scoremode 84%, EMA/Keltner variants 25-50%, Funding/Fear_greed ~70-135%. Trend is not monotonic. Cost barriers are family-specific, not parameters-tunable. No progress toward improving cost_drag across altitude."

recommendation: "reframe"

recommendation_rationale: "The campaign has tested six mechanistically distinct hypotheses (RSI, Keltner mean-reversion, Keltner breakout, Keltner scoremode, EMA, MACD) across 52 trials and runs. All show signal_quality failure: zero/weak/inverted directional correlation on price-only technical indicators at BTC/ETH 1h. This is not a tuning problem (altitude_history shows exhaustive parameter exploration) but a structural property: price-based technicals on the most efficient markets produce no exploitable edge. Simultaneously, the research_brief's stated goal (backward-extended 2018-2025 testing) was not executed; protocols defaulted to 2-year windows due to orchestrator wiring. The budget is approaching limit (~53 runs used of ~50-60 budgeted). The current search direction (mechanistic variation within price-only technicals) has converged to a null result. Two paths forward exist: (1) Fix orchestrator wiring and properly execute extended-data trend testing, OR (2) Pivot to structurally different mechanism classes (funding rate, behavioral sentiment) via the already-scheduled backward-extension pass (KB operational.backward_extension_pass: H-041-A and H-041-C on 2018-2025 data, post-build-steps, status scheduled_post_build_steps). Given infrastructure constraints, path (2) is recommended as next research direction."

