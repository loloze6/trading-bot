    source: BLOCK-01
    severity: critical
    description: >
      shift(1) on rolling zscore series not code-reviewed.
      VMD-B-zscore and VMD-A carry implementation_allowed: false.
    resolution: "Code reviewer confirms .shift(1) precedes zscore formula for both series."
    blocks: backtest_execution
    clears: backtest_specification_authoring

  - id: BLK-02
    source: BR-06
