primary_variant: VMD-B-zscore

status: approve

rationale: >
  VMD-B-zscore is falsifiable, regime-routed with documented lag controls, and carries
  a pre-registered primary variant. Multiple comparison structure is partially defined
  (BH for secondaries). Six enumerable failure modes are testable via constructed statistics.
  Hypothesis structure clears gatekeeper criteria. Backtest specification authoring may
  proceed. Backtest execution is hard-blocked pending BLK-01 and BLK-02 resolution.
  BLK-03 (parameter pre-registration) must be resolved before IS run begins.

blocking_issues:
