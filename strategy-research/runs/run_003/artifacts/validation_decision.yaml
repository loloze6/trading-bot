    resolution: >
      Pre-register single parameter tuple in backtest_specification.yaml before
      IS backtest is executed. All 72 configs reported; only pre-registered tuple
      used for primary hypothesis test.
    blocks: backtest_authorization
    clears: specification_authoring

  - id: BLK-04
