hypothesis_id: TEMPORAL_DISTRIBUTION_FINDING_ER50_KELTNER
what_failed:
  - "median_sharpe: FAIL across all 4 clean ER>=0.50 replications (run_017, run_024, run_027, run_033)"
  - "min_trade_count: FAIL — 7 of 22 window-symbol slots fire zero trades"
  - "walk_forward_stability: FAIL — per-window trade counts range 1-9 with high variance"
diagnostic_rule_applied: >
  TEMPORAL DISTRIBUTION (not covered by Rules 1-6): 69 cumulative trades across 22
  window-symbol slots is above the statistical floor, but the distribution is fatally
  skewed. 7 slots have zero trades because the TRENDING regime (ER>=0.50, VR>=1.20)
  does not occur in those calendar months regardless of threshold. This is not Rule 6
  Case B (starvation from over-tight threshold) — at ER>=0.50 the signal has been
  confirmed with corr=0.214, and confirmed zero-trade months are Jan, Sep, Oct (BTC)
  and Jan, Mar, Jul, Nov (ETH). These are months where ER simply does not reach 0.50.
  Relaxing the threshold (Rule 6 Case B response) has been tried at ER>=0.35 and
  ER>=0.30 — both collapse corr to 0.041-0.082. There is no ER threshold that
  simultaneously activates the signal in the dead months AND preserves the corr.
