what_not_to_try:
  - "Do NOT attempt further ER/VR threshold tuning on this signal. The tradeoff has
    been fully explored: ER>=0.50 preserves corr but misses 7 months; ER<=0.35
    activates more months but collapses corr. No threshold in this range solves both."
  - "Do NOT attempt regime_confidence_filter or position-sizing adjustments (the
    COST_DRAG_STRUCTURAL_FIX brief in run_038). The problem is zero-trade months —
    no filter applied to the existing signal trades will backfill those months."
  - "Do NOT attempt timeframe escalation (4h, 2h) to address this. The temporal gap
    is calendar-month-level: months with low ER on 1h also have low ER on 4h. Run_027
    (4h replication) produced identical corr=0.2145 and identical cost_drag=27.45%,
    confirming timeframe does not change which months the regime fires."
  - "Do NOT propose instrument escalation (SOLUSDT, AVAXUSDT, DOTUSDT) on this
    specific signal family. The issue is signal-regime compatibility, not instrument
    selection. Run_027 (SOLUSDT) produced the same zero-month pattern."
next_altitude: campaign_review
campaign_review_rationale: >
  The COST_DRAG_STRUCTURAL_FIX research question (run_038 brief) was framed by
  campaign_review before the temporal distribution finding was computed. That finding
  invalidates the current brief's premise: it assumes cost_drag comes from too many
  trades (target is reduce_trade_count), but the confirmed data shows the signal has
  too FEW trades (69 across 22 slots, 7 with zero), and the binding constraint is
  temporal coverage, not trade frequency. campaign_review must reframe with this
  finding as the primary input before run_038 executes any backtest.
