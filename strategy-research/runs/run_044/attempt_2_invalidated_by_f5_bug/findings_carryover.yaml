what_not_to_try:
  - "Pivoting away from funding-rate mechanism prematurely: this run did not measure signal quality (active_n_bars=0, no IC measured). The mechanism itself (8h forced settlement flows as mean-reversion driver) is theoretically sound; this is execution failure, not signal failure."
  - "Escalating to a different instrument: the failure is component-level (initialization), not venue-level. All venues would show active_n_bars=0 if aux_feeds or settlement logic is broken."
  - "Escalating to a different timeframe: settlement cycles are 8h absolute time, independent of chart timeframe. Timeframe change will not address settlement-bar detection failure."

next_altitude: "refine"

notes: "H-044 configured FundingRateMeanReversionComponent(threshold=0.0) to fire at all settlement bars with aux_feeds: [funding_rate]. Expected ~3 activations/day × 330 prescreen days ≈ 1,000 active bars minimum. Prescreen consumed BTCUSDT, ETHUSDT, 2024-01 through 2024-11 (16,032 bars) and produced active_n_bars=0. This points to: (a) Funding-rate time series is missing or null during prescreen window, (b) FundingRateMeanReversionComponent.process() has a logic bug preventing settlement-bar identification, (c) Warmup=3 or regime initialization silences settlement bars. Recommended refine: run H-045 with identical config but add external validation (logging at component input/output and settlement-bar identification points) to confirm funding_rate values are present and settlement hour logic is executing. If H-045 still shows active_n_bars=0 WITH validation confirming funding_rate data exists, escalate to developer review of component implementation."