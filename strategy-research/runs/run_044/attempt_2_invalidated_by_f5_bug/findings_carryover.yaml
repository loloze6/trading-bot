bug_superseded: true
bug_superseded_note: >
  F5 (2026-07-04): this diagnosis was remarkably close to the actual root cause
  (correctly identified "component initialization failure," correctly ruled out
  signal-quality/venue/timeframe explanations, correctly proposed re-validating
  aux_feeds wiring). The actual bug: FundingRateMeanReversionComponent's confidence
  calc divides by zero when threshold=0.0 (this hypothesis's own continuous-mode
  design), silently swallowed by main_strategy.update(). Fixed in F5a. The
  next_altitude=refine recommendation below was correct in spirit but was overridden
  by a separate bug (F6: stale cross-family circuit-breaker state forced pivot instead
  -- see campaign_state.yaml altitude_history run_044 outcome_invalidation_note).
hypothesis_id: FUNDING_RATE_CONTINUOUS_MEAN_REVERSION
what_failed:
  - "Component execution: zero active bars generated across 16,032-bar prescreen window (forecast_sparsity_pct=100%)"
  - "Aux-feeds integration: funding_rate data was either missing, null-valued, or not merged into component input stream"
  - "Settlement-bar detection: logic for UTC hour % 8 == 0 either not executing or not correctly identifying settlement bars"

diagnostic_rule_applied: "Rule 6, Case B analog: active_n_bars=0, forecast_sparsity_pct=100%, ic_significance.p_value=1.0 (not computed) indicates component initialization failure, not signal weakness. Distinct from signal-quality failure (weak IC on active bars)."

