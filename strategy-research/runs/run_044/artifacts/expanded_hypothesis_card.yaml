    name: Liquidation_Data_Mechanism_Purity
    description: "Would decompose volume confirmation signals at settlements into organic herding vs. cascade-driven reversals. Enables confident V2 (Keltner gate) validation."
    feed_status: unavailable
    routing: feed_wishlist
    unlock_impact: "Improves V2 mechanism specificity; prevents false-positive volume confirmation during liquidation cascades."

  - candidate_id: ALT2
