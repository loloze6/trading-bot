reverse_hypothesis:
  - reverse_id: REV1
    mechanism: "+sign(8h_funding_rate) × 10.0 — same direction as funding payment (alignment, not reversal)."
    rationale: "Margin calls from longs paying → forced selling cascade → price falls further (continuation, not stabilization)."
    diversity_check:
      library_category: structural_rate
      data_requirements: funding_open_interest
      verdict: cosmetic_rejected
      reason: "Shares V1 category AND data_requirements. Polarity flip is parameter change only. Per Improvement 04, rejected. Re-activate if V1 shows positive IC (opposite expected direction)."

behavioral_features:
  - feature_id: BF1
    name: Settlement_Lag_Inertia
    description: "Retail traders lag mechanical settlement adjustments by 1–4 bars. Initial rebalancing at t0; secondary participant reaction extends mean-reversion impulse."
    proxy: "Bars t1–t4 post-settlement IC sustained or rising vs. t0 (settlement bar). Indicates inertia-driven reversion persistence."
    variant_relevance: "V1/V2/V3 all benefit. V2 (Keltner) may amplify by capturing inertia-driven extremes."

  - feature_id: BF2
    name: Leverage_Reset_Clustering
    description: "Settlement boundaries coincide with margin reset cycles; stop-order and liquidation clustering occurs near settlement times, exacerbating flow."
    proxy: "Volume clustering, spread widening at UTC settlement hours. Requires order_book data to validate."
    variant_relevance: "V1 inherits passively. V2 (Keltner) captures clustering via band extremes. V3 (sentiment) orthogonal."

