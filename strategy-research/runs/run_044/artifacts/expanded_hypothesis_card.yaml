base_hypothesis_id: FUNDING_RATE_CONTINUOUS_MEAN_REVERSION
hypothesis_id_expanded: FUNDING_RATE_CONTINUOUS_MEAN_REVERSION_EXPANDED

thesis: >
  The sign of 8h perpetual funding rate carries ungated mean-reversion information
  at every settlement boundary on BTC/ETH 1h. V1 activates continuously (threshold=0.0).
  V2/V3 explore orthogonal complementary filters (volatility, sentiment) without regime
  gating, documented for diversity audit only — V1 executes this cycle per shakedown brief.

expanded_variants:
  - variant_id: V1
    name: FundingRateMeanReversionComponent_Continuous
    mechanism: "−sign(8h_funding_rate) × 10.0 at every UTC settlement bar (hour % 8 == 0), regardless of magnitude (threshold=0.0)."
    component: "FundingRateMeanReversionComponent(threshold=0.0, scaling_factor=10.0) from strategy_components.py"
    edge_source:
      category: structural_forced_flow
      specific_mechanism: "Mechanical 8h settlement forces position rebalancing: positive funding → longs reduce (bearish flow); negative → shorts reduce (bullish flow). Non-optional, recurring, all magnitudes → continuous mean-reversion pressure."
      measurable_proxy: "Binance 8h perpetual funding_rate sign; settlement occurs at UTC 0, 8, 16 hours daily."
      evidence_type: funding_open_interest
    parameters:
      threshold: 0.0
      scaling_factor: 10.0
      activation_bars_per_day: 3
    activation_rate: 0.125
    library_category: structural_rate
    data_requirements: funding_open_interest
    diversity_axis: "Base hypothesis; continuous activation; no filters or modifiers."
    known_regime_affinity: neutral
    power_estimate:
      a_priori_n_eff: 100.4
      min_detectable_ic: 0.10
      verdict: sufficient_power_a_priori

