campaign_id: "rsi_mean_reversion_low_er"
runs_reviewed: 28
pattern_detected: "same_root_cause_different_families"
pattern_evidence:
  - "keltner_mean_reversion (runs 017, 024, 027, 033): forecast_return_corr=0.2145 on TRENDING-gated bars only (~1% of bars); full-range prescreen (run_039) ic_active_bars=-0.032 (p=0.83, n_active=1125). Signal produces zero directional content on the regime it was designed for."
  - "keltner_breakout (runs 015, 033): forecast_return_corr=-0.171, confirming signal inversion. Same underlying mechanism (Keltner) as mean_reversion family."
  - "keltner_scoremode (runs 028, 030): forecast_return_corr ranging 0.014–0.2953; cost_drag=84%, a 4× structural cost barrier independent of parameter tuning."
  - "keltner_trend_mean_reversion (runs 024, 027, 033): reuses identical signal and params as keltner_mean_reversion; shares the same zero-directional-content root cause."
  - "rsi_mean_reversion (run_014): forecast_return_corr=-0.022 after exhausting parameter space (smooth_period, er_threshold, vr_threshold all varied)."
  - "rsi_momentum_trending (run_018): forecast_return_corr=0.018, cost_drag=272.8%, structural cost unviability (cost barrier >> 80% threshold)."
  - "KB meta_finding (A5.1-A5.3): Keltner families were initially recorded as failing due to 'regime_availability' (zero-trade slots in 7/22 then 14/48 window-symbol slots). Post-hoc analysis (run_039 full-range prescreen) revealed true root cause: signal_quality (ic_active_bars=-0.032, p=0.83 on TRENDING-labeled bars). Campaign spent ~10 runs attempting to fix regime availability via secondary-signal layering when the primary signal itself had zero informational content."
  - "COST STRUCTURE BARRIER: Both rsi_momentum_trending (cost_drag=272.8%) and keltner_scoremode (cost_drag=84%) exceed structural viability thresholds. This is arithmetic, not parameter-tunable: high-frequency rebalancing incurs round-trip costs that overwhelm gross edge on 1h timeframe."
recommendation: "reframe"
recommendation_rationale: >
  The campaign has tested 6 hypothesis families (rsi_mean_reversion, keltner_breakout,
  keltner_mean_reversion, rsi_momentum_trending, keltner_trend_mean_reversion,
  keltner_scoremode) without discovering a consistent positive-IC edge. Misdiagnosis
  of "regime availability" as root cause burned ~10 runs. The true causal structure:
  classical technical indicators on 1h BTC/ETH lack directional content (signal_quality
  failure) coupled with cost-structure constraints (transaction costs overwhelm gross
  edge at rebalance frequency). The ER-threshold detector used for regime gating is
  itself unusable on BTC/ETH 1h (Pareto-blocked by activation×stability tradeoff;
  KB finding: er_detector_unusable_btc_eth_1h). Continuing parameter tuning yields
  diminishing returns. Reframe required: either (a) test daily-timeframe regime overlays
  (KB preferred first candidate) to determine if finer regime delineation recovers
  signal quality, OR (b) proceed to power-parked structural/behavioral signals
  (H-041-A funding_rate, H-041-C fear_greed) with extended historical data (2018+).
  Current search space has hit structural ceiling.

