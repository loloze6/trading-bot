next_research_question:
  hypothesis_id: "DAILY_REGIME_OVERLAY_SIGNAL_QUALITY"
  asset: "BTCUSDT, ETHUSDT"
  timeframe: "1h"
  research_question: >
    Does a daily-timeframe regime overlay (ADX-based trend/range classification or 
    daily HMM state) improve signal quality and activation consistency for Keltner 
    technical indicators on 1h BTC/ETH? Specifically: can a daily regime gate reduce 
    temporal variance (zero-trade months observed in runs 017/024/027/033 attributed 
    to regime detector scarcity) and recover positive forecast_return_corr on a signal 
    family (Keltner TRENDING gate, ER>=0.50) that showed ic_active_bars=-0.032 ungated 
    but forecast_corr=0.2145 when regime-gated? If daily-regime-conditional IC is 
    positive (> 0.05, p < 0.10) AND stable across calendar windows, this validates 
    regime-detection as a mechanism class and justifies building a daily ADX or HMM 
    detector per KB AC4 post-unusable policy (A2.3). If ungated daily-regime edge 
    remains <= 0 or cost-drag remains > 80%, escalate to power-parked structural 
    signals (H-041-A, H-041-C) on extended 2018+ data.
  signal_concept: >
    Keltner channel (ema=20, atr=20, mult=2.0, scale=-20) with daily ADX(14) overlay 
    on trend/range classification. Forecast computed as -sign(keltner_band_breach) 
    modulated by daily ADX regime: full strength in ADX>=30 (trending regime), reduced 
    weight (0.5×) in 20<=ADX<30 (intermediate), zeroed in ADX<20 (ranging). Daily ADX 
    propagated to all 1h bars within each calendar day. Ungated on ER/VR (A2.3 standing 
    policy). Compute forecast_return_corr and ic_active_bars on all bars (filtering 
    active_bars where ADX!=NaN); compare both metrics against baseline (pure Keltner 
    from run_017 canonical). Variant V1 (ADX thresholding per above); V2 (ADX linear 
    scaling, reserved for diversity audit) not executed in this cycle.
  constraints:
    - "One variant only (V1) for immediate run queue; V2 reserved for diversity audit."
    - "Must not replace existing bot architecture or introduce new regime detector infrastructure (standalone assessment only; detector build decision requires AC4 gate)."
    - "Ungated by ER/VR regime detectors (post-A2.3 standing policy)."
    - "Daily ADX computed on daily OHLC; propagated to all 1h bars within each calendar day."
    - "Compute ic_active_bars separately (gates by ADX != NaN) per A8.3 protocol; report both all-bars and active-bars IC."
    - "If positive daily-regime-conditional IC emerges (ic_active_bars > 0.05, p < 0.10 on combined symbols), register full ADX daily detector build (separate hypothesis) per KB post-unusable policy (A2.3 consequence field)."