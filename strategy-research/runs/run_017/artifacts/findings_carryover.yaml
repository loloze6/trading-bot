carryover_lessons:
  - "Keltner lower-band mean-reversion does not have a reliable edge in TRENDING regimes on
    BTCUSDT/ETHUSDT 1h, even after band-width optimization. Edge was not trading-cost-driven
    (cost_drag 27% is acceptable) but signal-driven (pvalue >> 0.10)."
  - "ETHUSDT responds worse than BTCUSDT to this signal (0% win rate vs 22%); consider that
    stablecoin pairs may have different mean-reversion dynamics, or the signal is not
    transferable across assets."
  - "Trending regime (ER≥0.50, VR≥1.20) classification is working (regime fires and has
    reasonable forward returns in some windows), but signal does not profit from those states.
    Problem is signal-regime mismatch, not regime detection."
  - "Next hypothesis should test a structurally different signal (e.g., RSI momentum, MACD
    divergence, volatility mean-reversion) or a different regime mode (e.g., quantile-score
    regime instead of threshold rules)."