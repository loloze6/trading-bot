hypothesis_id: "KELTNER_THRESHOLD_4H_AVAX"
status: "conditional_approve"
rationale: "Core hypothesis (threshold-rules regime filtering reduces cost_drag via marginal-regime elimination) is sound and falsifiable. V1_Conservative is a well-motivated control with clear success criteria (cost_drag <80%, sharpe ≥0.30, min_trade_count ≥5). Variants V2–V5 are mechanically reasonable but require validation gates to prevent look-ahead bias and over-fitting. V6 and reverse-hypothesis are secondary hypotheses; test only if V1 fails. Primary blocker: sample-split methodology must guarantee walk-forward calibration (no look-ahead in percentile/frequency statistics). Proceeding to backtest is warranted if conditions are honored."

blocking_issues:
  - "Look-ahead bias in V2, V4, V6: percentile windows and frequency counters must be computed walk-forward (training data only), not on full dataset. If codebase uses global statistics before train/test split, variants V2/V4/V6 are disqualified. Resolution: verify threshold calibration logic in backtest harness; confirm thresholds are frozen at test window start."
  - "Confidence→position_size scaling verification: V3 conditional approval depends on ExecutionHandler implementing confidence-based position sizing. If confidence only affects forecast (not sizing), V3 is structurally broken. Resolution: audit ExecutionHandler.open_*_position() methods; confirm scaling_factor = base_sizing * confidence_param. Without this, reject V3 before testing."
  - "Trade count floor enforcement: V1 and variants must flag hard stop if min_trade_count <4 in any window (untradeable). This is a binary pass/fail gate, not a soft threshold. Resolution: add backtest-side assertion; halt on violation and report which window failed and why."

conditions:
  - "Walk-forward threshold calibration: ER and VR thresholds computed on training window only. Percentile windows (V2), frequency counters (V6), and regime fire frequency must not use forward data. Confirm in backtest harness before running."
  - "Regime activation frequency measurement: track actual % of candles where regime fires (trending, mean_reversion, unknown). Verify V1 achieves 10–20% target activation; if >25%, thresholds are too permissive and cost_drag goal is at risk."
  - "Minimum trade count floor: if any window produces <4 trades, stop variant testing for that window; flag as untradeable. Variants must achieve ≥5 trades per window (minimum 4) to proceed."
  - "V2-only: Percentile window (252 bars ≈ 6 days) must align to training period boundaries. Verify that rolling 60th/40th percentiles are computed on training data; test data applies frozen percentile thresholds (no adaptive re-calibration)."
  - "V3-only: Prior to testing V3, confirm ExecutionHandler.open_*_position() scales position_size by confidence parameter (e.g., size = base_size * confidence). Measure actual position sizes for low-confidence (0.3) vs nominal (0.7) trades; confirm ≤50% size reduction. Without this scaling, V3 is broken."
  - "V4-only: Post-backtest regime validity analysis required. Compute forward_return_mean and win_rate for trending vs mean_reversion regimes (filtered by ER/VR thresholds). Asymmetric gates justified only if mean_reversion forward_return_mean ≥ trending; otherwise reject V4."
  - "V5-only: Regime persistence distribution analysis required. If mean persistence <3 bars, V5 N=3 filter eliminates most signals; reject V5 or re-tune N to 1–2."
  - "Baseline comparison: isolate threshold effect by comparing V1 to run_030 (score-mode with cost_drag=128.44%). All other config parameters must be identical; only regime_thresholds change. If cost_drag remains >100%, thresholds are ineffective (cost_drag is slippage-driven, not regime-driven)."
  - "V6 & Reverse hypothesis: test only if V1 fails AND failure reason is regime_frequency >20% (insufficient trade volume) or min_trade_count <4 in some windows. If V1 fails due to sharpe <0.20 (edge loss), do not test V6/reverse; failure is structural (Keltner edge lost), not frequency-related."