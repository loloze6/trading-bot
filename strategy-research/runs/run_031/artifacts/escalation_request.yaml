reason: "Mean_reversion regime (VR ≤1.2, the primary regime firing in threshold-rules configuration) marked uninformative on AVAX in multiple walk-forward windows (2024-01, 2024-05, 2024-10) with forward_return_mean near 0. Keltner signal showed positive gross edge in score-mode (run_030: gross_pnl=44.86 median) but signal collapsed to zero edge (forecast_return_corr=0.0021) when threshold-rules gated to high-conviction regimes. Hypothesis predicts threshold-rules isolate informative regime subsets, but AVAX's regime definitions (ER ≥0.30, VR ≥1.5 for trending; VR ≤1.2 for mean_reversion) may be asset-specific or regime detection methodology mismatched to AVAX's market structure. Test same Keltner signal + threshold-rules regime on a different instrument (e.g., BTCUSDT from store_of_value category) to separate signal failure from asset-specific regime dynamics."

proposed_capability: "Validate threshold-rules regime methodology (ER ≥0.30 AND VR ≥1.5 for trending; VR ≤1.2 for mean_reversion) on store_of_value instruments (BTCUSDT, ETHUSDT) where regime definitions may have higher forward edge. If threshold-rules shows signal recovery (forecast_return_corr >0.03, cost_drag <80%, Sharpe ≥0.30) on BTCUSDT, then AVAX is asset-specific and regime should be re-tuned. If signal remains near 0 on BTCUSDT, then Keltner + threshold-rules is fundamentally incompatible and requires component pivot."