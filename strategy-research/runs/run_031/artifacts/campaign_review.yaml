campaign_id: rsi_mean_reversion_low_er
runs_reviewed: 20
pattern_detected: "partial_convergence_with_frequency_bottleneck"
pattern_evidence:
  - "Forecast edge exists: runs 017, 024, 027, 028 show forecast_return_corr ≥0.2145; run_028 peaks at 0.2953."
  - "Gross PnL positive: run_030 research_brief cites median gross_pnl=44.86 across walk-forward windows, confirming directional signal."
  - "Frequency is the constraint: All high-correlation runs (017, 024, 027, 028) pair with excessive cost_drag (27.45–84.29%). Run_030 cost_drag=128.44% despite corr=0.0138 (low signal) — indicates trading too frequently, not signal failure."
  - "Multiple families exhibit same pattern: keltner_scoremode (run_030), keltner_trend_mean_reversion (run_024), and keltner_mean_reversion (run_017) all show corr ≥0.2 with cost_drag >27%. Alternates (rsi_momentum_trending run_018, keltner_mean_reversion run_016) fail harder (cost_drag >180%), but root is identical—over-trading marginal regime combinations."
  - "Timeframe escalation produced evidence of search space narrowing: 1h exhausted → 4h shows more stable higher correlation (017, 024, 027 at 0.2145 vs 1h noise around 0.01). But 4h still over-trades (cost_drag remains >27% minimum)."
  - "Research_brief run_030 analysis correctly identifies Rule 1 diagnostic: cost_drag >80% AND gross_pnl >0 indicates SIZING/FREQUENCY problem, not signal. Score-mode min_score tuning (0.25→0.15 at run_029) made Sharpe worse, confirming parameter exhaustion on that dimension."
pattern_rationale: "Campaign has demonstrated a positive forecast edge in specific regimes (Keltner 4h AVAX) but is blocked by trade frequency. Unlike failed families with fundamentally broken signals (negative correlation), successful runs (017, 024, 027, 028) show signal quality is real—the cost structure prevents profitability. This is a structural constraint, not evidence the research question is wrong."
recommendation: "continue"
recommendation_rationale: "The current research_brief.yaml proposes threshold-rules regime filtering (ER ≥0.30 AND VR ≥1.5 for trending; VR ≤1.2 for mean_reversion) applied to the Keltner 4h AVAX configuration from run_030. This directly targets the diagnosed bottleneck: reducing qualifying candles from estimated 40–60% (score-mode min_score=0.15) to 10–20% (strict thresholds) to eliminate marginal regime trades where forward_return_mean≈0 and cost_drag dominates. Threshold-rules is a methodology pivot (distinct from signal or parameter altitude), justifiable by the empirical evidence that Keltner shows positive gross edge but over-trades. Run_031 is a high-confidence test: if cost_drag drops below 80% while preserving forecast_return_corr >0.15, the structural fix worked; if not, the campaign has identified that frequency filtering itself does not unlock profitability, escalating the question to signal quality or regime design. Budget: 20 of ~35 runs allocated; this pivot consumes 1 run, leaving 14 for follow-ups or reframe if needed."
budget_assessment: "20 runs used / ~35-run campaign budget = 57% allocation. Recommend prioritizing run_031 (threshold-rules) and 1–2 follow-up validation windows before making escalate/reframe decision. If run_031 fails (cost_drag remains >80% OR forecast_return_corr <0.10), THEN reframe toward different signal component or regime methodology, as threshold-rules will have exhausted the frequency-reduction approach."