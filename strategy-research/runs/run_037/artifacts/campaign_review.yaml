  - "Pattern: Across 7 failed families (rsi_mean_reversion, keltner_breakout, keltner_mean_reversion, keltner_trend_mean_reversion, keltner_scoremode, rsi_momentum_trending, rsi_momentum), cost_drag >= 25%, and most sharpe ratios FAIL despite positive correlation. Root cause is NOT the signal — it is trading frequency destroying risk-adjusted returns."
  - "Win rate PASS + Sharpe FAIL appears in runs 016, 020, 021, 029, 030, 034 — signal direction correct, but too many losing trades per window offset alpha."
