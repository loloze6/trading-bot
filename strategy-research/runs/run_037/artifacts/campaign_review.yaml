  - "Instrument escalation (runs 027, 029 testing ETHUSDT, SOLUSDT, AVAXUSDT) yields identical cost_drag patterns to BTCUSDT; problem is structural, not instrument-specific."
  - "Timeframe escalation (run_020, 4h) shows same Sharpe failure pattern; suggests cost_drag is driven by signal rebalance frequency, not absolute time."

recommendation: reframe

recommendation_rationale: "The campaign has tested 7 distinct hypothesis families and 4 instruments across 23 runs, all converging on the same failure mode: positive forecast correlation (0.2+) is neutralized by cost_drag (25-420%), resulting in Sharpe ratio failure. The win_rate PASS + Sharpe FAIL pattern confirms the signal is directionally correct but trades too frequently or too small. Continuing to search for better signals (rsi variants, keltner variants) will not fix a structural problem with position sizing and trade frequency. The research question must shift from 'find the signal that works' to 'find the signal + sizing strategy that generates infrequent, high-conviction trades that survive trading costs.'"

