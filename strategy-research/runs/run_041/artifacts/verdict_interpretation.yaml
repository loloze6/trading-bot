  n_trades: 0
  statistic_valid: neither
  route: insufficient_sample_inconclusive
  note: "A8.5.3 recalibration; parked per A8.5.1b"

do_not_add_to_failed_families: true
do_not_retry_until: >
  Funding regime reactivation trigger is met (see reactivation_trigger above).
  No 2021-2023 backward data extension — out of scope for current campaign phase.
