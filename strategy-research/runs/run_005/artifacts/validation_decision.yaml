hypothesis_id: volume_momentum_btcusdt_1h

status: REFINE

rationale: |
  Hypothesis is testable but contains three unresolved conflicts that must be cleared before backtest.
  
  (1) DIRECTION CONFLICT: Variants 003 and reverse_hypothesis assume volume signals exhaustion/reversal,
  contradicting the base confirmation thesis. Testing both simultaneously confounds results; author 
  must choose ONE before any statistical validation. Economic rationale required, not empirical cherry-picking.
  
  (2) DATA FEASIBILITY: Variants 002, 003, 006 require reliable buy/sell volume decomposition. OHLCV 
  alone cannot provide this; buy_volume proxy has >20% error on low-vol bars. Either restrict to 
  variants 001, 004, 005 (data-feasible) or source trade-level data.
  
  (3) HYPERPARAMETER OPACITY: Clamp range [-20, 20] and vol_thresholds (1.2–1.5) appear arbitrary. 
  Must either justify derivation (risk model? volatility bands?) or treat as tunable hyperparameters 
  and sweep systematically in walk-forward.

blocking_issues:
  - issue: MUTUALLY EXCLUSIVE VARIANTS
    detail: |
      Base hypothesis (variants 001, 002, 004, 005, 006) assume volume confirms momentum.
      Variant 003 and reverse_hypothesis assume volume contradicts momentum (exhaustion/reversal).
      These are mutually exclusive. Cannot test both without variant-selection bias.
      
    resolution: Author selects ONE direction (confirmation or reversal) with written economic 
      justification (institutional microstructure, options gamma, etc.). Selection must be pre-commitment 
      before backtest runs. Post-hoc switching = automatic REJECT.
    
    required_deliverable: One-paragraph justification for chosen direction, signed off before backtest.
  
  - issue: OHLCV DATA INSUFFICIENCY
    detail: |
      Variants 002 (multi-bar conviction), 006 (joint standardization) assume volume data quality 
      sufficient to detect institutional vs retail clustering. Trade data unavailable; buy_volume 
      proxy = volume × (close - open) / (high - low) has >20% error rate on low-vol bars, exactly 
      where the signal is most needed.
      
    resolution: (A) Accept limitation and test only variants 001, 004, 005 (treat volume as signal 
      regardless of source), OR (B) Procure trade-level data (Binance aggregate trades API or external 
      tick data provider).
    
    required_deliverable: Explicit decision (limitation acceptance OR data procurement plan with timeline).
  
  - issue: HYPERPARAMETER OPACITY
    detail: |
      Clamp range [-20, 20] and vol_thresholds (1.2, 1.5, 1.4) lack justification. Are these derived 
      from position sizing rules? Keltner bands? Risk model volatility? Without justification, they 
      are arbitrary tuning constants prone to overfitting.
      
    resolution: Either provide derivation document (cite risk model, Keltner calculation, etc.) OR 
      include these as tunable hyperparameters with pre-committed grid sweep in walk-forward 
      (e.g., vol_threshold ∈ [1.1, 1.2, 1.3, 1.4, 1.5]).
    
    required_deliverable: Justification doc OR grid sweep specification (ranges + allocation).
  
  - issue: REGIME DETECTION COUPLING
    detail: |
      If existing regime detector uses volume (in addition to ER/volatility), this strategy is 
      endogenous to regime detection. Forecast depends on regime; regime depends on volume. Backtest 
      treats regime as exogenous factor; live it may be unstable or correlated with signal.
      
    resolution: Confirm regime detector is independent (price and volatility only, no volume). 
      If volume-dependent, either redesign strategy as regime-agnostic OR document coupling as 
      stated limitation in approval.
    
    required_deliverable: Confirmation that regime detector is volume-independent, or acceptance doc 
      for endogeneity limitation.

recommended_path_forward: |
  Author revises expanded_hypothesis_card.yaml with:
  1. Direction selection (confirmation or reversal) + 100-word justification
  2. Variant filtering (mark data-feasible vs data-unfeasible)
  3. Hyperparameter justification or grid sweep plan
  4. Regime detector independence confirmation
  
  Resubmit to validation_gate for APPROVE or REJECT decision.
  
  Once gates are cleared, proceed to backtest_specification stage.