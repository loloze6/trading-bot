prescreen_result_summary:
  ic_active_bars: 0.190476
  p_value: 0.5469
  n_eff: 13
  active_n: 316
  route: kill_no_ic  # automated tool output
  cost_pass: true
  edge_to_cost_ratio: 3.7545

verdict_rationale: >
  IC = 0.1905 is in the expected positive direction (fear→long predicts positive returns),
  consistent with the contrarian mechanism. However, p = 0.547 is far from the significance
  threshold. Per the pre-registration statistical power note: n_eff = 316/24 ≈ 13, SE ≈ 0.28.
  To reach p < 0.10, we needed |IC| > 0.46. The observed IC of 0.19 is 0.68 SE from zero —
  clearly within noise. The cost gate passes (ratio=3.75), but the IC gate fails.
  Per pre-registration: verdict is 'insufficient_sample_inconclusive' when IC > 0 but
  not significant due to insufficient power. This is NOT a 'kill_no_ic' (which requires
  IC ≤ 0 or significance trivially far off). The mechanism is undetermined, not falsified.

