    shifted_ic: 0.190476
    unshifted_ic: 0.140005
    delta: 0.050471
    se: 0.2773
    delta_in_se_units: 0.18
    interpretation: >
      Shifted IC is slightly higher than unshifted IC (delta=0.050, 0.18 SE). This
      technically violates the claim but is well within sampling noise. No mechanistic
      interpretation possible at n_eff=13. Claim is inconclusive due to power, not
