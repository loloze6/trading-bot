    trigger_value: "ic_active_bars=0.190476 > 0.15"
    result: PASS
    detail: "See a8_4_reverification.yaml — no bugs found. IC attributable to noise at n_eff=13."

trial_count: 1
parameterization: "fear_threshold=25, greed_threshold=75 (pre-registered, not adjusted)"

disposition: parked_insufficient_sample
disposition_rationale: >
  IC is in the expected direction but sample is too small for the signal frequency
  (daily signal on 2-year window → n_eff≈13). Condition-based reactivation applies.

reactivation_trigger: >
  Data extension to 2018+. F&G has existed since 2018; a 7-year window (2018-2025)
  yields ~2555 daily readings, active_n ≈ 557 (21.8% × 2555), n_eff ≈ 557/24 ≈ 23
  per symbol. Two symbols: n_eff ≈ 46 → need |IC| > 0.15 for p < 0.10.
  This is within the plausible IC range for this signal class and the pre-registered
  mechanism would be properly testable.

  NOTE: Additional symbols do NOT materially increase power for F&G. The index is
  market-wide (single signal for all crypto), so BTC and ETH next-bar returns are
  highly correlated under the same F&G reading. Adding symbols increases active_n but
  not n_eff (effective independent observations). History is the binding resource.

  Data extension is scheduled as a consolidated backward-extension pass (after remaining
  build steps); do not start ad hoc. Do NOT retune the 25/75 thresholds on new data
  without registering as H-041-C-v2 per A8.5.3.

do_not_add_to_failed_families: true

