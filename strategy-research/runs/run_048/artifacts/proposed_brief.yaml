  category: persistent_behavioral_bias
  evidence_type: fear_greed
  specific_mechanism: >
    Extreme crowd sentiment (alternative.me Fear & Greed Index) overreaction creates
    profitable contrarian opportunity as sentiment reverts. 2024-2025 walk-forward positive
    IC (+0.094 to +0.182) observed when entry direction is inverted proves the mechanism
    is real. 2018-2023 negative IC (−0.058 to −0.135) was an artifact of inverted entry
    logic in run_042's original instantiation, not evidence of signal failure.
change_from_previous: "Flip entry forecast polarity (single-variable altitude-1 refinement per Rule 3). PREVIOUS (run_042, run_048): forecast=+10.0 when fear_greed<25 (long), forecast=−10.0 when fear_greed>75 (short). CORRECTED: forecast=−10.0 when fear_greed<25 (short extreme fear), forecast=+10.0 when fear_greed>75 (long extreme greed). Justification: run_048 per-era breakdown shows pooled ic_active_bars inverts from −0.0403 (all 2018-2023 eras negative, all 2024-2025 eras positive) under identical component config. This unidirectional 180° flip across 8 era-symbol pairs is diagnostic of mechanical entry-direction inversion, not regime-driven behavior. Negating the forecast will align historical IC to observed 2024-2025 positive direction. Fear_threshold, greed_threshold, scaling_factor, and transforms remain locked per constraints (A8.5.3). Expected pooled IC after fix: ~0.10-0.15 (estimated from 2024-2025 average ic_active_bars)."