hypothesis_id: H-041-C
status: conditional_approve
rationale: "Hypothesis is falsifiable (IC ≥ 0.15 on extended 2018–2025 data) and grounded in a known signal class (daily sentiment contrarian). Extended data (n_eff≈46 vs. n_eff=13 in run_042) is statistically justified for reactivation. Backward extension (2018-02-01 to 2023-12-31) is walk-forward-eligible per campaign_data_policy.yaml. Cost feasibility is marginal: daily timeframe and low fire rate require tight IC ≥ 0.15 to clear 34 bps/trade cost requirement. Era-level stability (A8.5.1a) is resolvable condition: any single era with IC < 0.10 or stability ratio > 2.0 is a hard failure; this must be checked before gate clearance."
blocking_issues: []
conditions:
  - "Backtest MUST report Spearman IC and p-value separately for each of the four eras defined in campaign_data_policy.yaml (2018-pre-funding, 2019-2023-full, 2024-burned, 2024-2025-walk-forward) per A8.5.1a. Any era with IC < 0.10 is a hard failure (automatic refusal to promote). Era IC stability ratio (max/min) must be < 2.0; if ≥ 2.0, hypothesis fails due to era-driven overfitting risk."
  - "Cost check (Layer 2 prescreen) must use taker round_trip_cost from cost_model.yaml: BTCUSDT 17.0 bps, ETHUSDT 17.5 bps. Estimated gross edge formula: IC × sigma_daily_bps × sqrt(avg_holding_bars). Required edge_to_cost_ratio ≥ 2.0 (safety_factor). If prescreen reports edge_to_cost_ratio < 2.0 due to IC degradation or longer holding periods than expected, automatically refuel to refine (parameter tuning) or reject."
  - "Lookahead bias check: Fear & Greed Index feed (alternative.me) must be verified as published strictly before 00:00 UTC next day. If publication lag extends past signal fire time, bar offset must be applied (e.g. fire on +1h bar instead of 00:00 bar) to eliminate look-ahead."