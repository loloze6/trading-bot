hypothesis_id: DAILY_REGIME_OVERLAY_1H_EXECUTION
asset: BTCUSDT, ETHUSDT
timeframe: 1h execution with daily regime gating
research_question: "Can a daily-timeframe regime detector (ADX, HMM, or daily Bollinger\
  \ bands) \npartition 1h bars into sub-regimes with differential edge properties?\
  \ \nSpecifically: does a high-IC signal (best prior: Keltner corr=0.2145 or \nkeltner_scoremode\
  \ corr=0.2953) produce positive forecast_return_corr AND \ncost_drag < 80% when\
  \ restricted to bars labeled by daily ADX (or HMM state) \nas mean-reversion-eligible?\
  \ Success criterion: forecast_return_corr > 0.05 \non all-bars analysis of the selected\
  \ regime state, with min 10% activation \nand cost_drag < 80%.\n"
signal_concept: "Dual-layer regime detection: (1) Daily ADX on 1D OHLCV to label regimes\
  \ \n(ADX < 25 = consolidation/mean-reversion candidate, ADX > 40 = trending/momentum\
  \ \ncandidate); (2) apply 1h signal (existing Keltner or RSI component) only on\
  \ bars \nwithin selected daily regime. This addresses two failures in prior runs:\
  \ (a) 1h \nER detector limited to ~1% bar activation; daily ADX can achieve 15-40%\
  \ activation \nin target state; (b) per-trade expectancy failure may be conditional\
  \ (negative in \ntrending, positive in consolidation, or vice versa) rather than\
  \ unconditional.\n"
constraints: "- Do not test additional signal families beyond daily regime detector;\
  \ use \n  existing Keltner, RSI, or EMA components paired with daily regime gate.\n\
  - Regime mechanism must be orthogonal to 1h single-indicator technical analysis\
  \ \n  (not ER-based, not VR-based). Daily or longer timeframe only.\n- Ungated check:\
  \ must compute forecast_return_corr on ALL 1h bars (post-regime-label), \n  not\
  \ regime-gated bars only, to comply with A2.3 scope rule (IC scope correction \n\
  \  from run_039).\n- No replacement of existing bot architecture. Implement daily\
  \ regime as a pre-filter \n  in ForecastManager or CompositeStrategy (existing extension\
  \ point).\n"
execution_priority: "(1) ADX regime audit: sweep ADX thresholds (entry_low=15, 25,\
  \ 35; entry_high=35, \n    40, 45) on 2024-2025 data. Target: find threshold pair\
  \ achieving \n    (a) >=10% activation in each state, (b) <=20 transitions/month,\
  \ (c) >0.15 \n    regime-conditional Sharpe or predictability hint.\n(2) Best-prior\
  \ signal + ADX gating: Apply highest-IC signal from runs 028 \n    (keltner_scoremode\
  \ corr=0.2953) to ADX-labeled mean-reversion state only. \n    Measure: forecast_return_corr\
  \ on all 1h bars, cost_drag, win_rate, Sharpe.\n(3) If ADX fails: Test HMM regime\
  \ (2-3 states on daily returns) + best signal.\n(4) Holdout validation if edge found.\n"
sample_budget: 4-5 runs (1 ADX audit, 1-2 signal+ADX combo, 1-2 HMM variants if needed,
  1 holdout).
