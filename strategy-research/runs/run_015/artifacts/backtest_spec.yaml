hypothesis_id: "V3 (pivot-from-V2-E1)"
variant_id: "V1"
variant_name: "Keltner Channel Breakout (TRENDING Momentum)"
status: "spec_ready"

config:
  regime_detector:
    mode: "threshold_rules"
    components:
      - id: "er"
        class: "strategies.strategy_components.EfficiencyRatioRegimeComponent"
        params:
          period: 24
          smooth_period: 5
      - id: "vr"
        class: "strategies.strategy_components.VarianceRatioComponent"
        params:
          k: 5
          window: 100
    rules:
      - regime: "trending"
        any_of:
          - - id: "er"
              op: "gte"
              value: 0.50
            - id: "vr"
              op: "gte"
              value: 1.20
      - regime: "mean_reversion"
        any_of:
          - - id: "vr"
              op: "lt"
              value: 0.90
      - regime: "chop"
        any_of:
          - - id: "er"
              op: "lt"
              value: 0.25
    default_regime: "unknown"
  
  strategies:
    warmup: 51
    regimes:
      trending:
        components:
          - id: "keltner"
            class: "strategies.strategy_components.KeltnerBreakoutComponent"
            params:
              ema_period: 20
              atr_period: 20
              atr_multiplier: 2.0
              scaling_factor: 20.0
            weight: 1.0
            lookback: 500
            transforms:
              - op: "ratio_to_mean"
              - op: "scale"
                params:
                  factor: 10.0
      mean_reversion: null
      chop: null
      unknown: null

config_rationale:
  - "Signal mechanism: 'Keltner breakouts detect momentum continuation' → KeltnerBreakoutComponent (ema_period=20, atr_multiplier=2.0 for wider channels, lower breakout frequency)"
  - "Regime filter: 'TRENDING (ER ≥ 0.50, VR ≥ 1.20) isolates directional moves' → threshold_rules with EfficiencyRatioRegimeComponent and VarianceRatioComponent"
  - "Cross-symbol normalization: ratio_to_mean normalizes by historical average; scale(10) targets forecast magnitude ~10 (vs V2's smaller signal)"
  - "Inactive regimes: mean_reversion and chop set to null (hypothesis tests TRENDING only; other bars stay flat)"
  - "Expected outcome: Breakouts fire at lower frequency on larger directional moves, reducing cost_drag vs V2 mean_reversion variant while testing momentum hypothesis"

component_gap: null