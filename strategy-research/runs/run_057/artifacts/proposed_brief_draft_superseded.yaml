strategy_domain: "time_series_trend_following"
market_universe: ["BTCUSDT", "ETHUSDT"]
timeframe: "1d"

research_goal: "Pivot to Keltner Channel breakout mechanism (different signal family from SMA+ER gate) to test daily trend-following with volatility-adaptive entry filtering, addressing the gate mechanism falsification proven by S2 in run_057"

hypothesis_card:
  hypothesis_id: "P4_KELTNER_BREAKOUT_LONGONLY_DAILY_V1"
  
  mechanism: |
    Long entry: close > SMA(20) + ATR(20) * 2.0 (upper Keltner band breakout). 
    Exit: close <= SMA(20). Position scaling: 10.0. No separate quality gate; volatility 
    adaptation via ATR is inherent to Keltner band width.
  
  signal_parameters:
    keltner_sma_lookback: 20
    keltner_atr_lookback: 20
    keltner_atr_factor: 2.0
    scaling_factor: 10.0
  
  signal_source: "Keltner Channel (ATR-based volatility bands)"
  
  gate_mechanism: "None; volatility sensitivity is inherent to ATR component"
  
  edge_source:
    category: "volatility_adaptive_breakout"
    mechanism_rationale: |
      Keltner bands adapt to market volatility via ATR. Breakouts above upper band 
      require both price movement AND volatility elevation, providing implicit regime 
      filtering. This avoids the mechanical confound risk (ER and SMA both elevated 
      in trends — Gate may be correlating with regimes, not removing whipsaws). 
      ATR-based bands are independent of trend detection; breakouts are more selective.
    persistence_argument: |
      Volatility breakouts are durable on daily crypto charts. High-ATR breakouts 
      correlate with trend initiation. Unlike SMA(100) which fires on any crossover, 
      Keltner requires volatility confirmation, reducing false signals in choppy regimes.
  
  change_from_previous: |
    Previous run_057 (P4_SMA_TREND_LONGONLY_DAILY_ER20GATE): SMA(100) long-only 
    entries gated on ER(20)>=0.30. S2 validation FALSIFIED mechanism: excluded entries 
    (ER<0.30, n=75) had mean_expectancy_bps=1395.90 vs included entries (ER>=0.30, n=42) 
    mean_expectancy_bps=433.73. Gate removed higher-quality trades, opposite of brief 
    rationale. Pre_registration forbids threshold adjustment. Threshold relaxation cannot 
    fix inverted mechanism. 
    
    Structural pivot: replace SMA(100) with Keltner Channel breakout. Rationale: 
    (1) Keltner's ATR provides volatility-adaptive filtering inherent to mechanism 
    (no separate quality gate needed), (2) avoids mechanical confound (ER and SMA 
    both elevated in trends), (3) tests whether previous failure was ER-gate-specific 
    or SMA-family-wide. Parent run_054 showed SMA(100) has real edge (positive aggregate 
    on ungated), but gating direction was inverted. Keltner tests different signal 
    mechanism on same timeframe/asset class.
  
  constraints:
    - "Market universe: BTCUSDT, ETHUSDT (same as prior)"
    - "Timeframe: 1d (same as prior; do not escalate timeframe in this pivot)"
    - "Direction: long-only (same as prior)"
    - "Sample split: protocols/ts_trend_daily_v1.json 15-window semi-annual windows (same as prior, for comparability)"
    - "Component source: STRATEGY_CONFIG_REFERENCE.md KeltnerChannelBreakoutLongOnlyComponent or implemented as new SubStrategyComponent per STRATEGY_EXTENDING.md"
  
  cost_feasibility: |
    Keltner expected to trade 2-4 times per window (fewer than SMA+gate target 2-5) 
    due to dual price-and-volatility requirement. Holding period 5-20 bars (vs prior 
    3-15 estimate). Median cost_drag_pct trend: lower (fewer, higher-conviction trades). 
    Cost model: 17.0 bps round-trip BTC, 17.5 ETH (same as prior). Plausibility assessment: 
    improved vs prior (fewer trades, less dilution risk).
  
  findings_carryover_integration: "See findings_carryover.yaml for S2 mechanism falsification detail and ruled-out approaches (do not retry threshold tuning or parameter sweep on backward mechanism)"