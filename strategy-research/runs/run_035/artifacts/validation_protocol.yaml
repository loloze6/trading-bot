hypothesis_id: "REFRAME_REGIME_SELECTIVITY_01"
falsifiable_statement: "Adding a third-condition selectivity gate (filter applied after ER/VR thresholds) improves risk-adjusted returns by Sharpe >= +0.15 annualized, without reducing sample size below statistical significance (min_trade_count >= 50 per window)."
null_expectation: "The selectivity gate reduces bar coverage without improving Sharpe ratio; it is harmful filtering applied to data with no underlying edge."
required_evidence:
  - "Walk-forward Sharpe improvement: median across windows must be >= +0.15 vs ungated baseline."
  - "Trade count stability: min_trade_count in any window must remain >= 50 to avoid noise."
  - "Drawdown control: max_drawdown_pct increase must not exceed +5 percentage points absolute."
  - "Win rate maintenance or improvement on stable or increased trade volume."
bias_risks:
  - "V2 (Vol Clustering): 100-bar rolling percentile window is inherently forward-looking; percentile bands must be computed on training data only, then applied as fixed thresholds to validation and test."
  - "All variants: hyperparameter selection (N for V1, quantile band for V2, product threshold for V3, ATR distance for V4) must be fixed a priori from domain logic, NOT optimized on walk-forward test data."
  - "V4 (Trade Spacing): ExecutionHandler query introduces circular dependency; must guard against inter-window data leakage by querying fills only within training window."
  - "Regime-specific overrides (TRENDING_override, MEAN_REVERTING_override, CHOPPY_fallback) risk post-hoc narrative fitting; must be hypothesis-driven, not fitted to results."
  - "Reverse hypothesis conflates frequency selectivity with position sizing; must test in isolation to prevent confounding."
failure_modes:
  - "Gate reduces coverage so aggressively (<2% bar coverage) that Sharpe becomes statistically unreliable with min_trade_count << 30 per window."
  - "Gate introduces undetected look-ahead bias; in-sample Sharpe improves but walk-forward and holdout performance degrade significantly."
  - "Gate reduces trade diversity, concentrating position risk; win_rate remains flat or declines while max_drawdown increases."
  - "Variant shows regime-specific collapse (e.g., V1 VR persistence fails when VR oscillates around 1.20 boundary in choppy markets); reveals overfitting to single historical regime."
  - "Hyperparameters are tuned on test data; Sharpe improvement is spurious and does not generalize."
  - "V4 becomes a position manager conflating signal timing with execution logistics; metric improvements are statistical artifacts, not real edge."
sample_split_design:
  - "Minimum three walk-forward windows: 60% training, 20% validation, 20% test, with no data leakage between windows."
  - "Each window must achieve min_trade_count >= 50 in both ungated baseline and gated variant; reject if either falls below."
  - "Test across two orthogonal regime environments: (1) trending-dominant market (mean ER > 0.40), (2) mean-reverting-dominant market (mean VR > 1.40), to detect regime-specific overfitting."
  - "V2 (Vol Clustering) compliance: compute percentile bands on training data only; lock thresholds and apply to validation and test without recalculation."
  - "V4 (Trade Spacing) compliance: query ExecutionHandler fills only within walk-forward training window; block any inter-window fill queries."
  - "Reverse hypothesis (position scaling) must run as separate backtest to isolate sizing effect from frequency selectivity."
  - "Hyperparameter lock: N=3 (V1), vol quantiles 0.30-0.70 (V2), product_threshold=0.50 (V3), ATR_distance=2 (V4) must be fixed before backtest; zero tuning on validation or test data."
decision_rules:
  - "Sharpe: approve only if median walk-forward Sharpe(gated) - Sharpe(ungated) >= +0.15; reject otherwise."
  - "Sample size: reject if min_trade_count < 50 in any window (below statistical noise floor)."
  - "Drawdown: reject if max_drawdown_pct increases > 5 percentage points absolute; trade quality concern."
  - "Win rate: reject if win_rate decreases on stable or increased trade_count (signal quality regression)."
  - "V2 (Vol Clustering): reject if percentiles are computed on rolling windows during backtest (forward-looking bias confirmed); only approve if training-only percentile computation is verified in logs."
  - "V4 (Trade Spacing): reject if ExecutionHandler queries span multiple walk-forward windows (inter-window leakage)."
  - "Regime consistency: conditional_approve if variant passes one regime but fails the other; require separate regime-conditional model."