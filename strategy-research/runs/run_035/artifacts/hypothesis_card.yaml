hypothesis_id: "REFRAME_REGIME_SELECTIVITY_01"
thesis: "KeltnerBreakout signal has marginal predictive power (corr ~0.15), but applies indiscriminately across regimes. A novel regime selectivity component (ER, VR, volatility clustering) can identify high-conviction windows and reduce rebalance frequency 60-70%, lowering cost_drag <30% and raising Sharpe to >0.5."
rationale: "Cost drag dominates weak-correlation strategies; all previous signals failed identically (signal selection is not bottleneck). Regime detection (ER, VR) has been partially tuned but lacks persistence/selectivity layer. Stricter regime gate firing <15-20% of bars concentrates signal usage on highest-conviction periods, offsetting weak correlation with reduced slippage. Integration: plug novel regime component into existing RegimeToStrategyMapping without replacing TradingBot architecture."
signal_concept: "Reuse KeltnerBreakout (ema_period=20, atr_period=20, atr_multiplier=2.0, scaling_factor=-20.0) unchanged. Add novel regime component with three conditions: (1) ER >= 0.35 (trending), (2) VR >= 1.20 (mean-reverting bands), (3) selectivity gate (TBD: VR persistence, volatility clustering, or adaptive threshold). Fire signal only when all three conditions hold; reduce bar coverage from ~100% to <15-20%."
target_market: "BTCUSDT, ETHUSDT"
timeframe: "1h"
assumptions:
  - "Signal correlation constant across regime subsets (0.15 marginal → 0.15+ in high-conviction windows)."
  - "Slippage/fees per rebalance scale linearly with position size and frequency (cost_drag ∝ rebalance_count)."
  - "Three-condition gate can reduce rebalance frequency 60-70% without look-ahead bias."
  - "Regime components (ER, VR) computable in live time with 1-bar latency."
expected_failure_modes:
  - mode: "Selectivity component too strict"
    trigger: "Fires <5% of bars, insufficient trade count (<20) for statistical significance."
  - mode: "Selectivity component too loose"
    trigger: "Fires >30% of bars, cost_drag remains >0.3, Sharpe <0.5."
  - mode: "Signal correlation degrades in high-conviction windows"
    trigger: "Correlation drops to 0.08-0.10 due to regime-specific noise; Sharpe <0.5 despite reduced cost."
  - mode: "Regime component introduces look-ahead bias"
    trigger: "Uses future volatility clustering or clustering data; invalidates backtest results."
  - mode: "Integration complexity"
    trigger: "Wiring requires architectural changes beyond CompositeStrategyForRegime."