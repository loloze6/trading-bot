status: "spec_ready"
config:
  regime_detector:
    mode: "score_product"
    min_score: 0.50
    min_margin: 0.0
    components:
      - id: "er"
        class: "strategies.strategy_components.EfficiencyRatioRegimeComponent"
        params:
          period: 24
          smooth_period: 5
      - id: "vr"
        class: "strategies.strategy_components.VarianceRatioComponent"
        params:
          k: 5
          window: 100
    regimes:
      mean_reversion:
        components:
          - id: "er"
            divisor: 1.0
            transforms:
              - op: "identity"
          - id: "vr"
            divisor: 1.0
            transforms:
              - op: "identity"
    default_regime: "unknown"
  strategies:
    warmup: 51
    regimes:
      mean_reversion:
        components:
          - id: "keltner"
            class: "strategies.strategy_components.KeltnerBreakoutComponent"
            params:
              ema_period: 20
              atr_period: 20
              atr_multiplier: 2.0
              scaling_factor: -20.0
            weight: 1.0
            lookback: 500
            transforms:
              - op: "identity"
config_rationale:
  - "Variant selection: V3 (Regime Intensity Score) selected because it is fully expressible via score_product mode; V1, V2, V4 require state tracking or execution-layer access not available in config schema."
  - "ER×VR product >= 0.50 gate: implemented via score_product mode with min_score=0.50, enforcing joint high-conviction regime states (strong trend efficiency + strong mean-reversion band persistence)."
  - "ER component (EfficiencyRatioRegimeComponent): detects directional trend strength with period=24, smooth_period=5; raw values 0–1 feed directly into product calculation."
  - "VR component (VarianceRatioComponent): detects mean-reversion band persistence with k=5, window=100; raw values ~0.5–1.5 feed directly into product calculation."
  - "Multiplicative gating: product = ER × VR; min_score=0.50 ensures both indicators must be reasonably elevated simultaneously (e.g., ER=0.5, VR=1.0 → product=0.50 fires; ER=0.35, VR=1.20 → product=0.42 does not fire)."
  - "KeltnerBreakout signal: lower-band tuning (scaling_factor=-20.0) fires on mean-reversion bounces; atr_multiplier=2.0 (wider channels) raises conviction threshold, aligning with hypothesis selectivity intent."
  - "Off-gate behavior: when ER×VR < 0.50, regime_detector returns regime='unknown', which produces null forecast (no trade), eliminating low-conviction bar coverage."
component_gap: null