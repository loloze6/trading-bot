campaign_id: rsi_mean_reversion_low_er
runs_reviewed: 23
pattern_detected: same_root_cause_different_families
pattern_evidence:
  - "7 signal families tested across 4 instruments (BTCUSDT, ETHUSDT, SOLUSDT, AVAXUSDT) and 2 timeframes (1h, 4h)"
  - "RSI, Keltner, and momentum families ALL show identical failure pattern: cost_drag dominance"
  - "Mode 1 failure: cost_drag 140–420% (runs 014, 016, 018, 021, 023, 034). Example: run_023 corr=0.0097, cost_drag=420.19%"
  - "Mode 2 failure: good signal correlation (corr 0.2+) but Sharpe FAIL (runs 024, 027, 028, 032, 033). Example: run_028 corr=0.2953, cost_drag=84.29%, both FAIL"
  - "Exception runs with both PASS: only run_017 and run_022 (both cost_drag <85%, corr >0.04). These remain isolated; replication via parameter tuning (runs 024–034) reverts to FAIL"
  - "No monotonic improvement in cost_drag or corr across 23 runs. Runs 015, 019, 022 achieve cost_drag ~25%, but corr collapses near zero; runs with corr ≥0.2 revert to cost_drag 27–413%"
pattern_rationale: "The cost_drag / Sharpe mismatch persists regardless of signal type (RSI vs Keltner vs momentum), instrument, or timeframe. This is not signal selection failure; it is structural sizing failure. Even runs with measurable signal alpha (corr ≥0.2) fail Sharpe filters, indicating the rebalance frequency or position sizing model is destroying returns."
recommendation: reframe
recommendation_rationale: "The campaign has exhausted the signal-family exploration paradigm (7 families, 4 instruments, 2 timeframes, 23 runs, 4 prior campaign reframes). Every pivot within signal selection reproduces the same cost_drag / Sharpe failure across different root causes. The shift from 'find the right signal' (solved: multiple exist with corr ≥0.15–0.29) to 'find the right regime gate to minimize rebalances while preserving conviction' is a genuine hypothesis change. The proposed REFRAME_REGIME_SELECTIVITY_01 directly targets the structural problem: fewer, higher-conviction trades in strict regime windows."
next_research_question:
  hypothesis_id: REFRAME_REGIME_SELECTIVITY_01
  asset: "BTCUSDT, ETHUSDT"
  timeframe: 1h
  research_question: "Can stricter regime thresholds or a novel regime component identify windows where even marginal forecasts (corr ≥ 0.15) produce >0.5 Sharpe by dramatically reducing rebalance frequency and position count?"
  signal_concept: "Reuse existing KeltnerBreakout (ema_period=20, atr_period=20, atr_multiplier=2.0, scaling_factor=-20.0) as proof-of-concept, but research a novel regime COMPONENT (not just parameter tuning) that combines ER, VR, and volatility regime into a stricter 3-condition gate firing <20% of bars. Goal: achieve >80% cost_drag reduction by cutting rebalances by 60–70%."
  regime_filter: "TRENDING + novel selectivity component (e.g. VR-based persistence, volatility clustering, or adaptive threshold). Baseline: ER ≥ 0.35, VR ≥ 1.20, plus new selectivity metric (to be defined) that fires only on highest-conviction windows. Target: <15% bar coverage, >50 cumulative trades across walk-forward, cost_drag <30%, Sharpe ≥ 0.5."
  constraints:
    - "Do NOT change asset or timeframe; focus on regime selectivity, not diversification."
    - "KeltnerBreakout component parameters remain exact from RUN017."
    - "Novel regime component is a NEW hypothesis family and must be coded/tested independently before integration."
  change_from_previous: "Previous runs exhausted parameter-tuning within existing regime logic (ER/VR thresholds). All signal families (RSI, Keltner, momentum) failed identically with cost_drag or weak correlation. This reframe targets the structural sizing problem: stricter regime gates to enable higher conviction per trade, not signal selection. Shifts from 'find the right signal' (exhausted) to 'find the right timing filter' (unexplored)."
budget_assessment: "23 runs invested in signal-family iteration; campaign remains active with no explicit ceiling. Cost_drag failure is consistent across all explored signal families and instruments. Recommend allocating 3–5 runs to test regime selectivity direction before further escalation. If regime selectivity (stricter gates, fewer rebalances) fails to reduce cost_drag below 30%, escalate to new instruments (e.g. alternative pairs, different asset class) or fundamental model redesign rather than more signal families."