reverse_hypothesis_purpose:
  concept: "Negate spread sign; test directionality of edge."
  if_v1_true_positive: "Base IC(positive) ≠ reverse IC(negative/near-zero). Confirms directional edge exists."
  if_both_near_zero: "Cost_drag dominates mechanism. Closes MA-based ungated family for BTC/ETH 1h timeframe."
  execution_timing: "Post-V1 results. Run reverse hypothesis on same backtest window and identical scaling to isolate direction vs. cost."

behavioral_insights:
