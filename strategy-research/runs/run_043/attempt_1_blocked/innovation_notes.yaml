  alt_02_fear_greed_confluence:
    concept: "EMA spread + F&G contrarian extremes."
    blockers: [
      "Power-insufficient: F&G is market-wide (ρ_symbols=0.82). 2024-2025 window yields n_eff ≈ 13; target MDE=0.10 requires n_eff ≥ 60.",
      "Signal alignment: F&G published daily (1 bar/day); misaligned to 1h bars. Requires A8.4 forward-fill logic with explicit staleness tracking.",
