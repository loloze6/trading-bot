  persistence_signal: "Sign autocorrelation captures herding stability. Supports thesis: continuous signal (95% bars) is more informative than discrete MA-crossover (1–2 per trend). Supports edge persistence claim in campaign hypothesis."
  velocity_exhaustion: "Momentum acceleration/deceleration not actionable in current component framework; useful for post-hoc confidence bucketing and regime diagnostics."

campaign_hypothesis_validation_pathway:
  claim_under_test: "Continuous activation (95% bars) + 1h lag structure permit residual edge post-costs despite high MA crowding."
  how_v1_tests_claim: "V1 measures gross IC on all bars. If IC (post-cost check) > 0: continuous + lag provides residual edge. If IC < 0 or barely > 0: crowding fully arbitraged mechanism."
  expected_failure_modes: [
    "cost_drag: gross IC is small (0.02–0.04, plausible range per crowding) × activation_rate. Cost ≈ 20 bps per rebalance overwhelms edge.",
    "regime_sensitivity: IC is +0.08 in TRENDING, -0.04 in RANGING (library affinity pattern). Unfiltered IC = weighted average ≈ 0.00. Per A2.3 policy, no regime gating; family fails at aggregated level.",
    "parameter_brittleness: 9/21 locally optimal. Adjacent (8/20, 10/22, 7/23) may differ radically. True optimum is brittle; edge is overfitted."
  ]
  next_steps_if_v1_fails: "Do NOT pursue ALT_01/ALT_02 gating logic (adds complexity to dead signal). Pivot to non-MA family (oscillator or volume_flow) for ungated edge research."
  next_steps_if_v1_validates: "ALT_02 (multi-scale stacking, component refactor required) becomes priority. ALT_01 (funding confluence) low priority unless funding extremes appear in test window."

