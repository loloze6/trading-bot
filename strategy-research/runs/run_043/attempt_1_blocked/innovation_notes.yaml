alternative_data_assessment:
  alt_01_funding_rate_strength:
    concept: "EMA spread × Binance funding rate sign (structural + behavioral)."
    design_blocker: "Two-stage filtering (spread > threshold AND |funding| > threshold) introduces regime-like sparse activation, violating A2.3 ungated policy. Requires upstream validation: does unfiltered spread alone carry edge? If yes, gating on funding adds complexity. If no, gating is futile."
