handoff_version: 1
run_id: run_024
from_stage: verdict_interpreter
to_stage: campaign_review
assigned_engine: claude
objective: 'Step back from per-run decisions and assess the full campaign. Detect
  patterns across all runs that indicate whether to continue, reframe, escalate, or
  terminate.

  '
primary_input_artifact: ../../campaign_state.yaml
required_inputs:
- path: ../../campaign_state.yaml
  reason: full history of all runs, families tried, diagnostics across all iterations
- path: artifacts/research_brief.yaml
  reason: the original research question to compare against current search direction
deliverables:
- campaign_review.yaml
constraints:
- Do not recommend terminate with fewer than 3 instruments tried AND 1 component built.
- Cite specific diagnostic values from diagnostics_log, not general impressions.
- If recommendation is reframe, next_research_question must be a complete research_brief.
stop_conditions:
- All reasonable options exhausted → recommendation: terminate with full evidence.
injected_context:
  refinement_attempt: '0'
  human_data_paths_injected: 'true'
  v1_diagnostic_result: 'ROOT CAUSE FOUND: default_regime must be ''unknown'' (not
    ''trending''). atr_multiplier must be 2.0 (not 1.5). No new components needed.'
  required_config_constraints: 'Generate ONE config only (V1 exact replication of
    run_017). Parameters:

    - default_regime: "unknown"   (CRITICAL — do NOT set to "trending")

    - atr_multiplier: 2.0         (CRITICAL — do NOT use 1.5)

    - ema_period: 20

    - atr_period: 20

    - scaling_factor: -20.0

    - regime: trending (ER>=0.5 AND VR>=1.2, threshold_rules)

    - timeframe: 1h

    Do NOT add vetoes, do NOT set default_regime to any active strategy.

    Do NOT generate V2/V3/V4 variants — they are not needed given V1 finding.

    '
  component_gap_resolution: No component gap. KeltnerBreakoutComponent with default_regime=unknown
    is sufficient.
