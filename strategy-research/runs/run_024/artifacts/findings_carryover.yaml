pivot_rationale: "Hypothesis framing assumed TRENDING regime (ER/VR thresholds from run_017) was sound, and the problem was execution (position sizing, rebalance frequency). Diagnostics reveal the regime definition itself is uninformative (forward_return_mean stationary near zero, sample sizes too small). Run_017 baseline (cost_drag=27.45%, corr=0.2145) achieved metrics within the threshold_rules regime but was never validated as predictive. V1 parameter refinement (atr_multiplier=2.0) did not improve regime quality — it was a parameter, not the core blocker. The regime architecture (binary threshold rules) is the problem. Solution: pivot to a different regime detection method (score_mode: continuous regime scoring instead of binary classification) that trades Keltner across all regime phases with confidence scaling. This keeps the signal fixed (Keltner) and changes only the regime architecture (altitude 2)."