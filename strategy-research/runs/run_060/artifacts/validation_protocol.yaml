hypothesis_id: "FUNDING_MR_4H_RETEST"

falsifiable_statement: "Continuous funding-rate mean-reversion at 4h timeframe with threshold=0.0 generates median annualized Sharpe ratio > 0.8 with maximum drawdown < 30% on both BTCUSDT and ETHUSDT over an 8-month walk-forward window (2024-12-01 to 2025-12-31), given 12.5% activation rate and ~2-bar (8h) holding periods."

null_expectation: "The signal produces zero or negative edge-adjusted returns due to: (1) insufficient funding extremes in 2024–2025 low-funding regime starving activation, (2) hold-period misalignment with cascade-mean-reversion window, (3) sparse signal (12.5% activation) eroding gross edge below 2× round-trip cost threshold, (4) regime-dependent correlation (high funding coinciding with equity weakness)."

required_evidence:
  - "Walk-forward Sharpe ≥ 0.8 on both BTCUSDT and ETHUSDT across entire 2024-12-01:2025-12-31 window"
  - "Maximum drawdown ≤ 30% on both symbols"
  - "Edge-to-cost ratio ≥ 2.0 (prescreen Layer 2 gate must pass before backtest)"
  - "Trade count ≥ 10 per window (sufficient activation to measure, ruling out signal starvation)"
  - "Forecast–forward-return correlation (IC) ≥ 0.015 on active bars"
  - "Per-window parameter stability (Sharpe variance across windows ≤ 30%)"

bias_risks:
  - "Look-ahead via settlement timestamp: if signal-trigger time (UTC 00:00/08:00/16:00) is rounded to bar-close but actual cascade executes intra-bar, model underestimates slippage and overstates entry price."
  - "Survivorship bias: forced liquidations and slippage spikes during extreme funding events are not modeled; live execution 5–10× worse than backtest assumption."
  - "Funding-rate feed lag: interpolation from 8h settlements to 4h bar-close may misalign signal with true cascade peak (t=0 vs t+1 bar)."
  - "Regime overfitting in walk-forward: 2024-12 to 2025-12 is a narrow low-funding band; holdout period (2026-01:2026-06) may revert to 2022–2023 intensity or forward-shift to 2026-07+ structure; window-based Sharpe may not transfer."
  - "Activation sparsity: 12.5% signal frequency makes statistical power thin; random clustering of signal fires into high-vol periods can inflate Sharpe; holdout will reveal regime sensitivity."

failure_modes:
  - "Activation starvation in 2024–2025 low-funding environment: extremes never reach magnitude required to trigger mean-reversion cascade; signal fires << 3 bars per 24h or zero bars, reducing trade count below meaningful sample."
  - "Hold-period misalignment: cascade peaks at t+1 bar post-settlement, but rebalance-on-settlement closes positions at t+2; realized hold (4–8h) occurs post-peak, capturing whipsaw instead of reversal; realized P&L negative despite positive IC."
  - "Cost gate prescreen failure: gross edge (IC × vol × sqrt(hold_bars)) insufficient to cover 34–35 bps round-trip (2024-12+ regime worse than run_059 burned range); edge_to_cost_ratio < 2.0, strategy fails Layer 2 before backtest."
  - "Symbol divergence: BTCUSDT cascade dynamics differ from ETHUSDT (leverage/liquidation clustering; correlation structures); one symbol clears Sharpe gate, other fails, violating 'both symbols' constraint."
  - "Holdout degradation: walk-forward Sharpe > 0.8 but holdout (2026-01:2026-06, single-use frozen data) reverts to < 0.5, indicating overfitting to micro-regime or parameter drift; mechanism fails generalization test."
  - "Positive correlation with market regime: during risk-on (low vol, calm funding), signal starves; during risk-off (high vol, spiking funding), equities tank, eroding gross edge despite high IC; Sharpe hampered by regime conditionals."
  - "Negative mean reversion instead of positive: if herding/momentum (B2 reverse hypothesis) dominates over forced unwinding, signal polarity is backwards; forecast–return correlation inverts, IC < 0, strategy loss-making."

bias_risks_summary: "Settlement-timestamp look-ahead and feed-lag misalignment are the primary forward-bias risks; regime overfitting is the primary backward-bias risk (overfitting to burned range / low-funding era 2024-12+)."

failure_modes_summary: "Activation starvation (B1) and cost gate failure (B3) are the most likely failure vectors. Hold-period mismatch (B2) is mechanistic and will manifest in per-bar P&L visualization during backtest."

sample_split_design:
  walk_forward_range: "2024-12-01 to 2025-12-31 (13 months, per campaign_data_policy.yaml walk_forward_extension)"
  holdout_range: "2026-01-01 to 2026-06-30 (6 months, per campaign_data_policy.yaml holdout_range — FROZEN, do not use in any backtest until holdout_evaluation stage)"
  holdout_note: "Single-use per A6.1. Evaluated only at holdout_evaluation stage after walk-forward Sharpe gate passes. If holdout fails, mechanism is terminated permanently (holdout_failure_is_terminal=true)."
  windows: "8 rolling windows (monthly + overlap)"
  window_size_bars: "744 bars (31-day month at 1h cadence; 4h-bar equivalent is 186 bars per month)"
  step_size_bars: "93 bars (4-bar overlap to match standard stride)"
  era_designation: "era_2024_2025_walk_forward_extension (per campaign_data_policy.yaml:58–61); holdout is era_2026_holdout"

decision_rules:
  - "sharpe >= 0.8 (median across walk-forward windows, both BTCUSDT and ETHUSDT)"
  - "max_drawdown_pct <= 30.0 (both symbols)"
  - "min_trade_count >= 10 per window (ruling out signal starvation)"
  - "forecast_return_corr >= 0.015 (median across active bars, pooled IC with bootstrap fallback)"
  - "edge_to_cost_ratio >= 2.0 (Layer 2 prescreen gate; if < 2.0, halt before backtest)"

cost_feasibility:
  assumed_round_trip_cost_bps:
    BTCUSDT: 17.0
    ETHUSDT: 17.5
  expected_holding_bars:
    min: 1
    max: 2
  expected_trades_per_window: 23
  expected_activation_rate: 0.125
  required_gross_edge_bps_per_trade:
    BTCUSDT: 34.0
    ETHUSDT: 35.0
  estimated_gross_edge_bps_per_trade:
    low_case: 2.5
    mid_case: 3.5
    high_case: 5.0
  estimated_edge_to_cost_ratio: "0.07 to 0.15 (low case: 2.5/34=0.074; high case: 5.0/34=0.147)"
  plausibility: "marginal"
  plausibility_rationale: "Funding-rate mean-reversion demonstrated success on daily timeframe (run_059: edge_to_cost_ratio=2.29, passed cost gate narrowly). 4h timeframe is 6× coarser than 1h (run_044: failed at 0.24) but 6× finer than daily. Hold-period amortization is borderline: 2-bar (8h) holds vs 1-bar daily holds means cost per trade is similar but sparse activation (12.5%) across more frequent bar ticks increases relative turnover. 2024-12-01+ walk-forward window overlaps with lower funding regime than burned range (2024-01:11) used by run_059, introducing regime-downshift risk. Signal class (mean-reversion on 4h) is proven in principle (daily baseline), but cost margin is thin and dependent on execution regime. Prescreen (Layer 2) will reveal empirically whether edge_to_cost_ratio ≥ 2.0 on the actual 2024-12+ data; if it clears, backtest is warranted; if it fails, strategy is dead-on-arrival (cost gate is deterministic)."

approval_rationale: "Mechanism is sound and previously validated (run_059, daily). Timeframe choice (4h = Nyquist minimum for 8h settlement cycle) is theoretically justified. Sparse activation and modest IC impose cost pressure, but prior evidence (daily) demonstrates edge can exceed 2× cost threshold under favorable conditions. Prescreen will provide objective cost gate before backtest resource expenditure. Marginal plausibility warrants conditional approval pending Layer 2 cost check; if that fails, no backtest is warranted."