pattern_detected: "same_root_cause_different_families"
pattern_evidence:
  - "run_014-016 (rsi_mean_reversion): cost_drag 142.8%, 25.8%, 185.3%"
  - "run_017 (keltner_breakout): cost_drag 27.4%, corr 0.2145 but sharpe FAIL"
  - "run_018-019 (rsi_momentum variants): cost_drag 272.9%, 25.2%; corr 0.018, 0.0"
  - "run_021-023 (keltner_mean_reversion variant): cost_drag 413.1%, 82.1%, 420.2%; all sharpe FAIL"
