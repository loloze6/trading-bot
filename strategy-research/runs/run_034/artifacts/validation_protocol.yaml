hypothesis_id: "RUN017_REPLICATION_REFINE_01"
falsifiable_statement: "Relaxing TRENDING regime threshold from ER=0.50 to ER=0.35 (V1: ER >= 0.35 AND VR >= 1.20) enables KeltnerBreakout to generate at least 100 cumulative trades across walk-forward windows while maintaining annualized Sharpe >= 0.5 (median) on BTCUSDT and ETHUSDT."
null_expectation: "ER=0.35 exhibits no performance improvement over ER=0.50 baseline, or breaches mean-reversion boundary (0.40-0.45 efficiency band), causing win rate < 45% and Sharpe < 0.5."
required_evidence:
  - "Walk-forward median annualized Sharpe >= 0.5 across all windows."
  - "Cumulative trade count >= 100 across walk-forward windows."
  - "Minimum 20 trades per walk-forward window (ensures Sharpe reliability)."
  - "Win rate >= 45% across walk-forward period."
  - "Holdout period Sharpe >= 0.4 (out-of-sample generalization test)."
  - "ER regime boundaries clearly separated from mean-reversion band (0.40-0.45)."
bias_risks:
  - "Threshold selection bias: ER=0.35 appears data-derived; if chosen post-backtest, overfitted."
  - "Look-ahead bias in ER/VR: forward-looking windows in regime computation yield biased signals."
  - "Multiple comparison problem: Testing 5 variants without correction inflates false positive rate; V2-V5 are post-hoc fishing."
  - "Parameter overfitting: ATR_period=20, atr_multiplier=2.0, scaling_factor=-20.0 may have been optimized on test data."
  - "Selection effect: V1 chosen for strong performance; walk-forward on same data re-uses training set."
  - "Asset-specific overfitting: Per-asset ER thresholds (0.32 BTC, 0.38 ETH) derived from same data create circularity."
failure_modes:
  - "ER=0.35 breaches mean-reversion boundary; regime overlap increases whipsaws and false breakouts; win rate < 45%; Sharpe < 0.3."
  - "Selection effect saturation: increased regime exposure yields more trades but lower per-trade edge; net Sharpe degrades despite higher frequency."
  - "Efficiency metrics unstable in holdout window; ER thresholds shift and regime fires <20 trades; Sharpe becomes unreliable (CI too wide)."
  - "ATR scaling factor (-20.0) insufficient at ER=0.35; forecast standardization produces extreme outliers; execution slippage from over-aggressive sizing."
  - "ETHUSDT efficiency instability: ER metrics noisier in alts; holdout exhibits mean-reversion dominance; V1 Sharpe < 0.4 on ETHUSDT alone."
  - "Walk-forward Sharpe median >= 0.5 but holdout < 0.4: classic overfitting signature; strategy fails out-of-sample."
  - "Win rate >= 45% but max_drawdown > 20%; Sharpe positive but portfolio fails stress-test under real drawdown scenarios."
sample_split_design:
  train_test_split: "Non-overlapping windows: 60-day train, 15-day test, repeated across history with zero overlap; no parameter tuning on test windows."
  holdout_design: "Reserve final 30 calendar days (completely out-of-sample) for holdout validation; zero parameters tuned on holdout period."
  regime_computation: "ER and VR computed only from historical bars within each window; no forward-looking data in rolling window calculations; verify rolling window does not reference future prices."
  statistical_power: "Minimum n=20 trades per walk-forward window required for Sharpe reliability; flag any window with <20 trades as inconclusive (wide confidence interval)."
  multiple_comparison_control: "V1 is primary hypothesis (pre-registered); V2-V5 conditional only; do not gate approval on secondary variants unless V1 fails and variants were pre-registered."
decision_rules:
  - "Approve if: sharpe_median >= 0.5 AND trade_count >= 100 AND min_trade_count >= 20 AND win_rate >= 45%."
  - "Reject if: sharpe_median < 0.5 OR trade_count < 100 OR min_trade_count < 10 OR win_rate < 40%."
  - "Conditional_approve if: walk-forward metrics pass but conditions must be satisfied for out-of-sample validation."
  - "V2-V5 analysis only permitted if V1 passes walk-forward AND multiple-comparison correction permits secondary testing."
  - "Aspirational (record, do not gate): regime_conditional_sharpe >= 0.6; parameter_drift < 10% across windows; holdout_sharpe >= 0.4."