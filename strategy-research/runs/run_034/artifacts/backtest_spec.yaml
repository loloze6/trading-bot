status: "spec_ready"
config:
  regime_detector:
    mode: "threshold_rules"
    components:
      - id: "er"
        class: "strategies.strategy_components.EfficiencyRatioRegimeComponent"
        params:
          period: 24
          smooth_period: 5
      - id: "vr"
        class: "strategies.strategy_components.VarianceRatioComponent"
        params:
          k: 5
          window: 100
    rules:
      - regime: "trending"
        any_of:
          - - id: "er"
              op: "gte"
              value: 0.35
            - id: "vr"
              op: "gte"
              value: 1.20
    default_regime: "trending"
  strategies:
    warmup: 51
    regimes:
      trending:
        components:
          - id: "keltner_breakout"
            class: "strategies.strategy_components.KeltnerBreakoutComponent"
            params:
              ema_period: 20
              atr_period: 20
              atr_multiplier: 2.0
              scaling_factor: -20.0
            weight: 1.0
            lookback: 50
            history_transforms: []
            transforms:
              - op: "identity"
      mean_reversion: null
      chop: null
config_rationale:
  - "Regime threshold relaxation: ER >= 0.35 (relaxed from baseline 0.50) enables TRENDING regime to fire ~40-45% of bars, targeting >100 cumulative trades while maintaining structural separation from mean-reversion boundary (~0.40-0.45 ER band)."
  - "VR >= 1.20 gate confirms directional trend formation, filtering sideways and choppy price action."
  - "KeltnerBreakout component with atr_multiplier=2.0 creates wider channel boundaries, reducing false breakout noise vs default multiplier 1.5."
  - "scaling_factor=-20.0 inverts signal to fire on lower-band breakouts (mean-reversion entry logic) in the context of efficiency-detected trend regimes."
  - "Single active regime (TRENDING only): mean_reversion and chop set to null; default_regime='trending' ensures all bars matched outside rules default to TRENDING forecast behavior."
  - "No additional normalization transforms: KeltnerBreakout output is already in forecast scale [-20,+20]; identity transform confirms raw component output without further scaling or standardization."
component_gap: null