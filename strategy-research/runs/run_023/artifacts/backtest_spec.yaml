status: "spec_ready"
config:
  regime_detector:
    mode: "threshold_rules"
    components:
      - id: "er"
        class: "strategies.strategy_components.EfficiencyRatioRegimeComponent"
        params:
          period: 24
          smooth_period: 5
      - id: "vr"
        class: "strategies.strategy_components.VarianceRatioComponent"
        params:
          k: 5
          window: 100
    rules:
      - regime: "trending"
        any_of:
          - - id: "er"
              op: "gte"
              value: 0.50
            - id: "vr"
              op: "gte"
              value: 1.20
    default_regime: "trending"
    vetoes: []
  strategies:
    warmup: 51
    regimes:
      trending:
        components:
          - id: "keltner_lower"
            class: "strategies.strategy_components.KeltnerBreakoutComponent"
            params:
              ema_period: 20
              atr_period: 20
              atr_multiplier: 1.5
              scaling_factor: -20.0
            weight: 1.0
            lookback: 500
            history_transforms: []
            transforms:
              - op: "identity"
      mean_reversion: null
      chop: null
      unknown: null
config_rationale:
  - "Lower-band mean-reversion signal: KeltnerBreakoutComponent scaling_factor=-20.0 inverts default upper-band behavior, triggering on lower-band breakout (mean-reversion entry)"
  - "TRENDING regime filter: EfficiencyRatioRegimeComponent (ER≥0.50) AND VarianceRatioComponent (VR≥1.20) via threshold_rules; signal activates only in trending zones"
  - "Volatility adjustment: ATR-based bands in KeltnerBreakoutComponent provide inherent volatility normalization; no additional vol_normalize needed"
  - "Raw signal preservation: identity transform keeps [-20,+20] output from KeltnerBreakoutComponent intact; no secondary normalization"
  - "Run_017 replication: identical component class, parameters (ema_period=20, atr_period=20, atr_multiplier=1.5), and regime thresholds (ER=0.50, VR=1.20)"
  - "Regime specificity: all non-TRENDING regimes (mean_reversion, chop, unknown) set to null; ensures V1 generates zero forecast outside TRENDING, testing regime selectivity hypothesis"
component_gap: null