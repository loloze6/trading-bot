stage: "backtest_specification"
status: "spec_ready"
hypothesis_id: "H-RUN007-V1"
config_rationale:
  - "RSI(14) pullback signal → RSIPullbackComponent with period=14"
  - "Long-only directional constraint → long_only=true parameter"
  - "Volatility standardization of raw signal → vol_normalize in history_transforms"
  - "Signal normalized by rolling mean → ratio_to_mean transform (rebases signal relative to 500-bar history)"
  - "Scaled to ±10 average magnitude → scale transform with factor=10.0"
  - "Threshold filter removes weak signals → threshold_filter with min_abs=15.0 (removes |forecast| < 15)"
  - "Mean-reversion regime identification (ER ≤ 0.20, VR ≤ 0.90) → threshold_rules engine with single mean_reversion rule"
  - "Efficiency Ratio regime component → EfficiencyRatioRegimeComponent period=24"
  - "Variance Ratio regime component → VarianceRatioComponent k=5 window=100"
  - "Inactive regimes (trending, chop, unknown) → null (no forecast; only mean_reversion produces signals)"
component_gap: null
config:
  regime_detector:
    mode: "threshold_rules"
    components:
      - id: "er"
        class: "strategies.strategy_components.EfficiencyRatioRegimeComponent"
        params:
          period: 24
          smooth_period: 5
      - id: "vr"
        class: "strategies.strategy_components.VarianceRatioComponent"
        params:
          k: 5
          window: 100
    vetoes: []
    rules:
      - regime: "mean_reversion"
        any_of:
          - - id: "er"
              op: "lte"
              value: 0.20
            - id: "vr"
              op: "lte"
              value: 0.90
      - regime: "trending"
        any_of:
          - - id: "er"
              op: "gte"
              value: 0.25
            - id: "vr"
              op: "gte"
              value: 1.10
          - - id: "er"
              op: "gte"
              value: 0.30
            - id: "vr"
              op: "between"
              low: 0.90
              high: 1.10
      - regime: "chop"
        any_of:
          - - id: "er"
              op: "between"
              low: 0.20
              high: 0.25
            - id: "vr"
              op: "between"
              low: 0.85
              high: 1.15
    default_regime: "mean_reversion"
  strategies:
    warmup: 51
    regimes:
      mean_reversion:
        components:
          - id: "rsi_pullback"
            class: "strategies.strategy_components.RSIPullbackComponent"
            params:
              period: 14
              scaling_factor: 0.4
              long_only: true
            weight: 1.0
            lookback: 500
            history_transforms:
              - op: "vol_normalize"
            transforms:
              - op: "ratio_to_mean"
              - op: "scale"
                params:
                  factor: 10.0
              - op: "threshold_filter"
                params:
                  min_abs: 15.0
      trending: null
      chop: null
      unknown: null