altitude_justification: "Rule 4: trending regime in uninformative_regimes list at 4h; median_forecast_return_corr=0.2145 (signal has directional edge identical to run_017), yet median_gross_pnl=0.0 (no trades executed). Uninformative regime definition is the bottleneck, not signal quality or cost structure. Regime forward_return_mean in trending: 2024-04=+0.002071 (near zero), 2024-07=-0.000387 (negative), 2024-08=-0.001306 (negative), 2024-11=-0.00418001 (negative). Cost drag median=27.4% (low, not the limiting factor). Correct action: pivot to different regime definition (score-mode instead of AND-gate threshold_rules)."