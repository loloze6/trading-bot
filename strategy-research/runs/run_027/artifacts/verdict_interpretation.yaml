primary_failure_mode: "Regime is uninformative at 4h timeframe. The TRENDING regime (ER≥0.5 AND VR≥1.2) at 4h does not identify a coherent market state; forward_return_mean in trending regime is near-zero or negative across multiple windows (e.g., 2024-04: +0.002071, 2024-07: -0.000387, 2024-08: -0.001306). Zero trades executed in most windows despite signal correlation=0.2145 being identical to run_017 1h baseline. Regime threshold definition (AND-gate) too restrictive at 4h bar frequency."
config_to_failure_map: "regime_detector.rules[0] with threshold_rules AND-gate (ER≥0.5 AND VR≥1.2) combined with 4h candle timeframe produces a regime label that is uninformative at the bar timescale. The threshold values ER≥0.5 and VR≥1.2 are correct per run_017 baseline, but the binary AND-logic does not transfer to 4h regime detection. The default_regime=unknown constraint correctly blocks non-trending trades, so zero forecasts outside trending regime. But trending regime itself is not profitable at 4h."
