handoff_version: 1
run_id: run_025
from_stage: backtest_specification
to_stage: protocol_execution
assigned_engine: tool
objective: 'Run the full walk-forward protocol against the emitted config, evaluated
  against this hypothesis''s specific validation criteria.

  '
primary_input_artifact: runs/{run_id}/artifacts/candidate_strategy_config.json
required_inputs:
- path: artifacts/candidate_strategy_config.json
  reason: the config to backtest
- path: artifacts/validation_protocol.yaml
  reason: hypothesis-specific success criteria for verdict evaluation
deliverables:
- protocol_result.yaml
injected_context:
  refinement_attempt: '0'
  human_data_paths_injected: 'true'
  component_gap_resolution: 'No score_mode needed. Use threshold_rules with relaxed
    thresholds: ER>=0.3, VR>=1.0. Keep default_regime: unknown. Keep Keltner params
    identical to run_017.'
  required_config_constraints: 'Generate ONE config only:

    - regime_detector.mode: threshold_rules (NOT score_mode)

    - default_regime: unknown (CRITICAL — do NOT set to trending)

    - TRENDING rule: ER>=0.3 AND VR>=1.2 (relax ER from 0.5 to 0.3, keep VR)

    - OR alternatively: ER>=0.5 OR VR>=1.2 (switch AND to OR for more coverage)

    - Keltner: ema_period=20, atr_period=20, atr_multiplier=2.0, scaling_factor=-20.0

    - unknown: null (CRITICAL — do NOT add zero-weight components)

    - No vetoes, no per-asset overrides, no confidence scaling

    '
