recommendation: continue

recommendation_rationale: "Price-action technical indicators (RSI, Keltner variants, EMA) are mechanistically exhausted on BTC/ETH 1h (6 families, 22+ runs, runs 011-039). High-correlation runs (017/024/027/033) were mirages: regime-gated IC on ~1% of bars with negative per-trade expectancy. This closes the price-only technical analysis path conclusively. However, two mechanism-backed structural signals remain power-insufficient, not exhausted: (1) H-041-A (funding-rate forced-flow settlement mechanism, ic_active=0.014, n_eff=10, power-parked per KB funding_rate_mean_reversion_inconclusive) and (2) H-041-C (behavioral sentiment, ic_active=0.19, n_eff=13, power-parked per KB fear_greed_contrarian_inconclusive). Both have reactivation_conditions (backward-extension to 2018+, scheduled in KB operational.backward_extension_pass, status: scheduled_post_build_steps). Additionally, FUNDING_RATE_CONTINUOUS showed lag_mismatch_to_regime_persistence on 1h (not a mechanism death) per KB funding_rate_continuous_mean_reversion_expanded_auto: a 4h timeframe escalation is concrete and testable next, and would directly evaluate the lag diagnosis. No component built (components_built=0) prohibits terminate per SKILL rules. Forecast_return_corr: highly variable (range -0.1705 to 0.2953), no improvement trend. Cost_drag: highly variable (range 25-413%), no improvement trend. This is no_pattern diagnostic profile (mixed root causes, no direction) correctly interpreted as mechanistic exhaustion, not structural sizing failure per A5.2 vocabulary rules (outcome=no_edge_observed, not outcome=signal_quality_with_positive_correlation)."

