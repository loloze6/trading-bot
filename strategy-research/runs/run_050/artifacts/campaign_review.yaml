pattern_evidence:
  - "Price-action technical indicators (RSI, Keltner variants, EMA) show mixed failure root causes: signal_quality (rsi_mean_reversion, keltner_mean_reversion, keltner_scoremode, ema_spread), signal_inversion (keltner_breakout), cost_drag (rsi_momentum_trending), already_priced_in (ema_spread). Across 6 families, 22+ runs (runs 011-039): no convergence to a shared recovery strategy."
  - "Structural signals (funding rate, fear/greed) show positive IC direction but insufficient sample power. H-041-A: ic_active_bars=0.014, p=0.97, n_eff=10 (KB funding_rate_mean_reversion_inconclusive). H-041-C: ic_active_bars=0.19, p=0.547, n_eff=13 (KB fear_greed_contrarian_inconclusive). Both outcome: inconclusive (underpowered, not exhausted)."
  - "Regime detector (ER-threshold on BTC/ETH 1h) declared structurally unusable per KB er_detector_unusable_btc_eth_1h: Pareto conflict between activation-in-band criterion (10-40%) and transition-stability criterion (≤4 transitions/window) cannot be resolved by configuration tuning. Evidence: 48-cell grid exploration yields best score 5/8, transitions 18-40/window regardless of dwell or hysteresis settings."
  - "High-correlation mirages in price-action runs: runs 017/024/027/033 show forecast_return_corr=0.2145, cost_drag=27.4%, win_rate_vs_sharpe=both PASS or both FAIL. Per KB keltner_root_cause_reattribution: these are regime-gated correlations (computed on ~1% of bars labeled TRENDING by the detector). Per-trade expectancy was negative (-26 bps on keltner_163 trades), confirming ic_active_bars=-0.032 on those very bars (p=0.83). A5.2 vocabulary correction: outcome is no_edge_observed, not signal_quality confirmation."
  - "Cost_drag trend across price-action: no improvement direction. Ranges 25-413% (run_015: 25.7%, run_017-033: 27-84%, runs 021/023/030/034/044: 128-420%). High-frequency signals structurally barrier-blocked at ~80% cost threshold. Low-frequency runs (e.g., run_021: corr=0.0136, cost=413%) trade frequency reduction against signal entropy; no sweet spot found."

