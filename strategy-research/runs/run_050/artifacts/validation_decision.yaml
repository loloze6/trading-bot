hypothesis_id: "H-041-A"
variant_id: "V1_holding_window_extended_4h"
refinement_attempt: 2

status: "conditional_approve"

rationale: "Mechanism is structural (8h funding settlement forced-flow). 1h variant failed on execution layer (insufficient hold duration, too much turnover); 4h expansion directly addresses this blocker. Walk-forward structure is sound (8 windows, 2024-12-01 to 2025-12-31, per A8.5.1a). Falsifiable criteria are well-defined and measurable. However, cost feasibility is marginal: claimed 0.27 bps/bar implies ~17.3 bps/trade cost, leaving only 16.7 bps headroom for gross edge vs required 34 bps. Parameters (threshold 0.0002, scaling 10.0) are unvalidated on 4h and were copied from failed run. Lookahead and regime-endogeneity risks exist but are auditible. Conditional approval requires two gating conditions: (1) Manual code audits confirm no look-ahead bias and no regime-detector use of funding_rate; (2) Layer 2 prescreen validates cost_feasibility by measuring IC, sigma_bar_bps, and avg_holding_bars, confirming estimated_gross_edge_bps ≥ 34 bps and edge_to_cost_ratio ≥ 2.0. If conditions pass, hypothesis proceeds to screening backtest. If conditions fail, status reverts to refine or reject per failure mode."

blocking_issues: []

conditions:
  - "Lookahead audit: Mandatory manual code review of data_manager.py (candle_builder), funding_rate injection, and timestamp logic. Confirm bar-timestamp occurs strictly AFTER funding settlement publication per Binance settlement clock. Document UTC offsets and edge cases (e.g., weekend settlement timing). If look-ahead confirmed, REJECT."
  - "Regime endogeneity audit: Mandatory code review of AdvancedStrategy class and CompositeStrategyForRegime. Audit all inputs to regime_detector (MarketRegime.compute). If funding_rate appears in any regime feature (e.g., for Vol classification, Rate-based regime bins), REFINE to decouple funding_rate from regime label. Proceed only if regime inputs are OHLCV + fear_greed (or other non-funding feeds)."
  - "Layer 2 cost-check (prescreen): Measure IC (Spearman, ungated), sigma_bar_bps (1-bar return std in bps), and avg_holding_bars from walk-forward screening backtest. Apply formula: estimated_gross_edge_bps = abs(IC) × sigma_bar_bps × sqrt(avg_holding_bars). Confirm estimated_gross_edge_bps ≥ 34 bps (BTCUSDT) and edge_to_cost_ratio = estimated_gross_edge / 17.0 ≥ 2.0. If edge_to_cost_ratio < 2.0, REJECT (implausible cost plausibility per Improvement 09 hard rule). Log measured IC, sigma_bar_bps, and avg_holding_bars in prescreen_result.yaml for audit trail."
  - "Activation rate validation (prescreen): Observe episode count across 8 walk-forward windows. Report mean ± std. If mean episodes/year falls outside 40–60 ± 20% (i.e., < 32 or > 72/year), inspect for parameter sensitivity or market-regime drift. Marginal tolerance: if 32–40 or 60–72/year, proceed but flag for robustness review in holdout."
  - "n_eff confirmation: Measure n_eff (episode-blocked, per A8.5.1a) for each of 8 windows. Report min, mean, max. Gate: proceed only if min_n_eff ≥ 50 per window. If any window n_eff < 50, FAIL (insufficient episode density for significance)."

promotion_criteria_if_conditions_pass: "All conditions above satisfied → screening backtest proceeds. If screening backtest yields Sharpe ≥ 1.0 (median), trade_count ≥ 100, win_rate ≥ 45%, max_drawdown ≤ 30%, and deflated Sharpe (accounting for n_eff) remains ≥ 0.8, hypothesis is promoted to holdout_evaluation. Holdout uses frozen range 2026-01-01 to 2026-06-30 (single-use, terminal: holdout failure ends further promotion path per campaign_data_policy.yaml)."

promotion_criteria_if_conditions_fail: "Any condition fails → status reverts per failure type: Look-ahead confirmed → REJECT (final, hard stop). Regime endogeneity confirmed → REFINE (decouple funding_rate from regime; resubmit as H-041-A-refined). Edge-to-cost-ratio < 2.0 → REJECT (implausible cost feasibility; attempt longer timeframe or tighter regime gating if mechanism still sound). Activation < 32/year or > 72/year without explanation → REFINE (re-tune parameters or investigate market regimes). n_eff < 50 in any window → FAIL (insufficient statistical power; reject unless data extension or regime-stratification resolves sparsity)."