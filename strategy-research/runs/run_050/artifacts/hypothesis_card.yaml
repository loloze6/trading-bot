hypothesis_id: H-041-A
asset: "BTCUSDT, ETHUSDT"
timeframe: "1h"
run_type: reactivation
target_market: "BTCUSDT, ETHUSDT"

thesis: "Extreme funding rates (|rate| > 0.0002) trigger mechanical forced liquidations and position unwinding within the 8h settlement cycle, creating mean-reversion pressure on prices detectable over the next 1–4 bars."

rationale: "The mechanism is structural (contractual funding settlement), not behavioral. The measurable proxy (signed funding_rate magnitude) is available in the funding_rate feed. Prior test (run_041) returned inconclusive due to insufficient sample (n_eff=10 on 2024-2025, a low-funding period). Backward extension to 2018+ includes 2020-2022 (documented funding-extreme era), expected to increase n_eff to 50+ and permit a statistically powered test. Reactivation condition now mechanically enforced via pre_registration.yaml machine_constraints block."

edge_source:
  category: structural_forced_flow
  specific_mechanism: "Perpetual futures funding settlement (every 8h UTC) forces a real cash transfer between long and short positions. An extreme funding rate (|rate| > 0.0002) indicates an extreme, crowded, one-sided positioning imbalance that is mechanically forced to unwind or squeeze at settlement, creating mean-reversion pressure on price. Measurable proxy: signed funding_rate magnitude at each settlement boundary, available in BTCUSDT/ETHUSDT_funding_8h.csv."
  why_not_arbitraged: "The forced-settlement mechanism itself is contractual and mechanical (not arbitrageable). Funding data is not universally integrated into algorithmic strategies—most retail and institutional traders focus on price technicals. Crowding risk is low. Information asymmetry does not apply (no speed/access advantage needed); the edge arises from structural flow that executes regardless of whether traders monitor funding extremes."
  evidence_type: funding_open_interest
  measurable_proxy: "Signed funding_rate magnitude and sign at 8h settlement bars (UTC hour % 8 == 0). Mechanism predicts: bars immediately after settlements with |rate| > 0.0002 show negative correlation between forecast sign and subsequent 1–4 bar returns (mean-reversion). Proxy is directly computable from available funding_rate feed."

signal_concept: "FundingRateMeanReversionComponent(threshold=0.0002, scaling_factor=10.0) — VERBATIM from run_041's candidate_strategy_config.json. Fires at 8h settlement boundaries (UTC hour % 8 == 0) when |funding_rate| > 0.0002. forecast = -sign(funding_rate) * scaling_factor at active bars; 0 elsewhere. Ungated (A2.3 standing policy): regime_detector.rules=[], default_regime='unknown'."

assumptions:
  - "Funding rate feed is accurate, timely, and reflects actual settlement amounts."
  - "Extreme funding rates (|rate| > 0.0002) reliably trigger forced deleveraging or squeezed positions."
  - "Mean-reversion materializes within 1–4 bars after settlement, not days later."
  - "Historical funding data (2018–2025) is representative of future dynamics; no structural breaks in settlement mechanics."
  - "Episode definition (gap ≤ 48 1h-bars, era-and-symbol-bounded) correctly isolates independent funding-extreme events for episode-blocked significance testing."

expected_failure_modes:
  - "Secular low-funding environment: 2024–2025 window showed sparse funding extremes. Even with backward extension, if 2026 markets remain structurally calm (lower leverage, tighter circuit breakers), activation may remain sparse and statistical power may fall below reactivation target."
  - "Lag mismatch to execution granularity: Forced deleveraging may take days or weeks to fully materialize. Prior KB finding (FUNDING_RATE_CONTINUOUS_MEAN_REVERSION_EXPANDED, run_044) shows lag_mismatch_to_regime_persistence at 1h bars. Extreme-only variant may face the same lag, failing to capture mean-reversion within position hold window."
  - "Signaling without flow: High funding rates signal crowded positioning but may not trigger immediate deleveraging if positions are renewed through settlement at high cost. Causal chain breaks if crowded traders accept the settlement cost rather than unwind."
  - "Cost drag at sparse activation: ~3% activation frequency (~2,000–3,000 active bars per symbol over 7 years) means high cost per trade. Even at plausible IC=0.10–0.20, edge-to-cost ratio may fail if transaction costs exceed 10 bps per round-trip."
  - "Era-transferability risk: 2020–2022 funding extremes occurred in higher-leverage, retail-driven market regime. Structural changes in 2024–2026 (institutional market-making, improved circuit breakers, regulatory constraints on leverage) may reduce forced-liquidation frequency or magnitude despite larger sample size."

