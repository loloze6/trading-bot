notes: "H-041-A is a formal reactivation following run_047's invalidation (F4d, 2026-07-05). run_047 silently reverted to 2024-only baseline_v1.json (not the machine-enforced backward-extension protocol) and silently dropped the MANDATORY A8.5.1a episode-blocked significance_methodology, making it a near-duplicate of run_041, not a valid test of the backward-extension reactivation. This run (run_050) has pre_registration.yaml machine_constraints block read directly by the orchestrator (not LLM-memorized), which generates the protocol file and force-injects significance_methodology into candidate_strategy_config.json. A conformance gate before verdict_interpreter halts (paused_for_human) if protocol or methodology deviate, preventing silent drift. Config is VERBATIM from run_041 (threshold=0.0002, scaling_factor=10.0); no recalibration. If prescreen passes both IC-significance gate AND cost gate, STOP before walk_forward_validation and report per-era numbers (2019-2021, 2021-2023, 2023-2026) for user-level review of era-transferability before proceeding. Era-transferability is a user decision, not automatic routing."