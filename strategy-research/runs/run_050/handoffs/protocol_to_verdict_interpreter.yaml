handoff_version: 1
run_id: run_050
from_stage: protocol_execution
to_stage: verdict_interpreter
assigned_engine: claude
objective: 'Interpret backtest findings against hypothesis-specific criteria. Produce
  a refined brief fixing the primary identified failure, or a final kill/promote decision.

  '
primary_input_artifact: runs/{run_id}/artifacts/protocol_result.yaml
required_inputs:
- path: artifacts/protocol_result.yaml
  reason: backtest findings and hypothesis-specific verdict criteria results
- path: artifacts/validation_protocol.yaml
  reason: original success criteria and failure modes to interpret against
- path: artifacts/backtest_spec.yaml
  reason: maps config choices to hypothesis claims for failure attribution
- path: artifacts/research_brief.yaml
  reason: original research question and constraints
- path: artifacts/prescreen_result.yaml
  reason: Prescreen killed this run — protocol_result.yaml is a stub. Use prescreen_result.yaml
    as the primary evidence source.
optional_inputs:
- path: ../../coin_universe.yaml
  reason: coin categories and strategy affinity — informs escalation target selection
- path: ../../regime_detector_report.yaml
  reason: 'Improvement 02: detector confidence per symbol/timeframe; required before
    any regime-attribution conclusion'
constraints:
- Change at most one hypothesis dimension in proposed_brief.yaml.
- Do not recommend components absent from STRATEGY_CONFIG_REFERENCE.md.
- Accept protocol_result.yaml numbers as truth — do not re-evaluate.
- 'PRESCREEN KILL: This run was terminated by signal_prescreen (route=kill_no_ic,
  IC=0.017764, cost_pass=False). protocol_result.yaml is a prescreen stub, NOT a full
  backtest result. Base your verdict on prescreen_result.yaml evidence. Apply the
  appropriate Diagnostic Rule from the prescreen route: kill_no_ic → Rule 2 (weak
  signal); refine_inverted_ic → Rule 3 (signal inversion); refine_cost_hurdle → Rule
  1 (cost drag, raise threshold_filter); kill_cost_hurdle → Rule 1 (cost drag, structural
  — kill); insufficient_power_a_priori → A8.6 power gate: no IC computed, disposition=parked,
  do_not_add_to_failed_families=true, verdict_label=insufficient_power_a_priori.'
- 'IMPROVEMENT 02 — REGIME ATTRIBUTION GATE: Do NOT conclude regime_attribution.conclusion
  = signal_bad_everywhere while detector_confidence != high for the tested symbol/timeframe,
  UNLESS ungated_escape_eligible is true (see handoff field). If detector_confidence
  is low/medium and ungated escape is not available, set conclusion = inconclusive_low_detector_confidence
  and route to regime_auditor.'
deliverables:
- verdict_interpretation.yaml
stop_conditions:
- All evaluable approve criteria pass → produce research_decision.yaml with decision
  promote.
- Two or more reject criteria confirmed → produce research_decision.yaml with decision
  kill.
prescreen_route: kill_no_ic
prescreen_ic: 0.017764
regime_detector_confidence:
  BTCUSDT_1h: medium
  ETHUSDT_1h: medium
injected_context:
  refinement_attempt: '2'
  human_data_paths_injected: 'false'
