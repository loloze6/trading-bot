hypothesis_id: H-RUN007
variant_id: V1

status: spec_ready

config:
  regime_detector:
    mode: threshold_rules
    components:
      - id: er
        class: strategies.strategy_components.EfficiencyRatioRegimeComponent
        params:
          period: 24
          smooth_period: 2
      - id: vr
        class: strategies.strategy_components.VarianceRatioComponent
        params:
          k: 5
          window: 100
    rules:
      - regime: mean_reversion
        any_of:
          - - id: er
              op: lte
              value: 0.20
            - id: vr
              op: lte
              value: 0.90
      - regime: trending
        any_of:
          - - id: er
              op: gte
              value: 0.25
            - id: vr
              op: gte
              value: 1.10
      - regime: chop
        any_of:
          - - id: vr
              op: between
              low: 0.90
              high: 1.10
    default_regime: mean_reversion
  
  strategies:
    warmup: 51
    regimes:
      mean_reversion:
        components:
          - id: rsi
            class: strategies.strategy_components.RSIPullbackComponent
            params:
              period: 14
              scaling_factor: 0.4
              long_only: true
            weight: 1.0
            lookback: 500
            history_transforms:
              - op: vol_normalize
            transforms:
              - op: ratio_to_mean
              - op: scale
                params:
                  factor: 10.0
              - op: threshold_filter
                params:
                  min_abs: 15.0
      trending: null
      chop: null

config_rationale:
  - claim: "Regime detection: mean_reversion when ER ≤ 0.20 AND VR ≤ 0.90"
    config: "regime_detector.rules[0] uses EfficiencyRatioRegimeComponent (smooth_period=2, reduced from 5 per configuration_change to decrease regime lag) and VarianceRatioComponent with exact thresholds matching hypothesis"
  
  - claim: "Signal mechanism: (50 - RSI14) with regime masking, long-only"
    config: "strategies.regimes.mean_reversion applies RSIPullbackComponent with period=14, scaling_factor=0.4, long_only=true; trending and chop regimes set to null to prevent trading outside mean_reversion"
  
  - claim: "Signal normalization and filtering pipeline"
    config: "history_transforms=[vol_normalize] normalizes by volatility (stddev_24×close); transforms=[ratio_to_mean, scale(10), threshold_filter(15)] normalizes signal by its 500-bar historical magnitude, scales to average=10, filters weak signals below 1.5× average"

component_gap: null