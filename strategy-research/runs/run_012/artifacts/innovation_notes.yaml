v1_rationale:
  mechanism_preserved: true
  mechanism_details: >
    RSI pullback (oversold detection) in low-trend regime predicts
    2–3 hour mean-reversion window. Original mechanism untested due
    to 5-hour detection lag in H-RUN007-V1.
  config_delta: smooth_period(ER) = 2 bars (from 5)
  delta_impact: >
    Reduces ER rolling window from 5-bar average to 2-bar average.
    Detects regime state changes faster; lag drops from 5 hours to ~2 hours.
    Aligns with mean-reversion window observation.
  testability: >
    Configuration-only change. No code modifications. Single lever
    (smooth_period) directly targets known failure mode. Isolation
    enables causal attribution.

