hypothesis_id: H-RUN007
asset: BTCUSDT
timeframe: 1h
research_question: >
  Does RSI(14) generate positive expected returns in BTCUSDT 1h
  when the market is in a mean_reversion regime (low ER, low VR)?
signal_concept: >
  RSIPullbackComponent: long-only signal proportional to distance of
  RSI below 50. No divergence detection. No behavioral features.
  Single component, single regime.
regime_filter: >
  mean_reversion only: ER <= 0.20 AND VR <= 0.90 (existing thresholds,
  existing components). All other regimes produce forecast 0.0.
mechanism: >
  RSI below 50 in a low-efficiency regime indicates short-term
  oversold conditions without directional trend. Price expected
  to revert toward mean.
assumptions:
  - mean_reversion regime occurs frequently enough for statistical validity (≥15% of bars)
  - RSI distance from 50 correlates with reversion probability
  - Regime detection must respond with lag < 2 hours to capture mean-reversion window (NEW)
expected_failure_modes:
  - regime classification lags actual market state
  - RSI signal has no edge even in chop regime
  - commission drag erodes any positive expected value
constraints:
  - one variant only — no divergence, no behavioral features, no cross-timeframe
  - use only RSIPullbackComponent and existing regime components
  - no new code required

change_from_previous: >
  ADDED ASSUMPTION: Regime detection must respond with lag < 2 hours to capture
  mean-reversion window.
  
  REASON: Run H-RUN007-V1 lost money across all 24 windows (BTCUSDT median Sharpe
  -5.019, max drawdown 25.979%). Root cause: ER smooth_period=5 created 5-hour
  regime detection lag, causing late entry/exit relative to mean-reversion window
  duration (2–3 hours). Signal mechanism untested due to timing failure, not lack
  of edge. CONFIGURATION CHANGE: reduce ER smooth_period from 5 to 2 bars in
  backtest_spec.yaml regime_detector section. This targets lag directly without
  altering hypothesis core (RSI pullback mechanism remains unchanged).