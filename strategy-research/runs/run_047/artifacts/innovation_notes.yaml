  Example (detector_wishlist_pending, not run queue):
  - variant: "mean-reversion active only in RANGING regime"
    reason: "BTC/ETH 1h regime detector is unusable_for_this_symbol_timeframe.
    Route to detector_wishlist; retry when detector is wired."
  V1 is already ungated; no regime-gating logic applied.

