run_id: run_047
hypothesis_id: H-041-A
expansion_stage_outcome: no_expansion_applied
expansion_constraint_source: "research_brief.constraints: 'One variant only (V1 = the exact run_041 config). No innovation_expansion diversity search -- this is a straight reactivation, not a fresh search.'"

reasoning_for_no_expansion: |
  research_brief.yaml constrains variant count to one. Per persona rule (forbidden
  section): if brief contains "one variant only", pass base hypothesis to V1 only.
  Expansion is appropriate only when brief does not constrain count. Reactivation context:
  H-041-A parked at run_041 (insufficient_sample_inconclusive, n_eff=10). Reactivation
  condition (backward data extension to 2019+) now satisfied. Mechanism unchanged.

mechanism_preservation: |
  V1 = run_041 config, VERBATIM:
  - Component: FundingRateMeanReversionComponent (existing, no code changes)
  - Params: threshold=0.0002, scaling_factor=10.0 (no tuning per constraints)
  - Signal: fires at 8h UTC settlement (hour % 8 == 0) when |funding_rate| > threshold
  - Forecast: -sign(funding_rate) × scaling_factor at active bars; 0 elsewhere
  - Ungated: regime_detector.rules=[], default_regime='mean_reversion'

data_context: |
  Run_041: 2024-2025 only (n_eff=10, active_n=13, funding extremes rare)
  Run_047: 2019-09-10/2019-11-27 through 2025-12-31 (n_eff≈50, pre-reg=132 episodes)
  Reactivation condition satisfied per campaign_knowledge_base.yaml.

