recommendation_rationale: "The campaign conclusively exhibits same_root_cause_different_families across price-only technical domain: Keltner, RSI, and EMA variants all fail with signal_quality (no directional content on liquid BTC/ETH 1h), confirming these signals are already priced in. This is structural and does not warrant further technical parameter tuning. However, the campaign's structural/behavioral signal families (H-041-A funding_rate, H-041-C fear_greed, FUNDING_RATE_CONTINUOUS) are NOT exhausted — they are inconclusive due to insufficient_sample on the 2024-2025 window only. The scheduled backward-extension pass (extending to 2018+) addresses this directly with expected n_eff ~50+ (vs current 10-13), putting these hypotheses into detectable-effect range (plausible_ic_range 0.05-0.20, min_detectable_ic at n_eff=50 ≈ 0.14, within range). Run_047's reactivation of H-041-A on extended data failed at prescreen with ic_pooled=null, indicating a data-loading or episode-blocked-significance-calculation issue, not a fundamental edge failure. The pending FUNDING_RATE_CONTINUOUS_MEAN_REVERSION_EXPANDED timeframe escalation (4h bars) is also a distinct, untested cell addressing lag_mismatch feedback from verdict_interpreter. Continuing allows: (1) debugging run_047 prescreen blocker, (2) completing H-041-C reactivation on 2018+ data, (3) testing 4h timeframe for continuous funding signal — three high-information tests not yet explored."

budget_assessment: "Runs used: 47 (including pre-Phase-A, pre-F1-F8 runs, and prescreen kills). No explicit hard campaign budget stated in campaign_state.yaml; review_every_n_runs=6 suggests 8-10 reviews across lifetime. At review 8, runs are allocated efficiently to sweep parameter space, then instrument space, then signal families. Remaining untested cells (H-041-C on 2018+, FUNDING_RATE_CONTINUOUS on 4h) are high-information (distinct mechanisms × timeframe scales). Recommend prioritizing thoroughness over speed: complete the backward-extension + escalation tests before reassessing. If those complete without positive IC, only then escalate to new instruments or declare structural limitations."

