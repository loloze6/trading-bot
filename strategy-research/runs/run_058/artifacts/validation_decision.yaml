hypothesis_id: "H-041-C-v2"
status: "reject"
rationale: "Hypothesis is rejected on two independent grounds, both blocking. (1) Era-dependent sign-flip: The expanded card documents that the contrarian mechanism shows opposite sign (IC) in 2024-2025 walk-forward period vs. 2018-2023 training era. This is not an 'era artifact' but evidence of edge inversion. A hypothesis that flips sign in the current regime is falsified before validation begins. (2) Cost feasibility implausible: Sparse 6% activation (270 trades/13mo) on 1h mean-reversion must overcome 34 bps/trade cost on BTCUSDT. Sentiment edge on 1h crypto historically delivers 5–20 bps gross, far below 2× safety factor. Cumulative slippage ≈ 9% over walk-forward window. Combined with documented sign-flip in 2024-2025, strategy has near-zero probability of passing Sharpe gate (>= 0.8) after costs."
blocking_issues:
  - "sign_flip_in_current_walk_forward_era: Walk-forward period (2024-12-01 to 2025-12-31) is explicitly marked 'diagnostic-only, sign flips' in expanded card. Testing a hypothesis with documented negative IC in the test period is testing the null/negative hypothesis."
  - "cost_feasibility_implausible: 6% activation, 270 trades/window, 34 bps required edge, historical sentiment edge 5–20 bps. No credible mechanism supports 2× cost safety factor on 1h crypto mean-reversion with this holding period."
  - "mechanism_decay_post_2023: Expanded card cites 'era-instability' and sign-flip as non-structural; KB run_048 (referenced but not provided) indicates edge has inverted. Proceeding to backtest is not falsification; it is validation of the null (no edge or negative edge)."
