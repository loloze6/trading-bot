notes:
- 'run_011 through run_015 first attempt: config_path bug — all ran default strategy_config.json.
  Numbers invalid for inter-run comparison. Directional conclusions (RSI parameter
  exhaustion → pivot) remain qualitatively valid. run_015 re-run and run_016+ are
  the first genuinely clean executions.'
- 'TEMPORAL DISTRIBUTION FINDING (2026-06-30): ER>=0.50 Keltner/TRENDING signal (run_017,
  run_024, run_027, run_033 — all identical) has 69 cumulative trades across 22 window-symbol
  slots (11 windows x 2 symbols). Of those 22 slots, 7 fire zero trades: BTC 2024-01,
  2024-09, 2024-10 and ETH 2024-01, 2024-03, 2024-07, 2024-11. TRENDING regime simply
  does not occur in those calendar months regardless of gate design — it is a temporal
  distribution problem, not a sample-size or gate-selectivity problem. Per-slot counts
  range 1-9 with high variance; median Sharpe stays at 0.000 because zero-trade slots
  drag the median and non-zero slots have too few trades for stable Sharpe estimates.
  No further regime-gate tuning on this signal should be attempted. Fixes require
  either extending walk-forward history beyond 11 months, or a signal with more uniform
  monthly activation.'
- 'BASELINE_V2 KELTNER RE-RUN (2026-07-02, Improvement 07 acceptance criterion):
  Same config as run_033 (ER>=0.50 Keltner breakout in TRENDING regime) re-run on
  baseline_v2 (24 windows, 2024-01 to 2025-12). Results: zero-trade slots 14/48 (29%)
  vs 7/22 (32%) on v1 — structurally unchanged. BTC 9/24 zero-trade (37%), ETH 5/24
  (21%). Total trades 163 (BTC=71, ETH=92) across 48 slots vs 69 across 22 on v1.
  Median Sharpe 0.000 for both symbols. Per-window Sharpes highly bimodal: inactive
  months drag median to zero; active months show large variance (+20 to -8). Verdict:
  regime-availability problem is CONFIRMED as structural and NOT a 2024-data artifact.
  keltner_mean_reversion and keltner_trend_mean_reversion remain fully exhausted even
  on extended data. Their failed_families evidence_window: 2024_only tags remain but
  root cause is now confirmed — do NOT re-open these families on baseline_v2.
  Protocol result: strategy-research/results/protocols/20260702T091324Z_18fad381/'
- 'IC SCOPE CORRECTION (2026-07-02, A2.3): Earlier determination that ungated_escape was
  not eligible (citing IC=0.2145 from Keltner runs) was incorrect per A2.3 scope rule.
  IC=0.2145 from runs 017/024/027/033 was computed on TRENDING-gated bars only (~1% of
  all bars with VR>=1.2 + ER>=0.5 config) — not on all bars. A2.3 requires all-bars IC
  (ungated protocol run) for the escape determination. ungated_escape_eligible is now
  INDETERMINATE for all regime-gated runs until an ungated protocol is executed.
  regime_audit_decision.yaml in run_039 updated to reflect this.'
- 'A6.4 AUDIT (2026-07-02, before Improvement 02 concludes): forecast_return_corr=0.2145
  across runs 017/024/027/033 is GENUINE deterministic computation, not stale caching.
  All four runs share identical Keltner params (ema=20, atr=20, mult=2.0, scale=-20)
  and ER threshold=0.5. Config hashes differ on secondary parameters that do not affect
  the signal computation. Therefore these four runs constitute ONE trial for deflated-Sharpe
  deduplication (A6.4 rule: deduplicate by signal-params-hash + protocol-hash, not
  full config hash). No code bug; no audit action required beyond this note.'
- 'REGIME DETECTOR RETUNE FINDING (2026-07-02, Improvement 02 + A2.2 retune cycle):
  Config discrepancy confirmed: run_033 used ER>=0.5 AND VR>=1.2 (activation=1.07%,
  persistence=18); run_039 used ER>=0.5 AND VR>=0.9 (activation=2.55%, persistence=8).
  Both are genuine different configs; run_033 is the canonical config used for all
  historical Keltner verdicts.
  48-cell grid over (ER_enter x ER_exit_ratio x min_dwell) with VR dropped (VR>=1.2
  structurally limits activation to ~1%, unreachable from [10%,40%] band).
  Best achievable score: 5/8 (max possible 8/8). Structural ceiling: transitions/window
  (~40 on best directly-implementable config) and activation-in-band are Pareto-conflicting
  on 1h crypto with a stateless single-indicator ER detector. No cell achieved
  transitions<=4/window simultaneously with activation in [10%,40%].
  Best directly-implementable config: ER>=0.25 (no dwell, no hysteresis) — persistence=12,
  activation=33%, cc_sens=0.157, transitions=40. Regime-auditor verdict: unusable_for_this_symbol_timeframe.
  Ungated escape NOT eligible: pooled IC=0.2145 on canonical Keltner trials >> 0.03 threshold.
  Campaign implication: regime-gated hypothesis testing on BTC/ETH 1h via ER detector is
  not viable. All future verdicts must use ungated analysis or a fundamentally different
  regime detector (e.g., ADX-based, HMM, or daily timeframe). Retune artifacts:
  regime_retune_results.yaml, config/regime_retune_winner.json,
  runs/run_039/artifacts/regime_audit_decision.yaml.'
